    <div id="cfgContent"></div>
  `;
  main().querySelectorAll('.tab').forEach(t=>t.addEventListener('click', ()=>{ CFG_TAB=t.dataset.tab; renderCfgTab(); }));
  renderCfgTab();
}
let domTestPolling = false;
async function renderCfgTab(){
  domTestPolling = false; // interrompe qualquer polling de teste da aba anterior
  main().querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===CFG_TAB));
  const box = document.getElementById('cfgContent');
  if(CFG_TAB==='dominio') await renderCfgDominio(box); else await renderCfgEmail(box);
}

async function renderCfgDominio(box){
  const [{ items, agente }, cfg] = await Promise.all([ api('/dominio/sync-log'), api('/dominio/config') ]);
  box.innerHTML = `
    <div class="card">
      <h3>Status do agente automático</h3>
      <p style="font-size:13px; color:var(--ink-soft);">
        ${agente && agente.lastSeenAt ? `Última comunicação: ${fmtDate(agente.lastSeenAt)} (versão ${esc(agente.version||'—')})` : 'O agente automático (src/dominio-agent.ts) ainda não se conectou nesta instalação. Rode-o numa máquina com acesso ao Domínio Web — ele busca a configuração abaixo sozinho, a cada ciclo.'}
      </p>
    </div>
    <div class="card">
      <h3>Acesso do agente (src/dominio-agent.ts)</h3>
      <p style="font-size:12.5px; color:var(--ink-soft); margin-top:-6px;">Preencha aqui os dados de acesso ao Domínio Web — o agente busca essa configuração sozinho, sem precisar editar o .env dele na máquina onde roda.</p>
      <div class="field"><label>Forma de acesso</label>
        <select id="domSource">
          <option value="">Ainda não definido</option>
          <option value="onvio">Onvio (login web)</option>
          <option value="db">Banco de dados (rede local/VPN do escritório)</option>
          <option value="http">API HTTP do Domínio Web/TOTVS</option>
        </select>
      </div>
      <div id="domOnvioFields" class="hidden">
        <p style="font-size:12.5px; color:var(--ink-soft);">
          Nesse modo o agente reaproveita uma sessão de login já feita no navegador. Na máquina onde o agente vai rodar,
          execute uma vez: <code>npm run onvio-login</code> — vai abrir um navegador pra você logar no Onvio normalmente
          (usuário, senha e verificação em duas etapas). Depois disso o agente e o botão "Atualizar Empresas" já funcionam
          sozinhos, sem precisar preencher mais nada aqui. Se a sessão expirar um dia, é só rodar o comando de novo.
        </p>
      </div>
      <div id="domDbFields" class="hidden">
        <div class="row">
          <div class="field grow"><label>Driver do banco</label>
            <select id="domDbDriver"><option value="mssql">SQL Server (mssql)</option><option value="oracle">Oracle</option></select>
          </div>
        </div>
        <div class="row">
          <div class="field grow"><label>Host</label><input id="domDbHost" value="${esc(cfg.dbHost)}"></div>
          <div class="field" style="width:110px;"><label>Porta</label><input id="domDbPort" type="number" value="${esc(cfg.dbPort)}"></div>
        </div>
        <div class="row">
          <div class="field grow"><label>Banco (SQL Server)</label><input id="domDbName" value="${esc(cfg.dbName)}"></div>
          <div class="field grow"><label>Usuário</label><input id="domDbUser" value="${esc(cfg.dbUser)}"></div>
        </div>
        <div class="field"><label>Senha ${cfg.temSenhaBanco?'(já configurada — deixe em branco para manter)':''}</label><input id="domDbPassword" type="password" placeholder="${cfg.temSenhaBanco?'••••••••':''}"></div>
        <div class="field"><label>Connect string (Oracle — ex.: host:1521/SERVICO)</label><input id="domDbConnectString" value="${esc(cfg.dbConnectString)}"></div>
        <div class="field"><label>Consulta SQL de clientes (SELECT)</label><textarea id="domQuery" rows="3" placeholder="SELECT CODIGO, NOME, CNPJ, STATUS FROM ...">${esc(cfg.queryClientes)}</textarea></div>
        <div class="row">
          <div class="field grow"><label>Coluna código</label><input id="domColCodigo" value="${esc(cfg.colCodigo)}"></div>
          <div class="field grow"><label>Coluna nome</label><input id="domColNome" value="${esc(cfg.colNome)}"></div>
          <div class="field grow"><label>Coluna CNPJ</label><input id="domColCnpj" value="${esc(cfg.colCnpj)}"></div>
          <div class="field grow"><label>Coluna status</label><input id="domColStatus" value="${esc(cfg.colStatus)}"></div>
        </div>
      </div>
      <div id="domHttpFields" class="hidden">
        <div class="field"><label>URL da API</label><input id="domApiUrl" value="${esc(cfg.apiUrl)}"></div>
        <div class="field"><label>Token ${cfg.temTokenApi?'(já configurado — deixe em branco para manter)':''}</label><input id="domApiToken" type="password" placeholder="${cfg.temTokenApi?'••••••••':''}"></div>
      </div>
      <div class="row" style="margin-top:6px;">
        <button class="btn primary" id="btnSalvarDomCfg">Salvar</button>
        <button class="btn" id="btnTestarDomCfg">Testar conexão</button>
      </div>
      <div id="domTestResult" style="margin-top:12px;"></div>
    </div>
    <div class="card">
      <h3>Histórico de sincronizações</h3>
      <table class="data-table">
        <thead><tr><th>Quando</th><th>Origem</th><th>Novas</th><th>Atualizadas</th><th>Status</th></tr></thead>
        <tbody>${items.length? items.map(l=>`<tr><td>${fmtDate(l.executado_em)}</td><td>${esc(l.origem)}</td><td>${l.empresas_novas}</td><td>${l.empresas_atualizadas}</td><td><span class="tag ${l.status==='ok'?'ok':'bad'}">${l.status}</span></td></tr>`).join(''):'<tr><td colspan="5"><div class="empty-state">Nenhuma sincronização ainda.</div></td></tr>'}</tbody>
      </table>
    </div>
    <button class="btn primary" id="btnImportarCfg">Importar clientes do Domínio Web (CSV)</button>
  `;
  document.getElementById('btnImportarCfg').addEventListener('click', importarDominioModal);
  document.getElementById('domSource').value = cfg.source || '';
  document.getElementById('domDbDriver').value = cfg.dbDriver || 'mssql';
  function syncSourceUI(){
    const v = document.getElementById('domSource').value;
    document.getElementById('domOnvioFields').classList.toggle('hidden', v!=='onvio');
    document.getElementById('domDbFields').classList.toggle('hidden', v!=='db');
    document.getElementById('domHttpFields').classList.toggle('hidden', v!=='http');
  }
  document.getElementById('domSource').addEventListener('change', syncSourceUI);
  syncSourceUI();

  document.getElementById('btnSalvarDomCfg').addEventListener('click', async ()=>{
    const body = {
      source: document.getElementById('domSource').value,
      dbDriver: document.getElementById('domDbDriver').value,
      dbHost: document.getElementById('domDbHost').value.trim(),
      dbPort: document.getElementById('domDbPort').value,
      dbName: document.getElementById('domDbName').value.trim(),
      dbUser: document.getElementById('domDbUser').value.trim(),
      dbPassword: document.getElementById('domDbPassword').value,
      dbConnectString: document.getElementById('domDbConnectString').value.trim(),
      queryClientes: document.getElementById('domQuery').value.trim(),
      colCodigo: document.getElementById('domColCodigo').value.trim(),
      colNome: document.getElementById('domColNome').value.trim(),
      colCnpj: document.getElementById('domColCnpj').value.trim(),
      colStatus: document.getElementById('domColStatus').value.trim(),
      apiUrl: document.getElementById('domApiUrl').value.trim(),
      apiToken: document.getElementById('domApiToken').value,
    };
    try{ await api('/dominio/config', { method:'PUT', body }); toast('Configuração salva.','ok'); renderCfgDominio(box); }
    catch(e){ toast(e.message,'err'); }
  });

  document.getElementById('btnTestarDomCfg').addEventListener('click', async ()=>{
    const resultEl = document.getElementById('domTestResult');
    const btn = document.getElementById('btnTestarDomCfg');
    btn.disabled = true; btn.textContent = 'Testando…';
    resultEl.innerHTML = `<p style="font-size:12.5px; color:var(--ink-soft);">Aguardando o agente responder (ele precisa estar rodando e configurado)…</p>`;
    try{
      const { id } = await api('/dominio/testar-conexao', { method:'POST' });
      domTestPolling = true;
      let tentativas = 0;
      const poll = async ()=>{
        if(!domTestPolling) return;
        tentativas++;
        const r = await api('/dominio/testar-conexao/'+id);
        if(r.status==='pending'){
          if(tentativas>30){ resultEl.innerHTML = `<div class="tag bad">Sem resposta</div> <span style="font-size:12.5px;">O agente não respondeu em tempo — confira se ele está rodando (npm run dominio-agent:dev) e apontando para este site.</span>`; btn.disabled=false; btn.textContent='Testar conexão'; return; }
          setTimeout(poll, 2000);
          return;
        }
        btn.disabled = false; btn.textContent = 'Testar conexão';
        if(r.status==='ok'){
          const res_ = r.resultado || {};
          resultEl.innerHTML = `<div class="tag ok">Conexão OK</div> <span style="font-size:12.5px;">${res_.totalLinhas||0} linha(s) retornada(s).</span>
            ${res_.amostra&&res_.amostra.length? `<pre style="white-space:pre-wrap; font-size:11.5px; background:var(--paper); padding:8px; border-radius:6px; margin-top:8px;">${esc(JSON.stringify(res_.amostra, null, 2))}</pre>`:''}`;
        } else {
          resultEl.innerHTML = `<div class="tag bad">Falhou</div> <span style="font-size:12.5px;">${esc(r.erro||'Erro desconhecido.')}</span>`;
        }
      };
      poll();
    }catch(e){
      btn.disabled = false; btn.textContent = 'Testar conexão';
      resultEl.innerHTML = `<div class="tag bad">Falhou</div> <span style="font-size:12.5px;">${esc(e.message)}</span>`;
    }
  });
}

async function renderCfgEmail(box){
  const status = await api('/email/status');
  const { items } = await api('/email/log');
  const { items: empresas } = await api('/empresas');
  box.innerHTML = `
    <div class="card">
      <h3>Status</h3>
      <p style="font-size:13px;">${status.configurado? `<span class="tag ok">Configurado</span> Enviando como ${esc(status.from)}` : `<span class="tag bad">Não configurado</span> Defina SMTP_HOST, SMTP_USER e SMTP_PASSWORD no .env do servidor.`}</p>
    </div>
    <div class="card">
      <h3>Identificar cliente automaticamente</h3>
      <p style="font-size:12.5px; color:var(--ink-soft); margin-top:-6px;">Envie um PDF, OFX ou XML — o site procura um CNPJ/CPF no conteúdo e sugere o cliente já cadastrado (é uma sugestão: você confirma antes de enviar).</p>
      <div class="field"><label>Arquivo</label><input type="file" id="idArquivo"></div>
      <button class="btn" id="btnIdentificar">Identificar</button>
      <div id="idResultado" style="margin-top:10px;"></div>
    </div>
    <div class="card">
      <h3>Enviar mensagem para um cliente</h3>
      <div class="field"><label>Empresa</label><select id="emEmpresa">${empresas.map(e=>`<option value="${e.id}">${esc(e.nome)}</option>`).join('')}</select></div>
      <div class="field"><label>Assunto</label><input id="emAssunto"></div>
      <div class="field"><label>Mensagem</label><textarea id="emCorpo" rows="4"></textarea></div>
      <div class="field"><label>Anexos (opcional)</label><input type="file" id="emAnexos" multiple></div>
      <button class="btn primary" id="btnEnviarEmail">Enviar</button>
    </div>
    <div class="card">
      <h3>Contatos e documentos por cliente</h3>
      <p style="font-size:12.5px; color:var(--ink-soft); margin-top:-6px;">Cadastre aqui os e-mails (pode ser mais de um) e os CNPJ/CPF de cada cliente, uma vez só — ficam salvos para o envio e para a identificação automática.</p>
      <div class="field"><label>Empresa</label><select id="ccEmpresa">${empresas.map(e=>`<option value="${e.id}">${esc(e.nome)}</option>`).join('')}</select></div>
      <div id="ccBody"></div>
    </div>
    <div class="card">
      <h3>Histórico de envios</h3>
      <table class="data-table">
        <thead><tr><th>Quando</th><th>Empresa</th><th>Assunto</th><th>Status</th></tr></thead>
        <tbody>${items.length? items.map(e=>`<tr><td>${fmtDate(e.enviado_em)}</td><td>${esc(e.empresaNome||'—')}</td><td>${esc(e.assunto)}</td><td><span class="tag ${e.status==='ok'?'ok':'bad'}">${e.status}</span></td></tr>`).join(''):'<tr><td colspan="4"><div class="empty-state">Nenhum envio ainda.</div></td></tr>'}</tbody>
      </table>
    </div>
  `;

  document.getElementById('btnIdentificar').addEventListener('click', async ()=>{
    const f = document.getElementById('idArquivo').files[0];
    const resEl = document.getElementById('idResultado');
    if(!f){ toast('Selecione um arquivo.','err'); return; }
    const fd = new FormData(); fd.append('arquivo', f);
    try{
      const r = await api('/email/identificar', { method:'POST', body:fd });
      if(!r.documentosEncontrados.length){ resEl.innerHTML = `<p style="font-size:12.5px; color:var(--ink-soft);">Nenhum CNPJ/CPF encontrado no arquivo.</p>`; return; }
      if(!r.matches.length){ resEl.innerHTML = `<p style="font-size:12.5px;">Encontrei ${r.documentosEncontrados.map(d=>esc(d.documento)).join(', ')}, mas nenhum cliente cadastrado com esse documento ainda (cadastre abaixo, em "Contatos e documentos por cliente").</p>`; return; }
      resEl.innerHTML = `<div style="font-size:12.5px; margin-bottom:6px;">Cliente identificado:</div>` + r.matches.map(m=>
        `<button class="btn small" data-emp="${m.empresaId}">${esc(m.empresaNome)} (${m.tipo.toUpperCase()} ${esc(m.documento)})</button>`
      ).join(' ');
      resEl.querySelectorAll('[data-emp]').forEach(b=>b.addEventListener('click', ()=>{
        document.getElementById('emEmpresa').value = b.dataset.emp;
        toast('Cliente selecionado no formulário de envio abaixo.','ok');
      }));
    }catch(e){ toast(e.message,'err'); }
  });

  document.getElementById('btnEnviarEmail').addEventListener('click', async ()=>{
    const fd = new FormData();
    fd.append('empresaId', document.getElementById('emEmpresa').value);
    fd.append('assunto', document.getElementById('emAssunto').value);
    fd.append('corpo', document.getElementById('emCorpo').value);
    [...document.getElementById('emAnexos').files].forEach(f=>fd.append('anexos', f));
    try{
      await api('/email/enviar', { method:'POST', body:fd });
      toast('E-mail enviado.','ok');
      renderCfgTab();
    }catch(e){ toast(e.message,'err'); }
  });

  async function carregarContatosEDocs(){
    const empresaId = document.getElementById('ccEmpresa').value;
    const ccBody = document.getElementById('ccBody');
    if(!empresaId){ ccBody.innerHTML=''; return; }
    const [{items:contatos}, {items:docs}] = await Promise.all([
      api('/empresas/'+empresaId+'/contatos'), api('/empresas/'+empresaId+'/documentos'),
    ]);
    ccBody.innerHTML = `
      <div style="font-weight:600; font-size:12.5px; margin:10px 0 6px;">E-mails de contato</div>
      <table class="data-table"><tbody id="ccContatosBody">
        ${contatos.map(c=>`<tr data-id="${c.id}"><td>${esc(c.nome)}</td><td>${esc(c.email)}</td><td style="text-align:right;"><button class="btn small danger" data-act="rmContato">Remover</button></td></tr>`).join('') || '<tr><td colspan="3"><span style="font-size:12px; color:var(--ink-soft);">Nenhum contato cadastrado.</span></td></tr>'}
      </tbody></table>
      <div class="row" style="margin-top:8px;">
        <div class="field" style="margin-bottom:0;"><input id="ccNome" placeholder="Nome do contato"></div>
        <div class="field" style="margin-bottom:0;"><input id="ccEmail" type="email" placeholder="e-mail@cliente.com"></div>
        <button class="btn small" id="btnAddContato">+ Adicionar e-mail</button>
      </div>
      <div style="font-weight:600; font-size:12.5px; margin:16px 0 6px;">CNPJ / CPF cadastrados</div>
      <table class="data-table"><tbody id="ccDocsBody">
        ${docs.map(d=>`<tr data-id="${d.id}"><td>${d.tipo.toUpperCase()}</td><td>${esc(d.documento)}</td><td style="text-align:right;"><button class="btn small danger" data-act="rmDoc">Remover</button></td></tr>`).join('') || '<tr><td colspan="3"><span style="font-size:12px; color:var(--ink-soft);">Nenhum documento cadastrado.</span></td></tr>'}
      </tbody></table>
      <div class="row" style="margin-top:8px;">
        <div class="field" style="margin-bottom:0;"><input id="ccDocumento" placeholder="CNPJ ou CPF (só números ou com pontuação)"></div>
        <button class="btn small" id="btnAddDoc">+ Adicionar documento</button>
      </div>
    `;
    document.getElementById('btnAddContato').addEventListener('click', async ()=>{
      const nome = document.getElementById('ccNome').value.trim();
      const email = document.getElementById('ccEmail').value.trim();
      if(!nome||!email){ toast('Preencha nome e e-mail.','err'); return; }
      try{ await api('/empresas/'+empresaId+'/contatos', { method:'POST', body:{ nome, email } }); carregarContatosEDocs(); }
      catch(e){ toast(e.message,'err'); }
    });
    document.querySelectorAll('[data-act="rmContato"]').forEach(b=>b.addEventListener('click', async e=>{
      await api('/empresas/contatos/'+e.target.closest('tr').dataset.id, { method:'DELETE' });
      carregarContatosEDocs();
    }));
    document.getElementById('btnAddDoc').addEventListener('click', async ()=>{
      const documento = document.getElementById('ccDocumento').value.trim();
      if(!documento){ toast('Informe o CNPJ ou CPF.','err'); return; }
      try{ await api('/empresas/'+empresaId+'/documentos', { method:'POST', body:{ documento } }); carregarContatosEDocs(); }
      catch(e){ toast(e.message,'err'); }
    });
    document.querySelectorAll('[data-act="rmDoc"]').forEach(b=>b.addEventListener('click', async e=>{
      await api('/empresas/documentos/'+e.target.closest('tr').dataset.id, { method:'DELETE' });
      carregarContatosEDocs();
    }));
  }
  document.getElementById('ccEmpresa').addEventListener('change', carregarContatosEDocs);
  if(empresas.length) carregarContatosEDocs();
}

// ===================== start =====================
boot();
</script>
</body>
</html>
