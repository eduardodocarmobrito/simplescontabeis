let FIN_TAB='lancamentos';
async function pageFinanceiro(){
  main().innerHTML = `
    <h1>Financeiro</h1>
    <p class="subtitle">Honorários e recebimentos</p>
    <div class="tabs">
      <div class="tab" data-tab="lancamentos">Lançamentos</div>
      <div class="tab" data-tab="honorarios">Honorários por empresa</div>
    </div>
    <div id="finContent"></div>
  `;
  main().querySelectorAll('.tab').forEach(t=>t.addEventListener('click', ()=>{ FIN_TAB=t.dataset.tab; renderFinTabs(); }));
  renderFinTabs();
}
function renderFinTabs(){
  main().querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===FIN_TAB));
  if(FIN_TAB==='honorarios') renderHonorarios(); else renderLancamentos();
}
async function renderHonorarios(){
  const podeEditar = can('financeiro','editar');
  const { items } = await api('/financeiro/honorarios');
  const { items: empresas } = await api('/empresas');
  const semHonorario = empresas.filter(e=>!items.some(h=>h.empresa_id===e.id));
  const box = document.getElementById('finContent');
  box.innerHTML = `
    <div class="card" style="padding:0; overflow-x:auto;">
      <table class="data-table">
        <thead><tr><th>Empresa</th><th>Valor mensal</th><th>Vencimento (dia)</th><th>Ativo</th><th></th></tr></thead>
        <tbody id="honBody"></tbody>
      </table>
    </div>
  `;
  const linhas = [...items.map(h=>({...h, nome:h.empresaNome})), ...semHonorario.map(e=>({empresa_id:e.id, nome:e.nome, valor:0, dia_vencimento:10, ativo:0, observacao:''}))];
  document.getElementById('honBody').innerHTML = linhas.length? linhas.map(h=>`
    <tr data-empresa="${h.empresa_id}">
      <td>${esc(h.nome)}</td>
      <td>${fmtMoney(h.valor)}</td>
      <td>Dia ${h.dia_vencimento}</td>
      <td><span class="tag ${h.ativo?'ok':'muted'}">${h.ativo?'Ativo':'Sem cobrança'}</span></td>
      <td style="text-align:right;">${podeEditar?`<button class="btn small" data-act="edit">Configurar</button>`:''}</td>
    </tr>
  `).join('') : `<tr><td colspan="5"><div class="empty-state">Nenhuma empresa cadastrada.</div></td></tr>`;
  if(podeEditar) box.querySelectorAll('[data-act="edit"]').forEach(b=>b.addEventListener('click', e=>{
    const empresaId = Number(e.target.closest('tr').dataset.empresa);
    const h = linhas.find(x=>x.empresa_id===empresaId);
    honorarioModal(empresaId, h);
  }));
}
function honorarioModal(empresaId, h){
  openModal(`
    <h3>Configurar honorário</h3>
    <div class="field"><label>Valor mensal (R$)</label><input id="hnValor" type="number" step="0.01" value="${h?h.valor:0}"></div>
    <div class="field"><label>Dia de vencimento</label><input id="hnDia" type="number" min="1" max="28" value="${h?h.dia_vencimento:10}"></div>
    <div class="field"><label>Observação</label><input id="hnObs" value="${h&&h.observacao?esc(h.observacao):''}"></div>
    <label class="checkbox-row"><input type="checkbox" id="hnAtivo" ${h&&h.ativo?'checked':''}> Cobrança ativa (entra na geração mensal)</label>
    <div class="modal-actions">
      <button class="btn" id="hnCancel">Cancelar</button>
      <button class="btn primary" id="hnSalvar">Salvar</button>
    </div>
  `);
  document.getElementById('hnCancel').addEventListener('click', closeModal);
  document.getElementById('hnSalvar').addEventListener('click', async ()=>{
    const body = { valor:Number(document.getElementById('hnValor').value)||0, diaVencimento:Number(document.getElementById('hnDia').value)||10, ativo:document.getElementById('hnAtivo').checked, observacao:document.getElementById('hnObs').value.trim() };
    await api('/financeiro/honorarios/'+empresaId, { method:'PUT', body });
    closeModal(); renderHonorarios();
  });
}
async function renderLancamentos(){
  const podePostar = can('financeiro','postar');
  const podeEditar = can('financeiro','editar');
  const box = document.getElementById('finContent');
  const hoje = new Date();
  const compDefault = hoje.getFullYear()+'-'+String(hoje.getMonth()+1).padStart(2,'0');
  box.innerHTML = `
    <div class="row" style="margin-bottom:14px;">
      <div class="field" style="margin-bottom:0;"><label>Competência</label><input type="month" id="finComp" value="${compDefault}"></div>
      ${podePostar?`<button class="btn primary" id="btnGerarLanc">Gerar lançamentos do mês</button>`:''}
    </div>
    <div class="kpi-grid" id="finResumo"></div>
    <div class="card" style="padding:0; overflow-x:auto;">
      <table class="data-table">
        <thead><tr><th>Empresa</th><th>Valor</th><th>Vencimento</th><th>Status</th><th></th></tr></thead>
        <tbody id="lancBody"></tbody>
      </table>
    </div>
  `;
  async function carregar(){
    const comp = document.getElementById('finComp').value;
    const [{items}, {resumo}] = await Promise.all([ api('/financeiro/lancamentos?competencia='+comp), api('/financeiro/resumo?competencia='+comp) ]);
    document.getElementById('finResumo').innerHTML = `
      <div class="kpi"><div class="eyebrow">Pago</div><div class="val">${fmtMoney(resumo.pago.total)}</div><div class="sub">${resumo.pago.qtd} lançamento(s)</div></div>
      <div class="kpi"><div class="eyebrow">Pendente</div><div class="val">${fmtMoney(resumo.pendente.total)}</div><div class="sub">${resumo.pendente.qtd} lançamento(s)</div></div>
      <div class="kpi"><div class="eyebrow">Atrasado</div><div class="val">${fmtMoney(resumo.atrasado.total)}</div><div class="sub">${resumo.atrasado.qtd} lançamento(s)</div></div>
    `;
    document.getElementById('lancBody').innerHTML = items.length? items.map(l=>`
      <tr data-id="${l.id}">
        <td>${esc(l.empresaNome)}</td>
        <td>${fmtMoney(l.valor)}</td>
        <td>${fmtDate(l.vencimento)}</td>
        <td><span class="tag ${l.status==='pago'?'ok':l.status==='atrasado'?'bad':l.status==='cancelado'?'muted':'warn'}">${l.status}</span></td>
        <td style="text-align:right;">${podeEditar?`<button class="btn small" data-act="pago">Marcar pago</button>`:''}</td>
      </tr>
    `).join('') : `<tr><td colspan="5"><div class="empty-state">Nenhum lançamento nesta competência.</div></td></tr>`;
    if(podeEditar) document.getElementById('lancBody').querySelectorAll('[data-act="pago"]').forEach(b=>b.addEventListener('click', async e=>{
      const id = Number(e.target.closest('tr').dataset.id);
      await api('/financeiro/lancamentos/'+id, { method:'PUT', body:{ status:'pago', dataPagamento: new Date().toISOString().slice(0,10) } });
      carregar();
    }));
  }
  document.getElementById('finComp').addEventListener('change', carregar);
  if(podePostar) document.getElementById('btnGerarLanc').addEventListener('click', async ()=>{
    const comp = document.getElementById('finComp').value;
    const r = await api('/financeiro/lancamentos/gerar', { method:'POST', body:{ competencia: comp } });
    toast(r.criados+' lançamento(s) gerado(s).','ok');
    carregar();
  });
  carregar();
}

// ===================== Contratos =====================
function rteToolbarHtml(){
  return `
    <div class="rte-toolbar">
      <button type="button" data-cmd="bold"><b>N</b></button>
      <button type="button" data-cmd="italic"><i>I</i></button>
      <button type="button" data-cmd="underline"><u>S</u></button>
      <button type="button" data-cmd="formatBlock" data-val="h1">Título</button>
      <button type="button" data-cmd="formatBlock" data-val="h2">Subtítulo</button>
      <button type="button" data-cmd="formatBlock" data-val="p">Parágrafo</button>
      <button type="button" data-cmd="insertUnorderedList">• Lista</button>
      <button type="button" data-cmd="insertOrderedList">1. Lista</button>
      <button type="button" data-cmd="justifyLeft">Esq.</button>
      <button type="button" data-cmd="justifyCenter">Centro</button>
      <button type="button" data-cmd="justifyFull">Justif.</button>
      <button type="button" data-acao="imagem">Imagem</button>
    </div>
  `;
}
function setupRte(toolbarEl, bodyEl){
  toolbarEl.querySelectorAll('button[data-cmd]').forEach(b=>b.addEventListener('click', ()=>{
    bodyEl.focus();
    document.execCommand(b.dataset.cmd, false, b.dataset.val||null);
  }));
  const btnImagem = toolbarEl.querySelector('button[data-acao="imagem"]');
  if(btnImagem){
    const inputArquivo = document.createElement('input');
    inputArquivo.type = 'file'; inputArquivo.accept = 'image/*'; inputArquivo.style.display = 'none';
    btnImagem.after(inputArquivo);
    btnImagem.addEventListener('click', ()=> inputArquivo.click());
    inputArquivo.addEventListener('change', ()=>{
      const arquivo = inputArquivo.files[0];
      if(!arquivo) return;
      const leitor = new FileReader();
      leitor.onload = ()=>{ bodyEl.focus(); document.execCommand('insertImage', false, leitor.result); };
      leitor.readAsDataURL(arquivo);
      inputArquivo.value = '';
    });
  }
}
const CONTRATO_AUTO_PREENCHER = [
  ['', '— Digitar manualmente —'], ['nome','Nome da empresa'], ['cnpj','CNPJ'],
  ['endereco','Endereço'], ['cidade','Cidade'], ['uf','UF'], ['cep','CEP'], ['email','E-mail'], ['inscricaoMunicipal','Inscrição municipal'],
  ['nomeRepresentanteLegal','Nome do representante legal'], ['cpfRepresentanteLegal','CPF do representante legal'],
];
const MESES_PT_EXTENSO_JS = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
let CONTRATOS_TAB='contratos';
async function pageContratos(){
  main().innerHTML = `
    <h1>Contratos</h1>
    <p class="subtitle">Contratos de prestação de serviços e aditivos com as empresas-cliente.</p>
    <div class="tabs">
      <div class="tab" data-tab="contratos">Contratos</div>
      <div class="tab" data-tab="modelos">Modelos</div>
    </div>
    <div id="contratosContent"></div>
  `;
  main().querySelectorAll('.tab').forEach(t=>t.addEventListener('click', ()=>{ CONTRATOS_TAB=t.dataset.tab; renderContratosTab(); }));
  renderContratosTab();
}
function renderContratosTab(){
  main().querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===CONTRATOS_TAB));
  if(CONTRATOS_TAB==='modelos') renderContratosModelos(); else renderContratosLista();
}
let CONTRATOS_FILTRO={ empresaId:'', status:'' };
async function renderContratosLista(){
  const box = document.getElementById('contratosContent');
  const qs = new URLSearchParams();
  if(CONTRATOS_FILTRO.empresaId) qs.set('empresaId', CONTRATOS_FILTRO.empresaId);
  if(CONTRATOS_FILTRO.status) qs.set('status', CONTRATOS_FILTRO.status);
  const [{ items }, { items: empresas }] = await Promise.all([
    api('/contratos'+(qs.toString()?'?'+qs.toString():'')),
    api('/empresas'),
  ]);
  const STATUS_LABEL={rascunho:'Rascunho',ativo:'Ativo',encerrado:'Encerrado'};
  const TIPO_LABEL={contrato:'Contrato',aditivo:'Aditivo',distrato:'Distrato'};
  box.innerHTML = `
    <div class="row" style="margin-bottom:12px; align-items:flex-end;">
      <div class="field" style="width:280px;"><label>Empresa</label>
        ${comboSelectHtml('ctrFiltroEmpresaCombo', 'Todas as empresas')}
      </div>
      <div class="field" style="width:160px;"><label>Status</label>
        <select id="ctrFiltroStatus">
          <option value="">Todos</option>
          <option value="rascunho" ${CONTRATOS_FILTRO.status==='rascunho'?'selected':''}>Rascunho</option>
          <option value="ativo" ${CONTRATOS_FILTRO.status==='ativo'?'selected':''}>Ativo</option>
          <option value="encerrado" ${CONTRATOS_FILTRO.status==='encerrado'?'selected':''}>Encerrado</option>
        </select>
      </div>
      <button class="btn primary" id="btnNovoContrato">+ Novo contrato</button>
    </div>
    <div class="card" style="padding:0; overflow-x:auto;">
      <table class="data-table">
        <thead><tr><th>Empresa</th><th>Título</th><th>Tipo</th><th>Status</th><th>Atualizado em</th><th></th></tr></thead>
        <tbody>
          ${items.length? items.map(c=>`
            <tr>
              <td>${esc(c.empresaNome)}</td>
              <td>${esc(c.titulo)}</td>
              <td>${TIPO_LABEL[c.tipo]||c.tipo}</td>
              <td><span class="tag ${c.status==='ativo'?'ok':'muted'}">${STATUS_LABEL[c.status]||c.status}</span></td>
              <td>${fmtDateHora(c.updatedAt)}</td>
              <td style="text-align:right; white-space:nowrap;">
                <button class="btn small" data-id="${c.id}" data-act="abrir">Abrir</button>
                <button class="btn small danger" data-id="${c.id}" data-act="excluir">Excluir</button>
              </td>
            </tr>
          `).join('') : `<tr><td colspan="6"><div class="empty-state">Nenhum contrato encontrado.</div></td></tr>`}
        </tbody>
      </table>
    </div>
  `;
  setupComboSelect('ctrFiltroEmpresaCombo', empresas.map(e=>({id:e.id, label:e.nome})), (id)=>{ CONTRATOS_FILTRO.empresaId=id||''; renderContratosLista(); });
  if(CONTRATOS_FILTRO.empresaId){
    const atual = empresas.find(e=>String(e.id)===String(CONTRATOS_FILTRO.empresaId));
    if(atual){ document.querySelector('#ctrFiltroEmpresaCombo .combo-value').value=atual.id; document.querySelector('#ctrFiltroEmpresaCombo .combo-input').value=atual.nome; }
  }
  document.getElementById('ctrFiltroStatus').addEventListener('change', e=>{ CONTRATOS_FILTRO.status=e.target.value; renderContratosLista(); });
  document.getElementById('btnNovoContrato').addEventListener('click', ()=>novoContratoModal(empresas));
  box.querySelectorAll('[data-act="abrir"]').forEach(b=>b.addEventListener('click', ()=>abrirContratoDrawer(Number(b.dataset.id))));
  box.querySelectorAll('[data-act="excluir"]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm('Excluir este contrato? Só é possível excluir documentos em rascunho — encerre em vez de excluir um já ativo.')) return;
    try{ await api('/contratos/'+b.dataset.id, { method:'DELETE' }); toast('Excluído.','ok'); renderContratosLista(); }
    catch(e){ toast(e.message,'err'); }
  }));
}
async function novoContratoModal(empresas){
  const { items: modelos } = await api('/contratos/modelos');
  const ativos = modelos.filter(m=>m.ativo);
  if(!ativos.length){ toast('Cadastre um modelo de contrato primeiro, na aba Modelos.','err'); return; }
  openModal(`
    <h3>Novo contrato</h3>
    <div class="field"><label>Modelo</label>
      <select id="ncModelo">${ativos.map(m=>`<option value="${m.id}">${esc(m.nome)}</option>`).join('')}</select>
    </div>
    <div class="field"><label>Empresa</label>
      ${comboSelectHtml('ncEmpresaCombo', 'Digite para buscar a empresa…')}
    </div>
    <div class="modal-actions">
      <button class="btn" id="ncCancel">Cancelar</button>
      <button class="btn primary" id="ncCriar">Criar</button>
    </div>
  `);
  setupComboSelect('ncEmpresaCombo', empresas.map(e=>({id:e.id, label:e.nome})), ()=>{});
  document.getElementById('ncCancel').addEventListener('click', closeModal);
  document.getElementById('ncCriar').addEventListener('click', async ()=>{
    const empresaId = document.querySelector('#ncEmpresaCombo .combo-value').value;
    if(!empresaId){ toast('Selecione a empresa.','err'); return; }
    try{
      const r = await api('/contratos', { method:'POST', body:{ modeloId:Number(document.getElementById('ncModelo').value), empresaId:Number(empresaId), dados:{} } });
      closeModal();
      renderContratosLista();
      abrirContratoDrawer(r.id);
    }catch(e){ toast(e.message,'err'); }
  });
}
async function abrirContratoDrawer(id){
  const c = await api('/contratos/'+id);
  const campos = c.modeloCampos || [];
  const dados = c.dadosPreenchidos || {};
  openDrawer(`
    <div class="drawer-header">
      <h3>${esc(c.titulo)}</h3>
      <button class="btn small" id="drwFechar">Fechar</button>
    </div>
    <div class="drawer-body">
      ${c.tipo==='aditivo'?`<p style="font-size:12.5px; color:var(--ink-soft); margin-top:-6px;">Aditivo ao contrato: <b>${esc(c.contratoPaiTitulo||'')}</b></p>`:''}
      ${c.tipo==='distrato'?`<p style="font-size:12.5px; color:var(--ink-soft); margin-top:-6px;">Distrato do contrato: <b>${esc(c.contratoPaiTitulo||'')}</b></p>`:''}
      <div class="field"><label>Título</label><input id="drwTitulo" value="${esc(c.titulo)}"></div>
      ${campos.length?`
        <div class="card" style="background:var(--paper); margin-bottom:16px;">
          <div style="font-size:12px; color:var(--ink-soft); margin-bottom:8px;">Dados do contrato</div>
          <div class="campos-grid">
            ${campos.map(f=>`<div class="field"><label>${esc(f.rotulo)}</label><input class="drwCampo" data-chave="${esc(f.chave)}" value="${esc(dados[f.chave]||'')}"></div>`).join('')}
          </div>
          <button class="btn small" id="drwAplicarCampos">Aplicar no documento</button>
        </div>
      `:''}
      ${rteToolbarHtml()}
      <div class="rte-body" id="drwCorpo" contenteditable="true">${c.conteudoHtml}</div>
    </div>
    <div class="drawer-footer">
      <div id="drwEmailForm" style="display:none; width:100%; margin-bottom:8px;"></div>
      <button class="btn" id="drwRascunho">Salvar como rascunho</button>
      <button class="btn primary" id="drwSalvar">Salvar</button>
      <button class="btn" id="drwPdf">Baixar PDF</button>
      <button class="btn" id="drwEmail">Enviar por e-mail</button>
      ${c.tipo==='contrato'?`<button class="btn" id="drwAditivo">Criar aditivo</button><button class="btn" id="drwDistrato">Criar distrato</button>`:''}
    </div>
  `);
  const toolbar = document.querySelector('#drawerBody .rte-toolbar');
  const corpo = document.getElementById('drwCorpo');
  setupRte(toolbar, corpo);
  document.getElementById('drwFechar').addEventListener('click', closeDrawer);
  const salvarComStatus = async (status)=>{
    try{
      await api('/contratos/'+id, { method:'PUT', body:{ titulo: document.getElementById('drwTitulo').value.trim(), conteudoHtml: corpo.innerHTML, status } });
      toast('Salvo.','ok');
      renderContratosLista();
    }catch(e){ toast(e.message,'err'); }
  };
  document.getElementById('drwRascunho').addEventListener('click', ()=>salvarComStatus('rascunho'));
  document.getElementById('drwSalvar').addEventListener('click', ()=>salvarComStatus('ativo'));
  document.getElementById('drwPdf').addEventListener('click', ()=>{
    window.open('/api/contratos/'+id+'/pdf', '_blank');
  });
  const emailForm = document.getElementById('drwEmailForm');
  document.getElementById('drwEmail').addEventListener('click', ()=>{
    if(emailForm.style.display==='none'){
      emailForm.style.display='block';
      emailForm.innerHTML = `
        <div class="row">
          <input id="drwEmailDestino" style="flex:1;" placeholder="E-mail do destinatário" value="${esc(c.empresaEmail||'')}">
          <button class="btn primary small" id="drwEmailEnviar">Enviar</button>
        </div>
      `;
      document.getElementById('drwEmailEnviar').addEventListener('click', async ()=>{
        const destino = document.getElementById('drwEmailDestino').value.trim();
        if(!destino){ toast('Informe o e-mail.','err'); return; }
        try{
          await api('/contratos/'+id+'/enviar-email', { method:'POST', body:{ email: destino } });
          toast('E-mail enviado.','ok');
          emailForm.style.display='none';
        }catch(e){ toast(e.message,'err'); }
      });
    } else {
      emailForm.style.display='none';
    }
  });
  if(campos.length){
    document.getElementById('drwAplicarCampos').addEventListener('click', async ()=>{
      const novosDados = {};
      document.querySelectorAll('.drwCampo').forEach(inp=>novosDados[inp.dataset.chave]=inp.value);
      // {{dia}}/{{mes}}/{{ano}} são automáticos (data de hoje) — só não sobrescreve se o admin já
      // tiver digitado algo manualmente nesses campos.
      const hoje = new Date();
      if(!novosDados['dia']) novosDados['dia'] = String(hoje.getDate());
      if(!novosDados['mes']) novosDados['mes'] = MESES_PT_EXTENSO_JS[hoje.getMonth()];
      if(!novosDados['ano']) novosDados['ano'] = String(hoje.getFullYear());
      // {{vlr_extenso}} é calculado a partir de {{valor_honorário}} — só busca se o campo existir
      // no modelo e o admin já tiver digitado um valor.
      if(!novosDados['vlr_extenso'] && novosDados['valor_honorário']){
        try{
          const r = await api('/contratos/valor-extenso', { method:'POST', body:{ valor: novosDados['valor_honorário'] } });
          novosDados['vlr_extenso'] = r.extenso;
        }catch(e){ toast('Não consegui calcular o valor por extenso: '+e.message,'err'); }
      }
      let html = corpo.innerHTML;
      Object.keys(novosDados).forEach(chave=>{
        const valor = novosDados[chave];
        if(valor) html = html.split('{{'+chave+'}}').join(esc(valor));
      });
      corpo.innerHTML = html;
      toast('Dados aplicados no documento.','ok');
    });
  }
  if(c.tipo==='contrato'){
    document.getElementById('drwAditivo').addEventListener('click', ()=>novoAditivoModal(id));
    document.getElementById('drwDistrato').addEventListener('click', ()=>criarDistrato(id));
  }
}
async function criarDistrato(contratoId){
  if(!confirm('Criar um distrato deste contrato? O documento já sai pronto com o cabeçalho do contrato original, a cláusula e as assinaturas padrão — você revisa e ajusta antes de salvar.')) return;
  try{
    const r = await api('/contratos/'+contratoId+'/distrato', { method:'POST' });
    toast('Distrato criado.','ok');
    abrirContratoDrawer(r.id);
  }catch(e){ toast(e.message,'err'); }
}
function novoAditivoModal(contratoId){
  openModal(`
    <h3>Criar aditivo</h3>
    <div class="field"><label>O que vai mudar neste aditivo?</label>
      <textarea id="adDados" rows="5" placeholder="Ex.: O valor mensal dos honorários passa de R$ 500,00 para R$ 650,00, a partir de 01/09/2026."></textarea>
    </div>
    <p style="font-size:12px; color:var(--ink-soft); margin-top:-6px;">O aditivo já nasce com o mesmo timbrado do contrato original — esse texto entra pronto no documento, e você continua livre pra editar antes de salvar.</p>
    <div class="modal-actions">
      <button class="btn" id="adCancel">Cancelar</button>
      <button class="btn primary" id="adCriar">Criar aditivo</button>
    </div>
  `);
  document.getElementById('adCancel').addEventListener('click', closeModal);
  document.getElementById('adCriar').addEventListener('click', async ()=>{
    try{

function contratoModeloCampoRowHtml(campo){

      <select class="cmAuto" style="width:200px;">

      </select>
      <button type="button" class="btn small cmRemover">Remover</button>
    </div>

function contratoModeloDrawer(m){
  openDrawer(`
    <div class="drawer-header">
      <h3>${m?'Editar modelo':'Novo modelo'}</h3>
      <button class="btn small" id="cmFechar">Fechar</button>
    </div>
    <div class="drawer-body">
      <div class="field"><label>Nome do modelo</label><input id="cmNome" value="${m?esc(m.nome):''}"></div>
      ${m?`<label class="checkbox-row"><input type="checkbox" id="cmAtivo" ${m.ativo?'checked':''}> Ativo (disponível pra criar contratos novos)</label>`:''}
      <div class="card" style="background:var(--paper); margin:14px 0;">
        <div style="font-size:12px; color:var(--ink-soft); margin-bottom:8px;">
          Campos que serão preenchidos por contrato — use <code>{{chave}}</code> no texto do contrato em cada lugar onde esse dado deve aparecer.
        </div>
        <div id="cmCamposList">${(m?m.campos:[]).map(contratoModeloCampoRowHtml).join('')}</div>
        <button type="button" class="btn small" id="cmAddCampo">+ Adicionar campo</button>
      </div>
      <div class="card" style="background:var(--paper); margin:14px 0;">
        <div style="font-size:12px; color:var(--ink-soft); margin-bottom:8px;">
          Já tem o contrato pronto num arquivo Word? Carregue aqui — o texto entra no editor abaixo,
          já formatado, e continua livre pra editar e inserir os campos.
        </div>
        <div class="row" style="align-items:center;">
          <input type="file" id="cmArquivoDocx" accept=".docx">
          <button type="button" class="btn small" id="cmCarregarDocx">Carregar Word</button>
        </div>
        <div style="font-size:11.5px; color:var(--ink-soft); margin-top:4px;">Só arquivo .docx — se o seu estiver em .doc antigo, abra e salve como .docx no Word primeiro.</div>
      </div>
      ${rteToolbarHtml()}
      <div class="rte-body" id="cmCorpo" contenteditable="true">${m?m.conteudoHtml:'<h1>Contrato de Prestação de Serviços</h1><p></p>'}</div>
    </div>
    <div class="modal-actions" style="padding:16px 24px; border-top:1px solid var(--line);">
      <button class="btn primary" id="cmSalvar">Salvar modelo</button>
    </div>
  `);
  const lista = document.getElementById('cmCamposList');
  function ligarRemover(){
    lista.querySelectorAll('.cmRemover').forEach(b=>b.addEventListener('click', ()=>{ b.closest('.cmCampoRow').remove(); }));
  }
  ligarRemover();
  document.getElementById('cmAddCampo').addEventListener('click', ()=>{
    lista.insertAdjacentHTML('beforeend', contratoModeloCampoRowHtml());
    ligarRemover();
  });
  const toolbar = document.querySelector('#drawerBody .rte-toolbar');
  const corpo = document.getElementById('cmCorpo');
  setupRte(toolbar, corpo);
  document.getElementById('cmFechar').addEventListener('click', closeDrawer);
  document.getElementById('cmCarregarDocx').addEventListener('click', async ()=>{
    const arquivo = document.getElementById('cmArquivoDocx').files[0];
    if(!arquivo){ toast('Selecione um arquivo .docx.','err'); return; }
    const fd = new FormData(); fd.append('arquivo', arquivo);
    try{
      const r = await api('/contratos/modelos/importar-docx', { method:'POST', body:fd });
      corpo.innerHTML = r.html;
      toast('Arquivo carregado — revise o texto e insira os campos onde precisar.','ok');
    }catch(e){ toast(e.message,'err'); }
  });
  document.getElementById('cmSalvar').addEventListener('click', async ()=>{
    const nome = document.getElementById('cmNome').value.trim();
    if(!nome){ toast('Informe o nome do modelo.','err'); return; }
    const campos = [...lista.querySelectorAll('.cmCampoRow')].map(row=>({
      chave: row.querySelector('.cmChave').value.trim(),
      rotulo: row.querySelector('.cmRotulo').value.trim(),
      autoPreencherDe: row.querySelector('.cmAuto').value || null,
    })).filter(c=>c.chave && c.rotulo);
    const body = { nome, conteudoHtml: corpo.innerHTML, campos };
    if(m) body.ativo = document.getElementById('cmAtivo').checked;
    try{
      if(m) await api('/contratos/modelos/'+m.id, { method:'PUT', body });
      else await api('/contratos/modelos', { method:'POST', body });
      closeDrawer();
      toast('Modelo salvo.','ok');
      renderContratosModelos();
    }catch(e){ toast(e.message,'err'); }
  });
}

const MODS = [['dashboard','Início'],['empresas','Empresas'],['solicitacoes','Solicitações de Documentos'],['envio','Envio de Documentos'],['nfse','NFS-e'],['financeiro','Financeiro'],['contratos','Contratos'],['relatorios','Relatórios'],['usuarios','Usuários'],['configuracoes','Configurações']];
// Lista de empresas com busca por texto — usada nos dois pickers de empresa do modal de usuário
// (Cliente com múltiplas empresas, Colaborador com acesso restrito), já que a base de empresas
// pode ter centenas de linhas (import do Domínio Web).
function checklistComFiltroHtml(idPrefix, empresas, selecionados){
  selecionados = selecionados || [];
  return `
    <input type="text" id="${idPrefix}Filtro" placeholder="Buscar empresa…" style="margin-bottom:6px;">
    <div style="max-height:220px; overflow-y:auto; overflow-x:hidden; border:1px solid var(--rule); border-radius:8px; padding:8px 10px;">
      ${empresas.map(e=>`<label class="checklist-item ${idPrefix}Linha" data-nome="${esc(normalizaTxt(e.nome))}"><input type="checkbox" class="${idPrefix}Check" value="${e.id}" ${selecionados.includes(e.id)?'checked':''}><span>${esc(e.nome)}</span></label>`).join('') || '<span style="font-size:12px; color:var(--ink-soft);">Nenhuma empresa cadastrada.</span>'}
    </div>
  `;
}
function setupChecklistFiltro(idPrefix){
  const filtro = document.getElementById(idPrefix+'Filtro');
  if(!filtro) return;
  filtro.addEventListener('input', ()=>{
    const termo = normalizaTxt(filtro.value);
    document.querySelectorAll('.'+idPrefix+'Linha').forEach(el=>{
      el.style.display = el.dataset.nome.includes(termo) ? '' : 'none';
    });
  });
}
async function usuarioModal(u){
  const { items: empresas } = await api('/empresas');
  openModal(`
    <h3>${u?'Editar':'Novo'} usuário</h3>
    <div class="field"><label>Nome</label><input id="usNome" value="${u?esc(u.nome):''}"></div>
    <div class="field"><label>E-mail</label><input id="usEmail" type="email" value="${u?esc(u.email):''}"></div>
    <div class="field"><label>Senha ${u?'(deixe em branco para manter)':''}</label><input id="usSenha" type="password"></div>
    ${!u? `<div class="field"><label>Perfil</label><select id="usPerfil"><option value="Colaborador">Colaborador (escritório)</option><option value="Administrador">Administrador</option><option value="Cliente">Cliente</option></select></div>`
        : `<div class="field"><label>Perfil</label><input value="${esc(u.perfil)}" disabled></div>`}
    <div id="usEmpresaWrap" class="field hidden">
      <label>Empresa(s) — pode marcar mais de uma</label>
      ${checklistComFiltroHtml('usCliEmp', empresas, [])}
    </div>
    ${u? `<label class="checkbox-row"><input type="checkbox" id="usAtivo" ${u.ativo?'checked':''}> Ativo</label>`:''}
    <div id="usColabWrap" class="hidden">
      <div style="margin:16px 0 8px; padding-top:12px; border-top:1px solid var(--rule); font-weight:600; font-size:13.5px;">Permissões e acessos</div>
      <label class="checkbox-row"><input type="checkbox" id="usAcessoTodas" checked> Acesso a todas as empresas</label>
      <div id="usEmpresasRestritasWrap" class="hidden" style="margin:6px 0 10px;">
        ${checklistComFiltroHtml('usColabEmp', empresas, [])}
      </div>
      <div id="usPermWrap"></div>
    </div>
    <div class="modal-actions">
      <button class="btn" id="usCancel">Cancelar</button>
      <button class="btn primary" id="usSalvar">Salvar</button>
    </div>
  `, '760px');
  setupChecklistFiltro('usCliEmp');
  setupChecklistFiltro('usColabEmp');
  const perfilSel = document.getElementById('usPerfil');
  function syncPerfilUI(){
    const perfil = u? u.perfil : perfilSel.value;
    document.getElementById('usEmpresaWrap').classList.toggle('hidden', perfil!=='Cliente');
    document.getElementById('usColabWrap').classList.toggle('hidden', perfil!=='Colaborador');
  }
  if(perfilSel) perfilSel.addEventListener('change', syncPerfilUI);
  syncPerfilUI();

  function renderPermGrid(perms){
    perms = perms || [];
    const wrap = document.getElementById('usPermWrap');
    wrap.innerHTML = `<div style="font-size:12px; font-weight:600; margin-bottom:6px;">Permissões por módulo</div>
      <div class="perm-grid">
        <div></div><div class="hdr">Ver</div><div class="hdr">Postar</div><div class="hdr">Editar</div>
        ${MODS.map(([m,l])=>{
          const p = perms.find(x=>x.modulo===m) || {};
          return `<div class="modname">${l}</div>
            <div><input type="checkbox" class="pv" data-mod="${m}" ${p.pode_visualizar?'checked':''}></div>
            <div><input type="checkbox" class="pp" data-mod="${m}" ${p.pode_postar?'checked':''}></div>
            <div><input type="checkbox" class="pe" data-mod="${m}" ${p.pode_editar?'checked':''}></div>`;
        }).join('')}
      </div>`;
  }
  renderPermGrid([]);
  const acessoTodasEl = document.getElementById('usAcessoTodas');
  const empresasRestritasWrap = document.getElementById('usEmpresasRestritasWrap');
  acessoTodasEl.addEventListener('change', ()=> empresasRestritasWrap.classList.toggle('hidden', acessoTodasEl.checked));

  if(u && u.perfil==='Colaborador'){
    const [{ items: perms }, { empresaIds }] = await Promise.all([
      api('/users/'+u.id+'/permissoes'),
      api('/users/'+u.id+'/empresas'),
    ]);
    renderPermGrid(perms);
    acessoTodasEl.checked = !!u.acessoTodasEmpresas;
    empresasRestritasWrap.classList.toggle('hidden', acessoTodasEl.checked);
    empresasRestritasWrap.querySelectorAll('.usColabEmpCheck').forEach(c=>{ c.checked = empresaIds.includes(Number(c.value)); });
  }
  if(u && u.perfil==='Cliente'){
    const { empresaIds } = await api('/users/'+u.id+'/empresas');
    document.querySelectorAll('.usCliEmpCheck').forEach(c=>{ c.checked = empresaIds.includes(Number(c.value)); });
  }

  document.getElementById('usCancel').addEventListener('click', closeModal);
  document.getElementById('usSalvar').addEventListener('click', async ()=>{
    const nome=document.getElementById('usNome').value.trim();
    const email=document.getElementById('usEmail').value.trim();
    const senha=document.getElementById('usSenha').value;
    if(!nome||!email){ toast('Preencha nome e e-mail.','err'); return; }
    const perfil = u? u.perfil : perfilSel.value;
    if(perfil==='Cliente' && ![...document.querySelectorAll('.usCliEmpCheck')].some(c=>c.checked)){
      toast('Marque ao menos uma empresa para o cliente.','err'); return;
    }
    try{
      let userId;
      if(u){
        const body = { nome, email, ativo: document.getElementById('usAtivo').checked };
        if(senha) body.password = senha;
        if(perfil==='Colaborador') body.acessoTodasEmpresas = document.getElementById('usAcessoTodas').checked;
        await api('/users/'+u.id, { method:'PUT', body });
        userId = u.id;
      } else {
        if(!senha){ toast('Defina uma senha.','err'); return; }
        const body = { nome, email, perfil, password: senha };
        if(perfil==='Colaborador') body.acessoTodasEmpresas = document.getElementById('usAcessoTodas').checked;
        const r = await api('/users', { method:'POST', body });
        userId = r.id;
      }
      if(perfil==='Colaborador'){
        const permissoes = {};
        MODS.forEach(([m])=>{
          permissoes[m] = {
            visualizar: !!document.querySelector(`.pv[data-mod="${m}"]`)?.checked,
            postar: !!document.querySelector(`.pp[data-mod="${m}"]`)?.checked,
            editar: !!document.querySelector(`.pe[data-mod="${m}"]`)?.checked,
          };
        });
        await api('/users/'+userId+'/permissoes', { method:'PUT', body:{ permissoes } });
        const empresaIds = document.getElementById('usAcessoTodas').checked ? [] :
          [...document.querySelectorAll('.usColabEmpCheck:checked')].map(c=>Number(c.value));
        await api('/users/'+userId+'/empresas', { method:'PUT', body:{ empresaIds } });
      }
      if(perfil==='Cliente'){
        const empresaIds = [...document.querySelectorAll('.usCliEmpCheck:checked')].map(c=>Number(c.value));
        await api('/users/'+userId+'/empresas', { method:'PUT', body:{ empresaIds } });
      }
      closeModal(); pageUsuarios();
    }catch(e){ toast(e.message,'err'); }
  });
}

    const id = Number(tr.dataset.id);
    escritorioModal(items.find(x=>x.id===id));
  }));
  document.getElementById('escritoriosBody').querySelectorAll('[data-act="admin"]').forEach(b=>b.addEventListener('click', e=>{
    const tr = e.target.closest('tr');
    const id = Number(tr.dataset.id);
    administradorModal(items.find(x=>x.id===id));
  }));
  document.getElementById('escritoriosBody').querySelectorAll('[data-act="toggle"]').forEach(b=>b.addEventListener('click', async e=>{
    const tr = e.target.closest('tr');

    try{
      await api('/super/escritorios/'+id+'/ativo', { method:'PUT', body:{ ativo: !item.ativo } });

    }catch(err){ toast(err.message,'err'); }
  }));

function escritorioModal(esc_){
  openModal(`

    <div class="field"><label>CNPJ</label><input id="escCnpj" value="${esc_&&esc_.cnpj?esc(esc_.cnpj):''}"></div>
    <div class="field"><label>E-mail</label><input id="escEmail" type="email" value="${esc_&&esc_.email?esc(esc_.email):''}"></div>
    <div class="field"><label>Telefone</label><input id="escTelefone" value="${esc_&&esc_.telefone?esc(esc_.telefone):''}"></div>
    ${!esc_?'<p class="subtitle" style="margin-top:0;">Depois de criado, use o botão "+ Administrador" na lista pra cadastrar o primeiro acesso desse escritório.</p>':''}
    <div class="modal-actions">
      <button class="btn" id="escCancel">Cancelar</button>
      <button class="btn primary" id="escSalvar">Salvar</button>
    </div>
  `);
  document.getElementById('escCancel').addEventListener('click', closeModal);
  document.getElementById('escSalvar').addEventListener('click', async ()=>{
    const nome = document.getElementById('escNome').value.trim();
    if(!nome){ toast('Informe o nome do escritório.','err'); return; }
    const body = {
      nome,
      cnpj: document.getElementById('escCnpj').value.trim() || null,
      email: document.getElementById('escEmail').value.trim() || null,
      telefone: document.getElementById('escTelefone').value.trim() || null,
    };
    try{
      if(esc_) await api('/super/escritorios/'+esc_.id, { method:'PUT', body });
      else await api('/super/escritorios', { method:'POST', body });
      closeModal(); pageEscritorios();
    }catch(e){ toast(e.message,'err'); }
  });
}
function administradorModal(esc_){
  openModal(`
    <h3>Novo Administrador — ${esc(esc_.nome)}</h3>
    <div class="field"><label>Nome</label><input id="admNome"></div>
    <div class="field"><label>E-mail</label><input id="admEmail" type="email"></div>
    <div class="field"><label>Senha</label><input id="admSenha" type="password"></div>

    <div class="modal-actions">
      <button class="btn" id="admCancel">Cancelar</button>
      <button class="btn primary" id="admSalvar">Salvar</button>
    </div>
  `);
  document.getElementById('admCancel').addEventListener('click', closeModal);
  document.getElementById('admSalvar').addEventListener('click', async ()=>{
    const nome = document.getElementById('admNome').value.trim();
    const email = document.getElementById('admEmail').value.trim();
    const password = document.getElementById('admSenha').value;
    if(!nome || !email || !password){ toast('Preencha nome, e-mail e senha.','err'); return; }

      closeModal(); toast('Administrador criado.','ok'); pageEscritorios();
    }catch(e){ toast(e.message,'err'); }

function tabelaModulosHtml(prefixo, items){
  return `
    <table class="data-table">
      <thead><tr><th>Módulo</th><th>Valor mensal (R$)</th><th>Ativo</th><th></th></tr></thead>
      <tbody>
        ${items.map(m=>`
          <tr data-chave="${m.chave}">
            <td><input class="${prefixo}Nome" value="${esc(m.nome)}" style="width:100%;"></td>
            <td style="width:160px;"><input class="${prefixo}Valor" type="number" step="0.01" min="0" value="${m.valorMensal}" style="width:100%;"></td>
            <td style="width:70px; text-align:center;"><input class="${prefixo}Ativo" type="checkbox" ${m.ativo?'checked':''}></td>
            <td style="width:90px;"><button class="btn small ${prefixo}Salvar">Salvar</button></td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}
function ligarSalvarModulos(container, prefixo, endpoint){
  container.querySelectorAll('.'+prefixo+'Salvar').forEach(btn=>btn.addEventListener('click', async ()=>{
    const tr = btn.closest('tr');
    const chave = tr.dataset.chave;
    const body = {
      nome: tr.querySelector('.'+prefixo+'Nome').value.trim(),
      valorMensal: Number(tr.querySelector('.'+prefixo+'Valor').value) || 0,
      ativo: tr.querySelector('.'+prefixo+'Ativo').checked,
    };
    try{ await api(endpoint+'/'+chave, { method:'PUT', body }); toast('Módulo atualizado.','ok'); }
    catch(e){ toast(e.message,'err'); }
  }));
}

  main().innerHTML = `

    const resultEl = document.getElementById('domTestResult');
    const btn = document.getElementById('btnTestarDomCfg');
    btn.disabled = true; btn.textContent = 'Testando…';
    resultEl.innerHTML = `<p style="font-size:12.5px; color:var(--ink-soft);">Aguardando o agente responder (ele precisa estar rodando e configurado)…</p>`;
    try{
      const { id } = await api('/dominio/testar-conexao', { method:'POST' });
      domTestPolling = true;
      let tentativas = 0;
      const poll = async ()=>{
        if(!domTestPolling) return;
        tentativas++;
        const r = await api('/dominio/testar-conexao/'+id);
        if(r.status==='pending'){
          if(tentativas>30){ resultEl.innerHTML = `<div class="tag bad">Sem resposta</div> <span style="font-size:12.5px;">O agente não respondeu em tempo — confira se ele está rodando (npm run dominio-agent:dev) e apontando para este site.</span>`; btn.disabled=false; btn.textContent='Testar conexão'; return; }
          setTimeout(poll, 2000);
          return;
        }
        btn.disabled = false; btn.textContent = 'Testar conexão';
        if(r.status==='ok'){
          const res_ = r.resultado || {};
          resultEl.innerHTML = `<div class="tag ok">Conexão OK</div> <span style="font-size:12.5px;">${res_.totalLinhas||0} linha(s) retornada(s).</span>
            ${res_.amostra&&res_.amostra.length? `<pre style="white-space:pre-wrap; font-size:11.5px; background:var(--paper); padding:8px; border-radius:6px; margin-top:8px;">${esc(JSON.stringify(res_.amostra, null, 2))}</pre>`:''}`;
        } else {
          resultEl.innerHTML = `<div class="tag bad">Falhou</div> <span style="font-size:12.5px;">${esc(r.erro||'Erro desconhecido.')}</span>`;
        }
      };
      poll();
    }catch(e){
      btn.disabled = false; btn.textContent = 'Testar conexão';
      resultEl.innerHTML = `<div class="tag bad">Falhou</div> <span style="font-size:12.5px;">${esc(e.message)}</span>`;
    }
  });
}

let CFG_ASSINATURA_POLL = null;
async function renderCfgAssinaturaPlataforma(box){
  if(CFG_ASSINATURA_POLL){ clearInterval(CFG_ASSINATURA_POLL); CFG_ASSINATURA_POLL=null; }
  const { items } = await api('/escritorio/modulos');
  box.innerHTML = `
    <div class="card">
      <p style="font-size:12.5px; color:var(--ink-soft); margin-top:-4px;">
        Módulos que o seu escritório contrata da plataforma (diferente do catálogo que você vende
        pras suas empresas-cliente, na aba "Módulos"). Teste qualquer um grátis por 3 dias, ou
        contrate direto via Pix/cartão.
      </p>
    </div>
    <div id="cfgAssinaturaContent"></div>
  `;
  const content = document.getElementById('cfgAssinaturaContent');
  content.innerHTML = `
    ${items.map(assinaturaModuloCardHtml).join('')}
    <div class="card" style="margin-top:14px;">
      <div class="row" style="justify-content:space-between; align-items:center;">
        <div>Total selecionado: <b id="cfgAssinaturaTotal">${fmtMoney(0)}</b></div>
        <button class="btn primary" id="btnPagarAssinaturaPlataforma" disabled>Pagar agora</button>
      </div>
      <div id="cfgAssinaturaPagamentoResultado" style="margin-top:12px;"></div>
    </div>
  `;
  content.querySelectorAll('[data-acao="testar"]').forEach(b=>b.addEventListener('click', async ()=>{
    try{
      await api('/escritorio/modulos/'+b.dataset.chave+'/iniciar-teste', { method:'POST' });
      toast('Teste iniciado! Você tem 3 dias de acesso completo.','ok');
      renderCfgAssinaturaPlataforma(box);
    }catch(e){ toast(e.message,'err'); }
  }));
  const btnPagar = document.getElementById('btnPagarAssinaturaPlataforma');
  function recomputarTotal(){
    const marcados = [...content.querySelectorAll('.assinaturaCheck:checked')];
    const total = marcados.reduce((soma,c)=>soma+Number(c.dataset.valor),0);
    document.getElementById('cfgAssinaturaTotal').textContent = fmtMoney(total);
    btnPagar.disabled = marcados.length===0;
  }
  content.querySelectorAll('.assinaturaCheck').forEach(c=>c.addEventListener('change', recomputarTotal));
  btnPagar.addEventListener('click', async ()=>{
    const chaves = [...content.querySelectorAll('.assinaturaCheck:checked')].map(c=>c.dataset.chave);
    if(!chaves.length) return;
    const resultado = document.getElementById('cfgAssinaturaPagamentoResultado');
    resultado.innerHTML = `<div class="empty-state">Gerando cobrança…</div>`;
    try{
      const r = await api('/escritorio/modulos/pagar', { method:'POST', body:{ modulos: chaves } });
      resultado.innerHTML = `
        <div class="card" style="background:var(--paper);">
          ${r.pixImagemBase64?`
            <div style="text-align:center;">
              <img src="data:image/png;base64,${r.pixImagemBase64}" alt="QR Code Pix" style="width:200px; height:200px;">
              <div style="font-size:12px; color:var(--ink-soft); margin:8px 0 4px;">Pix copia e cola</div>
              <input readonly value="${esc(r.pixPayload||'')}" style="width:100%; font-family:'IBM Plex Mono',monospace; font-size:11px; text-align:center;" onclick="this.select()">
            </div>
          `:''}
          ${r.invoiceUrl?`<div style="text-align:center; margin-top:12px;"><a class="btn primary" href="${esc(r.invoiceUrl)}" target="_blank" rel="noopener">Pagar com cartão de crédito</a></div>`:''}
          <div style="text-align:center; margin-top:12px; font-size:12px; color:var(--ink-soft);">Assim que o pagamento confirmar, o acesso libera sozinho aqui.</div>
        </div>
      `;
      CFG_ASSINATURA_POLL = setInterval(async ()=>{
        try{
          const { items: atualizados } = await api('/escritorio/modulos');
          const todosLiberados = chaves.every(ch=>{ const m=atualizados.find(i=>i.chave===ch); return m && m.status==='ativo'; });
          if(todosLiberados){
            clearInterval(CFG_ASSINATURA_POLL); CFG_ASSINATURA_POLL=null;
            toast('Pagamento confirmado!','ok');
            renderCfgAssinaturaPlataforma(box);
          }
        }catch(e){ /* ignora falha pontual de rede no polling */ }
      }, 5000);
    }catch(e){
      resultado.innerHTML = `<div class="slot-locked" style="background:var(--paper); border-color:var(--debit);"><span class="fname">Não consegui gerar a cobrança</span>${esc(e.message)}</div>`;
    }
  });
}

      lista.innerHTML = servicos.length? servicos.map((s,idx)=>`
        <div class="card" style="background:var(--paper-deep); margin-bottom:10px;" data-item-id="${s.id}">

          </div>
          <div class="field"><label>Modelo (NFS-e › Modelos)</label>
            <select data-f="modelo">
              <option value="">— Selecione —</option>
              ${modelosAtivos.map(m=>`<option value="${m.id}" ${s.modeloId===m.id?'selected':''}>${esc(m.nome)}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>Descrição do serviço</label>
            <textarea data-f="descricao" rows="3">${esc(s.descricaoServico)}</textarea>
            <div style="font-size:11px; color:var(--ink-soft); margin-top:4px;">Use <code>{{mes_competencia}}</code> onde quiser que apareça o mês/ano da competência (ex.: "agosto/2026").</div>
          </div>
          <div class="field"><label>Valor do serviço (R$)</label><input data-f="valor" type="number" step="0.01" min="0" value="${s.valorServico!=null?s.valorServico:''}"></div>
          <label class="checkbox-row"><input type="checkbox" data-f="ativo" ${s.ativo?'checked':''}> Ativo (desmarque pra pausar só este serviço)</label>
          <button class="btn primary small" data-act="salvar-item" data-id="${s.id}">Salvar este serviço</button>
        </div>
      `).join('') : `<div class="empty-state">Nenhum serviço configurado ainda — adicione pelo botão abaixo.</div>`;
      lista.querySelectorAll('[data-act="salvar-item"]').forEach(b=>b.addEventListener('click', async ()=>{
        const card = b.closest('[data-item-id]');
        const body = {
          modeloId: card.querySelector('[data-f="modelo"]').value || null,
          descricaoServico: card.querySelector('[data-f="descricao"]').value,
          valorServico: card.querySelector('[data-f="valor"]').value,
          ativo: card.querySelector('[data-f="ativo"]').checked,
        };
        try{ await api('/nfse/agendamento/itens/'+b.dataset.id, { method:'PUT', body }); toast('Salvo.','ok'); carregarQuadroSelecionadas(); }
        catch(err){ toast(err.message,'err'); }
      }));
      lista.querySelectorAll('[data-act="remover-item"]').forEach(b=>b.addEventListener('click', async ()=>{
        if(!confirm('Remover este serviço? Ele deixa de gerar NFS-e nas próximas execuções.')) return;
        try{
          await api('/nfse/agendamento/itens/'+b.dataset.id, { method:'DELETE' });
          const idx = servicos.findIndex(s=>String(s.id)===b.dataset.id);
          if(idx>=0) servicos.splice(idx,1);
          renderItens();
          carregarQuadroSelecionadas();
        }catch(err){ toast(err.message,'err'); }
      }));
    }
    renderItens();
    document.getElementById('agAdicionarItem').addEventListener('click', async ()=>{
      try{
        const r = await api('/nfse/agendamento/empresas/'+item.empresaId+'/itens', { method:'POST' });
        servicos.push({ id:r.id, empresaId:item.empresaId, modeloId:null, descricaoServico:'Honorários contábeis referente ao Mês {{mes_competencia}}', valorServico:null, ativo:true });
        renderItens();
        carregarQuadroSelecionadas();
      }catch(err){ toast(err.message,'err'); }
    });
  }
  async function carregarLogAgendamento(){
    const logBox = document.getElementById('agLog');
    const { items } = await api('/nfse/agendamento/log');
    // "Tentar novamente" só aparece na linha mais recente de cada emissão — sem isso, depois de um
    // reenvio bem-sucedido (que entra como uma linha NOVA no histórico), a linha antiga com erro
    // continuava mostrando o botão pra sempre, e clicar nela de novo criaria um anexo/e-mail
    // duplicado pro cliente.
    const maisRecentePorEmissao = {};
    items.forEach(l=>{ if(!(l.emissaoId in maisRecentePorEmissao)) maisRecentePorEmissao[l.emissaoId] = l; });
    logBox.innerHTML = items.length? `
      <table class="data-table">
        <thead><tr><th>Quando</th><th>Empresa</th><th>Competência</th><th>Status</th><th>Mensagem</th><th></th></tr></thead>
        <tbody>
          ${items.map(l=>{
            const falhouAnexo = l.sucesso && /não consegui anexar/i.test(l.mensagem||'') && maisRecentePorEmissao[l.emissaoId]===l;
            return `
            <tr>
              <td>${fmtDateHora(l.executadoEm)}</td>
              <td>${esc(l.empresaNome||'—')}</td>
              <td>${esc(l.competencia)}</td>
              <td><span class="tag ${l.sucesso?'ok':'bad'}">${l.sucesso?'Sucesso':'Falhou'}</span></td>
              <td style="font-size:12px;">${esc(l.mensagem||'')}</td>
              <td>${falhouAnexo?`<button class="btn small" data-act="reenviar-doc" data-emissao="${l.emissaoId}">Tentar novamente</button>`:''}</td>
            </tr>
          `}).join('')}
        </tbody>
      </table>
    ` : `<div class="empty-state">Nenhuma execução ainda.</div>`;
    logBox.querySelectorAll('[data-act="reenviar-doc"]').forEach(b=>b.addEventListener('click', async ()=>{
      b.disabled = true; b.textContent = 'Tentando…';
      try{
        const r = await api('/nfse/agendamento/emissoes/'+b.dataset.emissao+'/reenviar-documento', { method:'POST' });
        toast(r.mensagem,'ok');
        carregarLogAgendamento();
      }catch(e){ toast(e.message,'err'); b.disabled=false; b.textContent='Tentar novamente'; }
    }));
  }
  carregarQuadroDisponiveis();
  carregarQuadroSelecionadas();
  carregarLogAgendamento();
  if(NFSE_AG_EMPRESA_ABERTA){
    const item = quadro2.find(x=>x.empresaId===NFSE_AG_EMPRESA_ABERTA);
    if(item) abrirPainelEmpresa(item);
  }
}
let CFG_EMAIL_SUBTAB='smtp';
async function renderCfgEmail(box){
  box.innerHTML = `
    <div class="tabs" style="margin-bottom:14px;">
      <div class="tab" data-subtab="smtp">Configuração SMTP</div>
      <div class="tab" data-subtab="nfse-texto">Texto padrão para NFS-e</div>
    </div>
    <div id="cfgEmailSubContent"></div>
  `;
  box.querySelectorAll('.tab').forEach(t=>t.addEventListener('click', ()=>{ CFG_EMAIL_SUBTAB=t.dataset.subtab; renderCfgEmailSubTab(); }));
  renderCfgEmailSubTab();
}
function renderCfgEmailSubTab(){
  document.querySelectorAll('#cfgContent .tab[data-subtab]').forEach(t=>t.classList.toggle('active', t.dataset.subtab===CFG_EMAIL_SUBTAB));
  const sub = document.getElementById('cfgEmailSubContent');
  if(CFG_EMAIL_SUBTAB==='nfse-texto') renderCfgEmailTextoNfse(sub);
  else renderCfgEmailSmtp(sub);
}
async function renderCfgEmailTextoNfse(box){
  const cfg = await api('/email/config');
  box.innerHTML = `
    <div class="card">
      <h3>Texto padrão para envio de NFS-e para o cliente</h3>
      <p style="font-size:12.5px; color:var(--ink-soft); margin-top:-6px;">
        Usado automaticamente quando a rotina de emissão de NFS-e (Configurações › Emissão de NFS-e)
        manda a nota por e-mail pro cliente, com o PDF já anexado.
      </p>
      <div class="field"><label>Descrição / corpo do e-mail</label>
        <textarea id="cfgNfseEmailTexto" rows="6" placeholder="Ex.: Prezado cliente, segue em anexo a nota fiscal de serviço referente aos honorários contábeis do mês.">${esc(cfg.nfseEmailTexto)}</textarea>
      </div>
      <button class="btn primary" id="cfgNfseEmailSalvar">Salvar</button>
    </div>
  `;
  document.getElementById('cfgNfseEmailSalvar').addEventListener('click', async ()=>{
    try{
      await api('/email/config', { method:'PUT', body:{ nfseEmailTexto: document.getElementById('cfgNfseEmailTexto').value } });
      toast('Texto salvo.','ok');
    }catch(e){ toast(e.message,'err'); }
  });
}
async function renderCfgEmailSmtp(box){
  const status = await api('/email/status');
  const cfg = await api('/email/config');
  const { items } = await api('/email/log');
  const { items: empresas } = await api('/empresas');
  box.innerHTML = `
    <div class="card">
      <h3>Status</h3>
      <p style="font-size:13px;">${status.configurado? `<span class="tag ok">Configurado</span> Enviando como ${esc(status.from)}` : `<span class="tag bad">Não configurado</span> Preencha e salve os dados abaixo.`}</p>
    </div>
    <div class="card">
      <h3>Configuração SMTP</h3>
      <p style="font-size:12.5px; color:var(--ink-soft); margin-top:-6px;">Se for Gmail/Google Workspace, use uma <a href="https://myaccount.google.com/apppasswords" target="_blank" rel="noopener" class="link-discreto">senha de app</a> — a senha normal da conta não funciona aqui.</p>
      <div class="row">
        <div class="field grow"><label>Host SMTP</label><input id="cfgSmtpHost" value="${esc(cfg.smtpHost)}" placeholder="smtp.gmail.com"></div>
        <div class="field" style="width:110px;"><label>Porta</label><input id="cfgSmtpPort" type="number" value="${cfg.smtpPort}"></div>
      </div>
      <label class="checkbox-row"><input type="checkbox" id="cfgSmtpSecure" ${cfg.smtpSecure?'checked':''}> Conexão segura (SSL direto na porta — deixe desmarcado pra porta 587/TLS, padrão do Gmail)</label>
      <div class="field"><label>Usuário / e-mail de login</label><input id="cfgSmtpUser" value="${esc(cfg.smtpUser)}" placeholder="simplescontabeis@gmail.com"></div>
      <div class="field"><label>Senha${cfg.temSenha?' (já salva — preencha só se quiser trocar)':''}</label><input id="cfgSmtpPassword" type="password" placeholder="${cfg.temSenha?'••••••••••••••••':'senha de app'}"></div>
      <div class="row">
        <div class="field grow"><label>Nome do remetente</label><input id="cfgFromName" value="${esc(cfg.fromName)}" placeholder="Simples Contábeis"></div>
        <div class="field grow"><label>E-mail do remetente (opcional, padrão = usuário)</label><input id="cfgFromEmail" value="${esc(cfg.fromEmail)}" placeholder="simplescontabeis@gmail.com"></div>
      </div>
      <div class="row">
        <button class="btn primary" id="cfgSmtpSalvar">Salvar</button>
        <button class="btn" id="cfgSmtpTestar">Testar conexão</button>
      </div>
      <div id="cfgSmtpResultado" style="margin-top:10px;"></div>
    </div>
    <div class="card">
      <h3>Contatos e documentos por cliente</h3>
      <p style="font-size:12.5px; color:var(--ink-soft); margin-top:-6px;">Cadastre aqui os e-mails (pode ser mais de um) e os CNPJ/CPF de cada cliente, uma vez só — ficam salvos para o envio e para a identificação automática.</p>
      <div class="field"><label>Empresa</label>${comboSelectHtml('ccEmpresaCombo', 'Digite para buscar a empresa…')}</div>
      <div id="ccBody"></div>
    </div>
    <div class="card">
      <h3>Histórico de envios</h3>
      <table class="data-table">
        <thead><tr><th>Quando</th><th>Empresa</th><th>Assunto</th><th>Status</th></tr></thead>
        <tbody>${items.length? items.map(e=>`<tr><td>${fmtDate(e.enviado_em)}</td><td>${esc(e.empresaNome||'—')}</td><td>${esc(e.assunto)}</td><td><span class="tag ${e.status==='ok'?'ok':'bad'}">${e.status}</span></td></tr>`).join(''):'<tr><td colspan="4"><div class="empty-state">Nenhum envio ainda.</div></td></tr>'}</tbody>
      </table>
    </div>
  `;

  document.getElementById('cfgSmtpSalvar').addEventListener('click', async ()=>{
    const body = {
      smtpHost: document.getElementById('cfgSmtpHost').value.trim(),
      smtpPort: Number(document.getElementById('cfgSmtpPort').value) || 587,
      smtpSecure: document.getElementById('cfgSmtpSecure').checked,
      smtpUser: document.getElementById('cfgSmtpUser').value.trim(),
      smtpPassword: document.getElementById('cfgSmtpPassword').value,
      fromName: document.getElementById('cfgFromName').value.trim(),
      fromEmail: document.getElementById('cfgFromEmail').value.trim(),
    };
    try{
      await api('/email/config', { method:'PUT', body });
      toast('Configuração salva.','ok');
      renderCfgTab();
    }catch(e){ toast(e.message,'err'); }
  });
  document.getElementById('cfgSmtpTestar').addEventListener('click', async ()=>{
    const resEl = document.getElementById('cfgSmtpResultado');
    resEl.innerHTML = `<div class="empty-state">Testando…</div>`;
    try{
      await api('/email/testar', { method:'POST' });
      resEl.innerHTML = `<div class="tag ok">Conexão OK</div>`;
    }catch(e){
      resEl.innerHTML = `<div class="tag bad">Falhou</div> <span style="font-size:12.5px;">${esc(e.message)}</span>`;
    }
  });

  async function carregarContatosEDocs(){
    const empresaId = document.querySelector('#ccEmpresaCombo .combo-value').value;
    const ccBody = document.getElementById('ccBody');
    if(!empresaId){ ccBody.innerHTML=''; return; }
    const [{items:contatos}, {items:docs}] = await Promise.all([
      api('/empresas/'+empresaId+'/contatos'), api('/empresas/'+empresaId+'/documentos'),
    ]);
    ccBody.innerHTML = `
      <div style="font-weight:600; font-size:12.5px; margin:10px 0 6px;">Contatos (e-mail e WhatsApp)</div>
      <table class="data-table"><tbody id="ccContatosBody">
        ${contatos.map(c=>`<tr data-id="${c.id}"><td>${esc(c.nome)}</td><td>${esc(c.email)}</td><td>${c.telefone?esc(c.telefone):'—'}${c.receber_whatsapp?' <span class="tag ok">WhatsApp</span>':''}</td><td style="text-align:right;"><button class="btn small danger" data-act="rmContato">Remover</button></td></tr>`).join('') || '<tr><td colspan="4"><span style="font-size:12px; color:var(--ink-soft);">Nenhum contato cadastrado.</span></td></tr>'}
      </tbody></table>
      <div class="row" style="margin-top:8px; align-items:flex-end;">
        <div class="field" style="margin-bottom:0;"><input id="ccNome" placeholder="Nome do contato"></div>
        <div class="field" style="margin-bottom:0;"><input id="ccEmail" type="email" placeholder="e-mail@cliente.com"></div>
        <div class="field" style="margin-bottom:0;"><input id="ccTelefone" placeholder="WhatsApp (DDD + número)"></div>
        <label class="checkbox-row" style="margin-bottom:8px;"><input type="checkbox" id="ccReceberWhatsapp"> Receber por WhatsApp</label>
        <button class="btn small" id="btnAddContato">+ Adicionar</button>
      </div>
      <div style="font-weight:600; font-size:12.5px; margin:16px 0 6px;">CNPJ / CPF cadastrados</div>
      <table class="data-table"><tbody id="ccDocsBody">
        ${docs.map(d=>`<tr data-id="${d.id}"><td>${d.tipo.toUpperCase()}</td><td>${esc(d.documento)}</td><td style="text-align:right;"><button class="btn small danger" data-act="rmDoc">Remover</button></td></tr>`).join('') || '<tr><td colspan="3"><span style="font-size:12px; color:var(--ink-soft);">Nenhum documento cadastrado.</span></td></tr>'}
      </tbody></table>
      <div class="row" style="margin-top:8px;">
        <div class="field" style="margin-bottom:0;"><input id="ccDocumento" placeholder="CNPJ ou CPF (só números ou com pontuação)"></div>
        <button class="btn small" id="btnAddDoc">+ Adicionar documento</button>
      </div>
    `;
    document.getElementById('btnAddContato').addEventListener('click', async ()=>{
      const nome = document.getElementById('ccNome').value.trim();
      const email = document.getElementById('ccEmail').value.trim();
      const telefone = document.getElementById('ccTelefone').value.trim();
      const receberWhatsapp = document.getElementById('ccReceberWhatsapp').checked;
      if(!nome||!email){ toast('Preencha nome e e-mail.','err'); return; }
      try{ await api('/empresas/'+empresaId+'/contatos', { method:'POST', body:{ nome, email, telefone, receberWhatsapp } }); carregarContatosEDocs(); }
      catch(e){ toast(e.message,'err'); }
    });
    document.querySelectorAll('[data-act="rmContato"]').forEach(b=>b.addEventListener('click', async e=>{
      await api('/empresas/contatos/'+e.target.closest('tr').dataset.id, { method:'DELETE' });
      carregarContatosEDocs();
    }));
    document.getElementById('btnAddDoc').addEventListener('click', async ()=>{
      const documento = document.getElementById('ccDocumento').value.trim();
      if(!documento){ toast('Informe o CNPJ ou CPF.','err'); return; }
      try{ await api('/empresas/'+empresaId+'/documentos', { method:'POST', body:{ documento } }); carregarContatosEDocs(); }
      catch(e){ toast(e.message,'err'); }
    });
    document.querySelectorAll('[data-act="rmDoc"]').forEach(b=>b.addEventListener('click', async e=>{
      await api('/empresas/documentos/'+e.target.closest('tr').dataset.id, { method:'DELETE' });
      carregarContatosEDocs();
    }));
  }
  setupComboSelect('ccEmpresaCombo', empresas.map(e=>({id:e.id, label:e.nome})), carregarContatosEDocs);
}

// ===================== start =====================
boot();
</script>
