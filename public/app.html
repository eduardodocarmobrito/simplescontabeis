let NFSE_PREFILL = null;
let NFSE_RASCUNHO_ID = null;
let NFSE_EMITIR_EMPRESA_ID = null;
async function renderNfseEmitir(){
  const prefill = NFSE_PREFILL;
  NFSE_PREFILL = null;
  NFSE_RASCUNHO_ID = (prefill && prefill.__modo === 'continuar') ? prefill.id : null;
  const [{ items }, { items: modelos }] = await Promise.all([ api('/nfse/empresas'), api('/nfse/modelos') ]);
  const habilitadas = items.filter(e=>e.habilitado);
  const modelosAtivos = modelos.filter(m=>m.ativo);
  const box = document.getElementById('nfseContent');
  if(!habilitadas.length){
    box.innerHTML = `<div class="empty-state">Nenhuma empresa habilitada para emitir NFS-e ainda — configure na aba Empresas.</div>`;
    return;
  }
  if(!modelosAtivos.length){
    box.innerHTML = `<div class="empty-state">Nenhum modelo de serviço cadastrado ainda — crie um na aba Modelos antes de emitir.</div>`;
    return;
  }
  // Com mais de uma empresa habilitada, obriga escolher a empresa antes de mostrar o resto do
  // formulário — evita preencher tudo e emitir sem querer pra empresa errada. Com só uma
  // habilitada, ou vindo de Duplicar/Continuar (que já trazem a empresa definida), pula direto.
  if(prefill) NFSE_EMITIR_EMPRESA_ID = prefill.empresaId;
  else if(habilitadas.length===1) NFSE_EMITIR_EMPRESA_ID = habilitadas[0].id;
  else if(!habilitadas.some(e=>e.id===NFSE_EMITIR_EMPRESA_ID)) NFSE_EMITIR_EMPRESA_ID = null;
  if(habilitadas.length>1 && !NFSE_EMITIR_EMPRESA_ID){
    box.innerHTML = `
      <div class="card">
        <div class="field"><label>Selecione a empresa (prestador do serviço)</label>
          <select id="nfseEmiEmpresaPick">
            <option value="">Selecione…</option>
            ${habilitadas.map(e=>`<option value="${e.id}">${esc(e.nome)}</option>`).join('')}
          </select>
        </div>
      </div>
    `;
    document.getElementById('nfseEmiEmpresaPick').addEventListener('change', e=>{
      const id = Number(e.target.value) || null;
      if(id){ NFSE_EMITIR_EMPRESA_ID = id; renderNfseEmitir(); }
    });
    return;
  }
  const hoje = new Date();
  box.innerHTML = `
    <div class="card">
      <div class="row">
        <div class="field grow"><label>Empresa (prestador do serviço)</label>
          <select id="nfseEmiEmpresa">${habilitadas.map(e=>`<option value="${e.id}" ${e.id===NFSE_EMITIR_EMPRESA_ID?'selected':''}>${esc(e.nome)}</option>`).join('')}</select>
        </div>
        <div class="field grow"><label>Modelo de serviço</label>
          <select id="nfseEmiModelo">${modelosAtivos.map(m=>`<option value="${m.id}">${esc(m.nome)}</option>`).join('')}</select>
        </div>
      </div>
      <div style="margin:14px 0 8px; font-weight:600; font-size:13px; color:var(--ink-soft); border-top:1px solid var(--rule); padding-top:12px;">Tomador do serviço</div>
      <div class="row">
        <div class="field grow"><label>CPF ou CNPJ</label><input id="nfseEmiDocTomador" placeholder="Só números"></div>
        <div class="field grow"><label>Nome / Razão social</label><input id="nfseEmiNomeTomador"></div>
      </div>
      <div id="nfseEmiCnpjStatus" style="font-size:11.5px; color:var(--ink-soft); margin:-6px 0 8px;"></div>
      <div class="field"><label>E-mail (opcional)</label><input id="nfseEmiEmailTomador" type="email"></div>
      <div class="row">
        <div class="field grow"><label>Endereço</label><input id="nfseEmiEndereco"></div>
        <div class="field" style="width:100px;"><label>Número</label><input id="nfseEmiNumero"></div>
        <div class="field grow"><label>Complemento</label><input id="nfseEmiComplemento"></div>
        <div class="field" style="width:130px;"><label>CEP</label><input id="nfseEmiCep"></div>
      </div>
      <div class="row">
        <div class="field grow"><label>Bairro</label><input id="nfseEmiBairro"></div>
        <div class="field grow"><label>Cidade</label><input id="nfseEmiCidade"></div>
        <div class="field" style="width:70px;"><label>UF</label><input id="nfseEmiUf" maxlength="2"></div>
      </div>
      <input type="hidden" id="nfseEmiCodMun">
      <div style="margin:14px 0 8px; font-weight:600; font-size:13px; color:var(--ink-soft); border-top:1px solid var(--rule); padding-top:12px;">Serviço prestado</div>
      <div class="row">
        <div class="field" style="width:140px;"><label>Valor (R$)</label><input id="nfseEmiValor" type="number" step="0.01" min="0"></div>

      <div class="row">
        <button class="btn" id="btnSalvarNfse">${NFSE_RASCUNHO_ID?'Salvar rascunho':'Salvar como rascunho'}</button>
        <button class="btn primary" id="btnEmitirNfse">Emitir NFS-e</button>
      </div>
      <div id="nfseEmiResultado" style="margin-top:12px;"></div>
    </div>
  `;
  if(prefill){
    const setVal=(id,v)=>{ const el=document.getElementById(id); if(el && v!=null) el.value=v; };
    setVal('nfseEmiEmpresa', prefill.empresaId);
    setVal('nfseEmiModelo', prefill.modeloId);
    setVal('nfseEmiDocTomador', prefill.tomadorDocumento);
    setVal('nfseEmiNomeTomador', prefill.tomadorNome);
    setVal('nfseEmiEmailTomador', prefill.tomadorEmail);
    setVal('nfseEmiEndereco', prefill.tomadorLogradouro);
    setVal('nfseEmiNumero', prefill.tomadorNumero);
    setVal('nfseEmiComplemento', prefill.tomadorComplemento);
    setVal('nfseEmiCep', prefill.tomadorCep);

    setVal('nfseEmiDescricao', prefill.descricaoServico);
    setVal('nfseEmiValor', prefill.valorServico);
    toast(prefill.__modo==='continuar' ? 'Continuando rascunho — revise os dados antes de emitir.' : 'Dados duplicados — revise antes de emitir.', 'ok');
  }
  if(habilitadas.length>1) document.getElementById('nfseEmiEmpresa').addEventListener('change', e=>{

  });
  document.getElementById('nfseEmiDocTomador').addEventListener('input', async e=>{

      document.getElementById('nfseEmiUf').value = r.uf || '';

      if(r.municipio && r.uf){
        try{

      }
    }catch(err){
      status.textContent = err.message;
    }
  });
  function nfseLerFormulario(){
    return {
      empresaId: Number(document.getElementById('nfseEmiEmpresa').value),
      modeloId: Number(document.getElementById('nfseEmiModelo').value),
      tomador: {
        documento: document.getElementById('nfseEmiDocTomador').value.replace(/\D/g,''),
        nome: document.getElementById('nfseEmiNomeTomador').value.trim(),
        email: document.getElementById('nfseEmiEmailTomador').value.trim() || null,
        logradouro: document.getElementById('nfseEmiEndereco').value.trim() || null,
        numero: document.getElementById('nfseEmiNumero').value.trim() || null,
        complemento: document.getElementById('nfseEmiComplemento').value.trim() || null,
        cep: document.getElementById('nfseEmiCep').value.trim() || null,
        bairro: document.getElementById('nfseEmiBairro').value.trim() || null,
        codigoMunicipio: document.getElementById('nfseEmiCodMun').value || null,
      },
      servico: {
        descricao: document.getElementById('nfseEmiDescricao').value.trim(),
        valor: Number(document.getElementById('nfseEmiValor').value),
        competencia: document.getElementById('nfseEmiCompetencia').value,
      },
    };
  }
  document.getElementById('btnSalvarNfse').addEventListener('click', async ()=>{
    const body = nfseLerFormulario();
    if(!body.tomador.documento || !body.tomador.nome){ toast('Preencha o documento e o nome do tomador.','err'); return; }
    if(!body.servico.descricao || !body.servico.valor || !body.servico.competencia){ toast('Preencha a descrição, o valor e a competência.','err'); return; }
    try{
      if(NFSE_RASCUNHO_ID){
        await api('/nfse/rascunhos/'+NFSE_RASCUNHO_ID, { method:'PUT', body });
        toast('Rascunho atualizado.','ok');
      }else{
        const r = await api('/nfse/rascunhos', { method:'POST', body });
        NFSE_RASCUNHO_ID = r.id;
        document.getElementById('btnSalvarNfse').textContent = 'Salvar rascunho';
        toast('Rascunho salvo — você pode continuar depois em Notas emitidas.','ok');
      }
    }catch(e){ toast(e.message,'err'); }
  });
  document.getElementById('btnEmitirNfse').addEventListener('click', async ()=>{
    const resultado = document.getElementById('nfseEmiResultado');
    const body = nfseLerFormulario();
    if(!body.tomador.documento || !body.tomador.nome){ toast('Preencha o documento e o nome do tomador.','err'); return; }
    if(!body.servico.descricao || !body.servico.valor || !body.servico.competencia){ toast('Preencha a descrição, o valor e a competência.','err'); return; }
    resultado.innerHTML = `<div class="empty-state">Enviando ao Sistema Nacional NFS-e…</div>`;
    try{
      let r;
      if(NFSE_RASCUNHO_ID){
        await api('/nfse/rascunhos/'+NFSE_RASCUNHO_ID, { method:'PUT', body });
        r = await api('/nfse/rascunhos/'+NFSE_RASCUNHO_ID+'/emitir', { method:'POST' });
        NFSE_RASCUNHO_ID = null;
      }else{
        r = await api('/nfse/emitir', { method:'POST', body });
      }
      resultado.innerHTML = `<div class="slot-locked" style="background:var(--paper);"><span class="fname">Emitida com sucesso</span>Chave de acesso: ${esc(r.chaveAcesso||'—')}</div>`;
      toast('NFS-e emitida com sucesso.','ok');
    }catch(e){
      resultado.innerHTML = `<div class="slot-locked" style="background:var(--paper); border-color:var(--debit);"><span class="fname">Rejeitada pelo Sistema Nacional NFS-e</span>${esc(e.message)}</div>`;
      toast(e.message,'err');
    }
  });
}

let NFSE_NOTAS_SELECIONADAS = new Set();
let NFSE_NOTAS_FILTRO = { dataDe:'', dataAte:'' };
let NFSE_NOTAS_EMPRESA_ATUAL = null;
// Lista → detalhe (padrão do projeto, ver memory.md "Resumir por empresa antes do detalhe"): a aba
// abre mostrando quantas notas cada empresa tem, não tudo solto numa tabela só. Clicar numa empresa
// abre a tabela cheia (filtros de data, seleção em lote, cancelar/duplicar/continuar) só daquela empresa.
async function renderNfseNotas(){
  if(NFSE_NOTAS_EMPRESA_ATUAL) return renderNfseNotasDetalhe(NFSE_NOTAS_EMPRESA_ATUAL);
  return renderNfseNotasLista();
}
async function renderNfseNotasLista(){
  const box = document.getElementById('nfseContent');
  box.innerHTML = `<div class="empty-state">Carregando…</div>`;
  const [{ items: empresas }, { items: notas }] = await Promise.all([ api('/nfse/empresas'), api('/nfse/emissoes') ]);
  const contagem = {}, ultimaPorEmpresa = {};
  notas.forEach(n=>{
    contagem[n.empresaId] = (contagem[n.empresaId]||0)+1;
    if(!ultimaPorEmpresa[n.empresaId] || n.criadoEm>ultimaPorEmpresa[n.empresaId]) ultimaPorEmpresa[n.empresaId] = n.criadoEm;
  });
  const habilitadas = empresas.filter(e=>e.habilitado);
  const idsAtivos = new Set([...habilitadas.map(e=>e.id), ...Object.keys(contagem).map(Number)]);
  const linhas = [...idsAtivos].map(id=>{
    const emp = empresas.find(e=>e.id===id);
    return { id, nome: emp?emp.nome:'(empresa removida)', qtd: contagem[id]||0, ultima: ultimaPorEmpresa[id]||null };
  }).sort((a,b)=>a.nome.localeCompare(b.nome));
  box.innerHTML = `
    <div class="card" style="padding:0; overflow-x:auto;">
      <table class="data-table">
        <thead><tr><th>Empresa</th><th>Notas emitidas</th><th>Última emissão</th><th></th></tr></thead>
        <tbody>
          ${linhas.length? linhas.map(l=>`
            <tr class="nfseEmpresaRow" data-id="${l.id}" style="cursor:pointer;">
              <td><b>${esc(l.nome)}</b></td>
              <td>${l.qtd}</td>
              <td>${l.ultima?fmtDateHora(l.ultima):'—'}</td>
              <td style="text-align:right;"><button class="btn small">Ver</button></td>
            </tr>
          `).join('') : '<tr><td colspan="4"><div class="empty-state">Nenhuma empresa habilitada pra NFS-e ainda.</div></td></tr>'}
        </tbody>
      </table>
    </div>
  `;
  box.querySelectorAll('.nfseEmpresaRow').forEach(tr=>tr.addEventListener('click', ()=>{
    NFSE_NOTAS_EMPRESA_ATUAL = Number(tr.dataset.id);
    renderNfseNotas();
  }));
}
async function renderNfseNotasDetalhe(empresaId){
  const { dataDe, dataAte } = NFSE_NOTAS_FILTRO;
  const { items: empresas } = await api('/nfse/empresas');
  const empresa = empresas.find(e=>e.id===empresaId);
  const qs = new URLSearchParams({ empresaId });
  if(dataDe) qs.set('dataDe', dataDe);
  if(dataAte) qs.set('dataAte', dataAte);
  const { items } = await api('/nfse/emissoes?'+qs.toString());
  NFSE_NOTAS_SELECIONADAS = new Set([...NFSE_NOTAS_SELECIONADAS].filter(id=>items.some(i=>i.id===id)));
  const box = document.getElementById('nfseContent');
  const STATUS_LABEL={emitida:'Emitida',pendente:'Pendente',rejeitada:'Rejeitada',erro:'Erro',rascunho:'Rascunho',cancelada:'Cancelada'};
  box.innerHTML = `
    <button class="btn small" id="btnNfseNotasVoltar">← Voltar pra lista de empresas</button>
    <h3 style="margin:12px 0 10px;">${esc(empresa?empresa.nome:'Empresa')}</h3>
    <div class="row" style="margin-bottom:12px; align-items:flex-end;">
      ${dateFieldHtml('nfseNotasDe','De',dataDe)}
      ${dateFieldHtml('nfseNotasAte','Até',dataAte)}
      <div id="nfseNotasLoteBar" style="margin-bottom:2px;"></div>
    </div>
    <div class="card" style="padding:0; overflow-x:auto;">
      <table class="data-table">
        <thead><tr><th style="width:34px;"><input type="checkbox" id="nfseNotasSelAll"></th><th>Tomador</th><th>Modelo</th><th>Serviço</th><th>Valor</th><th>Status</th><th>Emitido em</th><th></th></tr></thead>
        <tbody>
          ${items.length? items.map(n=>`
            <tr>
              <td><input type="checkbox" class="nfseNotaSel" data-id="${n.id}" ${NFSE_NOTAS_SELECIONADAS.has(n.id)?'checked':''}></td>
              <td>${esc(n.tomadorNome)}</td>
              <td>${esc(n.modeloNome||'—')}</td>
              <td>${esc(n.descricaoServico)}</td>
              <td>${fmtMoney(n.valorServico)}</td>
              <td><span class="tag ${n.status==='emitida'?'ok':(n.status==='pendente'?'muted':(n.status==='rascunho'?'muted':'bad'))}">${STATUS_LABEL[n.status]||n.status}</span></td>
              <td>${fmtDateHora(n.criadoEm)}</td>
              <td style="text-align:right; white-space:nowrap;">
                ${n.status==='rascunho'?`<button class="btn small" data-id="${n.id}" data-act="continuar">Continuar</button> <button class="btn small" data-id="${n.id}" data-act="excluir">Excluir</button>`:''}
                ${n.status!=='rascunho'?`<button class="btn small" data-id="${n.id}" data-act="duplicar">Duplicar</button>`:''}
                ${n.status==='emitida'||n.status==='cancelada'?`<button class="btn small" data-id="${n.id}" data-act="baixar-xml">XML</button> <button class="btn small" data-id="${n.id}" data-act="baixar-pdf">PDF</button>`:''}
                ${n.status==='emitida'?`<button class="btn small" data-id="${n.id}" data-act="enviar-whatsapp-nfse">${n.whatsappEnviado?'Reenviar WhatsApp':'Enviar WhatsApp'}</button>`:''}
                ${n.status==='emitida'?`<button class="btn small" data-id="${n.id}" data-act="cancelar" style="color:var(--debit);">Cancelar</button>`:''}
              </td>
            </tr>
          `).join('') : `<tr><td colspan="8"><div class="empty-state">Nenhuma emissão neste período.</div></td></tr>`}
        </tbody>
      </table>
    </div>
  `;
  document.getElementById('btnNfseNotasVoltar').addEventListener('click', ()=>{
    NFSE_NOTAS_EMPRESA_ATUAL = null;
    renderNfseNotas();
  });
  setupDatePicker('nfseNotasDe','nfseNotasDe_text');
  setupDatePicker('nfseNotasAte','nfseNotasAte_text');
  document.getElementById('nfseNotasDe').addEventListener('change', e=>{ NFSE_NOTAS_FILTRO.dataDe = e.target.value; renderNfseNotas(); });
  document.getElementById('nfseNotasAte').addEventListener('change', e=>{ NFSE_NOTAS_FILTRO.dataAte = e.target.value; renderNfseNotas(); });
  function desenhaLoteBar(){
    const bar = document.getElementById('nfseNotasLoteBar');
    const qtd = NFSE_NOTAS_SELECIONADAS.size;
    bar.innerHTML = qtd? `
      <span style="font-size:12.5px; color:var(--ink-soft); margin-right:8px;">${qtd} selecionada${qtd>1?'s':''}</span>
      <button class="btn small" data-lote="xml">Baixar XML</button>
      <button class="btn small" data-lote="pdf">Baixar PDF</button>
      <button class="btn small" data-lote="ambos">Baixar XML + PDF (.zip)</button>
    ` : '';
    bar.querySelectorAll('[data-lote]').forEach(b=>b.addEventListener('click', ()=>{
      const ids = [...NFSE_NOTAS_SELECIONADAS].join(',');
      window.open('/api/nfse/emissoes/baixar-lote?ids='+ids+'&formato='+b.dataset.lote, '_blank');
    }));
  }
  desenhaLoteBar();
  const selAll = document.getElementById('nfseNotasSelAll');
  function atualizaSelAll(){
    const boxes = [...box.querySelectorAll('.nfseNotaSel')];
    selAll.checked = boxes.length>0 && boxes.every(b=>b.checked);
    selAll.indeterminate = boxes.some(b=>b.checked) && !selAll.checked;
  }
  atualizaSelAll();
  box.querySelectorAll('.nfseNotaSel').forEach(b=>b.addEventListener('change', ()=>{
    const id = Number(b.dataset.id);
    if(b.checked) NFSE_NOTAS_SELECIONADAS.add(id); else NFSE_NOTAS_SELECIONADAS.delete(id);
    atualizaSelAll();
    desenhaLoteBar();
  }));
  selAll.addEventListener('change', ()=>{
    box.querySelectorAll('.nfseNotaSel').forEach(b=>{
      b.checked = selAll.checked;
      const id = Number(b.dataset.id);
      if(selAll.checked) NFSE_NOTAS_SELECIONADAS.add(id); else NFSE_NOTAS_SELECIONADAS.delete(id);
    });
    selAll.indeterminate = false;
    desenhaLoteBar();
  });
  box.querySelectorAll('[data-act="baixar-xml"]').forEach(b=>b.addEventListener('click', ()=>{
    window.open('/api/nfse/emissoes/'+b.dataset.id+'/xml', '_blank');
  }));
  box.querySelectorAll('[data-act="baixar-pdf"]').forEach(b=>b.addEventListener('click', ()=>{
    window.open('/api/nfse/emissoes/'+b.dataset.id+'/danfse', '_blank');
  }));
  box.querySelectorAll('[data-act="enviar-whatsapp-nfse"]').forEach(b=>b.addEventListener('click', async ()=>{
    b.disabled = true; b.textContent = 'Enviando…';
    try{
      const r = await api('/nfse/emissoes/'+b.dataset.id+'/enviar-whatsapp', { method:'POST' });
      toast('Enviado por WhatsApp'+(r.falhas?' (algum contato falhou)':'')+'.','ok');
      renderNfseNotas();
    }catch(e){ toast(e.message,'err'); b.disabled = false; b.textContent = 'Enviar WhatsApp'; }
  }));
  box.querySelectorAll('[data-act="cancelar"]').forEach(b=>b.addEventListener('click', ()=>{
    const n = items.find(i=>i.id===Number(b.dataset.id));
    nfseCancelarModal(n);
  }));
  box.querySelectorAll('[data-act="duplicar"]').forEach(b=>b.addEventListener('click', ()=>{
    const n = items.find(i=>i.id===Number(b.dataset.id));
    NFSE_PREFILL = { ...n, __modo:'duplicar' };
    NFSE_TAB='emitir';
    renderNfseTabs();
  }));
  box.querySelectorAll('[data-act="continuar"]').forEach(b=>b.addEventListener('click', ()=>{
    const n = items.find(i=>i.id===Number(b.dataset.id));
    NFSE_PREFILL = { ...n, __modo:'continuar' };
    NFSE_TAB='emitir';
    renderNfseTabs();
  }));
  box.querySelectorAll('[data-act="excluir"]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm('Excluir este rascunho?')) return;
    try{
      await api('/nfse/emissoes/'+b.dataset.id, { method:'DELETE' });
      toast('Rascunho excluído.','ok');
      renderNfseNotas();
    }catch(e){ toast(e.message,'err'); }
  }));
}

// ===================== Busca de XML (NF-e/NFC-e/NFS-e — Sefaz + Sistema Nacional NFS-e) =====================
// Bloco de certificado por empresa — reaproveitado tanto na página "Busca de XML" quanto direto no
// cadastro da empresa (um só lugar pra configurar, em vez de precisar ir numa tela separada).
async function renderCertificadoBuscaXml(containerEl, empresaId, empresaUfPadrao, opts){
  opts = opts || {};
  const { items, moduloAtivo } = await api('/nfe/config');
  if(opts.onModuloStatus) opts.onModuloStatus(moduloAtivo);
  const cfg = items.find(c=>c.empresaId===Number(empresaId));
  if(cfg){
    containerEl.innerHTML = `
      <div class="slot-locked" style="background:var(--paper);">
        <span class="fname">${esc(cfg.titular||'Certificado configurado')}</span>
        CNPJ do certificado: ${esc(cfg.cnpjCertificado||'—')} · Válido até ${fmtValidade(cfg.validadeAte)} · UF autora: ${esc(cfg.ufAutor)} · Ambiente: ${cfg.ambiente==='homologacao'?'Homologação':'Produção'}
        <br>NF-e/NFC-e — última busca: ${cfg.ultimaBuscaEm?fmtDateHora(cfg.ultimaBuscaEm):'nunca'}${cfg.ultimoErro?` — <span style="color:var(--debit);">${esc(cfg.ultimoErro)}</span>`:''}
        <br>NFS-e — última busca: ${cfg.ultimaBuscaNfseEm?fmtDateHora(cfg.ultimaBuscaNfseEm):'nunca'}${cfg.ultimoErroNfse?` — <span style="color:var(--debit);">${esc(cfg.ultimoErroNfse)}</span>`:''}
      </div>
      <label class="checkbox-row"><input type="checkbox" id="nfeCfgAtivo_${empresaId}" ${cfg.ativo?'checked':''}> Busca ativa para esta empresa</label>
      <div class="row" style="margin-top:6px;">
        <button class="btn primary" id="btnNfeBuscarAgora_${empresaId}" ${moduloAtivo?'':'disabled'}>Buscar agora</button>
        <button class="btn danger" id="btnNfeRemoverCert_${empresaId}">Remover certificado</button>
      </div>
      <div id="nfeBuscaResultado_${empresaId}" style="margin-top:10px;"></div>
    `;
    containerEl.querySelector(`#nfeCfgAtivo_${empresaId}`).addEventListener('change', async (ev)=>{
      const ligando = ev.target.checked;
      try{
        const r = await api('/nfe/config/'+empresaId+'/ativo', { method:'PUT', body:{ ativo: ligando } });
        const s = r.sync;
        if(ligando && s && (s.novosNfe||s.novosNfse)) toast(`Ativado — trouxe ${s.novosNfe||0} NF-e/NFC-e e ${s.novosNfse||0} NFS-e do histórico.`,'ok');
        else toast('Atualizado.','ok');
        if(ligando && (s?.novosNfe||s?.novosNfse) && opts.onDocumentosMudou) opts.onDocumentosMudou();
      }
      catch(e){ toast(e.message,'err'); ev.target.checked=!ev.target.checked; }
    });
    containerEl.querySelector(`#btnNfeRemoverCert_${empresaId}`).addEventListener('click', async ()=>{
      if(!confirmar('Remover o certificado desta empresa? A busca automática para de funcionar até você enviar outro.')) return;
      try{ await api('/nfe/config/'+empresaId, { method:'DELETE' }); toast('Certificado removido.','ok'); renderCertificadoBuscaXml(containerEl, empresaId, empresaUfPadrao, opts); }
      catch(e){ toast(e.message,'err'); }
    });
    containerEl.querySelector(`#btnNfeBuscarAgora_${empresaId}`).addEventListener('click', async ()=>{
      const btn = containerEl.querySelector(`#btnNfeBuscarAgora_${empresaId}`);
      const resultado = containerEl.querySelector(`#nfeBuscaResultado_${empresaId}`);
      btn.disabled = true; btn.textContent = 'Buscando…';
      resultado.innerHTML = `<div class="empty-state">Consultando a Sefaz e o Sistema Nacional NFS-e…</div>`;
      try{
        const r = await api('/nfe/config/'+empresaId+'/buscar', { method:'POST' });
        const partes = [`${r.novosNfe} NF-e/NFC-e`, `${r.novosNfse} NFS-e`];
        resultado.innerHTML = `<div class="tag ${(r.erroNfe||r.erroNfse)?'bad':'ok'}">${(r.erroNfe||r.erroNfse)?'Concluído com falhas':'Concluído'}</div> <span style="font-size:12.5px;">${partes.join(' · ')} novo(s).</span>
          ${r.erroNfe?`<div style="font-size:12px; color:var(--debit); margin-top:4px;">NF-e/NFC-e: ${esc(r.erroNfe)}</div>`:''}
          ${r.erroNfse?`<div style="font-size:12px; color:var(--debit); margin-top:4px;">NFS-e: ${esc(r.erroNfse)}</div>`:''}`;
        if(opts.onDocumentosMudou) opts.onDocumentosMudou();
      }catch(e){
        resultado.innerHTML = `<div class="tag bad">Falhou</div> <span style="font-size:12.5px;">${esc(e.message)}</span>`;
      }finally{
        btn.disabled = false; btn.textContent = 'Buscar agora';
      }
    });
  } else {
    containerEl.innerHTML = `
      <div class="field"><label>Arquivo do certificado (.pfx)</label><input type="file" id="nfeCertArquivo_${empresaId}" accept=".pfx,.p12"></div>
      <div class="field"><label>Senha do certificado</label><input type="password" id="nfeCertSenha_${empresaId}"></div>
      <div class="row">
        <div class="field grow"><label>UF autora</label><input id="nfeCertUf_${empresaId}" maxlength="2" style="text-transform:uppercase;" placeholder="ex.: SP" value="${esc(empresaUfPadrao||'')}"></div>
        <div class="field grow"><label>Ambiente</label>
          <select id="nfeCertAmbiente_${empresaId}"><option value="producao">Produção</option><option value="homologacao">Homologação</option></select>
        </div>
      </div>
      <button class="btn primary" id="btnEnviarNfeCert_${empresaId}">Enviar certificado</button>
    `;
    containerEl.querySelector(`#btnEnviarNfeCert_${empresaId}`).addEventListener('click', async ()=>{
      const arquivo = containerEl.querySelector(`#nfeCertArquivo_${empresaId}`).files[0];
      const senha = containerEl.querySelector(`#nfeCertSenha_${empresaId}`).value;
      const ufAutor = containerEl.querySelector(`#nfeCertUf_${empresaId}`).value.trim().toUpperCase();
      const ambiente = containerEl.querySelector(`#nfeCertAmbiente_${empresaId}`).value;
      if(!arquivo){ toast('Selecione o arquivo .pfx.','err'); return; }
      if(!senha){ toast('Informe a senha do certificado.','err'); return; }
      if(!ufAutor){ toast('Informe a UF.','err'); return; }
      const fd = new FormData();
      fd.append('arquivo', arquivo); fd.append('senha', senha); fd.append('ufAutor', ufAutor); fd.append('ambiente', ambiente); fd.append('empresaId', empresaId);
      const btnEnviar = containerEl.querySelector(`#btnEnviarNfeCert_${empresaId}`);
      btnEnviar.disabled = true; btnEnviar.textContent = 'Enviando e buscando histórico…';
      try{
        const r = await api('/nfe/config', { method:'POST', body:fd });
        const s = r.sync || {};
        if(s.novosNfe || s.novosNfse){
          toast(`Certificado enviado — trouxe ${s.novosNfe||0} NF-e/NFC-e e ${s.novosNfse||0} NFS-e do histórico.`,'ok');
        } else if(s.erroNfe || s.erroNfse){
          toast(`Certificado enviado, mas a busca do histórico falhou: ${s.erroNfe||s.erroNfse}`,'err');
        } else {
          toast('Certificado enviado.','ok');
        }
        renderCertificadoBuscaXml(containerEl, empresaId, empresaUfPadrao, opts);
        if(opts.onDocumentosMudou) opts.onDocumentosMudou();
      }catch(e){ toast(e.message,'err'); btnEnviar.disabled = false; btnEnviar.textContent = 'Enviar certificado'; }
    });
  }
  return cfg;
}
// Duas telas: lista de empresas (o que já tem certificado configurado ou algum documento) e, ao
// clicar numa delas, o detalhe (certificado + documentos daquela empresa só). Evita jogar tudo solto
// na mesma tela quando o escritório tem várias empresas na Busca de XML.
async function pageNfeBusca(){
  main().innerHTML = `
    <h1>Busca de XML</h1>
    <p class="subtitle">Busca automática de NF-e, NFC-e e NFS-e direto na Sefaz e no Sistema Nacional NFS-e, usando o certificado digital de cada cliente — não depende do certificado do escritório.</p>
    <div id="nfeBuscaModuloAviso"></div>
    <div id="nfeBuscaMain"></div>
  `;
  const box = document.getElementById('nfeBuscaMain');
  const { items: empresas } = await api('/empresas');

  function avisoModulo(ativo){
    document.getElementById('nfeBuscaModuloAviso').innerHTML = ativo ? '' : `
      <div class="card" style="background:var(--paper); border-color:var(--warn, #c9a227);">
        <span style="font-size:12.5px;">Módulo "Busca automática de XML (NF-e/NFC-e/NFS-e)" não contratado para este escritório — você pode cadastrar certificados, mas o botão "Buscar agora" fica desativado. Contrate em <b>Configurações › Assinatura da plataforma</b>.</span>
      </div>
    `;
  }

  async function mostrarLista(){
    box.innerHTML = `<div class="empty-state">Carregando…</div>`;
    const [{ items: configs, moduloAtivo }, { items: contagens }] = await Promise.all([ api('/nfe/config'), api('/nfe/documentos/contagem') ]);
    avisoModulo(moduloAtivo);
    const contagem = {};
    contagens.forEach(c=>{ contagem[c.empresaId] = c.qtd; });
    const idsAtivos = new Set([...configs.map(c=>c.empresaId), ...Object.keys(contagem).map(Number)]);
    const linhas = [...idsAtivos].map(id=>{
      const emp = empresas.find(e=>e.id===id);
      const cfg = configs.find(c=>c.empresaId===id);
      return {
        id, nome: emp?emp.nome:'(empresa removida)',
        temCert: !!cfg, qtdDocs: contagem[id]||0,
        ultimaBusca: cfg ? (cfg.ultimaBuscaEm && cfg.ultimaBuscaNfseEm ? (cfg.ultimaBuscaEm>cfg.ultimaBuscaNfseEm?cfg.ultimaBuscaEm:cfg.ultimaBuscaNfseEm) : (cfg.ultimaBuscaEm||cfg.ultimaBuscaNfseEm)) : null,
      };
    }).sort((a,b)=>a.nome.localeCompare(b.nome));
    box.innerHTML = `
      <div class="card">
        <h3>Adicionar empresa</h3>
        <p style="font-size:12.5px; color:var(--ink-soft); margin-top:-6px;">Busque uma empresa pra cadastrar o certificado dela e começar a buscar os documentos.</p>
        <div class="field" style="max-width:420px; margin-bottom:0;"><label>Empresa</label>${comboSelectHtml('nfeAddEmpresaCombo', 'Digite para buscar a empresa…')}</div>
      </div>
      <div class="card" style="padding:0; overflow-x:auto;">
        <table class="data-table">
          <thead><tr><th>Empresa</th><th>Certificado</th><th>Documentos</th><th>Última busca</th><th></th></tr></thead>
          <tbody>
            ${linhas.length ? linhas.map(l=>`
              <tr class="nfeEmpresaRow" data-id="${l.id}" style="cursor:pointer;">
                <td><b>${esc(l.nome)}</b></td>
                <td><span class="tag ${l.temCert?'ok':'muted'}">${l.temCert?'Configurado':'Sem certificado'}</span></td>
                <td>${l.qtdDocs}</td>
                <td>${l.ultimaBusca?fmtDateHora(l.ultimaBusca):'—'}</td>
                <td style="text-align:right;"><button class="btn small">Ver</button></td>
              </tr>
            `).join('') : '<tr><td colspan="5"><div class="empty-state">Nenhuma empresa configurada ainda — use a busca acima pra adicionar a primeira.</div></td></tr>'}
          </tbody>
        </table>
      </div>
    `;
    setupComboSelect('nfeAddEmpresaCombo', empresas.map(e=>({id:e.id, label:e.nome})), (id)=>{ if(id) mostrarDetalhe(Number(id)); });
    box.querySelectorAll('.nfeEmpresaRow').forEach(tr=>tr.addEventListener('click', ()=>mostrarDetalhe(Number(tr.dataset.id))));
  }

  async function mostrarDetalhe(empresaId){
    const empresa = empresas.find(e=>e.id===empresaId);
    box.innerHTML = `
      <button class="btn small" id="btnNfeVoltarLista">← Voltar pra lista de empresas</button>
      <div class="card" style="margin-top:10px;">
        <h3>${esc(empresa?empresa.nome:'Empresa')}</h3>
        <div id="nfeConfigBody"></div>
      </div>
      <div class="card">
        <h3>Documentos recebidos</h3>
        <div class="row" style="margin-bottom:8px; align-items:flex-end;">
          <div class="field" style="margin-bottom:0; width:220px;"><label>Tipo</label>
            <select id="nfeDocTipo"><option value="">Todos</option><option value="nfe">NF-e</option><option value="nfce">NFC-e</option><option value="nfse">NFS-e</option><option value="evento">Evento</option><option value="outro">Outro</option></select>
          </div>
        </div>
        <div class="row" style="margin-bottom:8px; align-items:center; gap:10px;">
          <span style="font-size:12.5px; color:var(--ink-soft);"><span id="nfeDocSelecionadosCount">0</span> selecionado(s)</span>
          <button class="btn small" id="btnNfeBaixarLoteXml" disabled>Baixar selecionados — XML</button>
          <button class="btn small" id="btnNfeBaixarLotePdf" disabled>Baixar selecionados — PDF</button>
          <button class="btn small" id="btnNfeBaixarLoteAmbos" disabled>Baixar selecionados — XML + PDF</button>
        </div>
        <div class="card" style="padding:0; overflow-x:auto;">
          <table class="data-table">
            <thead><tr><th style="width:32px;"><input type="checkbox" id="nfeDocSelecionarTodos"></th><th>Data</th><th>Tipo</th><th>Emitente</th><th>Chave de acesso</th><th>Valor</th><th></th></tr></thead>
            <tbody id="nfeDocBody"><tr><td colspan="7"><div class="empty-state">Carregando…</div></td></tr></tbody>
          </table>
        </div>
      </div>
    `;
    document.getElementById('btnNfeVoltarLista').addEventListener('click', mostrarLista);

    async function carregarConfig(){
      const cbody = document.getElementById('nfeConfigBody');
      await renderCertificadoBuscaXml(cbody, empresaId, empresa&&empresa.uf, {
        onDocumentosMudou: carregarDocumentos,
        onModuloStatus: avisoModulo,
      });
    }

    function atualizarBarraSelecao(){
      const marcados = [...document.querySelectorAll('.nfeDocCheck:checked')];
      document.getElementById('nfeDocSelecionadosCount').textContent = marcados.length;
      const semSelecao = marcados.length===0;
      document.getElementById('btnNfeBaixarLoteXml').disabled = semSelecao;
      document.getElementById('btnNfeBaixarLotePdf').disabled = semSelecao;
      document.getElementById('btnNfeBaixarLoteAmbos').disabled = semSelecao;
    }
    function baixarLote(formato){
      const ids = [...document.querySelectorAll('.nfeDocCheck:checked')].map(c=>c.dataset.id);
      if(!ids.length) return;
      window.open('/api/nfe/documentos/baixar-lote?ids='+ids.join(',')+'&formato='+formato, '_blank');
    }
    document.getElementById('btnNfeBaixarLoteXml').addEventListener('click', ()=>baixarLote('xml'));
    document.getElementById('btnNfeBaixarLotePdf').addEventListener('click', ()=>baixarLote('pdf'));

          <td>${d.valorTotal!=null?fmtMoney(d.valorTotal):'—'}</td>

            ${d.tipo!=='evento'?`<a class="btn small" href="/api/nfe/documentos/${d.id}/pdf" target="_blank" rel="noopener">PDF</a>`:''}
          </td>
        </tr>
      `).join('') : '<tr><td colspan="7"><div class="empty-state">Nenhum documento encontrado ainda.</div></td></tr>';
      document.querySelectorAll('.nfeDocCheck').forEach(c=>c.addEventListener('change', atualizarBarraSelecao));
      atualizarBarraSelecao();
    }

    document.getElementById('nfeDocTipo').addEventListener('change', carregarDocumentos);
    carregarConfig();
    carregarDocumentos();
  }

  mostrarLista();
}

const IC_TIPO_LABEL = { das:'DAS', declaracao:'Declaração do Simples', situacao_fiscal:'Situação Fiscal' };
async function pageIntegraContador(){
  main().innerHTML = `
    <h1>Integra Contador</h1>
    <p class="subtitle">Busca automática de DAS, Declaração do Simples Nacional e Relatório de Situação Fiscal direto na Receita Federal, usando o certificado digital do próprio escritório — serviço pago por consulta (SERPRO).</p>
    <div class="card" id="icConfigCard">
      <h3>Configuração do escritório</h3>
      <div id="icConfigBody"><div class="empty-state">Carregando…</div></div>
    </div>
    <div id="icAviso"></div>
    <div id="icMain"></div>
  `;
  await renderIcConfig();
  const cfgAtual = await api('/integracontador/config');
  avisoIc(cfgAtual.ativo);
  mostrarIcLista();

  function avisoIc(ativo){
    document.getElementById('icAviso').innerHTML = ativo ? '' : `
      <div class="card" style="background:var(--paper); border-color:var(--warn, #c9a227);">
        <span style="font-size:12.5px;">Configure e ative o Integra Contador acima antes de habilitar empresas — sem isso, o botão "Buscar agora" fica desativado.</span>
      </div>
    `;
  }

  async function renderIcConfig(){
    const cfg = await api('/integracontador/config');
    const body = document.getElementById('icConfigBody');
    body.innerHTML = `
      <div class="row">
        <div class="field"><label>CNPJ do escritório (contratante junto à Loja SERPRO)</label><input id="icCnpj" value="${esc(cfg.cnpj||'')}"></div>
        <div class="field"><label>Consumer Key</label><input id="icConsumerKey" value="${esc(cfg.consumerKey||'')}"></div>
        <div class="field"><label>Consumer Secret</label><input id="icConsumerSecret" type="password" placeholder="${cfg.temConsumerSecret?'••••••••  (deixe em branco pra manter)':''}"></div>
      </div>
      <div class="row">
        <div class="field"><label>Certificado digital do escritório (.pfx) ${cfg.temCertificado?`— atual: <b>${esc(cfg.titularCertificado||'')}</b>${cfg.validadeCertificadoAte?', válido até '+fmtDate(cfg.validadeCertificadoAte):''}`:''}</label><input id="icCertArquivo" type="file" accept=".pfx,.p12"></div>
        <div class="field"><label>Senha do certificado</label><input id="icCertSenha" type="password" placeholder="${cfg.temCertificado?'só necessário se enviar um certificado novo':''}"></div>
      </div>
      <label class="checkbox-row"><input type="checkbox" id="icAtivo" ${cfg.ativo?'checked':''}> Manter o Integra Contador ativo</label>
      ${cfg.ultimoErro?`<p style="color:var(--debit); font-size:12.5px;">Último erro: ${esc(cfg.ultimoErro)}</p>`:''}
      <div class="row" style="margin-top:8px;">
        <button class="btn primary" id="btnIcSalvarConfig">Salvar</button>
        <button class="btn" id="btnIcTestar" ${cfg.temCertificado&&cfg.consumerKey?'':'disabled'}>Testar conexão</button>
      </div>
    `;
    document.getElementById('btnIcSalvarConfig').addEventListener('click', async (ev)=>{
      const btn = ev.target; btn.disabled = true; btn.textContent = 'Salvando…';
      try{
        const fd = new FormData();
        fd.append('cnpj', document.getElementById('icCnpj').value.trim());
        fd.append('consumerKey', document.getElementById('icConsumerKey').value.trim());
        const secret = document.getElementById('icConsumerSecret').value;
        if(secret) fd.append('consumerSecret', secret);
        fd.append('ativo', document.getElementById('icAtivo').checked);
        const arquivo = document.getElementById('icCertArquivo').files[0];
        const senha = document.getElementById('icCertSenha').value;
        if(arquivo){ fd.append('certificado', arquivo); fd.append('senhaCertificado', senha); }
        await api('/integracontador/config', { method:'PUT', body: fd });
        toast('Configuração salva.','ok');
        await renderIcConfig();
        avisoIc(document.getElementById('icAtivo').checked);
      }catch(e){ toast(e.message,'err'); }
      finally{ btn.disabled = false; btn.textContent = 'Salvar'; }
    });
    const btnTestar = document.getElementById('btnIcTestar');
    if(btnTestar) btnTestar.addEventListener('click', async ()=>{
      btnTestar.disabled = true; btnTestar.textContent = 'Testando…';
      try{
        await api('/integracontador/config/testar', { method:'POST' });
        toast('Conexão validada com sucesso.','ok');
      }catch(e){ toast(e.message,'err'); }
      finally{ btnTestar.disabled = false; btnTestar.textContent = 'Testar conexão'; }
    });

  async function mostrarIcLista(){
    const box = document.getElementById('icMain');
    box.innerHTML = `<div class="empty-state">Carregando…</div>`;
    const { items } = await api('/integracontador/empresas');
    box.innerHTML = `
      <div class="card">
        <div class="field" style="max-width:420px; margin-bottom:0;"><label>Buscar empresa</label>${comboSelectHtml('icFiltroEmpresaCombo', 'Digite para buscar a empresa…')}</div>
      </div>
      <div class="card" style="padding:0; overflow-x:auto;">
        <table class="data-table">
          <thead><tr><th>Empresa</th><th>Status</th><th>Optante Simples</th><th>Documentos</th><th>Última busca</th><th>Alerta</th><th></th></tr></thead>
          <tbody>
            ${items.length ? items.map(e=>`
              <tr class="icEmpresaRow" data-id="${e.id}" style="cursor:pointer;">
                <td><b>${esc(e.nome)}</b></td>
                <td><span class="tag ${e.ativo?'ok':'muted'}">${e.ativo?'Ativo':'Inativo'}</span></td>
                <td>${e.optanteSimplesNacional?'<span class="tag ok">Optante</span>':'—'}</td>
                <td>${e.qtdDocumentos}</td>
                <td>${e.ultimaBuscaEm?fmtDateHora(e.ultimaBuscaEm):'—'}</td>
                <td>${e.alertaDeclaracao?`<span class="tag bad" title="${esc(e.alertaDeclaracao)}">Não declarado</span>`:''}</td>
                <td style="text-align:right;"><button class="btn small">Ver</button></td>
              </tr>
            `).join('') : '<tr><td colspan="7"><div class="empty-state">Nenhuma empresa cadastrada ainda.</div></td></tr>'}
          </tbody>
        </table>
      </div>
    `;
    setupComboSelect('icFiltroEmpresaCombo', items.map(e=>({id:e.id, label:e.nome})), (id)=>{ if(id) mostrarIcDetalhe(Number(id)); });
    box.querySelectorAll('.icEmpresaRow').forEach(tr=>tr.addEventListener('click', ()=>mostrarIcDetalhe(Number(tr.dataset.id))));
  }

  async function mostrarIcDetalhe(empresaId){
    const box = document.getElementById('icMain');
    const { items } = await api('/integracontador/empresas');
    const emp = items.find(e=>e.id===empresaId);
    box.innerHTML = `
      <button class="btn small" id="btnIcVoltarLista">← Voltar pra lista de empresas</button>
      <div class="card" style="margin-top:10px;">
        <h3>${esc(emp?emp.nome:'Empresa')}</h3>
        <label class="checkbox-row"><input type="checkbox" id="icEmpAtivo" ${emp?.ativo?'checked':''}> Buscar dados desta empresa</label>
        <label class="checkbox-row"><input type="checkbox" id="icEmpOptante" ${emp?.optanteSimplesNacional?'checked':''}> Optante do Simples Nacional (habilita DAS e Declaração — Situação Fiscal vale pra qualquer regime)</label>
        ${emp?.alertaDeclaracao?`<div class="card" style="background:var(--paper); border-color:var(--warn, #c9a227); margin:8px 0;"><span style="font-size:12.5px;">⚠ ${esc(emp.alertaDeclaracao)}</span></div>`:''}
        ${emp?.ultimoErro?`<p style="color:var(--debit); font-size:12.5px;">Último erro: ${esc(emp.ultimoErro)}</p>`:''}
        <div class="row" style="margin-top:8px;">
          <button class="btn primary" id="btnIcSalvarEmpresa">Salvar</button>
          <button class="btn" id="btnIcBuscarAgora" ${emp?.ativo?'':'disabled'}>Buscar agora</button>
        </div>
      </div>
      <div class="card">
        <h3>Documentos</h3>
        <div class="card" style="padding:0; overflow-x:auto;">
          <table class="data-table">
            <thead><tr><th>Tipo</th><th>Período</th><th>Número</th><th>Vencimento</th><th>Recebido em</th><th></th></tr></thead>
            <tbody id="icDocBody"><tr><td colspan="6"><div class="empty-state">Carregando…</div></td></tr></tbody>
          </table>
        </div>
      </div>
    `;
    document.getElementById('btnIcVoltarLista').addEventListener('click', mostrarIcLista);
    // A busca de Situação Fiscal sozinha já pode passar de 1 minuto (fica reconsultando a Receita
    // até o relatório ficar pronto) — tempo suficiente pro proxy do Railway devolver um erro 502 pro
    // navegador mesmo quando a busca deu certo do lado do servidor. Por isso o backend não segura a
    // resposta esperando terminar: dispara em segundo plano, e aqui a tela fica reconsultando até
    // "ultimaBuscaEm" mudar, sem travar o botão o tempo todo nem depender do request original.
    async function esperarIcBuscaTerminar(ultimaBuscaAntes){
      for(let i=0;i<20;i++){
        await new Promise(r=>setTimeout(r, 4000));
        const { items } = await api('/integracontador/empresas');
        const atualizado = items.find(e=>e.id===empresaId);
        if(atualizado && atualizado.ultimaBuscaEm !== ultimaBuscaAntes) return atualizado;
      }
      return null;
    }
    document.getElementById('btnIcSalvarEmpresa').addEventListener('click', async (ev)=>{
      const btn = ev.target; btn.disabled = true; btn.textContent = 'Salvando…';
      try{
        const ultimaBuscaAntes = emp?.ultimaBuscaEm || null;
        const body = { ativo: document.getElementById('icEmpAtivo').checked, optanteSimplesNacional: document.getElementById('icEmpOptante').checked };
        const r = await api('/integracontador/empresas/'+empresaId, { method:'PUT', body });
        if(r.buscaIniciada){
          toast('Salvo — buscando dados em segundo plano…','ok');
          btn.textContent = 'Buscando…';
          const atualizado = await esperarIcBuscaTerminar(ultimaBuscaAntes);
          if(atualizado) toast(atualizado.ultimoErro ? 'Busca terminou com erro: '+atualizado.ultimoErro : 'Busca concluída.', atualizado.ultimoErro?'err':'ok');
          else toast('Busca ainda em andamento — confira em alguns instantes.','ok');
        } else toast('Salvo.','ok');
        mostrarIcDetalhe(empresaId);
        carregarIcDocumentos();
      }catch(e){ toast(e.message,'err'); }
      finally{ btn.disabled = false; btn.textContent = 'Salvar'; }
    });
    document.getElementById('btnIcBuscarAgora').addEventListener('click', async (ev)=>{
      const btn = ev.target; btn.disabled = true; btn.textContent = 'Buscando…';
      try{
        const ultimaBuscaAntes = emp?.ultimaBuscaEm || null;
        await api('/integracontador/empresas/'+empresaId+'/buscar', { method:'POST' });
        const atualizado = await esperarIcBuscaTerminar(ultimaBuscaAntes);
        if(atualizado) toast(atualizado.ultimoErro ? 'Busca terminou com erro: '+atualizado.ultimoErro : 'Busca concluída.', atualizado.ultimoErro?'err':'ok');
        else toast('Busca ainda em andamento — confira em alguns instantes.','ok');
        carregarIcDocumentos();
      }catch(e){ toast(e.message,'err'); }
      finally{ btn.disabled = false; btn.textContent = 'Buscar agora'; }
    });

    async function carregarIcDocumentos(){
      const tbody = document.getElementById('icDocBody');
      tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state">Carregando…</div></td></tr>`;
      const { items: docs } = await api('/integracontador/documentos?empresaId='+empresaId);
      tbody.innerHTML = docs.length ? docs.map(d=>`
        <tr>
          <td>${esc(IC_TIPO_LABEL[d.tipo]||d.tipo)}</td>
          <td>${esc(d.periodoApuracao||'—')}</td>
          <td>${esc(d.numeroDocumento||'—')}</td>
          <td>${d.dataVencimento?fmtDate(d.dataVencimento):'—'}</td>
          <td>${fmtDateHora(d.criadoEm)}</td>
          <td style="text-align:right;">${d.temPdf?`<a class="btn small" href="/api/integracontador/documentos/${d.id}/pdf" target="_blank" rel="noopener">PDF</a>`:'—'}</td>
        </tr>
      `).join('') : '<tr><td colspan="6"><div class="empty-state">Nenhum documento encontrado ainda.</div></td></tr>';
    }
    carregarIcDocumentos();
  }
}

// ===================== NFS-e self-service (perfil Cliente) =====================
// Bloqueio de acesso por módulo — teste grátis de 3 dias ou assinatura paga (Asaas). Reaproveitado
// pelas telas de NFS-e e Financeiro (A Receber/A Pagar) do perfil Cliente.
async function moduloDaChave(chave){
  const { items } = await api('/financeiro/minha-empresa/modulos');
  return items.find(i=>i.chave===chave);
}
function moduloPaywallHtml(item){
  const preco = fmtMoney(item.valorMensal);
  let titulo, texto, botaoHtml;
  if(item.status==='nao_contratado'){
    titulo = 'Você ainda não contratou este módulo';
    texto = `Teste grátis por 3 dias, sem compromisso. Depois do teste, ${preco}/mês.`;
    botaoHtml = `<button class="btn primary" id="paywallAcao" data-acao="testar" data-chave="${item.chave}">Iniciar teste grátis de 3 dias</button>`;
  } else if(item.status==='teste_vencido'){
    titulo = 'Seu teste grátis venceu';
    texto = `Contrate este módulo por ${preco}/mês pra continuar usando.`;
    botaoHtml = `<button class="btn primary" id="paywallAcao" data-acao="assinatura">Ir para Assinatura</button>`;
  } else {
    titulo = 'Assinatura vencida';
    texto = `Renove este módulo por ${preco}/mês pra continuar usando.`;
    botaoHtml = `<button class="btn primary" id="paywallAcao" data-acao="assinatura">Ir para Assinatura</button>`;
  }
  return `
    <div class="card" style="max-width:480px; margin:60px auto; text-align:center; padding:32px;">
      <h3>${esc(titulo)}</h3>
      <p style="color:var(--ink-soft); margin:10px 0 20px;">${esc(texto)}</p>
      ${botaoHtml}
    </div>
  `;
}
function ligarModuloPaywall(box, aoLiberar){
  const btn = box.querySelector('#paywallAcao');
  if(!btn) return;
  btn.addEventListener('click', async ()=>{
    if(btn.dataset.acao==='assinatura'){ goPage('minha-assinatura'); return; }
    try{
      await api('/financeiro/minha-empresa/modulos/'+btn.dataset.chave+'/iniciar-teste', { method:'POST' });
      toast('Teste iniciado! Você tem 3 dias de acesso completo.','ok');
      aoLiberar();
    }catch(e){ toast(e.message,'err'); }
  });
}

async function renderMinhaNfseEmitir(){

  }

  box.innerHTML = `
    <div class="card">
      <div class="field"><label>Modelo de serviço</label>
        <select id="mnfEmiModelo">${modelosAtivos.map(m=>`<option value="${m.id}">${esc(m.nome)}</option>`).join('')}</select>
      </div>
      <div style="margin:14px 0 8px; font-weight:600; font-size:13px; color:var(--ink-soft); border-top:1px solid var(--rule); padding-top:12px;">Tomador do serviço</div>
      <div class="row">

      </div>
      <div id="mnfEmiCnpjStatus" style="font-size:11.5px; color:var(--ink-soft); margin:-6px 0 8px;"></div>
      <div class="field"><label>E-mail (opcional)</label><input id="mnfEmiEmailTomador" type="email"></div>
      <div class="row">
        <div class="field grow"><label>Endereço</label><input id="mnfEmiEndereco"></div>
        <div class="field" style="width:100px;"><label>Número</label><input id="mnfEmiNumero"></div>
        <div class="field grow"><label>Complemento</label><input id="mnfEmiComplemento"></div>
        <div class="field" style="width:130px;"><label>CEP</label><input id="mnfEmiCep"></div>
      </div>
      <div class="row">
        <div class="field grow"><label>Bairro</label><input id="mnfEmiBairro"></div>
        <div class="field grow"><label>Cidade</label><input id="mnfEmiCidade"></div>
        <div class="field" style="width:70px;"><label>UF</label><input id="mnfEmiUf" maxlength="2"></div>
      </div>
      <input type="hidden" id="mnfEmiCodMun">
      <div style="margin:14px 0 8px; font-weight:600; font-size:13px; color:var(--ink-soft); border-top:1px solid var(--rule); padding-top:12px;">Serviço prestado</div>
      <div class="row">
        <div class="field" style="width:140px;"><label>Valor (R$)</label><input id="mnfEmiValor" type="number" step="0.01" min="0"></div>
        <div class="field" style="width:160px;"><label>Competência</label><input id="mnfEmiCompetencia" type="date" value="${hoje.toISOString().slice(0,10)}"></div>
      </div>
      <div class="field"><label>Descrição do serviço</label><textarea id="mnfEmiDescricao" rows="2"></textarea></div>
      <div class="row">
        <button class="btn" id="btnSalvarMinhaNfse">${NFSE_RASCUNHO_ID?'Salvar rascunho':'Salvar como rascunho'}</button>
        <button class="btn primary" id="btnEmitirMinhaNfse">Emitir NFS-e</button>
      </div>
      <div id="mnfEmiResultado" style="margin-top:12px;"></div>
    </div>
  `;
  if(prefill){
    const setVal=(id,v)=>{ const el=document.getElementById(id); if(el && v!=null) el.value=v; };
    setVal('mnfEmiModelo', prefill.modeloId);
    setVal('mnfEmiDocTomador', prefill.tomadorDocumento);
    setVal('mnfEmiNomeTomador', prefill.tomadorNome);
    setVal('mnfEmiEmailTomador', prefill.tomadorEmail);
    setVal('mnfEmiEndereco', prefill.tomadorLogradouro);
    setVal('mnfEmiNumero', prefill.tomadorNumero);
    setVal('mnfEmiComplemento', prefill.tomadorComplemento);
    setVal('mnfEmiCep', prefill.tomadorCep);
    setVal('mnfEmiBairro', prefill.tomadorBairro);
    setVal('mnfEmiCodMun', prefill.tomadorCodigoMunicipio);
    setVal('mnfEmiDescricao', prefill.descricaoServico);
    setVal('mnfEmiValor', prefill.valorServico);
    toast(prefill.__modo==='continuar' ? 'Continuando rascunho — revise os dados antes de emitir.' : 'Dados duplicados — revise antes de emitir.', 'ok');
  }
  document.getElementById('mnfEmiDocTomador').addEventListener('input', async e=>{
    const doc = e.target.value.replace(/\D/g,'');
    e.target.value = doc;
    if(doc.length!==14) return;
    const status = document.getElementById('mnfEmiCnpjStatus');
    status.textContent = 'Consultando CNPJ na Receita Federal…';
    try{
      const r = await api('/nfse/minha-empresa/cnpj/'+doc);
      document.getElementById('mnfEmiNomeTomador').value = r.razaoSocial || '';
      document.getElementById('mnfEmiEmailTomador').value = r.email || '';
      document.getElementById('mnfEmiEndereco').value = r.logradouro || '';
      document.getElementById('mnfEmiNumero').value = r.numero || '';
      document.getElementById('mnfEmiComplemento').value = r.complemento || '';
      document.getElementById('mnfEmiCep').value = r.cep || '';
      document.getElementById('mnfEmiBairro').value = r.bairro || '';
      document.getElementById('mnfEmiCidade').value = r.municipio || '';
      document.getElementById('mnfEmiUf').value = r.uf || '';
      status.textContent = 'Dados preenchidos a partir do CNPJ.';
      if(r.municipio && r.uf){
        try{
          const m = await api('/nfse/minha-empresa/municipio-ibge?cidade='+encodeURIComponent(r.municipio)+'&uf='+encodeURIComponent(r.uf));
          document.getElementById('mnfEmiCodMun').value = m.codigoMunicipio;
        }catch(errIbge){ /* segue sem o código IBGE do tomador */ }
      }
    }catch(err){
      status.textContent = err.message;
    }
  });
  function lerFormulario(){
    return {
      modeloId: Number(document.getElementById('mnfEmiModelo').value),
      tomador: {
        documento: document.getElementById('mnfEmiDocTomador').value.replace(/\D/g,''),
        nome: document.getElementById('mnfEmiNomeTomador').value.trim(),
        email: document.getElementById('mnfEmiEmailTomador').value.trim() || null,
        logradouro: document.getElementById('mnfEmiEndereco').value.trim() || null,
        numero: document.getElementById('mnfEmiNumero').value.trim() || null,
        complemento: document.getElementById('mnfEmiComplemento').value.trim() || null,
        cep: document.getElementById('mnfEmiCep').value.trim() || null,
        bairro: document.getElementById('mnfEmiBairro').value.trim() || null,
        codigoMunicipio: document.getElementById('mnfEmiCodMun').value || null,
      },
      servico: {
        descricao: document.getElementById('mnfEmiDescricao').value.trim(),
        valor: Number(document.getElementById('mnfEmiValor').value),
        competencia: document.getElementById('mnfEmiCompetencia').value,
      },
    };
  }
  document.getElementById('btnSalvarMinhaNfse').addEventListener('click', async ()=>{
    const body = lerFormulario();
    if(!body.tomador.documento || !body.tomador.nome){ toast('Preencha o documento e o nome do tomador.','err'); return; }
    if(!body.servico.descricao || !body.servico.valor || !body.servico.competencia){ toast('Preencha a descrição, o valor e a competência.','err'); return; }
    try{
      if(NFSE_RASCUNHO_ID){
        await api('/nfse/minha-empresa/rascunhos/'+NFSE_RASCUNHO_ID, { method:'PUT', body });
        toast('Rascunho atualizado.','ok');
      }else{
        const r = await api('/nfse/minha-empresa/rascunhos', { method:'POST', body });
        NFSE_RASCUNHO_ID = r.id;
        document.getElementById('btnSalvarMinhaNfse').textContent = 'Salvar rascunho';
        toast('Rascunho salvo — você pode continuar depois em Notas emitidas.','ok');
      }
    }catch(e){ toast(e.message,'err'); }
  });
  document.getElementById('btnEmitirMinhaNfse').addEventListener('click', async ()=>{
    const resultado = document.getElementById('mnfEmiResultado');
    const body = lerFormulario();
    if(!body.tomador.documento || !body.tomador.nome){ toast('Preencha o documento e o nome do tomador.','err'); return; }
    if(!body.servico.descricao || !body.servico.valor || !body.servico.competencia){ toast('Preencha a descrição, o valor e a competência.','err'); return; }
    resultado.innerHTML = `<div class="empty-state">Enviando ao Sistema Nacional NFS-e…</div>`;
    try{
      let r;
      if(NFSE_RASCUNHO_ID){
        await api('/nfse/minha-empresa/rascunhos/'+NFSE_RASCUNHO_ID, { method:'PUT', body });
        r = await api('/nfse/minha-empresa/rascunhos/'+NFSE_RASCUNHO_ID+'/emitir', { method:'POST' });
        NFSE_RASCUNHO_ID = null;
      }else{
        r = await api('/nfse/minha-empresa/emitir', { method:'POST', body });
      }
      resultado.innerHTML = `<div class="slot-locked" style="background:var(--paper);"><span class="fname">Emitida com sucesso</span>Chave de acesso: ${esc(r.chaveAcesso||'—')}</div>`;
      toast('NFS-e emitida com sucesso.','ok');
    }catch(e){
      resultado.innerHTML = `<div class="slot-locked" style="background:var(--paper); border-color:var(--debit);"><span class="fname">Rejeitada pelo Sistema Nacional NFS-e</span>${esc(e.message)}</div>`;
      toast(e.message,'err');
    }
  });
}
let MINHA_NFSE_SELECIONADAS = new Set();
let MINHA_NFSE_NOTAS_FILTRO = { dataDe:'', dataAte:'' };
async function renderMinhaNfseNotas(){
  const { dataDe, dataAte } = MINHA_NFSE_NOTAS_FILTRO;
  const qs = new URLSearchParams();
  if(dataDe) qs.set('dataDe', dataDe);
  if(dataAte) qs.set('dataAte', dataAte);
  const { items } = await api('/nfse/minha-empresa/emissoes'+(qs.toString()?'?'+qs.toString():''));
  MINHA_NFSE_SELECIONADAS = new Set([...MINHA_NFSE_SELECIONADAS].filter(id=>items.some(i=>i.id===id)));
  const box = document.getElementById('nfseContent');
  const STATUS_LABEL={emitida:'Emitida',pendente:'Pendente',rejeitada:'Rejeitada',erro:'Erro',rascunho:'Rascunho',cancelada:'Cancelada'};
  box.innerHTML = `
    <div class="row" style="margin-bottom:12px; align-items:flex-end;">
      ${dateFieldHtml('mnfNotasDe','De',dataDe)}
      ${dateFieldHtml('mnfNotasAte','Até',dataAte)}
      <div id="mnfNotasLoteBar" style="margin-bottom:2px;"></div>
    </div>
    <div class="card" style="padding:0; overflow-x:auto;">
      <table class="data-table">
        <thead><tr><th style="width:34px;"><input type="checkbox" id="mnfNotasSelAll"></th><th>Tomador</th><th>Modelo</th><th>Serviço</th><th>Valor</th><th>Status</th><th>Emitido em</th><th></th></tr></thead>
        <tbody>
          ${items.length? items.map(n=>`
            <tr>
              <td><input type="checkbox" class="mnfNotaSel" data-id="${n.id}" ${MINHA_NFSE_SELECIONADAS.has(n.id)?'checked':''}></td>
              <td>${esc(n.tomadorNome)}</td>
              <td>${esc(n.modeloNome||'—')}</td>
              <td>${esc(n.descricaoServico)}</td>
              <td>${fmtMoney(n.valorServico)}</td>
              <td><span class="tag ${n.status==='emitida'?'ok':(n.status==='pendente'?'muted':(n.status==='rascunho'?'muted':'bad'))}">${STATUS_LABEL[n.status]||n.status}</span></td>
              <td>${fmtDateHora(n.criadoEm)}</td>
              <td style="text-align:right; white-space:nowrap;">
                ${n.status==='rascunho'?`<button class="btn small" data-id="${n.id}" data-act="continuar">Continuar</button> <button class="btn small" data-id="${n.id}" data-act="excluir">Excluir</button>`:''}
                ${n.status!=='rascunho'?`<button class="btn small" data-id="${n.id}" data-act="duplicar">Duplicar</button>`:''}
                ${n.status==='emitida'||n.status==='cancelada'?`<button class="btn small" data-id="${n.id}" data-act="baixar-xml">XML</button> <button class="btn small" data-id="${n.id}" data-act="baixar-pdf">PDF</button>`:''}
                ${n.status==='emitida'?`<button class="btn small" data-id="${n.id}" data-act="cancelar" style="color:var(--debit);">Cancelar</button>`:''}
              </td>
            </tr>
          `).join('') : `<tr><td colspan="8"><div class="empty-state">Nenhuma emissão neste período.</div></td></tr>`}
        </tbody>
      </table>
    </div>
  `;
  setupDatePicker('mnfNotasDe','mnfNotasDe_text');
  setupDatePicker('mnfNotasAte','mnfNotasAte_text');
  document.getElementById('mnfNotasDe').addEventListener('change', e=>{ MINHA_NFSE_NOTAS_FILTRO.dataDe = e.target.value; renderMinhaNfseNotas(); });
  document.getElementById('mnfNotasAte').addEventListener('change', e=>{ MINHA_NFSE_NOTAS_FILTRO.dataAte = e.target.value; renderMinhaNfseNotas(); });
  function desenhaLoteBar(){
    const bar = document.getElementById('mnfNotasLoteBar');
    const qtd = MINHA_NFSE_SELECIONADAS.size;
    bar.innerHTML = qtd? `
      <span style="font-size:12.5px; color:var(--ink-soft); margin-right:8px;">${qtd} selecionada${qtd>1?'s':''}</span>
      <button class="btn small" data-lote="xml">Baixar XML</button>
      <button class="btn small" data-lote="pdf">Baixar PDF</button>
      <button class="btn small" data-lote="ambos">Baixar XML + PDF (.zip)</button>
    ` : '';
    bar.querySelectorAll('[data-lote]').forEach(b=>b.addEventListener('click', ()=>{
      const ids = [...MINHA_NFSE_SELECIONADAS].join(',');
      window.open('/api/nfse/minha-empresa/baixar-lote?ids='+ids+'&formato='+b.dataset.lote, '_blank');
    }));
  }
  desenhaLoteBar();
  const selAll = document.getElementById('mnfNotasSelAll');
  function atualizaSelAll(){
    const boxes = [...box.querySelectorAll('.mnfNotaSel')];
    selAll.checked = boxes.length>0 && boxes.every(b=>b.checked);
    selAll.indeterminate = boxes.some(b=>b.checked) && !selAll.checked;
  }
  atualizaSelAll();
  box.querySelectorAll('.mnfNotaSel').forEach(b=>b.addEventListener('change', ()=>{
    const id = Number(b.dataset.id);
    if(b.checked) MINHA_NFSE_SELECIONADAS.add(id); else MINHA_NFSE_SELECIONADAS.delete(id);
    atualizaSelAll();
    desenhaLoteBar();
  }));
  selAll.addEventListener('change', ()=>{
    box.querySelectorAll('.mnfNotaSel').forEach(b=>{
      b.checked = selAll.checked;
      const id = Number(b.dataset.id);
      if(selAll.checked) MINHA_NFSE_SELECIONADAS.add(id); else MINHA_NFSE_SELECIONADAS.delete(id);
    });
    selAll.indeterminate = false;
    desenhaLoteBar();
  });
  box.querySelectorAll('[data-act="baixar-xml"]').forEach(b=>b.addEventListener('click', ()=>{
    window.open('/api/nfse/minha-empresa/emissoes/'+b.dataset.id+'/xml', '_blank');

  box.querySelectorAll('[data-act="baixar-pdf"]').forEach(b=>b.addEventListener('click', ()=>{
    window.open('/api/nfse/minha-empresa/emissoes/'+b.dataset.id+'/danfse', '_blank');
  }));
  box.querySelectorAll('[data-act="cancelar"]').forEach(b=>b.addEventListener('click', ()=>{
    const n = items.find(i=>i.id===Number(b.dataset.id));
    minhaNfseCancelarModal(n);
  }));
  box.querySelectorAll('[data-act="duplicar"]').forEach(b=>b.addEventListener('click', ()=>{
    const n = items.find(i=>i.id===Number(b.dataset.id));
    NFSE_PREFILL = { ...n, __modo:'duplicar' };
    MINHA_NFSE_TAB='emitir';
    renderMinhaNfseTabs();
  }));
  box.querySelectorAll('[data-act="continuar"]').forEach(b=>b.addEventListener('click', ()=>{
    const n = items.find(i=>i.id===Number(b.dataset.id));
    NFSE_PREFILL = { ...n, __modo:'continuar' };
    MINHA_NFSE_TAB='emitir';
    renderMinhaNfseTabs();
  }));
  box.querySelectorAll('[data-act="excluir"]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm('Excluir este rascunho?')) return;
    try{
      await api('/nfse/minha-empresa/emissoes/'+b.dataset.id, { method:'DELETE' });
      toast('Rascunho excluído.','ok');
      renderMinhaNfseNotas();
    }catch(e){ toast(e.message,'err'); }
  }));
}
function minhaNfseCancelarModal(n){
  openModal(`
    <h3>Cancelar NFS-e</h3>
    <p style="color:var(--ink-soft); font-size:13px; margin-top:-6px;">Tomador: ${esc(n.tomadorNome)} — ${fmtMoney(n.valorServico)}<br>
    <b>Atenção: cancelamento é uma ação real e definitiva no Sistema Nacional NFS-e, não tem como desfazer depois.</b></p>
    <div class="field"><label>Motivo</label>
      <select id="mncMotivo">
        <option value="1">Erro na emissão</option>
        <option value="2">Serviço não prestado</option>
        <option value="9">Outros</option>
      </select>
    </div>
    <div class="field"><label>Justificativa (mínimo 15 caracteres)</label><textarea id="mncJustificativa" rows="3"></textarea></div>
    <button class="btn primary" id="btnConfirmarCancelarMinhaNfse" style="background:var(--debit); border-color:var(--debit);">Confirmar cancelamento</button>
  `);
  document.getElementById('btnConfirmarCancelarMinhaNfse').addEventListener('click', async ()=>{
    const motivo = document.getElementById('mncMotivo').value;
    const justificativa = document.getElementById('mncJustificativa').value.trim();
    if(justificativa.length<15){ toast('A justificativa precisa ter pelo menos 15 caracteres.','err'); return; }
    if(!confirm('Confirma o cancelamento desta NFS-e? Essa ação não pode ser desfeita.')) return;
    try{
      await api('/nfse/minha-empresa/emissoes/'+n.id+'/cancelar', { method:'POST', body:{ motivo, justificativa } });
      closeModal();
      toast('NFS-e cancelada.','ok');
      renderMinhaNfseNotas();
    }catch(e){ toast(e.message,'err'); }
  });
}

// Modal de lançamento manual, compartilhado entre Receber e Pagar — os campos são quase iguais,
// só muda o rótulo "Cliente"/"Fornecedor" e a rota da API.
async function minhaFinLancamentoModal(tipo, item){
  const ehReceber = tipo==='receber';
  const rota = ehReceber ? '/financeiro/minha-empresa/receber' : '/financeiro/minha-empresa/pagar';
  const rotuloTerceiro = ehReceber ? 'Cliente' : 'Fornecedor';
  const campoTerceiro = ehReceber ? 'clienteNome' : 'fornecedor';
  const valorTerceiro = item ? (ehReceber? item.clienteNome : item.fornecedor) : '';
  const travado = ehReceber && item && item.origem==='nfse';
  const contas = await minhaFinContasCache();
  openModal(`
    <h3>${item?'Editar':'Novo'} lançamento — ${ehReceber?'a receber':'a pagar'}</h3>
    ${travado?`<p style="font-size:12px; color:var(--ink-soft); margin:-4px 0 10px;">Este recebível veio de uma NFS-e emitida — descrição, ${rotuloTerceiro.toLowerCase()} e valor ficam travados.</p>`:''}
    <div class="field"><label>Descrição</label><input id="mflDescricao" value="${item?esc(item.descricao):''}" ${travado?'readonly style="background:var(--paper);"':''}></div>
    <div class="field"><label>${rotuloTerceiro} (opcional)</label><input id="mflTerceiro" value="${valorTerceiro?esc(valorTerceiro):''}" ${travado?'readonly style="background:var(--paper);"':''}></div>
    <div class="row">
      <div class="field" style="width:160px;"><label>Valor (R$)</label><input id="mflValor" type="number" step="0.01" min="0" value="${item?item.valor:''}" ${travado?'readonly style="background:var(--paper);"':''}></div>
      <div class="field" style="width:170px;">${dateFieldHtml('mflVencimento','Vencimento', item?item.vencimento:'')}</div>
    </div>
    <div class="field"><label>Conta (${ehReceber?'onde recebeu':'de onde pagou'}, opcional)</label>${contaSelectHtml('mflConta', contas, item?item.contaId:null)}</div>
    ${item?`<div class="field"><label>Status</label>
      <select id="mflStatus">
        <option value="pendente" ${item.status==='pendente'?'selected':''}>Pendente</option>
        <option value="${ehReceber?'pago':'pago'}" ${item.status==='pago'?'selected':''}>${ehReceber?'Recebido':'Pago'}</option>
        <option value="atrasado" ${item.status==='atrasado'?'selected':''}>Atrasado</option>
        <option value="cancelado" ${item.status==='cancelado'?'selected':''}>Cancelado</option>
      </select>
    </div>`:''}
    <div class="field"><label>Observação (opcional)</label><textarea id="mflObs" rows="2">${item&&item.observacao?esc(item.observacao):''}</textarea></div>
    <div class="modal-actions">
      <button class="btn" id="mflCancel">Cancelar</button>
      <button class="btn primary" id="mflSalvar">Salvar</button>
    </div>
  `);
  setupDatePicker('mflVencimento','mflVencimento_text');
  document.getElementById('mflCancel').addEventListener('click', closeModal);
  document.getElementById('mflSalvar').addEventListener('click', async ()=>{
    const descricao = document.getElementById('mflDescricao').value.trim();
    const valor = Number(document.getElementById('mflValor').value);
    const vencimento = document.getElementById('mflVencimento').value;
    if(!descricao || !valor || !vencimento){ toast('Preencha a descrição, o valor e o vencimento.','err'); return; }
    const contaVal = document.getElementById('mflConta').value;
    const body = { descricao, valor, vencimento, observacao: document.getElementById('mflObs').value.trim(), contaId: contaVal?Number(contaVal):null };
    body[campoTerceiro] = document.getElementById('mflTerceiro').value.trim();
    if(item) body.status = document.getElementById('mflStatus').value;
    try{
      if(item) await api(rota+'/'+item.id, { method:'PUT', body });
      else await api(rota, { method:'POST', body });
      closeModal();
      toast('Lançamento salvo.','ok');
      if(ehReceber) renderMinhaFinReceber(); else renderMinhaFinPagar();
    }catch(e){ toast(e.message,'err'); }
  });
}

let ASSINATURA_POLL = null;
function assinaturaModuloCardHtml(item){
  let badgeClass='muted', badgeText='Não contratado';
  // Contas migradas antes de existir o controle de teste/assinatura ganharam acesso liberado "pra
  // sempre" (ver migração de compatibilidade em src/server.ts) — uma data 100 anos no futuro é só
  // um jeito de representar isso no banco, não deve aparecer literalmente pro cliente.
  const dataAssinatura = item.assinaturaAtivaAte ? new Date(String(item.assinaturaAtivaAte).replace(' ','T')) : null;
  const semVencimento = dataAssinatura && (dataAssinatura.getTime() - Date.now()) > 1000*60*60*24*365*3;
  if(item.status==='teste'){ badgeClass='ok'; badgeText='Em teste até '+fmtDateHora(item.trialFim); }
  else if(item.status==='teste_vencido'){ badgeClass='bad'; badgeText='Teste grátis vencido'; }
  else if(item.status==='ativo'){ badgeClass='ok'; badgeText = semVencimento ? 'Ativo' : 'Ativo até '+fmtDateIso(String(item.assinaturaAtivaAte||'').slice(0,10)); }
  else if(item.status==='vencido'){ badgeClass='bad'; badgeText='Assinatura vencida'; }
  const mostraBotaoTeste = item.status==='nao_contratado';
  const rotuloCheckbox = item.status==='ativo' ? 'Incluir no pagamento (renovar antecipado)' : 'Incluir no pagamento';
  return `
    <div class="card" style="margin-bottom:10px;">
      <div class="row" style="justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
        <div>
          <div style="font-weight:600;">${esc(item.nome)}</div>
          <div style="font-size:12.5px; color:var(--ink-soft);">${fmtMoney(item.valorMensal)}/mês</div>
        </div>
        <div style="display:flex; align-items:center; gap:14px;">
          <span class="tag ${badgeClass}">${esc(badgeText)}</span>
          ${mostraBotaoTeste?`<button class="btn small" data-acao="testar" data-chave="${item.chave}">Iniciar teste grátis</button>`:''}
          <label class="checkbox-row" style="margin:0;"><input type="checkbox" class="assinaturaCheck" data-chave="${item.chave}" data-valor="${item.valorMensal}" data-nome="${esc(item.nome)}"> ${rotuloCheckbox}</label>
        </div>
      </div>
    </div>
  `;
}
async function renderMinhaAssinatura(){
  if(ASSINATURA_POLL){ clearInterval(ASSINATURA_POLL); ASSINATURA_POLL=null; }
  const { items } = await api('/financeiro/minha-empresa/modulos');
  const box = document.getElementById('assinaturaContent');
  box.innerHTML = `
    ${items.map(assinaturaModuloCardHtml).join('')}
    <div class="card" style="margin-top:14px;">
      <div class="row" style="justify-content:space-between; align-items:center;">
        <div>Total selecionado: <b id="assinaturaTotal">${fmtMoney(0)}</b></div>
        <button class="btn primary" id="btnPagarAssinatura" disabled>Pagar agora</button>
      </div>
      <div id="assinaturaPagamentoResultado" style="margin-top:12px;"></div>
    </div>
  `;
  box.querySelectorAll('[data-acao="testar"]').forEach(b=>b.addEventListener('click', async ()=>{
    try{
      await api('/financeiro/minha-empresa/modulos/'+b.dataset.chave+'/iniciar-teste', { method:'POST' });
      toast('Teste iniciado! Você tem 3 dias de acesso completo.','ok');
      renderMinhaAssinatura();
    }catch(e){ toast(e.message,'err'); }
  }));
  const btnPagar = document.getElementById('btnPagarAssinatura');
  function recomputarTotal(){
    const marcados = [...box.querySelectorAll('.assinaturaCheck:checked')];
    const total = marcados.reduce((soma,c)=>soma+Number(c.dataset.valor),0);
    document.getElementById('assinaturaTotal').textContent = fmtMoney(total);
    btnPagar.disabled = marcados.length===0;
  }
  box.querySelectorAll('.assinaturaCheck').forEach(c=>c.addEventListener('change', recomputarTotal));
  btnPagar.addEventListener('click', async ()=>{
    const chaves = [...box.querySelectorAll('.assinaturaCheck:checked')].map(c=>c.dataset.chave);
    if(!chaves.length) return;
    const resultado = document.getElementById('assinaturaPagamentoResultado');
    resultado.innerHTML = `<div class="empty-state">Gerando cobrança…</div>`;
    try{
      const r = await api('/financeiro/minha-empresa/modulos/pagar', { method:'POST', body:{ modulos: chaves } });
      resultado.innerHTML = `
        <div class="card" style="background:var(--paper);">
          ${r.pixImagemBase64?`
            <div style="text-align:center;">
              <img src="data:image/png;base64,${r.pixImagemBase64}" alt="QR Code Pix" style="width:200px; height:200px;">
              <div style="font-size:12px; color:var(--ink-soft); margin:8px 0 4px;">Pix copia e cola</div>
              <input readonly value="${esc(r.pixPayload||'')}" style="width:100%; font-family:'IBM Plex Mono',monospace; font-size:11px; text-align:center;" onclick="this.select()">
            </div>
          `:''}
          ${r.invoiceUrl?`<div style="text-align:center; margin-top:12px;"><a class="btn primary" href="${esc(r.invoiceUrl)}" target="_blank" rel="noopener">Pagar com cartão de crédito</a></div>`:''}
          <div style="text-align:center; margin-top:12px; font-size:12px; color:var(--ink-soft);">Assim que o pagamento confirmar, o acesso libera sozinho aqui.</div>
        </div>
      `;
      ASSINATURA_POLL = setInterval(async ()=>{
        try{
          const { items: atualizados } = await api('/financeiro/minha-empresa/modulos');
          const todosLiberados = chaves.every(ch=>{ const m=atualizados.find(i=>i.chave===ch); return m && m.status==='ativo'; });
          if(todosLiberados){
            clearInterval(ASSINATURA_POLL); ASSINATURA_POLL=null;
            toast('Pagamento confirmado!','ok');
            renderMinhaAssinatura();
          }
        }catch(e){ /* ignora falha pontual de rede no polling */ }
      }, 5000);
    }catch(e){
      resultado.innerHTML = `<div class="slot-locked" style="background:var(--paper); border-color:var(--debit);"><span class="fname">Não consegui gerar a cobrança</span>${esc(e.message)}</div>`;
    }
  });
}
