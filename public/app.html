      <div class="row">
        <div class="field" style="width:160px;"><label>Cód. Situação Tributária</label><input id="nmIbscbsCst" value="${m&&m.ibscbsCst?esc(m.ibscbsCst):'000'}" maxlength="3"></div>
        <div class="field grow"><label>Cód. Classificação Tributária</label>${comboSelectHtml('nmCclasstribCombo', 'Digite para buscar…')}</div>
      </div>
    `;
    setupComboSelect('nmCclasstribCombo', cclasstribItens, ()=>{});
    const alvo = (m && m.ibscbsCclasstrib) || '000001';
    const item = cclasstribItens.find(it=>it.id===alvo);
    if(item){
      document.querySelector('#nmCclasstribCombo .combo-input').value = item.label;
      document.querySelector('#nmCclasstribCombo .combo-value').value = item.id;
    }
  }
  desenhaIbscbsWrap();
  document.getElementById('nmIbscbsPreencher').addEventListener('change', desenhaIbscbsWrap);
  if(m && m.codigoTributacaoNacional){
    const item = ctribItens.find(it=>it.id===m.codigoTributacaoNacional);
    if(item){
      document.querySelector('#nmCTribNacCombo .combo-input').value = item.label;
      document.querySelector('#nmCTribNacCombo .combo-value').value = item.id;
    }
  }
  if(m && m.codigoNbs){
    const item = nbsItens.find(it=>it.id===m.codigoNbs);
    if(item){
      document.querySelector('#nmNbsCombo .combo-input').value = item.label;
      document.querySelector('#nmNbsCombo .combo-value').value = item.id;
    }
  }
  document.getElementById('nmCancel').addEventListener('click', closeModal);
  document.getElementById('nmSalvar').addEventListener('click', async ()=>{
    const nome = document.getElementById('nmNome').value.trim();
    const cTribNac = document.querySelector('#nmCTribNacCombo .combo-value').value;
    if(!nome || !cTribNac){ toast('Informe o nome e o código de tributação nacional.','err'); return; }
    const body = {
      nome,
      codigoTributacaoNacional: cTribNac,
      codigoTributacaoMunicipal: document.getElementById('nmCTribMun').value.trim(),
      codigoNbs: document.querySelector('#nmNbsCombo .combo-value').value || '',
      tribIssqn: Number(document.getElementById('nmTribIssqn').value),
      tipoRetencaoIssqn: Number(document.getElementById('nmRetIssqn').value),
      aliquotaIssqn: document.getElementById('nmAliquota').value,
      tipoRetencaoPisCofins: document.getElementById('nmRetPisCofins').value,
      issqnExigibilidadeSuspensa: document.getElementById('nmExigSuspensa').checked,
      issqnMotivoSuspensao: document.getElementById('nmExigSuspensa').checked ? Number(document.getElementById('nmMotivoSuspensao').value) : '',
      issqnNumeroProcesso: document.getElementById('nmExigSuspensa').checked ? document.getElementById('nmNumeroProcesso').value.trim() : '',
      beneficioMunicipalCodigo: document.getElementById('nmBeneficioMunicipal').value.trim(),
      pisCofinsCst: document.getElementById('nmPisCofinsCst').value,
      percentualIrrf: document.getElementById('nmPctIrrf').value,
      percentualCsll: document.getElementById('nmPctCsll').value,
      percentualCofinsRetido: document.getElementById('nmPctCofins').value,
      percentualPisRetido: document.getElementById('nmPctPis').value,
      percentualContribPrevidenciaria: document.getElementById('nmPctCp').value,
      ibscbsPreencher: document.getElementById('nmIbscbsPreencher').checked,
      ibscbsCst: document.getElementById('nmIbscbsPreencher').checked ? document.getElementById('nmIbscbsCst').value.trim() : '',
      ibscbsCclasstrib: document.getElementById('nmIbscbsPreencher').checked ? (document.querySelector('#nmCclasstribCombo .combo-value')?.value || '') : '',
      docResponsabilidadeTecnica: document.getElementById('nmDocTec').value.trim(),
      docReferencia: document.getElementById('nmDocRef').value.trim(),
      informacoesComplementares: document.getElementById('nmInfoComp').value.trim(),
    };
    if(m) body.ativo = document.getElementById('nmAtivo').checked;
    try{
      if(m) await api(opts.basePath+'/'+m.id, { method:'PUT', body });
      else await api(opts.basePath, { method:'POST', body });
      closeModal(); toast('Modelo salvo.','ok'); opts.aoSalvar();
    }catch(e){ toast(e.message,'err'); }
  });
}

function nfseCancelarModal(n){
  openModal(`
    <h3>Cancelar NFS-e</h3>
    <p style="color:var(--ink-soft); font-size:13px; margin-top:-6px;">Empresa: ${esc(n.empresaNome)} — Tomador: ${esc(n.tomadorNome)} — ${fmtMoney(n.valorServico)}<br>
    <b>Atenção: cancelamento é uma ação real e definitiva no Sistema Nacional NFS-e, não tem como desfazer depois.</b></p>
    <div class="field"><label>Motivo</label>
      <select id="ncMotivo">
        <option value="1">Erro na emissão</option>
        <option value="2">Serviço não prestado</option>
        <option value="9">Outros</option>
      </select>
    </div>
    <div class="field"><label>Justificativa (mínimo 15 caracteres)</label><textarea id="ncJustificativa" rows="3"></textarea></div>
    <button class="btn primary" id="btnConfirmarCancelar" style="background:var(--debit); border-color:var(--debit);">Confirmar cancelamento</button>
  `);
  document.getElementById('btnConfirmarCancelar').addEventListener('click', async ()=>{
    const motivo = document.getElementById('ncMotivo').value;
    const justificativa = document.getElementById('ncJustificativa').value.trim();
    if(justificativa.length<15){ toast('A justificativa precisa ter pelo menos 15 caracteres.','err'); return; }
    if(!confirm('Confirma o cancelamento desta NFS-e? Essa ação não pode ser desfeita.')) return;
    try{
      await api('/nfse/emissoes/'+n.id+'/cancelar', { method:'POST', body:{ motivo, justificativa } });
      closeModal();
      toast('NFS-e cancelada.','ok');
      renderNfseNotas();
    }catch(e){ toast(e.message,'err'); }
  });
}
let NFSE_NOTAS_SELECIONADAS = new Set();
let NFSE_NOTAS_FILTRO = { dataDe:'', dataAte:'' };
let NFSE_NOTAS_EMPRESA_ATUAL = null;
// Lista → detalhe (padrão do projeto, ver memory.md "Resumir por empresa antes do detalhe"): a aba
// abre mostrando quantas notas cada empresa tem, não tudo solto numa tabela só. Clicar numa empresa
// abre a tabela cheia (filtros de data, seleção em lote, cancelar/duplicar/continuar) só daquela empresa.
async function renderNfseNotas(){
  if(NFSE_NOTAS_EMPRESA_ATUAL) return renderNfseNotasDetalhe(NFSE_NOTAS_EMPRESA_ATUAL);
  return renderNfseNotasLista();
}
async function renderNfseNotasLista(){
  const box = document.getElementById('nfseContent');
  box.innerHTML = `<div class="empty-state">Carregando…</div>`;
  const [{ items: empresas }, { items: notas }] = await Promise.all([ api('/nfse/empresas'), api('/nfse/emissoes') ]);
  const contagem = {}, ultimaPorEmpresa = {};
  notas.forEach(n=>{
    contagem[n.empresaId] = (contagem[n.empresaId]||0)+1;
    if(!ultimaPorEmpresa[n.empresaId] || n.criadoEm>ultimaPorEmpresa[n.empresaId]) ultimaPorEmpresa[n.empresaId] = n.criadoEm;
  });
  const habilitadas = empresas.filter(e=>e.habilitado);
  const idsAtivos = new Set([...habilitadas.map(e=>e.id), ...Object.keys(contagem).map(Number)]);
  const linhas = [...idsAtivos].map(id=>{
    const emp = empresas.find(e=>e.id===id);
    return { id, nome: emp?emp.nome:'(empresa removida)', qtd: contagem[id]||0, ultima: ultimaPorEmpresa[id]||null };
  }).sort((a,b)=>a.nome.localeCompare(b.nome));
  box.innerHTML = `
    <div class="card" style="padding:0; overflow-x:auto;">
      <table class="data-table">
        <thead><tr><th>Empresa</th><th>Notas emitidas</th><th>Última emissão</th><th></th></tr></thead>
        <tbody>
          ${linhas.length? linhas.map(l=>`
            <tr class="nfseEmpresaRow" data-id="${l.id}" style="cursor:pointer;">
              <td><b>${esc(l.nome)}</b></td>
              <td>${l.qtd}</td>
              <td>${l.ultima?fmtDateHora(l.ultima):'—'}</td>
              <td style="text-align:right;"><button class="btn small">Ver</button></td>
            </tr>
          `).join('') : '<tr><td colspan="4"><div class="empty-state">Nenhuma empresa habilitada pra NFS-e ainda.</div></td></tr>'}
        </tbody>
      </table>
    </div>
  `;
  box.querySelectorAll('.nfseEmpresaRow').forEach(tr=>tr.addEventListener('click', ()=>{
    NFSE_NOTAS_EMPRESA_ATUAL = Number(tr.dataset.id);
    renderNfseNotas();
  }));
}
async function renderNfseNotasDetalhe(empresaId){
  const { dataDe, dataAte } = NFSE_NOTAS_FILTRO;
  const { items: empresas } = await api('/nfse/empresas');
  const empresa = empresas.find(e=>e.id===empresaId);
  const qs = new URLSearchParams({ empresaId });
  if(dataDe) qs.set('dataDe', dataDe);
  if(dataAte) qs.set('dataAte', dataAte);
  const { items } = await api('/nfse/emissoes?'+qs.toString());
  NFSE_NOTAS_SELECIONADAS = new Set([...NFSE_NOTAS_SELECIONADAS].filter(id=>items.some(i=>i.id===id)));
  const box = document.getElementById('nfseContent');
  const STATUS_LABEL={emitida:'Emitida',pendente:'Pendente',rejeitada:'Rejeitada',erro:'Erro',rascunho:'Rascunho',cancelada:'Cancelada'};
  box.innerHTML = `
    <button class="btn small" id="btnNfseNotasVoltar">← Voltar pra lista de empresas</button>
    <h3 style="margin:12px 0 10px;">${esc(empresa?empresa.nome:'Empresa')}</h3>
    <div class="row" style="margin-bottom:12px; align-items:flex-end;">
      ${dateFieldHtml('nfseNotasDe','De',dataDe)}
      ${dateFieldHtml('nfseNotasAte','Até',dataAte)}
      <div id="nfseNotasLoteBar" style="margin-bottom:2px;"></div>
    </div>
    <div class="card" style="padding:0; overflow-x:auto;">
      <table class="data-table">
        <thead><tr><th style="width:34px;"><input type="checkbox" id="nfseNotasSelAll"></th><th>Tomador</th><th>Modelo</th><th>Serviço</th><th>Valor</th><th>Status</th><th>Emitido em</th><th></th></tr></thead>
        <tbody>
          ${items.length? items.map(n=>`
            <tr>
              <td><input type="checkbox" class="nfseNotaSel" data-id="${n.id}" ${NFSE_NOTAS_SELECIONADAS.has(n.id)?'checked':''}></td>
              <td>${esc(n.tomadorNome)}</td>
              <td>${esc(n.modeloNome||'—')}</td>
              <td>${esc(n.descricaoServico)}</td>
              <td>${fmtMoney(n.valorServico)}</td>
              <td><span class="tag ${n.status==='emitida'?'ok':(n.status==='pendente'?'muted':(n.status==='rascunho'?'muted':'bad'))}">${STATUS_LABEL[n.status]||n.status}</span></td>
              <td>${fmtDateHora(n.criadoEm)}</td>
              <td style="text-align:right; white-space:nowrap;">
                ${n.status==='rascunho'?`<button class="btn small" data-id="${n.id}" data-act="continuar">Continuar</button> <button class="btn small" data-id="${n.id}" data-act="excluir">Excluir</button>`:''}
                ${n.status!=='rascunho'?`<button class="btn small" data-id="${n.id}" data-act="duplicar">Duplicar</button>`:''}
                ${n.status==='emitida'||n.status==='cancelada'?`<button class="btn small" data-id="${n.id}" data-act="baixar-xml">XML</button> <button class="btn small" data-id="${n.id}" data-act="baixar-pdf">PDF</button>`:''}
                ${n.status==='emitida'&&n.whatsappStatus==='lido'?`<span class="tag ok" title="Lido pelo cliente${n.whatsappStatusEm?' em '+fmtDateHora(n.whatsappStatusEm):''}">✓✓ Lido</span>`:''}
                ${n.status==='emitida'&&n.whatsappStatus==='entregue'?`<span class="tag ok" title="Entregue ao cliente">✓✓ Entregue</span>`:''}
                ${n.status==='emitida'&&n.whatsappStatus==='falhou'?`<span class="tag bad" title="Falha na entrega por WhatsApp">⚠ Falhou</span>`:''}
                ${n.status==='emitida'?`<button class="btn small" data-id="${n.id}" data-act="enviar-whatsapp-nfse">${n.whatsappEnviado?'Reenviar WhatsApp':'Enviar WhatsApp'}</button>`:''}
                ${n.status==='emitida'?`<button class="btn small" data-id="${n.id}" data-act="cancelar" style="color:var(--debit);">Cancelar</button>`:''}
              </td>
            </tr>
          `).join('') : `<tr><td colspan="8"><div class="empty-state">Nenhuma emissão neste período.</div></td></tr>`}
        </tbody>
      </table>
    </div>
  `;
  document.getElementById('btnNfseNotasVoltar').addEventListener('click', ()=>{
    NFSE_NOTAS_EMPRESA_ATUAL = null;
    renderNfseNotas();
  });
  setupDatePicker('nfseNotasDe','nfseNotasDe_text');
  setupDatePicker('nfseNotasAte','nfseNotasAte_text');
  document.getElementById('nfseNotasDe').addEventListener('change', e=>{ NFSE_NOTAS_FILTRO.dataDe = e.target.value; renderNfseNotas(); });
  document.getElementById('nfseNotasAte').addEventListener('change', e=>{ NFSE_NOTAS_FILTRO.dataAte = e.target.value; renderNfseNotas(); });
  function desenhaLoteBar(){
    const bar = document.getElementById('nfseNotasLoteBar');
    const qtd = NFSE_NOTAS_SELECIONADAS.size;
    bar.innerHTML = qtd? `
      <span style="font-size:12.5px; color:var(--ink-soft); margin-right:8px;">${qtd} selecionada${qtd>1?'s':''}</span>
      <button class="btn small" data-lote="xml">Baixar XML</button>
      <button class="btn small" data-lote="pdf">Baixar PDF</button>
      <button class="btn small" data-lote="ambos">Baixar XML + PDF (.zip)</button>
    ` : '';
    bar.querySelectorAll('[data-lote]').forEach(b=>b.addEventListener('click', ()=>{
      const ids = [...NFSE_NOTAS_SELECIONADAS].join(',');
      window.open('/api/nfse/emissoes/baixar-lote?ids='+ids+'&formato='+b.dataset.lote, '_blank');
    }));
  }
  desenhaLoteBar();
  const selAll = document.getElementById('nfseNotasSelAll');
  function atualizaSelAll(){
    const boxes = [...box.querySelectorAll('.nfseNotaSel')];
    selAll.checked = boxes.length>0 && boxes.every(b=>b.checked);
    selAll.indeterminate = boxes.some(b=>b.checked) && !selAll.checked;
  }
  atualizaSelAll();
  box.querySelectorAll('.nfseNotaSel').forEach(b=>b.addEventListener('change', ()=>{
    const id = Number(b.dataset.id);
    if(b.checked) NFSE_NOTAS_SELECIONADAS.add(id); else NFSE_NOTAS_SELECIONADAS.delete(id);
    atualizaSelAll();
    desenhaLoteBar();
  }));
  selAll.addEventListener('change', ()=>{
    box.querySelectorAll('.nfseNotaSel').forEach(b=>{
      b.checked = selAll.checked;
      const id = Number(b.dataset.id);
      if(selAll.checked) NFSE_NOTAS_SELECIONADAS.add(id); else NFSE_NOTAS_SELECIONADAS.delete(id);
    });
    selAll.indeterminate = false;
    desenhaLoteBar();
  });
  box.querySelectorAll('[data-act="baixar-xml"]').forEach(b=>b.addEventListener('click', ()=>{
    window.open('/api/nfse/emissoes/'+b.dataset.id+'/xml', '_blank');
  }));
  box.querySelectorAll('[data-act="baixar-pdf"]').forEach(b=>b.addEventListener('click', ()=>{
    window.open('/api/nfse/emissoes/'+b.dataset.id+'/danfse', '_blank');
  }));
  box.querySelectorAll('[data-act="enviar-whatsapp-nfse"]').forEach(b=>b.addEventListener('click', async ()=>{
    b.disabled = true; b.textContent = 'Enviando…';
    try{
      const r = await api('/nfse/emissoes/'+b.dataset.id+'/enviar-whatsapp', { method:'POST' });
      toast('Enviado por WhatsApp'+(r.falhas?' (algum contato falhou)':'')+'.','ok');
      renderNfseNotas();
    }catch(e){ toast(e.message,'err'); b.disabled = false; b.textContent = 'Enviar WhatsApp'; }
  }));
  box.querySelectorAll('[data-act="cancelar"]').forEach(b=>b.addEventListener('click', ()=>{
    const n = items.find(i=>i.id===Number(b.dataset.id));
    nfseCancelarModal(n);
  }));
  box.querySelectorAll('[data-act="duplicar"]').forEach(b=>b.addEventListener('click', ()=>{
    const n = items.find(i=>i.id===Number(b.dataset.id));
    NFSE_PREFILL = { ...n, __modo:'duplicar' };
    NFSE_TAB='emitir';
    renderNfseTabs();
  }));
  box.querySelectorAll('[data-act="continuar"]').forEach(b=>b.addEventListener('click', ()=>{
    const n = items.find(i=>i.id===Number(b.dataset.id));
    NFSE_PREFILL = { ...n, __modo:'continuar' };
    NFSE_TAB='emitir';
    renderNfseTabs();
  }));
  box.querySelectorAll('[data-act="excluir"]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm('Excluir este rascunho?')) return;
    try{
      await api('/nfse/emissoes/'+b.dataset.id, { method:'DELETE' });
      toast('Rascunho excluído.','ok');
      renderNfseNotas();
    }catch(e){ toast(e.message,'err'); }
  }));
}

// ===================== Busca de XML (NF-e/NFC-e/NFS-e — Sefaz + Sistema Nacional NFS-e) =====================
// Bloco de certificado por empresa — reaproveitado tanto na página "Busca de XML" quanto direto no
// cadastro da empresa (um só lugar pra configurar, em vez de precisar ir numa tela separada).
// Gerencia o certificado (upload/remover/ativar) — usado só no cadastro da empresa (Empresas →
// Configurações). Na tela de Busca de XML fica só o resumo somente-leitura (ver
// renderBuscaXmlResumoCertificado abaixo) pra não ter dois lugares pra subir o mesmo .pfx.
async function renderCertificadoBuscaXml(containerEl, empresaId, empresaUfPadrao, opts){
  opts = opts || {};
  const podePostar = can('nfe-busca','postar');
  const podeEditar = can('nfe-busca','editar');
  const { items, moduloAtivo } = await api('/nfe/config');
  if(opts.onModuloStatus) opts.onModuloStatus(moduloAtivo);
  const cfg = items.find(c=>c.empresaId===Number(empresaId));
  if(cfg){
    containerEl.innerHTML = `
      <div class="slot-locked" style="background:var(--paper);">
        <span class="fname">${esc(cfg.titular||'Certificado configurado')}</span>
        CNPJ do certificado: ${esc(cfg.cnpjCertificado||'—')} · Válido até ${fmtValidade(cfg.validadeAte)} · UF autora: ${esc(cfg.ufAutor)} · Ambiente: ${cfg.ambiente==='homologacao'?'Homologação':'Produção'}
        <br>NF-e/NFC-e — última busca: ${cfg.ultimaBuscaEm?fmtDateHora(cfg.ultimaBuscaEm):'nunca'}${cfg.ultimoErro?` — <span style="color:var(--debit);">${esc(cfg.ultimoErro)}</span>`:''}
        <br>NFS-e — última busca: ${cfg.ultimaBuscaNfseEm?fmtDateHora(cfg.ultimaBuscaNfseEm):'nunca'}${cfg.ultimoErroNfse?` — <span style="color:var(--debit);">${esc(cfg.ultimoErroNfse)}</span>`:''}
      </div>
      <label class="checkbox-row"><input type="checkbox" id="nfeCfgAtivo_${empresaId}" ${cfg.ativo?'checked':''} ${podeEditar?'':'disabled'}> Ativar Busca de XML</label>
      <div class="row" style="margin-top:6px;">
        ${podePostar?`<button class="btn primary" id="btnNfeBuscarAgora_${empresaId}" ${moduloAtivo?'':'disabled'}>Buscar agora</button>`:''}
        ${podeEditar?`<button class="btn danger" id="btnNfeRemoverCert_${empresaId}">Remover certificado</button>`:''}
      </div>
      <div id="nfeBuscaResultado_${empresaId}" style="margin-top:10px;"></div>
    `;
    if(podeEditar) containerEl.querySelector(`#nfeCfgAtivo_${empresaId}`).addEventListener('change', async (ev)=>{
      const ligando = ev.target.checked;
      try{
        const r = await api('/nfe/config/'+empresaId+'/ativo', { method:'PUT', body:{ ativo: ligando } });
        const s = r.sync;
        if(ligando && s && (s.novosNfe||s.novosNfse)) toast(`Ativado — trouxe ${s.novosNfe||0} NF-e/NFC-e e ${s.novosNfse||0} NFS-e do histórico.`,'ok');
        else toast('Atualizado.','ok');
        if(ligando && (s?.novosNfe||s?.novosNfse) && opts.onDocumentosMudou) opts.onDocumentosMudou();
      }
      catch(e){ toast(e.message,'err'); ev.target.checked=!ev.target.checked; }
    });
    if(podeEditar) containerEl.querySelector(`#btnNfeRemoverCert_${empresaId}`).addEventListener('click', async ()=>{
      if(!confirmar('Remover o certificado desta empresa? A busca automática para de funcionar até você enviar outro.')) return;
      try{ await api('/nfe/config/'+empresaId, { method:'DELETE' }); toast('Certificado removido.','ok'); renderCertificadoBuscaXml(containerEl, empresaId, empresaUfPadrao, opts); }
      catch(e){ toast(e.message,'err'); }
    });
    if(podePostar) containerEl.querySelector(`#btnNfeBuscarAgora_${empresaId}`).addEventListener('click', async ()=>{
      const btn = containerEl.querySelector(`#btnNfeBuscarAgora_${empresaId}`);
      const resultado = containerEl.querySelector(`#nfeBuscaResultado_${empresaId}`);
      btn.disabled = true; btn.textContent = 'Buscando…';
      resultado.innerHTML = `<div class="empty-state">Consultando a Sefaz e o Sistema Nacional NFS-e…</div>`;
      try{
        const r = await api('/nfe/config/'+empresaId+'/buscar', { method:'POST' });
        const partes = [`${r.novosNfe} NF-e/NFC-e`, `${r.novosNfse} NFS-e`];
        resultado.innerHTML = `<div class="tag ${(r.erroNfe||r.erroNfse)?'bad':'ok'}">${(r.erroNfe||r.erroNfse)?'Concluído com falhas':'Concluído'}</div> <span style="font-size:12.5px;">${partes.join(' · ')} novo(s).</span>
          ${r.erroNfe?`<div style="font-size:12px; color:var(--debit); margin-top:4px;">NF-e/NFC-e: ${esc(r.erroNfe)}</div>`:''}
          ${r.erroNfse?`<div style="font-size:12px; color:var(--debit); margin-top:4px;">NFS-e: ${esc(r.erroNfse)}</div>`:''}`;
        if(opts.onDocumentosMudou) opts.onDocumentosMudou();
      }catch(e){
        resultado.innerHTML = `<div class="tag bad">Falhou</div> <span style="font-size:12.5px;">${esc(e.message)}</span>`;
      }finally{
        btn.disabled = false; btn.textContent = 'Buscar agora';
      }
    });
  } else if(!podePostar){
    containerEl.innerHTML = `<div class="empty-state">Nenhum certificado configurado ainda — você não tem permissão para adicionar um.</div>`;
  } else {
    containerEl.innerHTML = `
      <div class="row">
        <div class="field grow"><label>Arquivo do certificado (.pfx)</label><input type="file" id="nfeCertArquivo_${empresaId}" accept=".pfx,.p12"></div>
        <div class="field" style="width:160px;"><label>Senha do certificado</label><input type="password" id="nfeCertSenha_${empresaId}"></div>
        <div class="field grow"><label>UF autora</label><input id="nfeCertUf_${empresaId}" maxlength="2" style="text-transform:uppercase;" placeholder="ex.: SP" value="${esc(empresaUfPadrao||'')}"></div>
        <div class="field grow"><label>Ambiente</label>
          <select id="nfeCertAmbiente_${empresaId}"><option value="producao">Produção</option><option value="homologacao">Homologação</option></select>
        </div>
      </div>
      <button class="btn primary" id="btnEnviarNfeCert_${empresaId}">Enviar certificado</button>
    `;
    containerEl.querySelector(`#btnEnviarNfeCert_${empresaId}`).addEventListener('click', async ()=>{
      const arquivo = containerEl.querySelector(`#nfeCertArquivo_${empresaId}`).files[0];
      const senha = containerEl.querySelector(`#nfeCertSenha_${empresaId}`).value;
      const ufAutor = containerEl.querySelector(`#nfeCertUf_${empresaId}`).value.trim().toUpperCase();
      const ambiente = containerEl.querySelector(`#nfeCertAmbiente_${empresaId}`).value;
      if(!arquivo){ toast('Selecione o arquivo .pfx.','err'); return; }
      if(!senha){ toast('Informe a senha do certificado.','err'); return; }
      if(!ufAutor){ toast('Informe a UF.','err'); return; }
      const fd = new FormData();
      fd.append('arquivo', arquivo); fd.append('senha', senha); fd.append('ufAutor', ufAutor); fd.append('ambiente', ambiente); fd.append('empresaId', empresaId);
      const btnEnviar = containerEl.querySelector(`#btnEnviarNfeCert_${empresaId}`);
      btnEnviar.disabled = true; btnEnviar.textContent = 'Enviando e buscando histórico…';
      try{
        const r = await api('/nfe/config', { method:'POST', body:fd });
        const s = r.sync || {};
        if(s.novosNfe || s.novosNfse){
          toast(`Certificado enviado — trouxe ${s.novosNfe||0} NF-e/NFC-e e ${s.novosNfse||0} NFS-e do histórico.`,'ok');
        } else if(s.erroNfe || s.erroNfse){
          toast(`Certificado enviado, mas a busca do histórico falhou: ${s.erroNfe||s.erroNfse}`,'err');
        } else {
          toast('Certificado enviado.','ok');
        }
        renderCertificadoBuscaXml(containerEl, empresaId, empresaUfPadrao, opts);
        if(opts.onDocumentosMudou) opts.onDocumentosMudou();
      }catch(e){ toast(e.message,'err'); btnEnviar.disabled = false; btnEnviar.textContent = 'Enviar certificado'; }
    });
  }
  return cfg;
}
// Resumo somente-leitura pra tela de Busca de XML — sem upload/remover/ativar (isso agora só em
// Empresas → Configurações); mantém só o status e o botão "Buscar agora", que é uma ação do dia a
// dia de quem está olhando os documentos, não de gerenciamento do certificado.
async function renderBuscaXmlResumoCertificado(containerEl, empresaId, empresaNome, opts){
  opts = opts || {};
  const podePostar = can('nfe-busca','postar');
  const { items, moduloAtivo } = await api('/nfe/config');
  if(opts.onModuloStatus) opts.onModuloStatus(moduloAtivo);
  const cfg = items.find(c=>c.empresaId===Number(empresaId));
  if(!cfg){
    containerEl.innerHTML = `<div class="empty-state">Nenhum certificado configurado ainda — envie em Empresas → ${esc(empresaNome||'')} → Configurações.</div>`;
    return cfg;
  }
  containerEl.innerHTML = `
    <div class="slot-locked" style="background:var(--paper);">
      <span class="fname">${esc(cfg.titular||'Certificado configurado')}</span>
      CNPJ do certificado: ${esc(cfg.cnpjCertificado||'—')} · Válido até ${fmtValidade(cfg.validadeAte)} · UF autora: ${esc(cfg.ufAutor)} · Ambiente: ${cfg.ambiente==='homologacao'?'Homologação':'Produção'}
      <br>NF-e/NFC-e — última busca: ${cfg.ultimaBuscaEm?fmtDateHora(cfg.ultimaBuscaEm):'nunca'}${cfg.ultimoErro?` — <span style="color:var(--debit);">${esc(cfg.ultimoErro)}</span>`:''}
      <br>NFS-e — última busca: ${cfg.ultimaBuscaNfseEm?fmtDateHora(cfg.ultimaBuscaNfseEm):'nunca'}${cfg.ultimoErroNfse?` — <span style="color:var(--debit);">${esc(cfg.ultimoErroNfse)}</span>`:''}
      ${!cfg.ativo?`<br><span class="tag muted" style="margin-top:6px;">Busca desativada — ative em Empresas → Configurações.</span>`:''}
    </div>
    <div class="row" style="margin-top:6px; align-items:center;">
      ${podePostar?`<button class="btn primary" id="btnNfeBuscarAgora_${empresaId}" ${(moduloAtivo&&cfg.ativo)?'':'disabled'}>Buscar agora</button>`:''}
      <span style="font-size:12px; color:var(--ink-soft);">Certificado gerenciado em Empresas → Configurações.</span>
    </div>
    <div id="nfeBuscaResultado_${empresaId}" style="margin-top:10px;"></div>
  `;
  if(podePostar) containerEl.querySelector(`#btnNfeBuscarAgora_${empresaId}`).addEventListener('click', async ()=>{
    const btn = containerEl.querySelector(`#btnNfeBuscarAgora_${empresaId}`);
    const resultado = containerEl.querySelector(`#nfeBuscaResultado_${empresaId}`);
    btn.disabled = true; btn.textContent = 'Buscando…';
    resultado.innerHTML = `<div class="empty-state">Consultando a Sefaz e o Sistema Nacional NFS-e…</div>`;
    try{
      const r = await api('/nfe/config/'+empresaId+'/buscar', { method:'POST' });
      const partes = [`${r.novosNfe} NF-e/NFC-e`, `${r.novosNfse} NFS-e`];
      resultado.innerHTML = `<div class="tag ${(r.erroNfe||r.erroNfse)?'bad':'ok'}">${(r.erroNfe||r.erroNfse)?'Concluído com falhas':'Concluído'}</div> <span style="font-size:12.5px;">${partes.join(' · ')} novo(s).</span>
        ${r.erroNfe?`<div style="font-size:12px; color:var(--debit); margin-top:4px;">NF-e/NFC-e: ${esc(r.erroNfe)}</div>`:''}
        ${r.erroNfse?`<div style="font-size:12px; color:var(--debit); margin-top:4px;">NFS-e: ${esc(r.erroNfse)}</div>`:''}`;
      if(opts.onDocumentosMudou) opts.onDocumentosMudou();
    }catch(e){
      resultado.innerHTML = `<div class="tag bad">Falhou</div> <span style="font-size:12.5px;">${esc(e.message)}</span>`;
    }finally{
      btn.disabled = false; btn.textContent = 'Buscar agora';
    }
  });
  return cfg;
}
// Duas telas: lista de empresas (o que já tem certificado configurado ou algum documento) e, ao
// clicar numa delas, o detalhe (certificado + documentos daquela empresa só). Evita jogar tudo solto
// na mesma tela quando o escritório tem várias empresas na Busca de XML.
// Paywall completo pra um módulo do ESCRITÓRIO (diferente do paywall do Cliente — aqui não tem
// "iniciar teste" porque só aparece quando o módulo já venceu/nunca foi contratado; o admin ativa
// direto contratando). Genérico o bastante pra reusar em qualquer tela que dependa de um módulo do
// escritório, não só Busca de XML.
async function escritorioModuloPaywallHtml(chave){
  const { items } = await api('/escritorio/modulos');
  const item = items.find(i=>i.chave===chave);
  if(!item) return '<div class="empty-state">Módulo não encontrado.</div>';
  const preco = fmtMoney(item.valorMensal);
  const titulo = item.status==='teste_vencido' ? 'Seu teste grátis venceu' : (item.status==='vencido' ? 'Assinatura vencida' : 'Módulo não contratado');
  return `
    <div class="card" style="max-width:480px; margin:40px auto; text-align:center; padding:32px;">
      <h3>${esc(titulo)}</h3>
      <p style="color:var(--ink-soft); margin:10px 0 6px;">${esc(item.nome)} — ${preco}/mês</p>
      <p style="color:var(--ink-soft); font-size:12.5px; margin:0 0 20px;">Contrate pra liberar esta tela.</p>
      <button class="btn primary" id="escPaywallPagar" data-chave="${chave}">Pagar agora</button>
      <div id="escPaywallResultado" style="margin-top:16px; text-align:left;"></div>
    </div>
  `;
}
let ESC_PAYWALL_POLL = null;
function ligarEscritorioModuloPaywall(container, chave, aoLiberar){
  if(ESC_PAYWALL_POLL){ clearInterval(ESC_PAYWALL_POLL); ESC_PAYWALL_POLL=null; }
  const btn = container.querySelector('#escPaywallPagar');
  if(!btn) return;
  btn.addEventListener('click', async ()=>{
    const resultado = container.querySelector('#escPaywallResultado');
    btn.disabled = true;
    resultado.innerHTML = `<div class="empty-state">Gerando cobrança…</div>`;
    try{
      const r = await api('/escritorio/modulos/pagar', { method:'POST', body:{ modulos:[chave] } });
      resultado.innerHTML = `
        <div class="card" style="background:var(--paper);">
          ${r.pixImagemBase64?`
            <div style="text-align:center;">
              <img src="data:image/png;base64,${r.pixImagemBase64}" alt="QR Code Pix" style="width:200px; height:200px;">
              <div style="font-size:12px; color:var(--ink-soft); margin:8px 0 4px;">Pix copia e cola</div>
              <input readonly value="${esc(r.pixPayload||'')}" style="width:100%; font-family:'IBM Plex Mono',monospace; font-size:11px; text-align:center;" onclick="this.select()">
            </div>
          `:''}
          ${r.invoiceUrl?`<div style="text-align:center; margin-top:12px;"><a class="btn" href="${esc(r.invoiceUrl)}" target="_blank" rel="noopener">Pagar com cartão de crédito</a></div>`:''}
          <div style="text-align:center; margin-top:12px; font-size:12px; color:var(--ink-soft);">Assim que o pagamento confirmar, a tela libera sozinha.</div>
        </div>
      `;
      ESC_PAYWALL_POLL = setInterval(async ()=>{
        try{
          const { items } = await api('/escritorio/modulos');
          const item = items.find(i=>i.chave===chave);
          if(item && item.status==='ativo'){
            clearInterval(ESC_PAYWALL_POLL); ESC_PAYWALL_POLL=null;
            toast('Pagamento confirmado!','ok');
            aoLiberar();
          }
        }catch(e){ /* ignora falha pontual de rede no polling */ }
      }, 5000);
    }catch(e){ resultado.innerHTML = `<span style="color:var(--debit); font-size:12.5px;">${esc(e.message)}</span>`; btn.disabled=false; }
  });
}
let NFE_TAB = 'configuradas';
async function pageNfeBusca(){

    const visiveis = NFE_TAB==='configuradas' ? configuradas : naoConfiguradas;
    box.innerHTML = `
      <div class="card">
        <div class="tabs">
          <div class="tab" data-tab="configuradas">Empresas Configuradas <span class="tag muted">${configuradas.length}</span></div>
          <div class="tab" data-tab="naoConfiguradas">Empresas Não Configuradas <span class="tag muted">${naoConfiguradas.length}</span></div>
        </div>
        <input type="text" id="nfeListaFiltro" placeholder="Buscar empresa…" style="margin:10px 0 6px;">
        <div style="max-height:420px; overflow-y:auto; overflow-x:hidden; border:1px solid var(--rule); border-radius:8px; padding:4px 10px;">
          ${visiveis.length ? visiveis.map(l=>`
            <div class="nfeEmpresaRow" data-id="${l.id}" data-nome="${esc(normalizaTxt(l.nome))}" style="display:flex; align-items:center; justify-content:space-between; gap:10px; padding:6px 8px; font-size:13px; cursor:pointer; border-bottom:1px solid var(--rule);">
              <span>${esc(l.nome)}</span>
              <span class="tag muted" style="flex:none;">${l.qtd} nota${l.qtd===1?'':'s'}</span>
            </div>
          `).join('') : `<div class="empty-state">${NFE_TAB==='configuradas'?'Nenhuma empresa configurada ainda — envie o certificado dela em Empresas → Configurações.':'Todas as empresas já estão configuradas.'}</div>`}
        </div>
      </div>
    `;
    box.querySelectorAll('.tab').forEach(t=>{
      t.classList.toggle('active', t.dataset.tab===NFE_TAB);
      t.addEventListener('click', ()=>{ NFE_TAB = t.dataset.tab; mostrarLista(); });
    });
    box.querySelectorAll('.nfeEmpresaRow').forEach(row=>row.addEventListener('click', ()=>mostrarDetalhe(Number(row.dataset.id))));
    const filtro = document.getElementById('nfeListaFiltro');
    if(filtro) filtro.addEventListener('input', ()=>{
      const termo = normalizaTxt(filtro.value);
      box.querySelectorAll('.nfeEmpresaRow').forEach(row=>{ row.style.display = row.dataset.nome.includes(termo) ? '' : 'none'; });
    });
  }

  async function mostrarDetalhe(empresaId){
    const empresa = empresas.find(e=>e.id===empresaId);
    let nfeDocDirecao = 'emitida';
    // mostrarLista() já barrou a entrada aqui se o módulo estivesse inativo (paywall antes de
    // chegar no detalhe) — esse callback só cobre o caso raro de o módulo vencer com a tela já
    // aberta; sem handler nenhum, renderCertificadoBuscaXml tentava chamar uma função inexistente
    // (avisoModulo) e quebrava antes de desenhar qualquer coisa, deixando o card do certificado
    // sempre em branco pra qualquer empresa.
    function avisoModulo(moduloAtivo){
      if(!moduloAtivo) toast('O módulo de Busca de XML não está mais ativo pra este escritório.','err');
    }
    box.innerHTML = `
      <button class="btn small" id="btnNfeVoltarLista">← Voltar pra lista de empresas</button>
      <div class="card" style="margin-top:10px;">
        <h3>${esc(empresa?empresa.nome:'Empresa')}</h3>
        <div id="nfeConfigBody"></div>
      </div>
      <div class="card">
        <h3>Documentos</h3>
        <div class="tabs" style="margin-bottom:12px;">
          <div class="tab" data-direcao="emitida">Notas emitidas</div>
          <div class="tab" data-direcao="recebida">Notas recebidas</div>
        </div>
        <div class="row" style="margin-bottom:8px; align-items:flex-end; flex-wrap:wrap;">
          <div class="field grow" style="margin-bottom:0; min-width:260px;"><label>Buscar</label>
            <input id="nfeDocBusca" placeholder="Número da nota, nome, CNPJ ou valor…">
          </div>
          ${dateFieldHtml('nfeDocDataDe','Data de','')}
          ${dateFieldHtml('nfeDocDataAte','Data até','')}
          <div class="field" style="margin-bottom:0; width:180px;"><label>Tipo</label>

          </div>
        </div>
        <div class="row" style="margin-bottom:8px; align-items:center; gap:10px;">
          <span style="font-size:12.5px; color:var(--ink-soft);"><span id="nfeDocSelecionadosCount">0</span> selecionado(s)</span>

      window.open('/api/nfe/documentos/baixar-lote?ids='+ids.join(',')+'&formato='+formato, '_blank');

    document.getElementById('btnNfeBaixarLoteXml').addEventListener('click', ()=>baixarLote('xml'));

      document.querySelectorAll('.nfeDocCheck').forEach(c=>c.addEventListener('change', atualizarBarraSelecao));

    box.querySelectorAll('.tab[data-direcao]').forEach(t=>t.addEventListener('click', ()=>{
      nfeDocDirecao = t.dataset.direcao;
      box.querySelectorAll('.tab[data-direcao]').forEach(x=>x.classList.toggle('active', x===t));

    document.getElementById('nfeDocTipo').addEventListener('change', carregarDocumentos);
    setupDatePicker('nfeDocDataDe','nfeDocDataDe_text');
    setupDatePicker('nfeDocDataAte','nfeDocDataAte_text');
    document.getElementById('nfeDocDataDe').addEventListener('change', carregarDocumentos);
    document.getElementById('nfeDocDataAte').addEventListener('change', carregarDocumentos);
    let nfeDocBuscaTimer = null;
    document.getElementById('nfeDocBusca').addEventListener('input', ()=>{
      clearTimeout(nfeDocBuscaTimer);
      nfeDocBuscaTimer = setTimeout(carregarDocumentos, 350);
    });
    carregarConfig();
    carregarDocumentos();
  }

  mostrarLista();
}

    const body = document.getElementById('icConfigBody');
    body.innerHTML = `
      <div class="row">
        <div class="field"><label>CNPJ do escritório (contratante junto à Loja SERPRO)</label><input id="icCnpj" value="${esc(cfg.cnpj||'')}"></div>
        <div class="field"><label>Consumer Key</label><input id="icConsumerKey" value="${esc(cfg.consumerKey||'')}"></div>
        <div class="field"><label>Consumer Secret</label><input id="icConsumerSecret" type="password" placeholder="${cfg.temConsumerSecret?'••••••••  (deixe em branco pra manter)':''}"></div>
      </div>
      <div class="row">
        <div class="field"><label>Certificado digital do escritório (.pfx) ${cfg.temCertificado?`— atual: <b>${esc(cfg.titularCertificado||'')}</b>${cfg.validadeCertificadoAte?', válido até '+fmtDate(cfg.validadeCertificadoAte):''}`:''}</label><input id="icCertArquivo" type="file" accept=".pfx,.p12"></div>
        <div class="field"><label>Senha do certificado</label><input id="icCertSenha" type="password" placeholder="${cfg.temCertificado?'só necessário se enviar um certificado novo':''}"></div>
      </div>
      <label class="checkbox-row"><input type="checkbox" id="icAtivo" ${cfg.ativo?'checked':''} ${podeEditar?'':'disabled'}> Manter o Integra Contador ativo</label>
      ${cfg.ultimoErro?`<p style="color:var(--debit); font-size:12.5px;">Último erro: ${esc(cfg.ultimoErro)}</p>`:''}
      <div class="row" style="margin-top:8px;">
        ${podeEditar?`<button class="btn primary" id="btnIcSalvarConfig">Salvar</button>`:''}
        ${podePostar?`<button class="btn" id="btnIcTestar" ${cfg.temCertificado&&cfg.consumerKey?'':'disabled'}>Testar conexão</button>`:''}
      </div>
    `;
    if(!podeEditar) body.querySelectorAll('input').forEach(el=>el.disabled=true);
    if(podeEditar) document.getElementById('btnIcSalvarConfig').addEventListener('click', async (ev)=>{
      const btn = ev.target; btn.disabled = true; btn.textContent = 'Salvando…';
      try{
        const fd = new FormData();
        fd.append('cnpj', document.getElementById('icCnpj').value.trim());
        fd.append('consumerKey', document.getElementById('icConsumerKey').value.trim());
        const secret = document.getElementById('icConsumerSecret').value;
        if(secret) fd.append('consumerSecret', secret);
        fd.append('ativo', document.getElementById('icAtivo').checked);
        const arquivo = document.getElementById('icCertArquivo').files[0];
        const senha = document.getElementById('icCertSenha').value;
        if(arquivo){ fd.append('certificado', arquivo); fd.append('senhaCertificado', senha); }
        await api('/integracontador/config', { method:'PUT', body: fd });
        toast('Configuração salva.','ok');
        await renderIcConfig();
        avisoIc(document.getElementById('icAtivo').checked);
      }catch(e){ toast(e.message,'err'); }
      finally{ btn.disabled = false; btn.textContent = 'Salvar'; }
    });
    const btnTestar = document.getElementById('btnIcTestar');
    if(btnTestar) btnTestar.addEventListener('click', async ()=>{
      btnTestar.disabled = true; btnTestar.textContent = 'Testando…';
      try{
        await api('/integracontador/config/testar', { method:'POST' });
        toast('Conexão validada com sucesso.','ok');
      }catch(e){ toast(e.message,'err'); }
      finally{ btnTestar.disabled = false; btnTestar.textContent = 'Testar conexão'; }
    });
  }

  async function mostrarIcDetalhe(empresaId){
    const box = document.getElementById('icMain');
    const { items } = await api('/integracontador/empresas');
    const emp = items.find(e=>e.id===empresaId);
    box.innerHTML = `
      <button class="btn small" id="btnIcVoltarLista">← Voltar pra lista de empresas</button>
      <div class="card" style="margin-top:10px;">
        <h3>${esc(emp?emp.nome:'Empresa')}</h3>
        <label class="checkbox-row"><input type="checkbox" id="icEmpAtivo" ${emp?.ativo?'checked':''} ${podeEditar?'':'disabled'}> Buscar dados desta empresa</label>
        <label class="checkbox-row"><input type="checkbox" id="icEmpOptante" ${emp?.optanteSimplesNacional?'checked':''} ${podeEditar?'':'disabled'}> Optante do Simples Nacional (habilita DAS e Declaração — Situação Fiscal vale pra qualquer regime)</label>
        <p style="font-size:12.5px; color:var(--ink-soft); margin:6px 0 0;">Última busca: <span id="icUltimaBusca">${emp?.ultimaBuscaEm?fmtDateHora(emp.ultimaBuscaEm):'nunca buscado'}</span></p>
        ${emp?.alertaDeclaracao?`<div class="card" style="background:var(--paper); border-color:var(--warn, #c9a227); margin:8px 0;"><span style="font-size:12.5px;">⚠ ${esc(emp.alertaDeclaracao)}</span></div>`:''}
        ${emp?.ultimoErro?`<p style="color:var(--debit); font-size:12.5px;">Último erro: ${esc(emp.ultimoErro)}</p>`:''}
        <div class="row" style="margin-top:8px;">
          ${podeEditar?`<button class="btn primary" id="btnIcSalvarEmpresa">Salvar</button>`:''}
          ${podePostar?`<button class="btn" id="btnIcBuscarAgora" ${emp?.ativo?'':'disabled'}>Buscar agora</button>`:''}
        </div>
      </div>
      <div class="card">
        <div class="row" style="justify-content:space-between; align-items:center;">
          <h3 style="margin:0;">Parcelamentos</h3>
          ${podePostar?`<button class="btn small" id="btnIcVincularParc">+ Vincular parcelamento</button>`:''}
        </div>
        <p style="font-size:12.5px; color:var(--ink-soft); margin:4px 0 8px;">Parcelamentos do Simples Nacional (PARCSN) já concedidos e vinculados — as guias de cada parcela são buscadas e anexadas automaticamente em Envio de Documentos todo mês.</p>
        <div id="icParcBody"><div class="empty-state">Carregando…</div></div>
      </div>
      <div class="card">
        <h3>Documentos</h3>
        <div class="card" style="padding:0; overflow-x:auto;">
          <table class="data-table">
            <thead><tr><th>Tipo</th><th>Período</th><th>Número</th><th>Vencimento</th><th>Recebido em</th><th></th></tr></thead>
            <tbody id="icDocBody"><tr><td colspan="6"><div class="empty-state">Carregando…</div></td></tr></tbody>
          </table>
        </div>
      </div>
    `;
    document.getElementById('btnIcVoltarLista').addEventListener('click', mostrarIcLista);
    if(podePostar) document.getElementById('btnIcVincularParc').addEventListener('click', ()=>{
      vincularParcelamentoModal(empresaId, emp?emp.nome:'Empresa', null, carregarIcParcelamentos);
    });
    async function carregarIcParcelamentos(){
      const wrap = document.getElementById('icParcBody');
      wrap.innerHTML = `<div class="empty-state">Carregando…</div>`;
      const { items: parcs } = await api('/integracontador/parcelamentos?empresaId='+empresaId);
      if(!parcs.length){ wrap.innerHTML = `<div class="empty-state">Nenhum parcelamento vinculado ainda.</div>`; return; }
      wrap.innerHTML = `
        <table class="data-table">
          <thead><tr><th>Número</th><th>Situação</th><th>Valor total</th><th>Parcelas</th><th>Valor da parcela</th><th>Última busca</th><th>Status</th><th></th></tr></thead>
          <tbody>
            ${parcs.map(p=>`
              <tr>
                <td><b>${esc(p.numero)}</b></td>
                <td>${esc(p.situacao||'—')}</td>
                <td>${p.valorTotalConsolidado!=null?fmtMoney(p.valorTotalConsolidado):'—'}</td>
                <td>${p.quantidadeParcelas!=null?p.quantidadeParcelas:'—'}</td>
                <td>${p.valorParcelaBasica!=null?fmtMoney(p.valorParcelaBasica):'—'}</td>
                <td>${p.ultimaBuscaEm?fmtDateHora(p.ultimaBuscaEm):'—'}${p.ultimoErro?`<br><span style="color:var(--debit); font-size:11px;">${esc(p.ultimoErro)}</span>`:''}</td>
                <td><span class="tag ${p.ativo?'ok':'muted'}">${p.ativo?'Ativo':'Encerrado'}</span></td>
                <td style="text-align:right; white-space:nowrap;">
                  ${podePostar?`<button class="btn small" data-act="parc-atualizar" data-numero="${p.numero}">Atualizar</button>`:''}
                  ${podeEditar?`<button class="btn small" data-act="parc-toggle" data-id="${p.id}" data-ativo="${p.ativo?1:0}">${p.ativo?'Encerrar':'Reativar'}</button>`:''}
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
      wrap.querySelectorAll('[data-act="parc-atualizar"]').forEach(b=>b.addEventListener('click', async ()=>{
        b.disabled = true; b.textContent = 'Atualizando…';
        try{
          await api('/integracontador/parcelamentos', { method:'POST', body:{ empresaId, numeroParcelamento:Number(b.dataset.numero) } });
          toast('Parcelamento atualizado.','ok');
          carregarIcParcelamentos();
        }catch(e){ toast(e.message,'err'); b.disabled=false; b.textContent='Atualizar'; }
      }));
      wrap.querySelectorAll('[data-act="parc-toggle"]').forEach(b=>b.addEventListener('click', async ()=>{
        const ativoAgora = b.dataset.ativo==='1';
        if(ativoAgora && !confirmar('Encerrar este parcelamento? A busca automática para de tentar emitir parcela nova pra ele.')) return;
        try{
          await api('/integracontador/parcelamentos/'+b.dataset.id+'/ativo', { method:'PUT', body:{ ativo: !ativoAgora } });
          toast(ativoAgora?'Parcelamento encerrado.':'Parcelamento reativado.','ok');
          carregarIcParcelamentos();
        }catch(e){ toast(e.message,'err'); }
      }));
    }
    carregarIcParcelamentos();
    // A busca de Situação Fiscal sozinha já pode passar de 1 minuto (fica reconsultando a Receita
    // até o relatório ficar pronto) — tempo suficiente pro proxy do Railway devolver um erro 502 pro
    // navegador mesmo quando a busca deu certo do lado do servidor. Por isso o backend não segura a
    // resposta esperando terminar: dispara em segundo plano, e aqui a tela fica reconsultando até
    // "ultimaBuscaEm" mudar, sem travar o botão o tempo todo nem depender do request original.
    // O backend só desiste de verdade depois de 5 minutos (INTEGRACONTADOR_TIMEOUT_BUSCA_MS) — o
    // poll aqui precisa cobrir essa janela inteira, senão a tela desiste antes da hora e mostra
    // "ainda em andamento" numa busca que só estava demorando (SITFIS pode reconsultar a Receita
    // várias vezes até o relatório ficar pronto).
    async function esperarIcBuscaTerminar(ultimaBuscaAntes){
      for(let i=0;i<80;i++){
        await new Promise(r=>setTimeout(r, 4000));
        const { items } = await api('/integracontador/empresas');
        const atualizado = items.find(e=>e.id===empresaId);
        if(atualizado && atualizado.ultimaBuscaEm !== ultimaBuscaAntes) return atualizado;
      }
      return null;
    }
    if(podeEditar) document.getElementById('btnIcSalvarEmpresa').addEventListener('click', async (ev)=>{
      const btn = ev.target; btn.disabled = true; btn.textContent = 'Salvando…';
      try{
        const ultimaBuscaAntes = emp?.ultimaBuscaEm || null;
        const body = { ativo: document.getElementById('icEmpAtivo').checked, optanteSimplesNacional: document.getElementById('icEmpOptante').checked };
        const r = await api('/integracontador/empresas/'+empresaId, { method:'PUT', body });
        if(r.buscaIniciada){
          toast('Salvo — buscando dados em segundo plano…','ok');
          btn.textContent = 'Buscando…';
          const atualizado = await esperarIcBuscaTerminar(ultimaBuscaAntes);
          if(atualizado) toast(atualizado.ultimoErro ? 'Busca terminou com erro: '+atualizado.ultimoErro : 'Busca concluída.', atualizado.ultimoErro?'err':'ok');
          else toast('Busca ainda em andamento — confira em alguns instantes.','ok');
        } else toast('Salvo.','ok');
        mostrarIcDetalhe(empresaId);
        carregarIcDocumentos();
      }catch(e){ toast(e.message,'err'); }
      finally{ btn.disabled = false; btn.textContent = 'Salvar'; }
    });
    if(podePostar) document.getElementById('btnIcBuscarAgora').addEventListener('click', async (ev)=>{
      const btn = ev.target; btn.disabled = true; btn.textContent = 'Buscando…';
      try{
        const ultimaBuscaAntes = emp?.ultimaBuscaEm || null;
        await api('/integracontador/empresas/'+empresaId+'/buscar', { method:'POST' });
        const atualizado = await esperarIcBuscaTerminar(ultimaBuscaAntes);
        if(atualizado){
          toast(atualizado.ultimoErro ? 'Busca terminou com erro: '+atualizado.ultimoErro : 'Busca concluída.', atualizado.ultimoErro?'err':'ok');
          document.getElementById('icUltimaBusca').textContent = fmtDateHora(atualizado.ultimaBuscaEm);
        } else toast('Busca ainda em andamento — confira em alguns instantes.','ok');
        carregarIcDocumentos();
      }catch(e){ toast(e.message,'err'); }
      finally{ btn.disabled = false; btn.textContent = 'Buscar agora'; }
    });

    async function carregarIcDocumentos(){
      const tbody = document.getElementById('icDocBody');
      tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state">Carregando…</div></td></tr>`;
      const { items: docs } = await api('/integracontador/documentos?empresaId='+empresaId);
      tbody.innerHTML = docs.length ? docs.map(d=>`
        <tr>
          <td>${esc(IC_TIPO_LABEL[d.tipo]||d.tipo)}</td>
          <td>${esc(d.periodoApuracao||'—')}</td>
          <td>${esc(d.numeroDocumento||'—')}</td>
          <td>${d.dataVencimento?fmtDate(d.dataVencimento):'—'}</td>
          <td>${fmtDateHora(d.criadoEm)}</td>
          <td style="text-align:right;">${d.temPdf?`<a class="btn small" href="/api/integracontador/documentos/${d.id}/pdf" target="_blank" rel="noopener">PDF</a>`:'—'}</td>
        </tr>
      `).join('') : '<tr><td colspan="6"><div class="empty-state">Nenhum documento encontrado ainda.</div></td></tr>';
    }
    carregarIcDocumentos();
  }
}

// ===================== NFS-e self-service (perfil Cliente) =====================
// Bloqueio de acesso por módulo — teste grátis de 3 dias ou assinatura paga (Asaas). Reaproveitado
// pelas telas de NFS-e e Financeiro (A Receber/A Pagar) do perfil Cliente.
async function moduloDaChave(chave){
  const { items } = await api('/financeiro/minha-empresa/modulos');
  return items.find(i=>i.chave===chave);
}
function moduloPaywallHtml(item){
  const preco = fmtMoney(item.valorMensal);
  let titulo, texto, botaoHtml;
  if(item.status==='nao_contratado'){
    titulo = 'Você ainda não contratou este módulo';
    texto = `Teste grátis por 3 dias, sem compromisso. Depois do teste, ${preco}/mês.`;
    botaoHtml = `<button class="btn primary" id="paywallAcao" data-acao="testar" data-chave="${item.chave}">Iniciar teste grátis de 3 dias</button>`;
  } else if(item.status==='teste_vencido'){
    titulo = 'Seu teste grátis venceu';
    texto = `Contrate este módulo por ${preco}/mês pra continuar usando.`;
    botaoHtml = `<button class="btn primary" id="paywallAcao" data-acao="assinatura">Ir para Assinatura</button>`;
  } else {
    titulo = 'Assinatura vencida';
    texto = `Renove este módulo por ${preco}/mês pra continuar usando.`;
    botaoHtml = `<button class="btn primary" id="paywallAcao" data-acao="assinatura">Ir para Assinatura</button>`;
  }
  return `
    <div class="card" style="max-width:480px; margin:60px auto; text-align:center; padding:32px;">
      <h3>${esc(titulo)}</h3>
      <p style="color:var(--ink-soft); margin:10px 0 20px;">${esc(texto)}</p>
      ${botaoHtml}
    </div>
  `;
}
function ligarModuloPaywall(box, aoLiberar){
  const btn = box.querySelector('#paywallAcao');
  if(!btn) return;
  btn.addEventListener('click', async ()=>{
    if(btn.dataset.acao==='assinatura'){ goPage('minha-assinatura'); return; }
    try{
      await api('/financeiro/minha-empresa/modulos/'+btn.dataset.chave+'/iniciar-teste', { method:'POST' });
      toast('Teste iniciado! Você tem 3 dias de acesso completo.','ok');
      aoLiberar();
    }catch(e){ toast(e.message,'err'); }
  });
}

  }
  ligarMascaraMoeda(document.getElementById('mnfEmiValor'));

      toast(e.message,'err');
    }
  });

    const boxes = [...box.querySelectorAll('.mnfNotaSel')];
    selAll.checked = boxes.length>0 && boxes.every(b=>b.checked);
    selAll.indeterminate = boxes.some(b=>b.checked) && !selAll.checked;

  box.querySelectorAll('.mnfNotaSel').forEach(b=>b.addEventListener('change', ()=>{
    const id = Number(b.dataset.id);

  `);

// Modal de lançamento manual, compartilhado entre Receber e Pagar — os campos são quase iguais,
// só muda o rótulo "Cliente"/"Fornecedor" e a rota da API.
async function minhaFinLancamentoModal(tipo, item){
  const ehReceber = tipo==='receber';
  const rota = ehReceber ? '/financeiro/minha-empresa/receber' : '/financeiro/minha-empresa/pagar';
  const rotuloTerceiro = ehReceber ? 'Cliente' : 'Fornecedor';
  const campoTerceiro = ehReceber ? 'clienteNome' : 'fornecedor';
  const valorTerceiro = item ? (ehReceber? item.clienteNome : item.fornecedor) : '';
  const travado = ehReceber && item && item.origem==='nfse';
  const contas = await minhaFinContasCache();
  openModal(`
    <h3>${item?'Editar':'Novo'} lançamento — ${ehReceber?'a receber':'a pagar'}</h3>
    ${travado?`<p style="font-size:12px; color:var(--ink-soft); margin:-4px 0 10px;">Este recebível veio de uma NFS-e emitida — descrição, ${rotuloTerceiro.toLowerCase()} e valor ficam travados.</p>`:''}
    <div class="field"><label>Descrição</label><input id="mflDescricao" value="${item?esc(item.descricao):''}" ${travado?'readonly style="background:var(--paper);"':''}></div>
    <div class="field"><label>${rotuloTerceiro} (opcional)</label><input id="mflTerceiro" value="${valorTerceiro?esc(valorTerceiro):''}" ${travado?'readonly style="background:var(--paper);"':''}></div>
    <div class="row">
      <div class="field" style="width:160px;"><label>Valor (R$)</label><input id="mflValor" type="number" step="0.01" min="0" value="${item?item.valor:''}" ${travado?'readonly style="background:var(--paper);"':''}></div>
      <div class="field" style="width:170px;">${dateFieldHtml('mflVencimento','Vencimento', item?item.vencimento:'')}</div>
    </div>
    <div class="field"><label>Conta (${ehReceber?'onde recebeu':'de onde pagou'}, opcional)</label>${contaSelectHtml('mflConta', contas, item?item.contaId:null)}</div>
    ${item?`<div class="field"><label>Status</label>
      <select id="mflStatus">
        <option value="pendente" ${item.status==='pendente'?'selected':''}>Pendente</option>
        <option value="${ehReceber?'pago':'pago'}" ${item.status==='pago'?'selected':''}>${ehReceber?'Recebido':'Pago'}</option>
        <option value="atrasado" ${item.status==='atrasado'?'selected':''}>Atrasado</option>
        <option value="cancelado" ${item.status==='cancelado'?'selected':''}>Cancelado</option>
      </select>
    </div>`:''}
    <div class="field"><label>Observação (opcional)</label><textarea id="mflObs" rows="2">${item&&item.observacao?esc(item.observacao):''}</textarea></div>
    <div class="modal-actions">
      <button class="btn" id="mflCancel">Cancelar</button>
      <button class="btn primary" id="mflSalvar">Salvar</button>
    </div>
  `);
  setupDatePicker('mflVencimento','mflVencimento_text');
  document.getElementById('mflCancel').addEventListener('click', closeModal);
  document.getElementById('mflSalvar').addEventListener('click', async ()=>{
    const descricao = document.getElementById('mflDescricao').value.trim();
    const valor = Number(document.getElementById('mflValor').value);
    const vencimento = document.getElementById('mflVencimento').value;
    if(!descricao || !valor || !vencimento){ toast('Preencha a descrição, o valor e o vencimento.','err'); return; }
    const contaVal = document.getElementById('mflConta').value;
    const body = { descricao, valor, vencimento, observacao: document.getElementById('mflObs').value.trim(), contaId: contaVal?Number(contaVal):null };
    body[campoTerceiro] = document.getElementById('mflTerceiro').value.trim();
    if(item) body.status = document.getElementById('mflStatus').value;
    try{
      if(item) await api(rota+'/'+item.id, { method:'PUT', body });
      else await api(rota, { method:'POST', body });
      closeModal();
      toast('Lançamento salvo.','ok');
      if(ehReceber) renderMinhaFinReceber(); else renderMinhaFinPagar();
    }catch(e){ toast(e.message,'err'); }
  });
}

// ===================== Minha Assinatura (Colaborador) =====================
// Diferente da tela do Cliente: quem paga de verdade é o escritório (cobrança agregada em
// Configurações > Assinatura, vista só pelo Administrador) — essa tela é só informativa, mostra pro
// próprio colaborador se o assento dele está isento ou incluído na cobrança.
async function pageMinhaAssinaturaColaborador(){
  const info = await api('/colaborador/minha-assinatura');
  let badgeClass='muted', badgeText='—', texto='';
  if(info.isento){
    badgeClass='ok'; badgeText='Isento';
    texto = 'Você não entra na contagem de assentos cobrados do escritório.';
  } else if(info.status==='ativo'){
    badgeClass='ok'; badgeText='Incluído na assinatura';
    texto = `Seu assento está ativo${info.assinaturaAtivaAte?(' até '+fmtDateIso(String(info.assinaturaAtivaAte).slice(0,10))):''}.`;
  } else if(info.status==='teste'){

let ASSINATURA_POLL = null;
function assinaturaModuloCardHtml(item){
  let badgeClass='muted', badgeText='Não contratado';
  // Contas migradas antes de existir o controle de teste/assinatura ganharam acesso liberado "pra
  // sempre" (ver migração de compatibilidade em src/server.ts) — uma data 100 anos no futuro é só
  // um jeito de representar isso no banco, não deve aparecer literalmente pro cliente.
  const dataAssinatura = item.assinaturaAtivaAte ? new Date(String(item.assinaturaAtivaAte).replace(' ','T')) : null;
  const semVencimento = dataAssinatura && (dataAssinatura.getTime() - Date.now()) > 1000*60*60*24*365*3;
  if(item.status==='isento'){ badgeClass='ok'; badgeText='Isento (cortesia)'; }
  else if(item.status==='teste'){ badgeClass='ok'; badgeText='Em teste até '+fmtDateHora(item.trialFim); }
  else if(item.status==='teste_vencido'){ badgeClass='bad'; badgeText='Teste grátis vencido'; }
  else if(item.status==='ativo'){ badgeClass='ok'; badgeText = semVencimento ? 'Ativo' : 'Ativo até '+fmtDateIso(String(item.assinaturaAtivaAte||'').slice(0,10)); }
  else if(item.status==='vencido'){ badgeClass='bad'; badgeText='Assinatura vencida'; }
  const mostraBotaoTeste = item.status==='nao_contratado';
  const rotuloCheckbox = item.status==='ativo' ? 'Incluir no pagamento (renovar antecipado)' : 'Incluir no pagamento';
  return `
    <div class="card" style="margin-bottom:10px;">
      <div class="row" style="justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
        <div>
          <div style="font-weight:600;">${esc(item.nome)}</div>
          <div style="font-size:12.5px; color:var(--ink-soft);">${item.quantidade!=null?`${item.quantidade} × ${fmtMoney(item.valorUnitario)} = `:''}${fmtMoney(item.valorMensal)}/mês</div>
        </div>
        <div style="display:flex; align-items:center; gap:14px;">
          <span class="tag ${badgeClass}">${esc(badgeText)}</span>
          ${item.status==='isento' ? '' : `
            ${mostraBotaoTeste?`<button class="btn small" data-acao="testar" data-chave="${item.chave}">Iniciar teste grátis</button>`:''}
            <label class="checkbox-row" style="margin:0;"><input type="checkbox" class="assinaturaCheck" data-chave="${item.chave}" data-valor="${item.valorMensal}" data-nome="${esc(item.nome)}"> ${rotuloCheckbox}</label>
          `}
        </div>
      </div>
    </div>
  `;
}
async function renderMinhaAssinatura(){
  if(ASSINATURA_POLL){ clearInterval(ASSINATURA_POLL); ASSINATURA_POLL=null; }
  const { items } = await api('/financeiro/minha-empresa/modulos');
  const box = document.getElementById('assinaturaContent');
  box.innerHTML = `
    ${items.map(assinaturaModuloCardHtml).join('')}
    <div class="card" style="margin-top:14px;">
      <div class="row" style="justify-content:space-between; align-items:center;">
        <div>Total selecionado: <b id="assinaturaTotal">${fmtMoney(0)}</b></div>
        <button class="btn primary" id="btnPagarAssinatura" disabled>Pagar agora</button>
      </div>
      <div id="assinaturaPagamentoResultado" style="margin-top:12px;"></div>
    </div>
  `;
  box.querySelectorAll('[data-acao="testar"]').forEach(b=>b.addEventListener('click', async ()=>{
    try{
      await api('/financeiro/minha-empresa/modulos/'+b.dataset.chave+'/iniciar-teste', { method:'POST' });
      toast('Teste iniciado! Você tem 3 dias de acesso completo.','ok');
      renderMinhaAssinatura();
    }catch(e){ toast(e.message,'err'); }
  }));
  const btnPagar = document.getElementById('btnPagarAssinatura');
  function recomputarTotal(){
    const marcados = [...box.querySelectorAll('.assinaturaCheck:checked')];
    const total = marcados.reduce((soma,c)=>soma+Number(c.dataset.valor),0);
    document.getElementById('assinaturaTotal').textContent = fmtMoney(total);
    btnPagar.disabled = marcados.length===0;
  }
  box.querySelectorAll('.assinaturaCheck').forEach(c=>c.addEventListener('change', recomputarTotal));
  btnPagar.addEventListener('click', async ()=>{
    const chaves = [...box.querySelectorAll('.assinaturaCheck:checked')].map(c=>c.dataset.chave);
    if(!chaves.length) return;
    const resultado = document.getElementById('assinaturaPagamentoResultado');
    resultado.innerHTML = `<div class="empty-state">Gerando cobrança…</div>`;
    try{
      const r = await api('/financeiro/minha-empresa/modulos/pagar', { method:'POST', body:{ modulos: chaves } });
      resultado.innerHTML = `
        <div class="card" style="background:var(--paper);">
          ${r.pixImagemBase64?`
            <div style="text-align:center;">
              <img src="data:image/png;base64,${r.pixImagemBase64}" alt="QR Code Pix" style="width:200px; height:200px;">
              <div style="font-size:12px; color:var(--ink-soft); margin:8px 0 4px;">Pix copia e cola</div>
              <input readonly value="${esc(r.pixPayload||'')}" style="width:100%; font-family:'IBM Plex Mono',monospace; font-size:11px; text-align:center;" onclick="this.select()">
            </div>
          `:''}
          ${r.invoiceUrl?`<div style="text-align:center; margin-top:12px;"><a class="btn primary" href="${esc(r.invoiceUrl)}" target="_blank" rel="noopener">Pagar com cartão de crédito</a></div>`:''}
          <div style="text-align:center; margin-top:12px; font-size:12px; color:var(--ink-soft);">Assim que o pagamento confirmar, o acesso libera sozinho aqui.</div>
        </div>
      `;
      ASSINATURA_POLL = setInterval(async ()=>{
        try{
          const { items: atualizados } = await api('/financeiro/minha-empresa/modulos');
          const todosLiberados = chaves.every(ch=>{ const m=atualizados.find(i=>i.chave===ch); return m && m.status==='ativo'; });
          if(todosLiberados){
            clearInterval(ASSINATURA_POLL); ASSINATURA_POLL=null;
            toast('Pagamento confirmado!','ok');
            renderMinhaAssinatura();
          }
        }catch(e){ /* ignora falha pontual de rede no polling */ }
      }, 5000);
    }catch(e){
      resultado.innerHTML = `<div class="slot-locked" style="background:var(--paper); border-color:var(--debit);"><span class="fname">Não consegui gerar a cobrança</span>${esc(e.message)}</div>`;
    }
  });
}

function setupRte(toolbarEl, bodyEl){
  toolbarEl.querySelectorAll('button[data-cmd]').forEach(b=>b.addEventListener('click', ()=>{
    bodyEl.focus();
    document.execCommand(b.dataset.cmd, false, b.dataset.val||null);
  }));
  const btnImagem = toolbarEl.querySelector('button[data-acao="imagem"]');
  if(btnImagem){
    const inputArquivo = document.createElement('input');
    inputArquivo.type = 'file'; inputArquivo.accept = 'image/*'; inputArquivo.style.display = 'none';
    btnImagem.after(inputArquivo);
    btnImagem.addEventListener('click', ()=> inputArquivo.click());
    inputArquivo.addEventListener('change', ()=>{
      const arquivo = inputArquivo.files[0];
      if(!arquivo) return;
      const leitor = new FileReader();
      leitor.onload = ()=>{ bodyEl.focus(); document.execCommand('insertImage', false, leitor.result); };
      leitor.readAsDataURL(arquivo);
      inputArquivo.value = '';
    });
  }
}

async function abrirContratoDrawer(id){

  const dados = c.dadosPreenchidos || {};
  openDrawer(`
    <div class="drawer-header">
      <h3>${esc(c.titulo)}</h3>
      <button class="btn small" id="drwFechar">Fechar</button>
    </div>
    <div class="drawer-body">
      ${c.tipo==='aditivo'?`<p style="font-size:12.5px; color:var(--ink-soft); margin-top:-6px;">Aditivo ao contrato: <b>${esc(c.contratoPaiTitulo||'')}</b></p>`:''}
      ${c.tipo==='distrato'?`<p style="font-size:12.5px; color:var(--ink-soft); margin-top:-6px;">Distrato do contrato: <b>${esc(c.contratoPaiTitulo||'')}</b></p>`:''}
      <div class="field"><label>Título</label><input id="drwTitulo" value="${esc(c.titulo)}"></div>
      ${campos.length?`
        <div class="card" style="background:var(--paper); margin-bottom:16px;">
          <div style="font-size:12px; color:var(--ink-soft); margin-bottom:8px;">Dados do contrato</div>
          <div class="campos-grid">
            ${campos.map(f=>`<div class="field"><label>${esc(f.rotulo)}</label><input class="drwCampo" data-chave="${esc(f.chave)}" value="${esc(dados[f.chave]||'')}"></div>`).join('')}
          </div>
          <button class="btn small" id="drwAplicarCampos">Aplicar no documento</button>
        </div>
      `:''}
      ${rteToolbarHtml()}
      <div class="rte-body" id="drwCorpo" contenteditable="true">${c.conteudoHtml}</div>
    </div>
    <div class="drawer-footer">
      <div id="drwEmailForm" style="display:none; width:100%; margin-bottom:8px;"></div>
      <button class="btn" id="drwRascunho">Salvar como rascunho</button>
      <button class="btn primary" id="drwSalvar">Salvar</button>
      <button class="btn" id="drwPdf">Baixar PDF</button>
      <button class="btn" id="drwEmail">Enviar por e-mail</button>
      ${c.tipo==='contrato'?`<button class="btn" id="drwAditivo">Criar aditivo</button><button class="btn" id="drwDistrato">Criar distrato</button>`:''}
    </div>
  `);
  const toolbar = document.querySelector('#drawerBody .rte-toolbar');
  const corpo = document.getElementById('drwCorpo');
  setupRte(toolbar, corpo);
  document.getElementById('drwFechar').addEventListener('click', closeDrawer);
  const salvarComStatus = async (status)=>{
    try{
      await api('/contratos/'+id, { method:'PUT', body:{ titulo: document.getElementById('drwTitulo').value.trim(), conteudoHtml: corpo.innerHTML, status } });
      toast('Salvo.','ok');
      renderContratosLista();
    }catch(e){ toast(e.message,'err'); }
  };
  document.getElementById('drwRascunho').addEventListener('click', ()=>salvarComStatus('rascunho'));
  document.getElementById('drwSalvar').addEventListener('click', ()=>salvarComStatus('ativo'));
  document.getElementById('drwPdf').addEventListener('click', ()=>{
    window.open('/api/contratos/'+id+'/pdf', '_blank');
  });
  const emailForm = document.getElementById('drwEmailForm');
  document.getElementById('drwEmail').addEventListener('click', ()=>{
    if(emailForm.style.display==='none'){
      emailForm.style.display='block';
      emailForm.innerHTML = `
        <div class="row">
          <input id="drwEmailDestino" style="flex:1;" placeholder="E-mail do destinatário" value="${esc(c.empresaEmail||'')}">
          <button class="btn primary small" id="drwEmailEnviar">Enviar</button>
        </div>
      `;
      document.getElementById('drwEmailEnviar').addEventListener('click', async ()=>{
        const destino = document.getElementById('drwEmailDestino').value.trim();
        if(!destino){ toast('Informe o e-mail.','err'); return; }
        try{
          await api('/contratos/'+id+'/enviar-email', { method:'POST', body:{ email: destino } });
          toast('E-mail enviado.','ok');
          emailForm.style.display='none';
        }catch(e){ toast(e.message,'err'); }
      });
    } else {
      emailForm.style.display='none';
    }
  });
  if(campos.length){
    document.getElementById('drwAplicarCampos').addEventListener('click', async ()=>{
      const novosDados = {};
      document.querySelectorAll('.drwCampo').forEach(inp=>novosDados[inp.dataset.chave]=inp.value);
      // {{dia}}/{{mes}}/{{ano}} são automáticos (data de hoje) — só não sobrescreve se o admin já
      // tiver digitado algo manualmente nesses campos.
      const hoje = new Date();
      if(!novosDados['dia']) novosDados['dia'] = String(hoje.getDate());
      if(!novosDados['mes']) novosDados['mes'] = MESES_PT_EXTENSO_JS[hoje.getMonth()];
      if(!novosDados['ano']) novosDados['ano'] = String(hoje.getFullYear());
      // {{vlr_extenso}} é calculado a partir de {{valor_honorário}} — só busca se o campo existir
      // no modelo e o admin já tiver digitado um valor.
      if(!novosDados['vlr_extenso'] && novosDados['valor_honorário']){
        try{
          const r = await api('/contratos/valor-extenso', { method:'POST', body:{ valor: novosDados['valor_honorário'] } });
          novosDados['vlr_extenso'] = r.extenso;
        }catch(e){ toast('Não consegui calcular o valor por extenso: '+e.message,'err'); }
      }
      let html = corpo.innerHTML;
      Object.keys(novosDados).forEach(chave=>{
        const valor = novosDados[chave];
        if(valor) html = html.split('{{'+chave+'}}').join(esc(valor));
      });
      corpo.innerHTML = html;
      toast('Dados aplicados no documento.','ok');
    });
  }
  if(c.tipo==='contrato'){
    document.getElementById('drwAditivo').addEventListener('click', ()=>novoAditivoModal(id));
    document.getElementById('drwDistrato').addEventListener('click', ()=>criarDistrato(id));
  }
}
async function criarDistrato(contratoId){

  try{
    const r = await api('/contratos/'+contratoId+'/distrato', { method:'POST' });
    toast('Distrato criado.','ok');
    abrirContratoDrawer(r.id);
  }catch(e){ toast(e.message,'err'); }
}

function contratoModeloDrawer(m){
  openDrawer(`

    </div>
    <div class="modal-actions" style="padding:16px 24px; border-top:1px solid var(--line);">
      <button class="btn primary" id="cmSalvar">Salvar modelo</button>
    </div>
  `);
  const lista = document.getElementById('cmCamposList');
  function ligarRemover(){
    lista.querySelectorAll('.cmRemover').forEach(b=>b.addEventListener('click', ()=>{ b.closest('.cmCampoRow').remove(); }));
  }
  ligarRemover();
  document.getElementById('cmAddCampo').addEventListener('click', ()=>{
    lista.insertAdjacentHTML('beforeend', contratoModeloCampoRowHtml());
    ligarRemover();
  });
  const toolbar = document.querySelector('#drawerBody .rte-toolbar');
  const corpo = document.getElementById('cmCorpo');
  setupRte(toolbar, corpo);
  document.getElementById('cmFechar').addEventListener('click', closeDrawer);
  document.getElementById('cmCarregarDocx').addEventListener('click', async ()=>{
    const arquivo = document.getElementById('cmArquivoDocx').files[0];
    if(!arquivo){ toast('Selecione um arquivo .docx.','err'); return; }
    const fd = new FormData(); fd.append('arquivo', arquivo);
    try{
      const r = await api('/contratos/modelos/importar-docx', { method:'POST', body:fd });
      corpo.innerHTML = r.html;
      toast('Arquivo carregado — revise o texto e insira os campos onde precisar.','ok');
    }catch(e){ toast(e.message,'err'); }
  });
  document.getElementById('cmSalvar').addEventListener('click', async ()=>{
    const nome = document.getElementById('cmNome').value.trim();
    if(!nome){ toast('Informe o nome do modelo.','err'); return; }
    const campos = [...lista.querySelectorAll('.cmCampoRow')].map(row=>({
      chave: row.querySelector('.cmChave').value.trim(),
      rotulo: row.querySelector('.cmRotulo').value.trim(),
      autoPreencherDe: row.querySelector('.cmAuto').value || null,
    })).filter(c=>c.chave && c.rotulo);
    const body = { nome, conteudoHtml: corpo.innerHTML, campos };
    if(m) body.ativo = document.getElementById('cmAtivo').checked;
    try{
      if(m) await api('/contratos/modelos/'+m.id, { method:'PUT', body });
      else await api('/contratos/modelos', { method:'POST', body });
      closeDrawer();
      toast('Modelo salvo.','ok');
      renderContratosModelos();
    }catch(e){ toast(e.message,'err'); }
  });
}

  selecionados = selecionados || [];

    <input type="text" id="${idPrefix}Filtro" placeholder="Buscar empresa…" style="margin-bottom:6px;">
    <div style="max-height:220px; overflow-y:auto; overflow-x:hidden; border:1px solid var(--rule); border-radius:8px; padding:8px 10px;">
      ${empresas.map(e=>`<label class="checklist-item ${idPrefix}Linha" data-nome="${esc(normalizaTxt(e.nome))}"><input type="checkbox" class="${idPrefix}Check" value="${e.id}" ${selecionados.includes(e.id)?'checked':''}><span>${esc(e.nome)}</span></label>`).join('') || '<span style="font-size:12px; color:var(--ink-soft);">Nenhuma empresa cadastrada.</span>'}
    </div>
  `;
}
function setupChecklistFiltro(idPrefix){
  const filtro = document.getElementById(idPrefix+'Filtro');
  if(!filtro) return;
  filtro.addEventListener('input', ()=>{
    const termo = normalizaTxt(filtro.value);
    document.querySelectorAll('.'+idPrefix+'Linha').forEach(el=>{
      el.style.display = el.dataset.nome.includes(termo) ? '' : 'none';
    });
  });
}

function tabelaModulosHtml(prefixo, items){
  return `
    <table class="data-table">
      <thead><tr><th>Módulo</th><th>Valor mensal (R$)</th><th>Ativo</th><th></th></tr></thead>
      <tbody>
        ${items.map(m=>`
          <tr data-chave="${m.chave}">
            <td><input class="${prefixo}Nome" value="${esc(m.nome)}" style="width:100%;" disabled></td>
            <td style="width:160px;"><input class="${prefixo}Valor" type="number" step="0.01" min="0" value="${m.valorMensal}" style="width:100%;" disabled></td>
            <td style="width:70px; text-align:center;"><input class="${prefixo}Ativo" type="checkbox" ${m.ativo?'checked':''} disabled></td>
            <td style="width:150px; white-space:nowrap;">
              <button class="btn small ${prefixo}Editar">Editar</button>
              <button class="btn small primary ${prefixo}Salvar" style="display:none;" disabled>Salvar</button>
              <button class="btn small ${prefixo}Cancelar" style="display:none;" title="Cancelar edição">✕</button>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}
function ligarSalvarModulos(container, prefixo, endpoint){
  container.querySelectorAll('tr[data-chave]').forEach(tr=>{
    const inputNome = tr.querySelector('.'+prefixo+'Nome');
    const inputValor = tr.querySelector('.'+prefixo+'Valor');
    const inputAtivo = tr.querySelector('.'+prefixo+'Ativo');
    const btnEditar = tr.querySelector('.'+prefixo+'Editar');
    const btnSalvar = tr.querySelector('.'+prefixo+'Salvar');
    const btnCancelar = tr.querySelector('.'+prefixo+'Cancelar');
    let original = { nome: inputNome.value, valor: inputValor.value, ativo: inputAtivo.checked };
    function entrarModoEdicao(){
      inputNome.disabled = false;
      inputValor.disabled = false;
      inputAtivo.disabled = false;
      btnEditar.style.display = 'none';
      btnSalvar.style.display = '';
      btnSalvar.disabled = false;
      btnCancelar.style.display = '';
    }
    function sairModoEdicao(){
      inputNome.disabled = true;
      inputValor.disabled = true;
      inputAtivo.disabled = true;
      btnEditar.style.display = '';
      btnSalvar.style.display = 'none';
      btnSalvar.disabled = true;
      btnCancelar.style.display = 'none';
    }
    btnEditar.addEventListener('click', entrarModoEdicao);
    btnCancelar.addEventListener('click', ()=>{
      inputNome.value = original.nome;
      inputValor.value = original.valor;
      inputAtivo.checked = original.ativo;
      sairModoEdicao();
    });
    btnSalvar.addEventListener('click', async ()=>{
      const chave = tr.dataset.chave;
      const body = {
        nome: inputNome.value.trim(),
        valorMensal: Number(inputValor.value) || 0,
        ativo: inputAtivo.checked,
      };
      try{
        await api(endpoint+'/'+chave, { method:'PUT', body });
        toast('Módulo atualizado.','ok');
        original = { nome: inputNome.value, valor: inputValor.value, ativo: inputAtivo.checked };
        sairModoEdicao();
      }catch(e){ toast(e.message,'err'); }
    });
  });
}

let CFG_TAB='dominio';

let domTestPolling = false;
async function renderCfgTab(){
  domTestPolling = false; // interrompe qualquer polling de teste da aba anterior
  main().querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===CFG_TAB));
  const box = document.getElementById('cfgContent');
  try{
    if(CFG_TAB==='assinatura-plataforma') await renderCfgAssinaturaPlataforma(box);
    else if(CFG_TAB==='dominio') await renderCfgDominio(box);
    else if(CFG_TAB==='nfse-agendamento') await renderCfgNfseAgendamento(box);
    else if(CFG_TAB==='whatsapp') await renderCfgWhatsapp(box);
    else await renderCfgEmail(box);
  }catch(e){
    box.innerHTML = `<div class="empty-state">Não foi possível carregar esta aba: ${esc(e.message||'erro desconhecido')}</div>`;
  }
}
