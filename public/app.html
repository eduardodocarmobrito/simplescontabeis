  }
  document.getElementById('empMunicipioUf').addEventListener('change', ev=>carregarCidadesMunicipio(ev.target.value, null));
  const empMunicipioUfInicial = document.getElementById('empMunicipioUf').value;
  if(empMunicipioUfInicial) carregarCidadesMunicipio(empMunicipioUfInicial, (e&&e.codigoMunicipioIbge)? null : (e&&e.cidade));
  else setupComboSelect('empMunicipioCidadeCombo', [], ()=>{});
  // Ao sair do campo CNPJ (com 14 dígitos — CPF de produtor rural não tem consulta pública), busca
  // os dados na Receita Federal e preenche só os campos que ainda estão vazios — nunca sobrescreve
  // algo que já foi digitado/cadastrado antes, pra não perder dado real corrigido na mão.
  document.getElementById('empCnpj').addEventListener('blur', async ev=>{
    const doc = ev.target.value.replace(/\D/g,'');
    const status = document.getElementById('empCnpjStatus');
    if(doc.length!==14){ status.textContent=''; return; }
    status.textContent = 'Consultando CNPJ na Receita Federal…';
    try{
      const r = await api('/empresas/cnpj/'+doc);
      const preencher = (id, valor)=>{ const el=document.getElementById(id); if(valor && !el.value.trim()) el.value = valor; };
      preencher('empNome', r.razaoSocial);
      preencher('empEmail', r.email);
      preencher('empCidade', r.municipio);
      preencher('empUf', r.uf);
      preencher('empCep', r.cep);
      const endereco = [r.logradouro, r.numero].filter(Boolean).join(', ') + (r.bairro? ' - '+r.bairro : '') + (r.complemento? ' ('+r.complemento+')' : '');
      preencher('empEndereco', endereco.trim().replace(/^,\s*/,''));
      const ufMunicipio = document.getElementById('empMunicipioUf');
      if(r.uf && r.municipio && !ufMunicipio.value){
        ufMunicipio.value = r.uf;
        carregarCidadesMunicipio(r.uf, r.municipio);
      }
      status.textContent = 'Dados preenchidos a partir do CNPJ (campos já preenchidos não foram alterados).';
    }catch(err){
      status.textContent = err.message;
    }
  });
  document.getElementById('empCancel').addEventListener('click', closeModal);
  document.getElementById('empSalvar').addEventListener('click', async ()=>{
    const nome=document.getElementById('empNome').value.trim();
    if(!nome){ toast('Informe o nome.','err'); return; }
    const body = {
      nome,
      cnpj: document.getElementById('empCnpj').value.trim(),
      codigoDominio: document.getElementById('empCodigo').value.trim(),
      email: document.getElementById('empEmail').value.trim(),
      telefone: document.getElementById('empTelefone').value.trim(),
      endereco: document.getElementById('empEndereco').value.trim(),
      cidade: document.getElementById('empCidade').value.trim(),
      uf: document.getElementById('empUf').value.trim(),
      cep: document.getElementById('empCep').value.trim(),
      inscricaoMunicipal: document.getElementById('empInscricaoMunicipal').value.trim(),
      inscricaoEstadual: document.getElementById('empInscricaoEstadual').value.trim(),
      nomeRepresentanteLegal: document.getElementById('empNomeRepresentante').value.trim(),
      cpfRepresentanteLegal: document.getElementById('empCpfRepresentante').value.trim(),
      codigoMunicipioIbge: document.getElementById('empCodigoMunicipio').value.trim(),
      nomeMunicipioIbge: document.getElementById('empNomeMunicipio').value.trim(),
    };
    try{
      if(e){
        body.ativo = document.getElementById('empAtivo').checked;
        body.visivelRelatorios = document.getElementById('empVisivel').checked;
        body.isentoAssinatura = document.getElementById('empIsento').checked;
        body.regimeTributario = document.querySelector('input[name="empRegimeTributario"]:checked')?.value || 'simples_nacional';
        body.regimeApuracaoSn = document.getElementById('empRegApuracao')?.value || '1';
        body.percentualTotalTributosSn = document.getElementById('empTotTribSN')?.value || null;
        await api('/empresas/'+e.id, { method:'PUT', body });
      } else {
        await api('/empresas', { method:'POST', body });
      }
      closeModal(); pageEmpresas();
    }catch(err){ toast(err.message,'err'); }
  });
}
// Card de UM anexo — reaproveitado pela lista simples (Constituição) e pelo histórico por ano/tipo
// (Licenças). Só licença ganha o campo de vencimento (contrato social/cartão CNPJ não vencem).
function anexoCardHtml(a){
  const tipoLabel = (EMPRESA_ANEXO_TIPOS[a.tipo]||{}).label || a.tipo;
  const vencTag = a.vencimentoOrigem==='automatico' ? `<span class="tag ok" style="font-size:10px;">lido automaticamente do PDF</span>`
    : a.vencimentoOrigem==='manual' ? `<span class="tag muted" style="font-size:10px;">informado manualmente</span>`
    : `<span class="tag bad" style="font-size:10px;">não identificado — informe a data</span>`;
  return `
  <div class="card" style="padding:10px 12px; margin-bottom:8px;">
    <div class="row" style="justify-content:space-between; align-items:flex-start; gap:10px;">
      <div>
        <div style="font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em;">${esc(tipoLabel)}</div>
        <a href="/api/empresas/anexos/${a.id}/arquivo" target="_blank" rel="noopener" style="font-weight:600;">${esc(a.nomeArquivo)}</a>
        <div style="font-size:11.5px; color:var(--ink-soft);">Enviado em ${fmtDateHora(a.criadoEm)}${a.criadoPorNome? ' por '+esc(a.criadoPorNome):''}</div>
      </div>
      <button class="btn small danger" data-act="rm-anexo" data-id="${a.id}">Excluir</button>
    </div>
    ${a.categoria==='licenca'? `
      <div class="row" style="align-items:flex-end; gap:8px; margin-top:8px;">
        ${dateFieldHtml('vencAnexo'+a.id, 'Vencimento', a.vencimento||'')}
        <button class="btn small" data-act="salvar-venc-anexo" data-id="${a.id}">Salvar</button>
        ${vencTag}
      </div>
    `:''}
  </div>`;
}
// Liga excluir/salvar-vencimento de uma lista de anexos já renderizada dentro de `container` — chama
// setupDatePicker pros que têm vencimento, e onChange() (recarregar) depois de qualquer ação.
function wireAnexoCardEvents(container, items, onChange){
  items.filter(a=>a.categoria==='licenca').forEach(a=>setupDatePicker('vencAnexo'+a.id, 'vencAnexo'+a.id+'_text'));
  container.querySelectorAll('[data-act="rm-anexo"]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirmar('Excluir este anexo?')) return;
    try{ await api('/empresas/anexos/'+b.dataset.id, { method:'DELETE' }); onChange(); }
    catch(err){ toast(err.message,'err'); }
  }));
  container.querySelectorAll('[data-act="salvar-venc-anexo"]').forEach(b=>b.addEventListener('click', async ()=>{
    const input = document.getElementById('vencAnexo'+b.dataset.id);
    try{
      await api('/empresas/anexos/'+b.dataset.id+'/vencimento', { method:'PUT', body:{ vencimento: input.value || null } });
      toast('Vencimento atualizado.','ok');
      onChange();
    }catch(err){ toast(err.message,'err'); }
  }));
}
// Carrega, lista e envia os anexos da aba Constituição — lista simples, sem agrupamento por ano
// (contrato social/cartão CNPJ não têm essa noção de exercício).
function ligarAbaAnexosEmpresa(empresaId, categoria, listId, formId, btnId){
  const tiposDaCategoria = Object.entries(EMPRESA_ANEXO_TIPOS).filter(([,info])=>info.categoria===categoria);
  async function carregar(){
    const wrap = document.getElementById(listId);
    wrap.innerHTML = `<div class="empty-state">Carregando…</div>`;
    const { items } = await api('/empresas/'+empresaId+'/anexos?categoria='+categoria);
    if(!items.length){ wrap.innerHTML = `<div class="empty-state">Nenhum anexo enviado ainda.</div>`; return; }
    wrap.innerHTML = items.map(anexoCardHtml).join('');
    wireAnexoCardEvents(wrap, items, carregar);
  }
  document.getElementById(btnId).addEventListener('click', ()=>{
    const formWrap = document.getElementById(formId);
    const vaiAbrir = formWrap.classList.contains('hidden');
    formWrap.classList.toggle('hidden', !vaiAbrir);
    if(!vaiAbrir) return;
    formWrap.innerHTML = `
      <div class="row" style="align-items:flex-end; padding:12px;">
        <div class="field grow" style="margin-bottom:0;"><label>Tipo</label>
          <select id="${formId}Tipo">${tiposDaCategoria.map(([v,info])=>`<option value="${v}">${esc(info.label)}</option>`).join('')}</select>
        </div>
        <div class="field grow" style="margin-bottom:0;"><label>Arquivo</label><input type="file" id="${formId}Arquivo"></div>
        <button class="btn small primary" id="${formId}Enviar">Enviar</button>
      </div>
    `;
    document.getElementById(formId+'Enviar').addEventListener('click', async ()=>{
      const tipo = document.getElementById(formId+'Tipo').value;
      const arquivo = document.getElementById(formId+'Arquivo').files[0];
      if(!arquivo){ toast('Selecione um arquivo.','err'); return; }
      const btn = document.getElementById(formId+'Enviar');
      btn.disabled = true; btn.textContent = 'Enviando…';
      const fd = new FormData(); fd.append('tipo', tipo); fd.append('arquivo', arquivo);
      try{
        await api('/empresas/'+empresaId+'/anexos', { method:'POST', body: fd });
        toast('Anexo enviado.','ok');
        formWrap.classList.add('hidden');
        carregar();
      }catch(err){ toast(err.message,'err'); }
      finally{ btn.disabled=false; btn.textContent='Enviar'; }
    });
  });
  carregar();
}
// Aba Licenças: ano → tipo (Alvará, Vigilância Sanitária, Corpo de Bombeiros, Ambiental-SEMMA) →
// histórico de anexos daquele tipo naquele ano. Clica no ano, os 4 tipos já aparecem prontos (com
// ou sem anexo ainda); clica num tipo, expande o histórico + botão pra anexar mais um daquele
// mesmo tipo/ano — cada anexo mantém o próprio vencimento, lido dele mesmo, nunca herdado.
function ligarAbaLicencasEmpresa(empresaId){
  const tiposLicenca = Object.entries(EMPRESA_ANEXO_TIPOS).filter(([,info])=>info.categoria==='licenca');
  const anoAtual = new Date().getFullYear();
  let ano = anoAtual;
  let tipoAberto = null;
  let todosAnexos = [];
  // Anos disponíveis são do escritório inteiro, não por empresa (o layout ano→tipo é o mesmo pra
  // qualquer uma) — adicionar um ano novo em "+ Ano" já libera ele pra todas de uma vez.
  let anosCompartilhados = [];

  function anosParaMostrar(){
    const anosComDados = todosAnexos.map(a=>a.ano).filter(Boolean); // nunca esconde ano que essa empresa já tem anexo, mesmo antigo
    const base = [anoAtual, anoAtual+1]; // a partir do ano atual — anos anteriores só aparecem se já tiverem anexo ou forem adicionados em "+ Ano"
    return [...new Set([...base, ...anosCompartilhados, ...anosComDados, ano])].sort((x,y)=>y-x);
  }
  function renderAnos(){
    const wrap = document.getElementById('empLicencasAnos');
    wrap.innerHTML = anosParaMostrar().map(a=>`<div class="tab ${a===ano?'active':''}" data-ano="${a}">${a}</div>`).join('')
      + `<div class="tab" data-act="outro-ano">+ Ano</div>`;
    wrap.querySelectorAll('[data-ano]').forEach(t=>t.addEventListener('click', ()=>{
      ano = Number(t.dataset.ano);
      tipoAberto = null;
      renderAnos();
      renderTipos();
    }));
    const btnOutro = wrap.querySelector('[data-act="outro-ano"]');
    if(btnOutro) btnOutro.addEventListener('click', async ()=>{
      const digitado = prompt('Adicionar/ver qual ano? (fica disponível pra todas as empresas)', String(anoAtual));
      if(!digitado) return;
      const n = Number(digitado);
      if(!Number.isInteger(n) || n<2000 || n>2100){ toast('Ano inválido.','err'); return; }
      try{
        await api('/empresas/licenca-anos', { method:'POST', body:{ ano:n } });
        if(!anosCompartilhados.includes(n)) anosCompartilhados.push(n);
        ano = n; tipoAberto = null;
        renderAnos(); renderTipos();
      }catch(err){ toast(err.message,'err'); }
    });
  }
  function anexosDoTipo(tipo){ return todosAnexos.filter(a=>a.tipo===tipo && a.ano===ano); }
  function renderTipos(){
    const wrap = document.getElementById('empLicencasTipos');
    wrap.innerHTML = tiposLicenca.map(([tipo,info])=>{
      const lista = anexosDoTipo(tipo);
      const maisRecente = lista[0]; // /anexos já vem ordenado desc por criado_em
      let vencTag = '';
      if(maisRecente && maisRecente.vencimento){
        const hoje = new Date().toISOString().slice(0,10);
        const vencida = maisRecente.vencimento < hoje;
        vencTag = `<span class="tag ${vencida?'bad':'ok'}" style="margin-left:8px;">${vencida?'Vencida em':'Vence em'} ${fmtDateIso(maisRecente.vencimento)}</span>`;
      }
      const aberto = tipoAberto===tipo;
      return `
      <div class="card" style="padding:0; margin-bottom:8px; overflow:hidden;">
        <div class="row" data-act="toggle-tipo" data-tipo="${tipo}" style="justify-content:space-between; align-items:center; padding:12px 14px; cursor:pointer;">
          <div>
            <b>${esc(info.label)}</b>
            <span class="tag muted" style="margin-left:8px;">${lista.length} anexo${lista.length===1?'':'s'}</span>
            ${vencTag}
          </div>
          <span style="color:var(--ink-soft);">${aberto?'▲':'▼'}</span>
        </div>
        <div id="empLicTipoCorpo_${tipo}" class="${aberto?'':'hidden'}" style="padding:0 14px 14px; border-top:1px solid var(--rule);"></div>
      </div>`;
    }).join('');
    wrap.querySelectorAll('[data-act="toggle-tipo"]').forEach(el=>el.addEventListener('click', ()=>{
      const tipo = el.dataset.tipo;
      tipoAberto = tipoAberto===tipo? null : tipo;
      renderTipos();
    }));
    if(tipoAberto) renderCorpoTipo(tipoAberto);
  }
  function renderCorpoTipo(tipo){
    const corpo = document.getElementById('empLicTipoCorpo_'+tipo);
    if(!corpo) return;
    const lista = anexosDoTipo(tipo);
    corpo.innerHTML = `
      <div style="padding-top:12px;">${lista.map(anexoCardHtml).join('') || `<div class="empty-state">Nenhum anexo enviado ainda pra ${ano}.</div>`}</div>
      <div id="empLicAddForm_${tipo}" class="hidden card" style="background:var(--paper); margin-top:8px;"></div>
      <button class="btn small" data-act="add-anexo-lic" data-tipo="${tipo}" style="margin-top:8px;">+ Adicionar Anexo</button>
    `;
    wireAnexoCardEvents(corpo, lista, carregarTudo);
    corpo.querySelector('[data-act="add-anexo-lic"]').addEventListener('click', ()=>{
      const formWrap = document.getElementById('empLicAddForm_'+tipo);
      const vaiAbrir = formWrap.classList.contains('hidden');
      formWrap.classList.toggle('hidden', !vaiAbrir);
      if(!vaiAbrir) return;
      formWrap.innerHTML = `
        <div class="row" style="align-items:flex-end; padding:12px;">
          <div class="field grow" style="margin-bottom:0;"><label>Arquivo</label><input type="file" id="empLicArquivo_${tipo}"></div>
          <button class="btn small primary" id="empLicEnviar_${tipo}">Enviar</button>
        </div>
      `;
      document.getElementById('empLicEnviar_'+tipo).addEventListener('click', async ()=>{
        const arquivo = document.getElementById('empLicArquivo_'+tipo).files[0];
        if(!arquivo){ toast('Selecione um arquivo.','err'); return; }
        const btn = document.getElementById('empLicEnviar_'+tipo);
        btn.disabled = true; btn.textContent = 'Enviando…';
        const fd = new FormData(); fd.append('tipo', tipo); fd.append('ano', String(ano)); fd.append('arquivo', arquivo);
        try{
          await api('/empresas/'+empresaId+'/anexos', { method:'POST', body: fd });
          toast('Anexo enviado.','ok');
          await carregarTudo();
        }catch(err){ toast(err.message,'err'); }
        finally{ btn.disabled=false; btn.textContent='Enviar'; }
      });
    });
  }
  async function carregarTudo(){
    const [anexosResp, anosResp] = await Promise.all([
      api('/empresas/'+empresaId+'/anexos?categoria=licenca'),
      api('/empresas/licenca-anos'),
    ]);
    todosAnexos = anexosResp.items;
    anosCompartilhados = anosResp.anos;
    renderAnos();
    renderTipos();
  }
  carregarTudo();
}
// ===================== Licenças (carga em lote por pasta) =====================
// Escolhe uma pasta inteira de PDFs (o navegador junta tudo o que tem lá dentro num FileList só,
// via webkitdirectory — suportado em Chrome/Edge/Safari; em navegador sem suporte, "multiple"
// ainda deixa selecionar vários arquivos de uma vez na mão) e manda tudo pro backend, que lê o
// CNPJ/CPF de cada PDF pra descobrir sozinho a empresa — sem precisar escolher empresa por empresa.
async function pageLicencasBulk(){
  const podePostar = can('licencas','postar');
  const podeEditar = can('licencas','editar');
  const tiposLicenca = Object.entries(EMPRESA_ANEXO_TIPOS).filter(([,info])=>info.categoria==='licenca');
  main().innerHTML = `
    <h1>Licenças</h1>
    <p class="subtitle">Carregue de uma vez todos os PDFs de um tipo de licença — o sistema lê o CNPJ/CPF de dentro de cada arquivo e anexa sozinho na empresa certa (mesmo lugar da aba Licenças de cada empresa).</p>
    ${!podePostar? `<p class="tag muted">Você só tem permissão de visualização neste módulo.</p>`:''}
    <div class="card">
      <h3>1. Tipo de licença</h3>
      <div class="row" id="lbTipos" style="flex-wrap:wrap; gap:10px;">
        ${tiposLicenca.map(([v,info])=>`<div class="kpi" data-tipo="${v}" style="cursor:pointer; min-width:220px;"><div class="eyebrow">Selecionar</div><div class="val" style="font-size:16px;">${esc(info.label)}</div></div>`).join('')}
      </div>
    </div>
    <div id="lbResto"></div>
  `;
  let tipoEscolhido = null;
  const tiposWrap = document.getElementById('lbTipos');
  tiposWrap.querySelectorAll('[data-tipo]').forEach(el=>el.addEventListener('click', ()=>{
    tipoEscolhido = el.dataset.tipo;
    tiposWrap.querySelectorAll('[data-tipo]').forEach(x=>x.style.boxShadow = x===el? '0 0 0 2px var(--accent) inset' : '');
    montarResto();
  }));

  async function montarResto(){
    const wrap = document.getElementById('lbResto');
    const anoAtual = new Date().getFullYear();
    const { anos } = await api('/empresas/licenca-anos');
    let anosBase = [...new Set([anoAtual, anoAtual+1, ...anos])].sort((a,b)=>b-a);
    wrap.innerHTML = `
      <div class="card">
        <h3>2. Ano da licença</h3>
        <div class="row" style="align-items:flex-end; gap:10px;">
          <div class="field" style="width:140px; margin-bottom:0;"><label>Ano</label>
            <select id="lbAno">${anosBase.map(a=>`<option value="${a}">${a}</option>`).join('')}</select>
          </div>
          ${podePostar? `<button class="btn small" id="lbOutroAno">+ Outro ano</button>` : ''}
        </div>
      </div>
      <div class="card">
        <h3>3. Pasta com os PDFs</h3>
        <p style="font-size:12.5px; color:var(--ink-soft); margin-top:-6px;">Escolha a pasta no computador com todas as licenças de "${esc(EMPRESA_ANEXO_TIPOS[tipoEscolhido].label)}" em PDF — cada arquivo precisa ter o CNPJ ou CPF da empresa em algum lugar do texto. Se o navegador não deixar escolher a pasta inteira, selecione todos os PDFs dela na mão (Cmd/Ctrl+A dentro da pasta).</p>
        <input type="file" id="lbPasta" webkitdirectory multiple accept="application/pdf" ${podePostar? '' : 'disabled'}>
        <div id="lbPastaResumo" style="font-size:12.5px; color:var(--ink-soft); margin-top:6px;"></div>
        ${podePostar? `<button class="btn primary" id="lbCarregar" style="margin-top:10px;" disabled>Carregar Licenças</button>` : ''}
      </div>
      <div id="lbRelatorio"></div>
    `;
    if(!podePostar) return;
    document.getElementById('lbOutroAno').addEventListener('click', async ()=>{
      const digitado = prompt('Adicionar/usar qual ano? (fica disponível pra todas as empresas)', String(anoAtual));
      if(!digitado) return;
      const n = Number(digitado);
      if(!Number.isInteger(n) || n<2000 || n>2100){ toast('Ano inválido.','err'); return; }
      try{ await api('/empresas/licenca-anos', { method:'POST', body:{ ano:n } }); }catch(e){ toast(e.message,'err'); return; }
      if(!anosBase.includes(n)){ anosBase = [...anosBase, n].sort((a,b)=>b-a); }
      const sel = document.getElementById('lbAno');
      sel.innerHTML = anosBase.map(a=>`<option value="${a}">${a}</option>`).join('');
      sel.value = String(n);
    });
    const inputPasta = document.getElementById('lbPasta');
    const btnCarregar = document.getElementById('lbCarregar');
    function arquivosPdf(){ return [...inputPasta.files].filter(f=>f.type==='application/pdf' || f.name.toLowerCase().endsWith('.pdf')); }
    inputPasta.addEventListener('change', ()=>{
      const arquivos = arquivosPdf();
      document.getElementById('lbPastaResumo').textContent = arquivos.length? `${arquivos.length} PDF(s) encontrados.` : 'Nenhum PDF encontrado nessa pasta.';
      btnCarregar.disabled = !arquivos.length;
    });
    btnCarregar.addEventListener('click', async ()=>{
      const arquivos = arquivosPdf();
      if(!arquivos.length) return;
      const ano = document.getElementById('lbAno').value;
      btnCarregar.disabled = true; btnCarregar.textContent = `Carregando… (${arquivos.length} arquivo(s))`;
      document.getElementById('lbRelatorio').innerHTML = '';
      const fd = new FormData();
      fd.append('tipo', tipoEscolhido);
      fd.append('ano', ano);
      arquivos.forEach(f=>fd.append('arquivos', f, f.name));
      try{
        const r = await api('/empresas/anexos/licencas-bulk', { method:'POST', body: fd });
        renderRelatorio(r);
        toast(`Concluído: ${r.identificados.length + r.semVencimento.length} anexados, ${r.naoIdentificados.length} não identificados.`, 'ok');
      }catch(e){ toast(e.message,'err'); }
      finally{ btnCarregar.disabled = false; btnCarregar.textContent = 'Carregar Licenças'; }
    });
  }

  function renderRelatorio(r){
    const wrap = document.getElementById('lbRelatorio');
    wrap.innerHTML = `
      <div class="card">
        <h3>Resultado</h3>
        <div class="row" style="gap:20px; margin-bottom:10px; flex-wrap:wrap;">
          <span class="tag ok">${r.identificados.length} com vencimento lido</span>
          <span class="tag muted">${r.semVencimento.length} sem vencimento (falta preencher)</span>
          <span class="tag bad">${r.naoIdentificados.length} não identificados</span>
        </div>
        ${r.semVencimento.length? `
          <div style="margin:14px 0 8px; font-weight:600; font-size:13.5px;">Já foram anexados — só falta a data de vencimento (não deu pra ler sozinho)</div>
          <div id="lbSemVenc"></div>
        `:''}
        ${r.naoIdentificados.length? `

// Botão "Atualizar Empresas": pede pro agente local sincronizar agora (não espera o ciclo automático).
async function atualizarEmpresasDoDominio(){
  const btn = document.getElementById('btnAtualizarEmpresas');
  const status = document.getElementById('atualizarEmpresasStatus');
  btn.disabled = true; btn.textContent = 'Atualizando…';
  status.textContent = 'Aguardando o agente responder (precisa estar rodando na sua máquina)…';
  try{
    const { id } = await api('/dominio/sincronizar-empresas', { method:'POST' });
    let tentativas = 0;
    const poll = async ()=>{
      tentativas++;
      const r = await api('/dominio/sincronizar-empresas/'+id);
      if(r.status==='pending'){
        if(tentativas>30){
          status.textContent = 'Sem resposta do agente — confira se ele está rodando (npm run dominio-agent:dev) e se a sessão do Onvio está válida (npm run onvio-login).';
          btn.disabled=false; btn.textContent='↻ Atualizar Empresas';
          return;
        }
        setTimeout(poll, 2000);
        return;
      }
      btn.disabled = false; btn.textContent = '↻ Atualizar Empresas';
      if(r.status==='ok'){
        status.textContent = `Atualizado: ${r.novas} nova(s), ${r.atualizadas} atualizada(s).`;
        toast('Empresas atualizadas.','ok');
        renderEmpresasTab();
      } else {
        status.textContent = 'Falhou: '+(r.erro||'erro desconhecido.');
        toast(r.erro || 'Falha ao atualizar empresas.','err');
      }
    };
    poll();
  }catch(e){
    btn.disabled = false; btn.textContent = '↻ Atualizar Empresas';
    status.textContent = '';
    toast(e.message,'err');
  }
}

  const podePostar = can('solicitacoes','postar');

  const [{ items: atribs }, empresas, { items: templates }] = await Promise.all([

  ]);
  const box = document.getElementById('solicContent');

    const termo = normalizaTxt(filtro).trim();
    const visiveis = termo ? atribs.filter(a=> normalizaTxt(a.empresaNome).includes(termo)) : atribs;
    atribBody.innerHTML = visiveis.length? visiveis.map(a=>`

        <td>${esc(a.templateNome)}</td>

        <td style="text-align:right; display:flex; gap:6px; justify-content:flex-end;">
          <button class="btn small" data-act="abrir">Abrir grade</button>
          ${podeEditar? (a.temAnexos
              ? `<span class="tag muted" title="Já tem documento anexado — não pode excluir">Excluir</span>`
              : `<button class="btn small danger" data-act="excluir-atrib">Excluir</button>`)
            : ''}
        </td>
      </tr>
    `).join('') : `<tr><td colspan="4"><div class="empty-state">${termo?'Nenhuma empresa encontrada.':'Nenhuma solicitação atribuída ainda.'}</div></td></tr>`;
    atribBody.querySelectorAll('[data-act="abrir"]').forEach(b=>b.addEventListener('click', e=>{
      const id=Number(e.target.closest('tr').dataset.id);
      abrirGrade(id, false);

    atribBody.querySelectorAll('[data-act="excluir-atrib"]').forEach(b=>b.addEventListener('click', async e=>{
      const tr = e.target.closest('tr');

      const a = atribs.find(x=>x.id===id);
      if(!confirmar(`Excluir "${a.templateNome}" de ${a.empresaNome}? Isso apaga também todos os anexos já enviados para essa solicitação. Não dá pra desfazer.`)) return;
      try{ await api('/checklist/atribuicoes/'+id, { method:'DELETE' }); toast('Excluído.','ok'); renderAtribuicoes(); }
      catch(err){ toast(err.message,'err'); }
    }));
  }
  desenhaAtribs('');
  document.getElementById('atribFiltro').addEventListener('input', e=>desenhaAtribs(e.target.value));
  if(podePostar) document.getElementById('btnNovaAtrib').addEventListener('click', ()=>novaAtribModal(empresas, templates));

const MESES=['','Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const UFS_BR=['AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR','PE','PI','RJ','RN','RS','RO','RR','SC','SP','SE','TO'];
function rotuloPeriodo(p){ return p.mes? `${MESES[p.mes]}/${p.ano}` : (p.rotulo || String(p.ano)); }

// Conteúdo de um slot (anexar/baixar/reabrir), sem wrapper — usado tanto na grade completa
// (dentro de um <td>) quanto no card compacto de "Meus Documentos" (dentro de uma div solta).
function slotInner(periodoId, s, opts){
  const { podePostar, podeVerDownload, podeEditar, mostrarLabel, souCliente } = opts;
  const inputId = `f_${periodoId}_${s.chave}`;
  const inputIdExtra = `fx_${periodoId}_${s.chave}`;
  const accept = (s.accept||[]).includes('qualquer') ? '' : (s.accept||[]).map(a=>({ofx:'.ofx',pdf:'.pdf',zip:'.zip,.rar,.7z',xml:'.xml',imagem:'.png,.jpg,.jpeg'}[a]||'')).join(',');
  const label = mostrarLabel? `<div class="slot-label" style="font-weight:600; color:var(--ink);">${esc(s.label)}${s.obrigatorio?' *':''}</div>` : '';
  const uploads = s.uploads || [];
  // "Incluir outro documento" é só do escritório (não do self-service do cliente) e só depois que
  // já existe pelo menos um anexo — pra um item ainda pendente, "Salvar" já resolve.
  const podeAdicionar = podePostar && !souCliente && uploads.length>0;
  const blocosUploads = uploads.map(u=>`
    <div class="slot-locked" style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px; flex-wrap:wrap;">
      <div style="flex:1; min-width:140px;"><span class="fname">${esc(u.fileName)}</span>Enviado em ${fmtDateHora(u.uploadedAt)}${s.travado?' · travado':''}</div>
      ${(podeVerDownload || podeEditar)? `<div style="display:flex; gap:6px; flex-shrink:0;">
        ${podeVerDownload? `<button class="btn small" data-act="download" data-upload="${u.id}">Baixar</button>`:''}
        ${podeEditar? `<button class="btn small danger" data-act="reabrir" data-upload="${u.id}">Reabrir</button>`:''}
      </div>`:''}
    </div>
  `).join('');
  const blocoNovo = !s.travado
    ? `${s.reaberto? `<div class="slot-reopen-note">Reaberto${s.motivoReabertura? ': '+esc(s.motivoReabertura):''} — pode reenviar</div>`:''}
       ${(!uploads.length && s.ultimoSubstituido)? `<div class="slot-label">Anterior: ${esc(s.ultimoSubstituido.fileName)} (substituído)</div>`:''}
       ${podePostar? `
         <input type="file" id="${inputId}" ${accept?`accept="${accept}"`:''}>
         <button class="btn small primary" data-act="salvar" data-periodo="${periodoId}" data-item="${s.chave}" data-input="${inputId}">Salvar</button>
       ` : (!uploads.length? `<span class="slot-label">Pendente</span>` : '')}`
    : '';
  const blocoAdicional = podeAdicionar
    ? `<input type="file" id="${inputIdExtra}" ${accept?`accept="${accept}"`:''}>
       <button class="btn small" data-act="salvar-adicional" data-periodo="${periodoId}" data-item="${s.chave}" data-input="${inputIdExtra}">Incluir outro documento</button>`
    : '';
  return `<div class="slot">${label}${blocosUploads}${blocoNovo}${blocoAdicional}</div>`;
}
// Liga os cliques de salvar/baixar/reabrir dentro de um container (a grade inteira, ou um card
// compacto) — onDepois roda depois de qualquer ação que mude o estado, pra recarregar a tela certa.
function wireSlotEvents(container, onDepois){
  container.querySelectorAll('[data-act="salvar"]').forEach(b=>b.addEventListener('click', async ()=>{
    const input = document.getElementById(b.dataset.input);
    const file = input.files[0];
    if(!file){ toast('Selecione um arquivo.','err'); return; }
    const fd = new FormData(); fd.append('arquivo', file); fd.append('itemChave', b.dataset.item);
    try{
      await api('/checklist/periodos/'+b.dataset.periodo+'/upload', { method:'POST', body:fd });
      toast('Arquivo salvo.','ok');
      onDepois();
    }catch(e){ toast(e.message,'err'); }
  }));
  container.querySelectorAll('[data-act="salvar-adicional"]').forEach(b=>b.addEventListener('click', async ()=>{
    const input = document.getElementById(b.dataset.input);
    const file = input.files[0];
    if(!file){ toast('Selecione um arquivo.','err'); return; }
    const fd = new FormData(); fd.append('arquivo', file); fd.append('itemChave', b.dataset.item); fd.append('adicional', 'true');
    try{
      await api('/checklist/periodos/'+b.dataset.periodo+'/upload', { method:'POST', body:fd });
      toast('Documento incluído.','ok');
      onDepois();
    }catch(e){ toast(e.message,'err'); }
  }));
  container.querySelectorAll('[data-act="download"]').forEach(b=>b.addEventListener('click', ()=>{
    window.open('/api/checklist/uploads/'+b.dataset.upload+'/download', '_blank');
  }));
  container.querySelectorAll('[data-act="reabrir"]').forEach(b=>b.addEventListener('click', async ()=>{
    const motivo = prompt('Motivo da reabertura (aparece para o cliente):');
    if(motivo===null) return;
    await api('/checklist/uploads/'+b.dataset.upload+'/reabrir', { method:'POST', body:{ motivo } });
    onDepois();
  }));
}

async function abrirGrade(atribuicaoId, souCliente){
  const { atribuicao, grade } = await api('/checklist/grade/'+atribuicaoId);
  const podePostar = souCliente || can('solicitacoes','postar');
  const podeEditar = !souCliente && can('solicitacoes','editar');
  const podeVerDownload = !souCliente && can('solicitacoes','visualizar');
  const opts = { podePostar, podeVerDownload, podeEditar, mostrarLabel:false, souCliente };

  const html = `
    <h1>${esc(atribuicao.templateNome)}</h1>
    <p class="subtitle">${esc(atribuicao.empresaNome)} — ${({mensal:'Mensal',anual:'Anual',avulso:'Avulso'})[atribuicao.periodicidade]||atribuicao.periodicidade}</p>
    <div class="row" style="margin-bottom:14px;">
      <button class="btn" id="btnVoltarGrade">← Voltar</button>
      ${podePostar && atribuicao.periodicidade!=='avulso' ? `<button class="btn" id="btnGerarPeriodo">Gerar ano na grade</button>`:''}
      ${podePostar && atribuicao.periodicidade==='avulso' ? `<button class="btn" id="btnNovoAvulso">+ Nova solicitação avulsa</button>`:''}
    </div>
    <div class="card" style="overflow-x:auto;">
      ${grade.length? `<table class="grade-table"><thead><tr><th>Período</th>${grade[0].slots.map(s=>`<th>${esc(s.label)}${s.obrigatorio?' *':''}</th>`).join('')}</tr></thead>
      <tbody id="gradeBody"></tbody></table>` : `<div class="empty-state">Nenhum período gerado ainda.</div>`}
    </div>
  `;
  main().innerHTML = html;
  document.getElementById('btnVoltarGrade').addEventListener('click', ()=> souCliente ? pageMeusDocumentos() : pageSolicitacoes());

  if(grade.length){
    const tbody = document.getElementById('gradeBody');
    tbody.innerHTML = grade.map(p=>
      `<tr data-periodo="${p.periodoId}"><td><b>${esc(rotuloPeriodo(p))}</b></td>${p.slots.map(s=>`<td>${slotInner(p.periodoId, s, opts)}</td>`).join('')}</tr>`
    ).join('');
    wireSlotEvents(tbody, ()=>abrirGrade(atribuicaoId, souCliente));
  }

  if(podePostar && atribuicao.periodicidade!=='avulso') document.getElementById('btnGerarPeriodo').addEventListener('click', async ()=>{
    const ano = prompt('Gerar grade de qual ano?', new Date().getFullYear());
    if(!ano) return;
    await api('/checklist/periodos/gerar', { method:'POST', body:{ atribuicaoId, ano:Number(ano) } });
    abrirGrade(atribuicaoId, souCliente);
  });
  if(podePostar && atribuicao.periodicidade==='avulso') document.getElementById('btnNovoAvulso').addEventListener('click', async ()=>{
    const rotulo = prompt('Descreva esta solicitação avulsa (ex.: "Extrato de Financiamento nº 4521")');
    if(!rotulo) return;
    await api('/checklist/periodos/gerar', { method:'POST', body:{ atribuicaoId, ano:new Date().getFullYear(), rotulo } });
    abrirGrade(atribuicaoId, souCliente);
  });
}

// ===================== Meus Documentos (cliente) =====================
// Cada solicitação vira uma linha compacta: um card pequeno pra abrir o histórico completo, e ao
// lado o período "da vez" já pronto pra anexar — mensal mostra o mês anterior (o extrato que acabou
// de fechar), anual mostra o ano corrente, avulso mostra a pendência mais recente ainda aberta.
function periodoDaVez(atribuicao, grade){
  if(!grade.length) return null;
  if(atribuicao.periodicidade==='mensal'){
    const hoje = new Date();
    const anterior = new Date(hoje.getFullYear(), hoje.getMonth()-1, 1);
    const ano = anterior.getFullYear(), mes = anterior.getMonth()+1;
    return grade.find(p=>p.ano===ano && p.mes===mes) || null;
  }
  if(atribuicao.periodicidade==='anual'){
    const anoAtual = new Date().getFullYear();
    return grade.find(p=>p.ano===anoAtual) || grade.slice().sort((a,b)=>b.ano-a.ano)[0];
  }
  // avulso: a pendência aberta mais recente (algum slot ainda não travado)
  const abertos = grade.filter(p=>p.slots.some(s=>!s.travado));
  return abertos.length? abertos[abertos.length-1] : null;
}
async function pageMeusDocumentos(){
  const { items } = await api('/checklist/minhas-atribuicoes');
  main().innerHTML = `
    <h1>Meus Documentos</h1>
    <p class="subtitle">Envie aqui os arquivos solicitados pelo seu escritório de contabilidade</p>
    <div id="mdList"></div>
  `;
  const box = document.getElementById('mdList');
  if(!items.length){ box.innerHTML = '<div class="empty-state">Nenhuma solicitação criada para sua empresa ainda.</div>'; return; }

  box.innerHTML = items.map(a=>`
    <div class="doc-row" data-id="${a.id}">
      <div class="doc-card" data-id="${a.id}">
        <h3>${esc(a.templateNome)}</h3>
        <div class="doc-card-sub">${({mensal:'Mensal',anual:'Anual',avulso:'Avulso'})[a.periodicidade]||a.periodicidade}</div>
        <div class="doc-card-link">Ver histórico completo →</div>
      </div>
      <div class="doc-inline" id="docInline${a.id}"><div class="empty-state" style="padding:10px;">Carregando…</div></div>
    </div>
  `).join('');
  box.querySelectorAll('.doc-card').forEach(c=>c.addEventListener('click', ()=>abrirGrade(Number(c.dataset.id), true)));

  for(const a of items){
    const painel = document.getElementById('docInline'+a.id);
    try{
      const { grade } = await api('/checklist/grade/'+a.id);
      const p = periodoDaVez(a, grade);
      if(!p){
        painel.innerHTML = `<div class="doc-inline-empty">Nenhuma pendência no momento — clique no card para ver o histórico.</div>`;
        continue;
      }
      const opts = { podePostar:true, podeVerDownload:false, podeEditar:false, mostrarLabel:true, souCliente:true };
      painel.innerHTML = `
        <div class="doc-inline-periodo">${esc(rotuloPeriodo(p))}</div>
        ${p.slots.map(s=>slotInner(p.periodoId, s, opts)).join('')}
      `;
      wireSlotEvents(painel, ()=>pageMeusDocumentos());
    }catch(e){
      painel.innerHTML = `<div class="doc-inline-empty">Não consegui carregar — abra o card.</div>`;
    }
  }
}

// "Recalcular DAS" não é um template do banco — dispara direto a busca no Integra Contador pra
// competência escolhida, achando sozinho o DAS original já entregue pela rotina mensal e devolvendo
// a guia recalculada em Envio de Documentos.
const RECALCULO_DAS_ID = '__recalculo_das';
// Igual ao Recalcular DAS: não é um template do banco. Diferente dele, não busca nada na hora — a
// Receita não deixa simular nem aderir a um parcelamento novo por API, só avisa o escritório, que
// negocia no e-CAC (fora do sistema) e depois vincula o parcelamento concedido em Solicitações.
const PARCELAMENTO_DAS_ID = '__parcelamento_das';
function novaSolicitacaoModal(disponiveis){
  const porId = new Map(disponiveis.map(t=>[String(t.id), t]));
  const hoje = new Date();
  openModal(`
    <h3>Nova solicitação</h3>
    <div class="field"><label>O que você precisa?</label>
      <select id="solTemplate">
        <option value="${RECALCULO_DAS_ID}">Recalcular DAS</option>
        <option value="${PARCELAMENTO_DAS_ID}">Solicitar parcelamento de DAS</option>
        ${disponiveis.map(t=>`<option value="${t.id}">${esc(t.nome)}</option>`).join('')}
      </select>
    </div>
    <div id="solPeriodoWrap"></div>
    <div class="modal-actions">
      <button class="btn" id="solCancel">Cancelar</button>
      <button class="btn primary" id="solEnviar">Solicitar</button>
    </div>
  `);
  function desenhaMesAno(idMes, idAno){
    const mesAnterior = hoje.getMonth()===0 ? 12 : hoje.getMonth();
    const anoDefault = hoje.getMonth()===0 ? hoje.getFullYear()-1 : hoje.getFullYear();
    return `<div class="row">
      <div class="field grow"><label>Mês</label><select id="${idMes}">${MESES.slice(1).map((m,i)=>`<option value="${i+1}" ${i+1===mesAnterior?'selected':''}>${m}</option>`).join('')}</select></div>
      <div class="field" style="width:110px;"><label>Ano</label><input id="${idAno}" type="number" value="${anoDefault}"></div>
    </div>`;
  }
  function desenhaPeriodo(){
    const valor = document.getElementById('solTemplate').value;
    const wrap = document.getElementById('solPeriodoWrap');
    if(valor===RECALCULO_DAS_ID){
      wrap.innerHTML = `<p style="font-size:12px; color:var(--ink-soft); margin:-4px 0 10px;">Buscamos direto na Receita o DAS recalculado (com juros/multa atualizados) da competência escolhida — só funciona se o DAS original dessa competência já tiver sido entregue pela rotina mensal.</p>` + desenhaMesAno('solMes','solAno');
      return;
    }
    if(valor===PARCELAMENTO_DAS_ID){
      wrap.innerHTML = `<p style="font-size:12px; color:var(--ink-soft); margin:-4px 0 10px;">Avisamos o escritório do seu pedido — a negociação do parcelamento (entrada, número de parcelas) é feita direto com a Receita. Depois que o parcelamento for concedido, as guias de cada parcela aparecem aqui todo mês pra você acompanhar e pagar.</p>`;
      return;
    }
    const t = porId.get(valor);
    if(t.periodicidade==='mensal'){
      wrap.innerHTML = desenhaMesAno('solMes','solAno');
    } else if(t.periodicidade==='anual'){
      wrap.innerHTML = `<div class="field" style="width:110px;"><label>Ano</label><input id="solAno" type="number" value="${hoje.getFullYear()}"></div>`;
    } else {
      wrap.innerHTML = `<div class="field"><label>Descreva o que precisa</label><input id="solRotulo" placeholder='Ex.: "Relação de Faturamento — Jan a Jul/2026"'></div>`;
    }
  }
  desenhaPeriodo();
  document.getElementById('solTemplate').addEventListener('change', desenhaPeriodo);
  document.getElementById('solCancel').addEventListener('click', closeModal);
  document.getElementById('solEnviar').addEventListener('click', async ()=>{
    const valor = document.getElementById('solTemplate').value;
    if(valor===RECALCULO_DAS_ID){
      const body = { mes: Number(document.getElementById('solMes').value), ano: Number(document.getElementById('solAno').value) };
      const btn = document.getElementById('solEnviar');
      btn.disabled = true; btn.textContent = 'Consultando a Receita…';
      try{
        await api('/envio/solicitar-recalculo-das', { method:'POST', body });
        closeModal();
        toast('DAS recalculado! Já está disponível em Documentos Recebidos.','ok');
        pageSolicitarDocumentos();
      }catch(e){ toast(e.message,'err'); btn.disabled=false; btn.textContent='Solicitar'; }
      return;
    }
    if(valor===PARCELAMENTO_DAS_ID){
      const btn = document.getElementById('solEnviar');
      btn.disabled = true; btn.textContent = 'Enviando…';
      try{
        const r = await api('/envio/solicitar-parcelamento-das', { method:'POST' });
        closeModal();
        toast(r.jaExistia? 'Você já tinha pedido isso — seguimos aguardando o escritório negociar com a Receita.' : 'Pedido enviado ao escritório.', 'ok');
        pageSolicitarDocumentos();
      }catch(e){ toast(e.message,'err'); btn.disabled=false; btn.textContent='Solicitar'; }
      return;
    }
    const t = porId.get(valor);
    const body = { templateId: Number(t.id) };
    if(t.periodicidade==='mensal'){
      body.mes = Number(document.getElementById('solMes').value);
      body.ano = Number(document.getElementById('solAno').value);
    } else if(t.periodicidade==='anual'){
      body.ano = Number(document.getElementById('solAno').value);
    } else {
      body.rotulo = document.getElementById('solRotulo').value.trim();
      if(!body.rotulo){ toast('Descreva o que você está solicitando.','err'); return; }
    }
    try{
      const r = await api('/envio/solicitar', { method:'POST', body });
      closeModal();
      toast(r.jaConcluido? 'Esse documento já tinha sido enviado — confira na lista.' : (r.jaExistia? 'Você já tinha solicitado isso — seguimos aguardando o escritório.' : 'Solicitação enviada ao escritório.'), 'ok');
      pageSolicitarDocumentos();
    }catch(e){ toast(e.message,'err'); }
  });
}

// Vincula um parcelamento JÁ CONCEDIDO na Receita — a Receita não deixa simular nem aderir a um
// parcelamento novo por API, só consultar o que já existe (a negociação continua sendo feita pelo
// escritório no e-CAC, fora do sistema). "periodoSolicitacaoId" é opcional: quando vem de uma
// solicitação do cliente em Solicitações, some da fila ao vincular; quando vem direto do Integra
// Contador (escritório vinculando sem esperar pedido do cliente), passa null.
async function vincularParcelamentoModal(empresaId, empresaNome, periodoSolicitacaoId, onDone){
  openModal(`
    <h3>Vincular parcelamento</h3>
    <p style="font-size:12.5px; color:var(--ink-soft); margin-top:-6px;">${esc(empresaNome)} — consultamos direto na Receita os parcelamentos já concedidos. A adesão (entrada, número de parcelas) é feita pelo escritório no e-CAC; aqui só vinculamos o que já existe pra passar a acompanhar e emitir as guias automaticamente todo mês.</p>
    <div id="vpLista"><div class="empty-state">Consultando a Receita…</div></div>
    <div class="modal-actions">
      <button class="btn" id="vpCancel">Cancelar</button>
      <button class="btn primary" id="vpConfirmar" disabled>Vincular</button>
    </div>
  `);
  document.getElementById('vpCancel').addEventListener('click', closeModal);
  const lista = document.getElementById('vpLista');
  const btnConfirmar = document.getElementById('vpConfirmar');
  let selecionado = null;
  try{
    const { items } = await api('/integracontador/parcelamentos/pedidos?empresaId='+empresaId);
    if(!items.length){
      lista.innerHTML = `<div class="empty-state">Nenhum parcelamento encontrado na Receita pra esta empresa ainda. Confirme se a adesão já foi concluída no e-CAC.</div>`;
      return;
    }
    lista.innerHTML = items.map((p,i)=>`
      <label class="checkbox-row" style="align-items:flex-start;">
        <input type="radio" name="vpNumero" value="${p.numero}" ${items.length===1?'checked':''}>
        <span><b>Nº ${esc(p.numero)}</b> — ${esc(p.situacao||'—')}<br><span style="font-size:11.5px; color:var(--ink-soft);">Pedido em ${fmtDataReceita(p.dataDoPedido)}${p.dataDaSituacao?' · situação desde '+fmtDataReceita(p.dataDaSituacao):''}</span></span>
      </label>
    `).join('');
    if(items.length===1){ selecionado = items[0].numero; btnConfirmar.disabled = false; }
    lista.querySelectorAll('input[name="vpNumero"]').forEach(r=>r.addEventListener('change', ()=>{
      selecionado = Number(r.value); btnConfirmar.disabled = false;
    }));
  }catch(e){
    lista.innerHTML = `<span style="color:var(--debit); font-size:12.5px;">${esc(e.message)}</span>`;
    return;
  }
  btnConfirmar.addEventListener('click', async ()=>{
    if(!selecionado) return;
    btnConfirmar.disabled = true; btnConfirmar.textContent = 'Vinculando…';
    try{
      const r = await api('/integracontador/parcelamentos', { method:'POST', body:{ empresaId, numeroParcelamento:selecionado, periodoSolicitacaoId } });
      closeModal();
      toast(r.entradaGerada? 'Parcelamento vinculado — a guia deste mês já foi buscada.' : 'Parcelamento vinculado.'+(r.avisoEntrada?' '+r.avisoEntrada:' Nenhuma guia disponível ainda — a busca automática tenta de novo todo dia.'), 'ok');
      if(onDone) onDone();
    }catch(e){ toast(e.message,'err'); btnConfirmar.disabled=false; btnConfirmar.textContent='Vincular'; }
  });
}

async function renderEnvioAtribuicoes(){
  const podePostar = can('envio','postar');
  const podeEditar = can('envio','editar');
  const [{ items: atribs }, empresas, { items: templates }] = await Promise.all([
    api('/envio/atribuicoes'), empresasAtivas(), api('/envio/templates'),
  ]);
  const box = document.getElementById('envioContent');
  box.innerHTML = `
    <div class="row" style="margin-bottom:14px;">${podePostar?`<button class="btn primary" id="btnNovaEnvioAtrib">+ Atribuir modelo a uma empresa</button>`:''}</div>

    <div class="card" style="padding:0; overflow-x:auto;">
      <table class="data-table">
        <thead><tr><th>Empresa</th><th>Modelo</th><th>Periodicidade</th><th></th></tr></thead>
        <tbody id="envioAtribBody"></tbody>
      </table>
    </div>
  `;
  const envioAtribBody = document.getElementById('envioAtribBody');
  function desenhaEnvioAtribs(filtro){
    const termo = normalizaTxt(filtro).trim();
    const visiveis = termo ? atribs.filter(a=> normalizaTxt(a.empresaNome).includes(termo)) : atribs;
    envioAtribBody.innerHTML = visiveis.length? visiveis.map(a=>`
      <tr data-id="${a.id}" ${a.pendentesCliente? 'style="background:var(--accent-pale);"':''}>
        <td>${esc(a.empresaNome)}</td>
        <td>${esc(a.templateNome)}${a.pendentesCliente? ` <span class="tag warn" title="Pedido feito pelo cliente, ainda sem documento enviado">${a.pendentesCliente} pedido${a.pendentesCliente>1?'s':''} do cliente</span>`:''}</td>
        <td>${({mensal:'Mensal',anual:'Anual',avulso:'Avulso'})[a.periodicidade]||a.periodicidade}</td>
        <td style="text-align:right; display:flex; gap:6px; justify-content:flex-end;">
          <button class="btn small" data-act="abrir">Abrir grade</button>
          ${podeEditar? (a.temDocumentos
              ? `<span class="tag muted" title="Já tem documento enviado — não pode excluir">Excluir</span>`
              : `<button class="btn small danger" data-act="excluir">Excluir</button>`)
            : ''}
        </td>
      </tr>
    `).join('') : `<tr><td colspan="4"><div class="empty-state">${termo?'Nenhuma empresa encontrada.':'Nenhum envio atribuído ainda.'}</div></td></tr>`;
    envioAtribBody.querySelectorAll('[data-act="abrir"]').forEach(b=>b.addEventListener('click', e=>{
      abrirEnvioGrade(Number(e.target.closest('tr').dataset.id), false);
    }));
    envioAtribBody.querySelectorAll('[data-act="excluir"]').forEach(b=>b.addEventListener('click', async e=>{
      const tr = e.target.closest('tr');
      const id = Number(tr.dataset.id);
      const a = atribs.find(x=>x.id===id);
      if(!confirmar(`Excluir "${a.templateNome}" de ${a.empresaNome}?`)) return;
      try{ await api('/envio/atribuicoes/'+id, { method:'DELETE' }); toast('Excluído.','ok'); renderEnvioAtribuicoes(); }
      catch(err){ toast(err.message,'err'); }
    }));
  }
  desenhaEnvioAtribs('');
  document.getElementById('envioAtribFiltro').addEventListener('input', e=>desenhaEnvioAtribs(e.target.value));
  if(podePostar) document.getElementById('btnNovaEnvioAtrib').addEventListener('click', ()=>novaEnvioAtribModal(empresas, templates));
}

function envioDocBlocoHtml(d, podeEditar, podePostar, souCliente, mostrarVencimento){
  const vencHtml = !mostrarVencimento ? '' : d.vencimento
    ? `<div><span class="tag warn" style="font-weight:700;">Vencimento ${esc(fmtDateIso(d.vencimento))}</span>${d.vencimentoOrigem==='automatico'?' <span style="font-size:10.5px; color:var(--ink-soft);">(identificado automaticamente)</span>':''}</div>`
    : `<div><span class="tag muted">Vencimento não identificado</span></div>`;
  return `<div class="slot" style="flex-direction:row; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:10px; padding-bottom:8px; margin-bottom:2px; border-bottom:1px dashed var(--rule);">
    <div style="flex:1; min-width:220px; display:flex; flex-direction:column; gap:6px;">
      <div class="slot-locked" style="background:var(--paper);"><span class="fname">${esc(d.fileName)}</span>Enviado em ${fmtDateHora(d.enviadoEm)}</div>
      ${d.observacao? `<div class="slot-reopen-note" style="background:var(--accent-pale); color:var(--accent-deep);">${esc(d.observacao)}</div>`:''}
      ${vencHtml}
      ${!souCliente ? `<div style="font-size:11px; color:var(--ink-soft);">${d.emailEnviado? `✓ Enviado por e-mail ao cliente${d.emailEnviadoEm?' em '+fmtDateHora(d.emailEnviadoEm):''}` : (d.emailErro? '⚠ E-mail não enviado: '+esc(d.emailErro) : '')}</div>` : ''}
      ${!souCliente ? `<div style="font-size:11px; color:var(--ink-soft);">${d.whatsappEnviado? whatsappStatusTexto(d) : (d.whatsappErro? '⚠ WhatsApp não enviado: '+esc(d.whatsappErro) : '')}</div>` : ''}
    </div>
    <div style="display:flex; gap:6px; flex-wrap:wrap; flex-shrink:0;">
      <button class="btn small" data-act="baixar-envio" data-doc="${d.id}">Baixar</button>
      ${podeEditar && mostrarVencimento? `<button class="btn small" data-act="editar-venc" data-doc="${d.id}" data-venc="${d.vencimento||''}">Vencimento</button>`:''}
      ${!souCliente && podePostar? `<button class="btn small" data-act="reenviar-email" data-doc="${d.id}">${d.emailEnviado?'Reenviar e-mail':'Enviar e-mail'}</button>`:''}
      ${!souCliente && podePostar? `<button class="btn small" data-act="enviar-whatsapp" data-doc="${d.id}">${d.whatsappEnviado?'Reenviar WhatsApp':'Enviar WhatsApp'}</button>`:''}
      ${podeEditar? `<button class="btn small danger" data-act="excluir-doc" data-doc="${d.id}">Excluir</button>`:''}
    </div>
  </div>`;
}
function envioCelulaHtml(p, accept, podePostar, podeEditar, souCliente, mostrarVencimento, ehDas, ehAvulso){
  const inputId = `ef_${p.periodoId}`;
  const docs = p.documentos || [];
  // Período avulso criado por engano (ou que não é mais necessário) sem nada anexado ainda — só
  // remove a linha inteira nesse caso; com documento já anexado, o jeito é excluir os documentos um
  // a um (histórico já enviado ao cliente não some sozinho). Pedido feito pelo cliente (p.solicitadoEm)
  // nunca ganha esse botão — excluir sumiria com o pedido dele sem responder, precisa ser atendido
  // (ou excluído de propósito lá em Solicitações), não descartado sem querer aqui na grade.
  const btnExcluirPeriodo = ehAvulso && podeEditar && !docs.length && !p.solicitadoEm
    ? `<button class="btn small danger" data-act="excluir-periodo" data-periodo="${p.periodoId}">Excluir</button>` : '';
  const blocosHtml = docs.map(d=>envioDocBlocoHtml(d, podeEditar, podePostar, souCliente, mostrarVencimento)).join('');
  // Com 2+ documentos no mesmo período (ex.: guia original + guia recalculada), a lista expandida
  // ocupa muito espaço vertical na grade — fica recolhida atrás de uma setinha por padrão.
  const blocos = docs.length>=2
    ? `<div class="envio-docs-toggle" data-act="toggle-docs" data-periodo="${p.periodoId}" style="cursor:pointer; display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-soft); margin-bottom:6px; user-select:none;">
         <span class="envio-docs-arrow" style="display:inline-block; transition:transform .15s;">▶</span><span>${docs.length} documentos anexados — clique para ver</span>
       </div>
       <div class="envio-docs-list" id="envioDocsList_${p.periodoId}" style="display:none;">${blocosHtml}</div>`
    : blocosHtml;
  const pedidoPendente = !souCliente && p.solicitadoEm && !docs.length
    ? `<div class="slot-reopen-note" style="background:var(--accent-pale); color:var(--accent-deep);">Solicitado pelo cliente em ${fmtDateHora(p.solicitadoEm)}</div>` : '';
  // Antes só o cliente via esse botão — o escritório (Colaborador/Administrador) tinha que abrir o
  // Integra Contador e usar "Buscar agora" pra conseguir o mesmo resultado. Agora quem pode postar
  // nessa grade também recalcula direto daqui, sem sair da tela.
  const btnRecalculo = (souCliente || podePostar) && ehDas && docs.length
    ? `<button class="btn small" data-act="recalcular-das" data-periodo="${p.periodoId}" style="margin-top:6px;">Solicitar recálculo do DAS</button>` : '';
  if(souCliente || !podePostar){
    return docs.length? `<div class="slot">${blocos}${btnRecalculo}</div>` : `<span class="slot-label">Nada enviado ainda</span>`;
  }
  const obsId = docs.length? inputId+'_obs' : '';
  return `<div class="slot">
    ${pedidoPendente}
    ${blocos}
    ${btnRecalculo}
    <input type="file" id="${inputId}" ${accept?`accept="${accept}"`:''}>
    ${docs.length? `<input type="text" id="${obsId}" placeholder="Observação (ex.: guia recalculada — cliente não pagou no prazo)" style="font-size:12.5px; border:1px solid var(--rule); border-radius:8px; padding:7px 9px;">`:''}
    <div style="display:flex; align-items:center; gap:8px;">
      <button class="btn small primary" data-act="enviar-doc" data-periodo="${p.periodoId}" data-input="${inputId}" data-obs="${obsId}">${docs.length?'Incluir outro documento':'Enviar'}</button>
      ${btnExcluirPeriodo}
    </div>
  </div>`;
}
function wireEnvioGradeEvents(container, atribuicaoId, souCliente){
  container.querySelectorAll('[data-act="toggle-docs"]').forEach(t=>t.addEventListener('click', ()=>{
    const lista = document.getElementById('envioDocsList_'+t.dataset.periodo);
    const arrow = t.querySelector('.envio-docs-arrow');
    const aberto = lista.style.display !== 'none';
    lista.style.display = aberto ? 'none' : '';
    arrow.style.transform = aberto ? '' : 'rotate(90deg)';
  }));
  container.querySelectorAll('[data-act="enviar-doc"]').forEach(b=>b.addEventListener('click', async ()=>{
    const input = document.getElementById(b.dataset.input);
    const file = input.files[0];
    if(!file){ toast('Selecione um arquivo.','err'); return; }
    const fd = new FormData(); fd.append('arquivo', file);
    if(b.dataset.obs){
      const obsEl = document.getElementById(b.dataset.obs);
      if(obsEl && obsEl.value.trim()) fd.append('observacao', obsEl.value.trim());
    }
    try{
      const r = await api('/envio/periodos/'+b.dataset.periodo+'/enviar', { method:'POST', body:fd });
      if(r.emailEnviado) toast('Documento enviado e e-mail disparado ao cliente.','ok');
      else toast('Documento salvo, mas o e-mail não foi enviado'+(r.emailErro?': '+r.emailErro:'')+'.', 'err');
      abrirEnvioGrade(atribuicaoId, souCliente);
    }catch(e){ toast(e.message,'err'); }
  }));
  container.querySelectorAll('[data-act="baixar-envio"]').forEach(b=>b.addEventListener('click', ()=>{
    window.open('/api/envio/documentos/'+b.dataset.doc+'/download', '_blank');
  }));
  container.querySelectorAll('[data-act="editar-venc"]').forEach(b=>b.addEventListener('click', ()=>{
    vencimentoModal(b.dataset.doc, b.dataset.venc||'', ()=>abrirEnvioGrade(atribuicaoId, souCliente));
  }));
  container.querySelectorAll('[data-act="reenviar-email"]').forEach(b=>b.addEventListener('click', async ()=>{
    try{ await api('/envio/documentos/'+b.dataset.doc+'/reenviar-email', { method:'POST' }); toast('E-mail reenviado.','ok'); abrirEnvioGrade(atribuicaoId, souCliente); }
    catch(e){ toast(e.message,'err'); }
  }));
  container.querySelectorAll('[data-act="enviar-whatsapp"]').forEach(b=>b.addEventListener('click', async ()=>{
    try{ await api('/envio/documentos/'+b.dataset.doc+'/enviar-whatsapp', { method:'POST' }); toast('WhatsApp enviado.','ok'); abrirEnvioGrade(atribuicaoId, souCliente); }
    catch(e){ toast(e.message,'err'); }
  }));
  container.querySelectorAll('[data-act="recalcular-das"]').forEach(b=>b.addEventListener('click', async ()=>{
    b.disabled = true; b.textContent = 'Recalculando…';
    try{
      await api('/envio/periodos/'+b.dataset.periodo+'/solicitar-recalculo-das', { method:'POST' });
      toast('DAS recalculado — já disponível pra baixar.','ok');
      abrirEnvioGrade(atribuicaoId, souCliente);
    }catch(e){ toast(e.message,'err'); b.disabled = false; b.textContent = 'Solicitar recálculo do DAS'; }
  }));
  container.querySelectorAll('[data-act="excluir-doc"]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirmar('Excluir este documento enviado? O cliente já pode ter recebido por e-mail — isso só remove daqui do site.')) return;
    try{ await api('/envio/documentos/'+b.dataset.doc, { method:'DELETE' }); toast('Excluído.','ok'); abrirEnvioGrade(atribuicaoId, souCliente); }
    catch(e){ toast(e.message,'err'); }
  }));
  container.querySelectorAll('[data-act="excluir-periodo"]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirmar('Excluir este envio avulso? Ele some da grade — como não tem nada anexado, não afeta o cliente.')) return;
    try{ await api('/envio/periodos/'+b.dataset.periodo, { method:'DELETE' }); toast('Excluído.','ok'); abrirEnvioGrade(atribuicaoId, souCliente); }
    catch(e){ toast(e.message,'err'); }
  }));
}
async function abrirEnvioGrade(atribuicaoId, souCliente){
  const { atribuicao, grade } = await api('/envio/grade/'+atribuicaoId);
  const podePostar = !souCliente && can('envio','postar');
  const podeEditar = !souCliente && can('envio','editar');
  const ehDas = atribuicao.templateNome === 'DAS - Mensal';
  const accept = (atribuicao.accept||[]).includes('qualquer') ? '' : (atribuicao.accept||[]).map(a=>({ofx:'.ofx',pdf:'.pdf',zip:'.zip,.rar,.7z',xml:'.xml',imagem:'.png,.jpg,.jpeg'}[a]||'')).join(',');

  main().innerHTML = `
    <h1>${esc(atribuicao.templateNome)}</h1>
    <p class="subtitle">${esc(atribuicao.empresaNome)} — ${({mensal:'Mensal',anual:'Anual',avulso:'Avulso'})[atribuicao.periodicidade]||atribuicao.periodicidade}</p>
    <div class="row" style="margin-bottom:14px;">
      <button class="btn" id="btnVoltarEnvioGrade">← Voltar</button>
      ${podePostar && atribuicao.periodicidade!=='avulso' ? `<button class="btn" id="btnGerarEnvioPeriodo">Gerar ano na grade</button>`:''}
      ${podePostar && atribuicao.periodicidade==='avulso' ? `<button class="btn" id="btnNovoEnvioAvulso">+ Novo envio avulso</button>`:''}
    </div>
    <div class="card" style="overflow-x:auto;">
      ${grade.length? `<table class="grade-table"><thead><tr><th>Período</th><th>Documento</th></tr></thead>
      <tbody id="envioGradeBody"></tbody></table>` : `<div class="empty-state">Nenhum período gerado ainda.</div>`}
    </div>
  `;

    ).join('');

    abrirEnvioGrade(atribuicaoId, souCliente);

}

// ===================== Documentos Recebidos (cliente) =====================
// Acha o documento mais recente entre todos os períodos (pode ter mais de um documento por
// período — ex.: guia original + guia recalculada) e devolve o período junto com ele.
function documentoEnvioMaisRecente(grade){
  let melhor = null, melhorDoc = null;
  for(const p of grade){
    for(const d of (p.documentos||[])){
      if(!melhorDoc || d.enviadoEm > melhorDoc.enviadoEm){ melhor = p; melhorDoc = d; }
    }
  }
  return melhor? { periodo: melhor, documento: melhorDoc } : null;
}
// Pra modelo mensal, "Documentos Recebidos" sempre mostra a competência do mês anterior ao atual
// (ex.: em setembro, mostra agosto) — mesmo sem nenhum documento ainda, porque é isso que o cliente
// espera ver ali (o mês que já fechou), não necessariamente o último arquivo que chegou (que podia
// ser de um mês bem mais antigo recalculado agora, escondendo o mês certo). Se o período nem foi
// gerado ainda na grade, devolve um período "virtual" só pra exibição, sem id nenhum atrás.
function periodoEnvioDaVez(ano, mes, grade){
  return grade.find(p=>p.ano===ano && p.mes===mes) || { periodoId:null, ano, mes, rotulo:null, documentos:[] };
}
async function pageDocumentosRecebidos(){
  const { items } = await api('/envio/minhas-atribuicoes');
  main().innerHTML = `
    <h1>Documentos Recebidos</h1>
    <p class="subtitle">Guias e documentos enviados pelo seu escritório de contabilidade</p>
    <div id="drList"></div>
  `;
  const box = document.getElementById('drList');
  if(!items.length){ box.innerHTML = '<div class="empty-state">Nenhum documento configurado para sua empresa ainda.</div>'; return; }
  box.innerHTML = items.map(a=>`
    <div class="doc-row" data-id="${a.id}">
      <div class="doc-card" data-id="${a.id}">
        <h3>${esc(a.templateNome)}</h3>
        <div class="doc-card-sub">${({mensal:'Mensal',anual:'Anual',avulso:'Avulso'})[a.periodicidade]||a.periodicidade}</div>
        <div class="doc-card-link">Ver histórico completo →</div>
      </div>
      <div class="doc-inline" id="drInline${a.id}"><div class="empty-state" style="padding:10px;">Carregando…</div></div>
    </div>
  `).join('');
  box.querySelectorAll('.doc-card').forEach(c=>c.addEventListener('click', ()=>abrirEnvioGrade(Number(c.dataset.id), true)));

  const hoje = new Date();
  const mesAnterior = new Date(hoje.getFullYear(), hoje.getMonth()-1, 1);
  for(const a of items){
    const painel = document.getElementById('drInline'+a.id);
    try{
      const { grade } = await api('/envio/grade/'+a.id);
      let p, d;
      if(a.periodicidade==='mensal'){
        p = periodoEnvioDaVez(mesAnterior.getFullYear(), mesAnterior.getMonth()+1, grade);
        const docs = p.documentos || [];
        d = docs.length ? docs[docs.length-1] : null;
      } else {
        const achado = documentoEnvioMaisRecente(grade);
        if(!achado){ painel.innerHTML = `<div class="doc-inline-empty">Nenhum documento recebido ainda.</div>`; continue; }
        p = achado.periodo; d = achado.documento;
      }
      if(!d){
        painel.innerHTML = `
          <div class="doc-inline-periodo">${esc(rotuloPeriodo(p))}</div>
          <div class="doc-inline-empty">Nenhum documento recebido ainda para essa competência.</div>
        `;
        continue;
      }
      const vencHtml = d.vencimento? `<span class="tag warn" style="font-weight:700;">Vencimento ${esc(fmtDateIso(d.vencimento))}</span>` : '';
      const outros = (p.documentos||[]).length - 1;
      painel.innerHTML = `
        <div class="doc-inline-periodo">${esc(rotuloPeriodo(p))}</div>
        <div class="slot">
          <div class="slot-label" style="font-weight:600; color:var(--ink);">${esc(d.fileName)}</div>
          ${d.observacao? `<div class="slot-reopen-note" style="background:var(--accent-pale); color:var(--accent-deep);">${esc(d.observacao)}</div>`:''}
          ${vencHtml}
          ${outros>0? `<div style="font-size:11px; color:var(--ink-soft);">+ ${outros} documento(s) anterior(es) nesse período</div>`:''}
          <button class="btn small" data-act="baixar-envio" data-doc="${d.id}">Baixar</button>
        </div>
      `;
      painel.querySelectorAll('[data-act="baixar-envio"]').forEach(b=>b.addEventListener('click', ()=>{
        window.open('/api/envio/documentos/'+b.dataset.doc+'/download', '_blank');
      }));
    }catch(e){
      painel.innerHTML = `<div class="doc-inline-empty">Não consegui carregar — abra o card.</div>`;
    }
  }
}

        <div class="field grow"><label>Endereço</label><input id="nfseEmiEndereco"></div>
        <div class="field" style="width:100px;"><label>Número</label><input id="nfseEmiNumero"></div>
        <div class="field grow"><label>Complemento</label><input id="nfseEmiComplemento"></div>
        <div class="field" style="width:130px;"><label>CEP</label><input id="nfseEmiCep"></div>
      </div>
      <div class="row">
        <div class="field grow"><label>Bairro</label><input id="nfseEmiBairro"></div>
        <div class="field grow"><label>Cidade</label><input id="nfseEmiCidade"></div>
        <div class="field" style="width:70px;"><label>UF</label><input id="nfseEmiUf" maxlength="2"></div>
      </div>
      <input type="hidden" id="nfseEmiCodMun">
      <div style="margin:14px 0 8px; font-weight:600; font-size:13px; color:var(--ink-soft); border-top:1px solid var(--rule); padding-top:12px;">Serviço prestado</div>
      <div class="row">
        <div class="field" style="width:140px;"><label>Valor (R$)</label><input id="nfseEmiValor" inputmode="decimal" placeholder="0,00"></div>
        <div class="field" style="width:160px;"><label>Competência</label><input id="nfseEmiCompetencia" type="date" value="${hoje.toISOString().slice(0,10)}"></div>
      </div>
      <div class="field"><label>Descrição do serviço</label><textarea id="nfseEmiDescricao" rows="2" placeholder="Ex.: Fabricação de 01 toldo sombrite medidas 6x4"></textarea></div>
      <div class="row">
        <button class="btn" id="btnSalvarNfse">${NFSE_RASCUNHO_ID?'Salvar rascunho':'Salvar como rascunho'}</button>
        <button class="btn primary" id="btnEmitirNfse">Emitir NFS-e</button>
      </div>
      <div id="nfseEmiResultado" style="margin-top:12px;"></div>
    </div>
  `;
  if(prefill){
    const setVal=(id,v)=>{ const el=document.getElementById(id); if(el && v!=null) el.value=v; };
    setVal('nfseEmiEmpresa', prefill.empresaId);
    setVal('nfseEmiModelo', prefill.modeloId);
    setVal('nfseEmiNomeTomador', prefill.tomadorNome);
    setVal('nfseEmiEmailTomador', prefill.tomadorEmail);
    setVal('nfseEmiTelTomador', prefill.tomadorTelefone);
    setVal('nfseEmiEndereco', prefill.tomadorLogradouro);
    setVal('nfseEmiNumero', prefill.tomadorNumero);
    setVal('nfseEmiComplemento', prefill.tomadorComplemento);
    setVal('nfseEmiCep', prefill.tomadorCep);
    setVal('nfseEmiBairro', prefill.tomadorBairro);
    setVal('nfseEmiCodMun', prefill.tomadorCodigoMunicipio);
    setVal('nfseEmiDescricao', prefill.descricaoServico);
    if(prefill.valorServico!=null) document.getElementById('nfseEmiValor').value = Number(prefill.valorServico).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
    if(prefill.tomadorDocumento) document.getElementById('nfseEmiDocTomador').value = formatarDocumentoBR(String(prefill.tomadorDocumento).replace(/\D/g,''));
    toast(prefill.__modo==='continuar' ? 'Continuando rascunho — revise os dados antes de emitir.' : 'Dados duplicados — revise antes de emitir.', 'ok');
  }
  ligarMascaraMoeda(document.getElementById('nfseEmiValor'));
  ligarMascaraCep(document.getElementById('nfseEmiCep'));
  if(habilitadas.length>1) document.getElementById('nfseEmiEmpresa').addEventListener('change', e=>{
    NFSE_EMITIR_EMPRESA_ID = Number(e.target.value) || null;
    NFSE_RASCUNHO_ID = null;
    renderNfseEmitir();
  });
  document.getElementById('nfseEmiDocTomador').addEventListener('input', async e=>{
    const doc = e.target.value.replace(/\D/g,'').slice(0,14);
    e.target.value = formatarDocumentoBR(doc);
    if(doc.length!==14) return; // busca automática só existe pra CNPJ — CPF não tem consulta pública
    const status = document.getElementById('nfseEmiCnpjStatus');
    status.textContent = 'Consultando CNPJ na Receita Federal…';
    try{
      const r = await api('/nfse/cnpj/'+doc);
      document.getElementById('nfseEmiNomeTomador').value = r.razaoSocial || '';
      document.getElementById('nfseEmiEmailTomador').value = r.email || '';
      document.getElementById('nfseEmiEndereco').value = r.logradouro || '';
      document.getElementById('nfseEmiNumero').value = r.numero || '';
      document.getElementById('nfseEmiComplemento').value = r.complemento || '';
      document.getElementById('nfseEmiCep').value = r.cep || '';
      document.getElementById('nfseEmiBairro').value = r.bairro || '';
      document.getElementById('nfseEmiCidade').value = r.municipio || '';
      document.getElementById('nfseEmiUf').value = r.uf || '';
      status.textContent = 'Dados preenchidos a partir do CNPJ.';
      if(r.municipio && r.uf){
        try{
          const m = await api('/nfse/municipio-ibge?cidade='+encodeURIComponent(r.municipio)+'&uf='+encodeURIComponent(r.uf));
          document.getElementById('nfseEmiCodMun').value = m.codigoMunicipio;
        }catch(errIbge){ /* segue sem o código IBGE do tomador — o servidor usa o do prestador como padrão */ }
      }
    }catch(err){
      status.textContent = err.message;
    }
  });
  // Preenchimento automático pelo CEP — funciona pra qualquer tomador (inclusive CPF, que não tem
  // consulta pública de CNPJ pra puxar o endereço). Sem isso, faltando o código do município do
  // tomador, o servidor cai no padrão do prestador — rejeição real da Receita quando o CEP digitado
  // é de outra cidade (achado ao vivo).
  document.getElementById('nfseEmiCep').addEventListener('input', async e=>{
    const cep = e.target.value.replace(/\D/g,'').slice(0,8);
    if(cep.length!==8) return;
    const status = document.getElementById('nfseEmiCnpjStatus');
    status.textContent = 'Consultando CEP…';
    try{
      const r = await api('/nfse/cep/'+cep);
      if(r.logradouro && !document.getElementById('nfseEmiEndereco').value) document.getElementById('nfseEmiEndereco').value = r.logradouro;
      if(r.bairro && !document.getElementById('nfseEmiBairro').value) document.getElementById('nfseEmiBairro').value = r.bairro;
      document.getElementById('nfseEmiCidade').value = r.cidade || '';
      document.getElementById('nfseEmiUf').value = r.uf || '';
      document.getElementById('nfseEmiCodMun').value = r.codigoMunicipio || '';
      status.textContent = r.codigoMunicipio ? 'Cidade preenchida a partir do CEP.' : 'CEP encontrado, mas não identifiquei o município — confira Cidade/UF na mão.';
    }catch(err){
      status.textContent = 'Não consegui consultar o CEP — confira Cidade/UF na mão.';
    }
  });
  function nfseLerFormulario(){
    return {
      empresaId: Number(document.getElementById('nfseEmiEmpresa').value),
      modeloId: Number(document.getElementById('nfseEmiModelo').value),
      tomador: {
        documento: document.getElementById('nfseEmiDocTomador').value.replace(/\D/g,''),
        nome: document.getElementById('nfseEmiNomeTomador').value.trim(),
        email: document.getElementById('nfseEmiEmailTomador').value.trim() || null,
        telefone: document.getElementById('nfseEmiTelTomador').value.replace(/\D/g,'') || null,
        logradouro: document.getElementById('nfseEmiEndereco').value.trim() || null,
        numero: document.getElementById('nfseEmiNumero').value.trim() || null,
        complemento: document.getElementById('nfseEmiComplemento').value.trim() || null,
        cep: document.getElementById('nfseEmiCep').value.trim() || null,
        bairro: document.getElementById('nfseEmiBairro').value.trim() || null,
        codigoMunicipio: document.getElementById('nfseEmiCodMun').value || null,
      },
      servico: {
        descricao: document.getElementById('nfseEmiDescricao').value.trim(),
        valor: moedaInputParaNumero(document.getElementById('nfseEmiValor')),
        competencia: document.getElementById('nfseEmiCompetencia').value,
      },
    };
  }
  document.getElementById('btnSalvarNfse').addEventListener('click', async ()=>{
    const body = nfseLerFormulario();
    if(!body.tomador.documento || !body.tomador.nome){ toast('Preencha o documento e o nome do tomador.','err'); return; }
    if(!body.servico.descricao || !body.servico.valor || !body.servico.competencia){ toast('Preencha a descrição, o valor e a competência.','err'); return; }
    try{
      if(NFSE_RASCUNHO_ID){
        await api('/nfse/rascunhos/'+NFSE_RASCUNHO_ID, { method:'PUT', body });
        toast('Rascunho atualizado.','ok');
      }else{
        const r = await api('/nfse/rascunhos', { method:'POST', body });
        NFSE_RASCUNHO_ID = r.id;
        document.getElementById('btnSalvarNfse').textContent = 'Salvar rascunho';
        toast('Rascunho salvo — você pode continuar depois em Notas emitidas.','ok');
      }
    }catch(e){ toast(e.message,'err'); }
  });
  document.getElementById('btnEmitirNfse').addEventListener('click', async ()=>{
    const resultado = document.getElementById('nfseEmiResultado');
    const body = nfseLerFormulario();
    if(!body.tomador.documento || !body.tomador.nome){ toast('Preencha o documento e o nome do tomador.','err'); return; }
    if(!body.servico.descricao || !body.servico.valor || !body.servico.competencia){ toast('Preencha a descrição, o valor e a competência.','err'); return; }
    resultado.innerHTML = `<div class="empty-state">Enviando ao Sistema Nacional NFS-e…</div>`;
    try{
      let r;
      if(NFSE_RASCUNHO_ID){
        await api('/nfse/rascunhos/'+NFSE_RASCUNHO_ID, { method:'PUT', body });
        r = await api('/nfse/rascunhos/'+NFSE_RASCUNHO_ID+'/emitir', { method:'POST' });
        NFSE_RASCUNHO_ID = null;
      }else{
        r = await api('/nfse/emitir', { method:'POST', body });
      }
      const empresaNome = habilitadas.find(emp=>emp.id===body.empresaId)?.nome || '';
      resultado.innerHTML = `<div class="slot-locked" style="background:var(--paper);"><span class="fname">Emitida com sucesso</span>Chave de acesso: ${esc(r.chaveAcesso||'—')}<div style="margin-top:8px;"><button class="btn small" id="btnCancelarNfseRecemEmitida" style="color:var(--debit);">Cancelar esta NFS-e</button></div></div>`;
      document.getElementById('btnCancelarNfseRecemEmitida').addEventListener('click', ()=>{
        nfseCancelarModal({ id:r.emissaoId, empresaNome, tomadorNome:body.tomador.nome, valorServico:body.servico.valor });
      });
      toast('NFS-e emitida com sucesso.','ok');
      nfseLimparFormularioEmissao('nfseEmi');
      document.getElementById('btnSalvarNfse').textContent = 'Salvar como rascunho';
    }catch(e){
      resultado.innerHTML = `<div class="slot-locked" style="background:var(--paper); border-color:var(--debit);"><span class="fname">Rejeitada pelo Sistema Nacional NFS-e</span>${esc(e.message)}</div>`;
      toast(e.message,'err');
    }
  });
}
// Limpa só os campos do tomador/serviço depois de emitir com sucesso — mantém empresa e modelo
// selecionados pra facilitar emitir a próxima nota em seguida (fluxo real observado: mesma empresa,
// vários tomadores diferentes em sequência). Evita reenviar sem querer os mesmos dados da nota anterior.
function nfseLimparFormularioEmissao(prefixo){
  ['DocTomador','NomeTomador','EmailTomador','TelTomador','Endereco','Numero','Complemento','Cep','Bairro','Cidade','Uf','CodMun','Valor','Descricao'].forEach(suf=>{
    const el = document.getElementById(prefixo+suf);
    if(el) el.value = '';
  });
  const status = document.getElementById(prefixo+'CnpjStatus');
  if(status) status.textContent = '';
  const competencia = document.getElementById(prefixo+'Competencia');
  if(competencia) competencia.value = new Date().toISOString().slice(0,10);
}

async function renderNfseModelos(){
  const podePostar = can('nfse','postar');
  const podeEditar = can('nfse','editar');
  const { items } = await api('/nfse/modelos');
  const box = document.getElementById('nfseContent');
  box.innerHTML = `
    <div class="row" style="margin-bottom:14px;">${podePostar?`<button class="btn primary" id="btnNovoNfseModelo">+ Novo modelo</button>`:''}</div>
    <div class="card" style="padding:0; overflow-x:auto;">
      <table class="data-table">
        <thead><tr><th>Nome</th><th>Cód. tributação nacional</th><th>ISSQN</th><th>Ativo</th><th></th></tr></thead>
        <tbody id="nfseModelosBody"></tbody>
      </table>
    </div>
  `;
  const TRIB_ISSQN_LABEL={1:'Operação tributável',2:'Imunidade',3:'Exportação de serviço',4:'Não incidência'};
  document.getElementById('nfseModelosBody').innerHTML = items.length? items.map(m=>`
    <tr data-id="${m.id}">
      <td><b>${esc(m.nome)}</b></td>
      <td>${esc(m.codigoTributacaoNacional)}</td>
      <td>${TRIB_ISSQN_LABEL[m.tribIssqn]||m.tribIssqn}</td>
      <td><span class="tag ${m.ativo?'ok':'muted'}">${m.ativo?'Sim':'Não'}</span></td>
      <td style="text-align:right;">${podeEditar?`<button class="btn small" data-act="edit">Editar</button>`:''}</td>
    </tr>
  `).join('') : `<tr><td colspan="5"><div class="empty-state">Nenhum modelo cadastrado ainda.</div></td></tr>`;
  if(podePostar) document.getElementById('btnNovoNfseModelo').addEventListener('click', ()=>nfseModeloModal());
  if(podeEditar) document.getElementById('nfseModelosBody').querySelectorAll('[data-act="edit"]').forEach(b=>b.addEventListener('click', e=>{
    const id=Number(e.target.closest('tr').dataset.id);
    nfseModeloModal(items.find(x=>x.id===id));
  }));
}
