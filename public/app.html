  });

  document.getElementById('btnTestarDomCfg').addEventListener('click', async ()=>{
    const resultEl = document.getElementById('domTestResult');
    const btn = document.getElementById('btnTestarDomCfg');
    btn.disabled = true; btn.textContent = 'Testando…';
    resultEl.innerHTML = `<p style="font-size:12.5px; color:var(--ink-soft);">Aguardando o agente responder (ele precisa estar rodando e configurado)…</p>`;
    try{
      const { id } = await api('/dominio/testar-conexao', { method:'POST' });
      domTestPolling = true;
      let tentativas = 0;
      const poll = async ()=>{
        if(!domTestPolling) return;
        tentativas++;
        const r = await api('/dominio/testar-conexao/'+id);
        if(r.status==='pending'){
          if(tentativas>30){ resultEl.innerHTML = `<div class="tag bad">Sem resposta</div> <span style="font-size:12.5px;">O agente não respondeu em tempo — confira se ele está rodando (npm run dominio-agent:dev) e apontando para este site.</span>`; btn.disabled=false; btn.textContent='Testar conexão'; return; }
          setTimeout(poll, 2000);
          return;
        }
        btn.disabled = false; btn.textContent = 'Testar conexão';
        if(r.status==='ok'){
          const res_ = r.resultado || {};
          resultEl.innerHTML = `<div class="tag ok">Conexão OK</div> <span style="font-size:12.5px;">${res_.totalLinhas||0} linha(s) retornada(s).</span>
            ${res_.amostra&&res_.amostra.length? `<pre style="white-space:pre-wrap; font-size:11.5px; background:var(--paper); padding:8px; border-radius:6px; margin-top:8px;">${esc(JSON.stringify(res_.amostra, null, 2))}</pre>`:''}`;
        } else {
          resultEl.innerHTML = `<div class="tag bad">Falhou</div> <span style="font-size:12.5px;">${esc(r.erro||'Erro desconhecido.')}</span>`;
        }
      };
      poll();
    }catch(e){
      btn.disabled = false; btn.textContent = 'Testar conexão';
      resultEl.innerHTML = `<div class="tag bad">Falhou</div> <span style="font-size:12.5px;">${esc(e.message)}</span>`;
    }
  });
}

              <img src="data:image/png;base64,${r.pixImagemBase64}" alt="QR Code Pix" style="width:200px; height:200px;">

              <input readonly value="${esc(r.pixPayload||'')}" style="width:100%; font-family:'IBM Plex Mono',monospace; font-size:11px; text-align:center;" onclick="this.select()">
            </div>
          `:''}
          ${r.invoiceUrl?`<div style="text-align:center; margin-top:12px;"><a class="btn primary" href="${esc(r.invoiceUrl)}" target="_blank" rel="noopener">Pagar com cartão de crédito</a></div>`:''}
          <div style="text-align:center; margin-top:12px; font-size:12px; color:var(--ink-soft);">Assim que o pagamento confirmar, o acesso libera sozinho aqui.</div>
        </div>
      `;
      CFG_ASSINATURA_POLL = setInterval(async ()=>{
        try{
          const { items: atualizados } = await api('/escritorio/modulos');
          const todosLiberados = chaves.every(ch=>{ const m=atualizados.find(i=>i.chave===ch); return m && m.status==='ativo'; });
          if(todosLiberados){
            clearInterval(CFG_ASSINATURA_POLL); CFG_ASSINATURA_POLL=null;
            toast('Pagamento confirmado!','ok');
            renderCfgAssinaturaPlataforma(box);
          }
        }catch(e){ /* ignora falha pontual de rede no polling */ }
      }, 5000);
    }catch(e){
      resultado.innerHTML = `<div class="slot-locked" style="background:var(--paper); border-color:var(--debit);"><span class="fname">Não consegui gerar a cobrança</span>${esc(e.message)}</div>`;
    }
  });
}

  async function abrirPainelEmpresa(item){
    const painel = document.getElementById('agPainelEmpresaWrap');
    painel.style.display='';
    painel.innerHTML = `<div class="empty-state">Carregando…</div>`;
    const [{ items: modelos }, { items: servicos }] = await Promise.all([
      api('/nfse/modelos'),
      api('/nfse/agendamento/empresas/'+item.empresaId+'/itens'),
    ]);
    const modelosAtivos = modelos.filter(m=>m.ativo);
    painel.innerHTML = `
      <h3>${esc(item.nome)}</h3>
      <label class="checkbox-row"><input type="checkbox" id="agAtivoEmpresa" ${item.ativo?'checked':''}> Empresa ativa nesta rotina (desmarque pra pausar todos os serviços dela sem remover nada)</label>
      <div style="font-size:12px; color:var(--ink-soft); margin:2px 0 12px;">Cada serviço abaixo vira uma NFS-e separada por competência — use quando o mesmo cliente precisar de mais de uma nota (ex.: honorários contábeis + licença do módulo NFS-e).</div>

      <button class="btn" id="agAdicionarItem" style="margin-top:8px;">+ Adicionar outro serviço</button>

      catch(err){ toast(err.message,'err'); }
    });
    function renderItens(){
      const lista = document.getElementById('agItensLista');
      lista.innerHTML = servicos.length? servicos.map((s,idx)=>`
        <div class="card" style="background:var(--paper-deep); margin-bottom:10px;" data-item-id="${s.id}">
          <div class="row" style="justify-content:space-between; align-items:center;">
            <strong style="font-size:13px;">Serviço ${idx+1}</strong>
            <button class="btn small danger" data-act="remover-item" data-id="${s.id}">Remover</button>
          </div>
          <div class="field"><label>Modelo (NFS-e › Modelos)</label>
            <select data-f="modelo">
              <option value="">— Selecione —</option>
              ${modelosAtivos.map(m=>`<option value="${m.id}" ${s.modeloId===m.id?'selected':''}>${esc(m.nome)}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>Descrição do serviço</label>
            <textarea data-f="descricao" rows="3">${esc(s.descricaoServico)}</textarea>
            <div style="font-size:11px; color:var(--ink-soft); margin-top:4px;">Use <code>{{mes_competencia}}</code> onde quiser que apareça o mês/ano da competência (ex.: "agosto/2026").</div>
          </div>
          <div class="field"><label>Valor do serviço (R$)</label><input data-f="valor" inputmode="decimal" placeholder="0,00" value="${s.valorServico!=null?Number(s.valorServico).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}):''}"></div>
          <label class="checkbox-row"><input type="checkbox" data-f="ativo" ${s.ativo?'checked':''}> Ativo (desmarque pra pausar só este serviço)</label>
          <button class="btn primary small" data-act="salvar-item" data-id="${s.id}">Salvar este serviço</button>
        </div>
      `).join('') : `<div class="empty-state">Nenhum serviço configurado ainda — adicione pelo botão abaixo.</div>`;
      lista.querySelectorAll('[data-f="valor"]').forEach(el=>ligarMascaraMoeda(el));

        const body = {
          modeloId: card.querySelector('[data-f="modelo"]').value || null,
          descricaoServico: card.querySelector('[data-f="descricao"]').value,
          valorServico: moedaInputParaNumero(card.querySelector('[data-f="valor"]')),
          ativo: card.querySelector('[data-f="ativo"]').checked,
        };
        try{ await api('/nfse/agendamento/itens/'+b.dataset.id, { method:'PUT', body }); toast('Salvo.','ok'); carregarQuadroSelecionadas(); }
        catch(err){ toast(err.message,'err'); }
      }));
      lista.querySelectorAll('[data-act="remover-item"]').forEach(b=>b.addEventListener('click', async ()=>{
        if(!confirm('Remover este serviço? Ele deixa de gerar NFS-e nas próximas execuções.')) return;
        try{
          await api('/nfse/agendamento/itens/'+b.dataset.id, { method:'DELETE' });
          const idx = servicos.findIndex(s=>String(s.id)===b.dataset.id);
          if(idx>=0) servicos.splice(idx,1);
          renderItens();
          carregarQuadroSelecionadas();
        }catch(err){ toast(err.message,'err'); }
      }));
    }
    renderItens();

      try{
        const r = await api('/nfse/agendamento/empresas/'+item.empresaId+'/itens', { method:'POST' });

  async function carregarLogAgendamento(){
    const logBox = document.getElementById('agLog');

    // "Tentar novamente" só aparece na linha mais recente de cada emissão — sem isso, depois de um

    // continuava mostrando o botão pra sempre, e clicar nela de novo criaria um anexo/e-mail
    // duplicado pro cliente.
    const maisRecentePorEmissao = {};
    items.forEach(l=>{ if(!(l.emissaoId in maisRecentePorEmissao)) maisRecentePorEmissao[l.emissaoId] = l; });
    logBox.innerHTML = items.length? `
      <table class="data-table">
        <thead><tr><th>Quando</th><th>Empresa</th><th>Competência</th><th>Status</th><th>Mensagem</th><th></th></tr></thead>

          ${items.map(l=>{
            const falhouAnexo = l.sucesso && /não consegui anexar/i.test(l.mensagem||'') && maisRecentePorEmissao[l.emissaoId]===l;
            return `
            <tr>
              <td>${fmtDateHora(l.executadoEm)}</td>
              <td>${esc(l.empresaNome||'—')}</td>
              <td>${esc(l.competencia)}</td>
              <td><span class="tag ${l.sucesso?'ok':'bad'}">${l.sucesso?'Sucesso':'Falhou'}</span></td>
              <td style="font-size:12px;">${esc(l.mensagem||'')}</td>
              <td>${falhouAnexo?`<button class="btn small" data-act="reenviar-doc" data-emissao="${l.emissaoId}">Tentar novamente</button>`:''}</td>
            </tr>
          `}).join('')}
        </tbody>
      </table>
    ` : `<div class="empty-state">Nenhuma execução ainda.</div>`;
    logBox.querySelectorAll('[data-act="reenviar-doc"]').forEach(b=>b.addEventListener('click', async ()=>{
      b.disabled = true; b.textContent = 'Tentando…';
      try{
        const r = await api('/nfse/agendamento/emissoes/'+b.dataset.emissao+'/reenviar-documento', { method:'POST' });
        toast(r.mensagem,'ok');
        carregarLogAgendamento();
      }catch(e){ toast(e.message,'err'); b.disabled=false; b.textContent='Tentar novamente'; }
    }));
  }
  carregarQuadroDisponiveis();
  carregarQuadroSelecionadas();
  carregarLogAgendamento();
  if(NFSE_AG_EMPRESA_ABERTA){
    const item = quadro2.find(x=>x.empresaId===NFSE_AG_EMPRESA_ABERTA);
    if(item) abrirPainelEmpresa(item);
  }
}
let CFG_EMAIL_SUBTAB='smtp';
async function renderCfgEmail(box){
  box.innerHTML = `
    <div class="tabs" style="margin-bottom:14px;">
      <div class="tab" data-subtab="smtp">Configuração SMTP</div>
      <div class="tab" data-subtab="nfse-texto">Texto padrão para NFS-e</div>
    </div>
    <div id="cfgEmailSubContent"></div>
  `;
  box.querySelectorAll('.tab').forEach(t=>t.addEventListener('click', ()=>{ CFG_EMAIL_SUBTAB=t.dataset.subtab; renderCfgEmailSubTab(); }));
  renderCfgEmailSubTab();
}
function renderCfgEmailSubTab(){
  document.querySelectorAll('#cfgContent .tab[data-subtab]').forEach(t=>t.classList.toggle('active', t.dataset.subtab===CFG_EMAIL_SUBTAB));
  const sub = document.getElementById('cfgEmailSubContent');
  if(CFG_EMAIL_SUBTAB==='nfse-texto') renderCfgEmailTextoNfse(sub);
  else renderCfgEmailSmtp(sub);
}
async function renderCfgEmailTextoNfse(box){
  const cfg = await api('/email/config');
  box.innerHTML = `
    <div class="card">
      <h3>Texto padrão para envio de NFS-e para o cliente</h3>
      <p style="font-size:12.5px; color:var(--ink-soft); margin-top:-6px;">
        Usado automaticamente quando a rotina de emissão de NFS-e (Configurações › Emissão de NFS-e)
        manda a nota por e-mail pro cliente, com o PDF já anexado.
      </p>
      <div class="field"><label>Descrição / corpo do e-mail</label>
        <textarea id="cfgNfseEmailTexto" rows="6" disabled placeholder="Ex.: Prezado cliente, segue em anexo a nota fiscal de serviço referente aos honorários contábeis do mês.">${esc(cfg.nfseEmailTexto)}</textarea>
      </div>
      <div class="row">
        <button class="btn" id="cfgNfseEmailEditar">Editar</button>
        <button class="btn" id="cfgNfseEmailCancelar" style="display:none;">Cancelar</button>
        <button class="btn primary" id="cfgNfseEmailSalvar" disabled>Salvar</button>
      </div>
    </div>
  `;
  let textoOriginal = cfg.nfseEmailTexto || '';
  const textarea = document.getElementById('cfgNfseEmailTexto');
  const btnEditar = document.getElementById('cfgNfseEmailEditar');
  const btnCancelar = document.getElementById('cfgNfseEmailCancelar');
  const btnSalvar = document.getElementById('cfgNfseEmailSalvar');
  function entrarModoEdicao(){
    textarea.disabled = false;
    textarea.focus();
    btnSalvar.disabled = false;
    btnEditar.style.display = 'none';
    btnCancelar.style.display = '';
  }
  function sairModoEdicao(){
    textarea.disabled = true;
    btnSalvar.disabled = true;
    btnEditar.style.display = '';
    btnCancelar.style.display = 'none';
  }
  btnEditar.addEventListener('click', entrarModoEdicao);
  btnCancelar.addEventListener('click', ()=>{
    textarea.value = textoOriginal;
    sairModoEdicao();
  });
  btnSalvar.addEventListener('click', async ()=>{
    try{
      await api('/email/config', { method:'PUT', body:{ nfseEmailTexto: textarea.value } });
      toast('Texto salvo.','ok');
      textoOriginal = textarea.value;
      sairModoEdicao();
    }catch(e){ toast(e.message,'err'); }
  });
}
function linhaContatoHtml(c, editando){
  if(!editando){
    return `<tr data-id="${c.id}"><td>${esc(c.nome)}</td><td>${esc(c.email)}</td><td>${c.telefone?esc(c.telefone):'—'}${c.receber_whatsapp?' <span class="tag ok">WhatsApp</span>':''}</td><td style="text-align:right; white-space:nowrap;"><button class="btn small" data-act="editContato">Editar</button> <button class="btn small danger" data-act="rmContato">Remover</button></td></tr>`;
  }
  return `<tr data-id="${c.id}">
    <td><input data-f="nome" value="${esc(c.nome)}"></td>
    <td><input data-f="email" type="email" value="${esc(c.email)}"></td>
    <td><input data-f="telefone" value="${esc(c.telefone||'')}" placeholder="WhatsApp (DDD + número)" style="margin-bottom:4px;"><label class="checkbox-row" style="margin:0;"><input type="checkbox" data-f="receberWhatsapp" ${c.receber_whatsapp?'checked':''}> Receber por WhatsApp</label></td>
    <td style="text-align:right; white-space:nowrap;"><button class="btn small primary" data-act="salvarContato">Salvar</button> <button class="btn small" data-act="cancelEditContato">Cancelar</button></td>
  </tr>`;
}
async function renderCfgEmailSmtp(box){
  const status = await api('/email/status');
  const cfg = await api('/email/config');
  const { items } = await api('/email/log');
  const empresas = await empresasAtivas();
  const isAdmin = STATE.user.perfil==='Administrador';
  box.innerHTML = `
    <div class="card">
      <h3>Status</h3>
      <p style="font-size:13px;">${status.configurado? `<span class="tag ok">Configurado</span> Enviando como ${esc(status.from)}` : `<span class="tag bad">Não configurado</span> ${isAdmin?'Preencha e salve os dados abaixo.':'Fale com o Administrador.'}`}</p>
    </div>
    ${isAdmin? `<div class="card">
      <h3>Configuração SMTP</h3>
      <p style="font-size:12.5px; color:var(--ink-soft); margin-top:-6px;">Se for Gmail/Google Workspace, use uma <a href="https://myaccount.google.com/apppasswords" target="_blank" rel="noopener" class="link-discreto">senha de app</a> — a senha normal da conta não funciona aqui.</p>
      <div class="row">
        <div class="field grow"><label>Host SMTP</label><input id="cfgSmtpHost" value="${esc(cfg.smtpHost)}" placeholder="smtp.gmail.com"></div>
        <div class="field" style="width:110px;"><label>Porta</label><input id="cfgSmtpPort" type="number" value="${cfg.smtpPort}"></div>
      </div>
      <label class="checkbox-row"><input type="checkbox" id="cfgSmtpSecure" ${cfg.smtpSecure?'checked':''}> Conexão segura (SSL direto na porta — deixe desmarcado pra porta 587/TLS, padrão do Gmail)</label>
      <div class="field"><label>Usuário / e-mail de login</label><input id="cfgSmtpUser" value="${esc(cfg.smtpUser)}" placeholder="simplescontabeis@gmail.com"></div>
      <div class="field"><label>Senha${cfg.temSenha?' (já salva — preencha só se quiser trocar)':''}</label><input id="cfgSmtpPassword" type="password" placeholder="${cfg.temSenha?'••••••••••••••••':'senha de app'}"></div>
      <div class="row">
        <div class="field grow"><label>Nome do remetente</label><input id="cfgFromName" value="${esc(cfg.fromName)}" placeholder="Simples Contábeis"></div>
        <div class="field grow"><label>E-mail do remetente (opcional, padrão = usuário)</label><input id="cfgFromEmail" value="${esc(cfg.fromEmail)}" placeholder="simplescontabeis@gmail.com"></div>
      </div>
      <div class="row">
        <button class="btn primary" id="cfgSmtpSalvar">Salvar</button>
        <button class="btn" id="cfgSmtpTestar">Testar conexão</button>
      </div>
      <div id="cfgSmtpResultado" style="margin-top:10px;"></div>
    </div>` : ''}
    <div class="card">
      <h3>Contatos e documentos por cliente</h3>
      <p style="font-size:12.5px; color:var(--ink-soft); margin-top:-6px;">Cadastre aqui os e-mails (pode ser mais de um) e os CNPJ/CPF de cada cliente, uma vez só — ficam salvos para o envio e para a identificação automática.</p>
      <div class="field"><label>Empresa</label>${comboSelectHtml('ccEmpresaCombo', 'Digite para buscar a empresa…')}</div>
      <div id="ccBody"></div>
    </div>
    <div class="card">
      <h3>Histórico de envios</h3>
      <table class="data-table">
        <thead><tr><th>Quando</th><th>Empresa</th><th>Assunto</th><th>Status</th></tr></thead>
        <tbody>${items.length? items.map(e=>`<tr><td>${fmtDate(e.enviado_em)}</td><td>${esc(e.empresaNome||'—')}</td><td>${esc(e.assunto)}</td><td><span class="tag ${e.status==='ok'?'ok':'bad'}">${e.status}</span></td></tr>`).join(''):'<tr><td colspan="4"><div class="empty-state">Nenhum envio ainda.</div></td></tr>'}</tbody>
      </table>
    </div>
  `;

  if(isAdmin){
    document.getElementById('cfgSmtpSalvar').addEventListener('click', async ()=>{
      const body = {
        smtpHost: document.getElementById('cfgSmtpHost').value.trim(),
        smtpPort: Number(document.getElementById('cfgSmtpPort').value) || 587,
        smtpSecure: document.getElementById('cfgSmtpSecure').checked,
        smtpUser: document.getElementById('cfgSmtpUser').value.trim(),
        smtpPassword: document.getElementById('cfgSmtpPassword').value,
        fromName: document.getElementById('cfgFromName').value.trim(),
        fromEmail: document.getElementById('cfgFromEmail').value.trim(),
      };
      try{
        await api('/email/config', { method:'PUT', body });
        toast('Configuração salva.','ok');
        renderCfgTab();
      }catch(e){ toast(e.message,'err'); }
    });
    document.getElementById('cfgSmtpTestar').addEventListener('click', async ()=>{
      const resEl = document.getElementById('cfgSmtpResultado');
      resEl.innerHTML = `<div class="empty-state">Testando…</div>`;
      try{
        await api('/email/testar', { method:'POST' });
        resEl.innerHTML = `<div class="tag ok">Conexão OK</div>`;
      }catch(e){
        resEl.innerHTML = `<div class="tag bad">Falhou</div> <span style="font-size:12.5px;">${esc(e.message)}</span>`;
      }
    });
  }

  async function carregarContatosEDocs(){
    const empresaId = document.querySelector('#ccEmpresaCombo .combo-value').value;
    const ccBody = document.getElementById('ccBody');
    if(!empresaId){ ccBody.innerHTML=''; return; }
    const [{items:contatos}, {items:docs}] = await Promise.all([
      api('/empresas/'+empresaId+'/contatos'), api('/empresas/'+empresaId+'/documentos'),
    ]);
    ccBody.innerHTML = `
      <div style="font-weight:600; font-size:12.5px; margin:10px 0 6px;">Contatos (e-mail e WhatsApp)</div>
      <table class="data-table"><tbody id="ccContatosBody">
        ${contatos.map(c=>linhaContatoHtml(c)).join('') || '<tr><td colspan="4"><span style="font-size:12px; color:var(--ink-soft);">Nenhum contato cadastrado.</span></td></tr>'}
      </tbody></table>
      <div class="row" style="margin-top:8px; align-items:flex-end;">
        <div class="field" style="margin-bottom:0;"><input id="ccNome" placeholder="Nome do contato"></div>
        <div class="field" style="margin-bottom:0;"><input id="ccEmail" type="email" placeholder="e-mail@cliente.com"></div>
        <div class="field" style="margin-bottom:0;"><input id="ccTelefone" placeholder="WhatsApp (DDD + número)"></div>
        <label class="checkbox-row" style="margin-bottom:8px;"><input type="checkbox" id="ccReceberWhatsapp"> Receber por WhatsApp</label>
        <button class="btn small" id="btnAddContato">+ Adicionar</button>
      </div>
      <div style="font-weight:600; font-size:12.5px; margin:16px 0 6px;">CNPJ / CPF cadastrados</div>
      <table class="data-table"><tbody id="ccDocsBody">
        ${docs.map(d=>`<tr data-id="${d.id}"><td>${d.tipo.toUpperCase()}</td><td>${esc(d.documento)}</td><td style="text-align:right;"><button class="btn small danger" data-act="rmDoc">Remover</button></td></tr>`).join('') || '<tr><td colspan="3"><span style="font-size:12px; color:var(--ink-soft);">Nenhum documento cadastrado.</span></td></tr>'}
      </tbody></table>
      <div class="row" style="margin-top:8px;">
        <div class="field" style="margin-bottom:0;"><input id="ccDocumento" placeholder="CNPJ ou CPF (só números ou com pontuação)"></div>
        <button class="btn small" id="btnAddDoc">+ Adicionar documento</button>
      </div>
    `;
    document.getElementById('btnAddContato').addEventListener('click', async ()=>{
      const nome = document.getElementById('ccNome').value.trim();
      const email = document.getElementById('ccEmail').value.trim();
      const telefone = document.getElementById('ccTelefone').value.trim();
      const receberWhatsapp = document.getElementById('ccReceberWhatsapp').checked;
      if(!nome||!email){ toast('Preencha nome e e-mail.','err'); return; }
      try{ await api('/empresas/'+empresaId+'/contatos', { method:'POST', body:{ nome, email, telefone, receberWhatsapp } }); carregarContatosEDocs(); }
      catch(e){ toast(e.message,'err'); }
    });
    // Delegação num único listener no tbody — sobrevive às trocas de outerHTML ao entrar/sair do
    // modo de edição de uma linha, sem precisar reatar handler nenhum depois de cada troca.
    document.getElementById('ccContatosBody').addEventListener('click', async e=>{
      const btn = e.target.closest('button[data-act]');
      if(!btn) return;
      const tr = btn.closest('tr');
      const contatoId = tr.dataset.id;
      const c = contatos.find(x=>String(x.id)===contatoId);
      if(btn.dataset.act==='rmContato'){
        await api('/empresas/contatos/'+contatoId, { method:'DELETE' });
        carregarContatosEDocs();
      } else if(btn.dataset.act==='editContato'){
        tr.outerHTML = linhaContatoHtml(c, true);
      } else if(btn.dataset.act==='cancelEditContato'){
        tr.outerHTML = linhaContatoHtml(c);
      } else if(btn.dataset.act==='salvarContato'){
        const nome = tr.querySelector('[data-f="nome"]').value.trim();
        const email = tr.querySelector('[data-f="email"]').value.trim();
        const telefone = tr.querySelector('[data-f="telefone"]').value.trim();
        const receberWhatsapp = tr.querySelector('[data-f="receberWhatsapp"]').checked;
        if(!nome||!email){ toast('Preencha nome e e-mail.','err'); return; }
        try{
          await api('/empresas/contatos/'+contatoId, { method:'PUT', body:{ nome, email, telefone, receberWhatsapp } });
          toast('Contato atualizado.','ok');
          carregarContatosEDocs();
        }catch(err){ toast(err.message,'err'); }
      }
    });
    document.getElementById('btnAddDoc').addEventListener('click', async ()=>{
      const documento = document.getElementById('ccDocumento').value.trim();
      if(!documento){ toast('Informe o CNPJ ou CPF.','err'); return; }
      try{ await api('/empresas/'+empresaId+'/documentos', { method:'POST', body:{ documento } }); carregarContatosEDocs(); }
      catch(e){ toast(e.message,'err'); }
    });
    document.querySelectorAll('[data-act="rmDoc"]').forEach(b=>b.addEventListener('click', async e=>{
      await api('/empresas/documentos/'+e.target.closest('tr').dataset.id, { method:'DELETE' });
      carregarContatosEDocs();
    }));
  }
  setupComboSelect('ccEmpresaCombo', empresas.map(e=>({id:e.id, label:empresaComboLabel(e)})), carregarContatosEDocs);
}

// ===================== start =====================
boot();
</script>
