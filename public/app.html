<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simples Contábeis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F1F3F2; --paper-deep:#E3E7E5; --rule:#D7DBD9; --rule-soft:#E7EAE8;
    --ink:#22302B; --ink-soft:#66756F; --surface:#FFFFFF;
    --accent:#1F7A5C; --accent-deep:#155B44; --accent-pale:#DCEFE7;
    --credit:#1F7A5C; --debit:#B8433A; --amber:#B7791F;
    --sidebar:#FFFFFF; --sidebar-ink:#22302B; --sidebar-soft:#8A968F; --sidebar-active:#DCEFE7;
    --shadow: 0 1px 3px rgba(20,30,26,0.10), 0 4px 12px rgba(20,30,26,0.06);
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;}
  button{font-family:inherit;}
  a{color:var(--accent-deep);}

  .login-screen{display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--paper);}
  .login-box{width:360px; max-width:90vw; background:var(--surface); border:1px solid var(--rule); border-radius:var(--radius); box-shadow:var(--shadow); padding:34px 32px;}
  .login-box .eyebrow{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent);}
  .login-box h1{font-weight:700; font-size:24px; margin:4px 0 20px;}
  .field{display:flex; flex-direction:column; gap:5px; margin-bottom:14px;}
  .field label{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace;}
  .field input, .field select, .field textarea{font-family:'Inter',sans-serif; font-size:14px; border:1px solid var(--rule); border-radius:8px; padding:9px 11px; background:var(--paper); color:var(--ink); width:100%;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-pale); background:var(--surface);}
  .login-error{margin-top:12px; padding:10px 12px; background:#F6E6E3; color:var(--debit); border:1px solid #E3B8AC; border-radius:6px; font-size:12.5px;}

  .combo{position:relative;}
  .combo-input{font-family:'Inter',sans-serif; font-size:14px; border:1px solid var(--rule); border-radius:8px; padding:9px 11px; background:var(--paper); color:var(--ink); width:100%;}
  .combo-input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-pale); background:var(--surface);}
  .combo-list{position:absolute; z-index:60; top:calc(100% + 4px); left:0; right:0; max-height:240px; overflow-y:auto; background:var(--surface); border:1px solid var(--rule); border-radius:10px; box-shadow:var(--shadow); display:none;}
  .combo-list.open{display:block;}
  .combo-item{padding:9px 12px; font-size:13.5px; cursor:pointer;}
  .combo-item:hover{background:var(--paper);}
  .combo-empty{padding:9px 12px; font-size:12.5px; color:var(--ink-soft);}

  .btn{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--rule); background:var(--surface); color:var(--ink); padding:9px 15px; border-radius:8px; font-size:13.5px; cursor:pointer; font-weight:500;}
  .btn:hover{border-color:var(--accent); color:var(--accent-deep);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn.primary:hover{background:var(--accent-deep); border-color:var(--accent-deep); color:#fff;}
  .btn.danger{color:var(--debit); border-color:#E3B8AC;}
  .btn.danger:hover{background:#F6E6E3;}
  .btn.small{padding:5px 10px; font-size:12px; border-radius:6px;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}

  .shell{display:flex; min-height:100vh;}
  .sidebar{width:246px; flex-shrink:0; background:var(--sidebar); padding:18px 0 24px; position:sticky; top:0; align-self:flex-start; height:100vh; overflow-y:auto; border-right:1px solid var(--rule);}
  .sidebar-brand{padding:2px 20px 16px; border-bottom:1px solid var(--rule); margin-bottom:8px;}
  .sidebar-brand .eyebrow{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent);}
  .sidebar-brand h2{font-size:18px; margin:3px 0 0; font-weight:700;}
  .nav-item{display:flex; align-items:center; gap:10px; padding:10px 20px; font-size:13.5px; color:var(--sidebar-ink); cursor:pointer; border-left:2px solid transparent;}
  .nav-item:hover{background:var(--paper);}
  .nav-item.active{background:var(--sidebar-active); border-left-color:var(--accent); color:var(--accent-deep); font-weight:600;}
  .nav-sub{padding:8px 20px 8px 40px; font-size:13px; color:var(--sidebar-ink); cursor:pointer; border-left:2px solid transparent;}
  .nav-sub:hover{background:var(--paper);}
  .nav-sub.active{background:var(--sidebar-active); border-left-color:var(--accent); color:var(--accent-deep); font-weight:600;}
  .sidebar-foot{padding:14px 20px 0; margin-top:14px; border-top:1px solid var(--rule);}
  .sidebar-foot .who{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--sidebar-soft); line-height:1.5;}
  .sidebar-foot .who b{color:var(--ink); display:block; font-size:12.5px; font-family:'Inter',sans-serif;}
  .sidebar-foot .logout{margin-top:8px; cursor:pointer; color:var(--debit); font-size:11.5px; font-family:'IBM Plex Mono',monospace; text-transform:uppercase;}

  .main{flex:1; min-width:0; padding:30px 34px 80px;}
  h1{font-size:25px; font-weight:700; margin:0 0 3px;}
  .subtitle{color:var(--ink-soft); font-size:13.5px; margin:0 0 20px;}
  .card{background:var(--surface); border:1px solid var(--rule); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px 20px; margin-bottom:18px;}
  .card h3{margin:0 0 12px; font-size:15px;}
  .row{display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end;}
  .grow{flex:1; min-width:160px;}

  .kpi-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:14px; margin-bottom:20px;}
  .kpi{background:var(--surface); border:1px solid var(--rule); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 18px; position:relative;}
  .kpi .eyebrow{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft);}
  .kpi .val{font-size:26px; font-weight:700; margin-top:4px;}
  .kpi .sub{font-size:12px; color:var(--ink-soft); margin-top:3px;}
  .kpi .kpi-actions{position:absolute; top:10px; right:10px; display:none; gap:4px;}
  .kpi:hover .kpi-actions{display:flex;}
  .kpi.add{display:flex; align-items:center; justify-content:center; border-style:dashed; cursor:pointer; color:var(--ink-soft); font-size:13px;}
  .kpi.add:hover{color:var(--accent-deep); border-color:var(--accent);}

  table.data-table{width:100%; border-collapse:collapse; font-size:13.5px;}
  table.data-table th{text-align:left; font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); padding:8px 10px; border-bottom:1px solid var(--rule);}
  table.data-table td{padding:9px 10px; border-bottom:1px solid var(--rule-soft); vertical-align:middle;}
  table.data-table tbody tr:hover{background:var(--paper);}
  .tag{display:inline-block; padding:2px 9px; border-radius:20px; font-size:11px; font-weight:600;}
  .tag.ok{background:var(--accent-pale); color:var(--accent-deep);}
  .tag.warn{background:#F5E7D0; color:var(--amber);}
  .tag.bad{background:#F6E6E3; color:var(--debit);}
  .tag.muted{background:var(--paper-deep); color:var(--ink-soft);}
  .link-discreto{font-size:11.5px; color:var(--ink-soft); cursor:pointer; border-bottom:1px dotted var(--ink-soft); line-height:1.3;}
  .link-discreto:hover{color:var(--accent-deep); border-bottom-color:var(--accent-deep);}

  .modal-bg{position:fixed; inset:0; background:rgba(20,30,26,.35); display:none; align-items:center; justify-content:center; z-index:1000; padding:20px;}
  .modal-bg.open{display:flex;}
  .modal{background:var(--surface); border-radius:var(--radius); box-shadow:0 10px 40px rgba(20,30,26,.25); padding:24px 26px; width:520px; max-width:100%; max-height:88vh; overflow-y:auto;}
  .modal h3{margin:0 0 16px; font-size:17px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:18px;}

  .toast-wrap{position:fixed; bottom:20px; right:20px; z-index:2000; display:flex; flex-direction:column; gap:8px;}
  .toast{background:var(--ink); color:#fff; padding:11px 16px; border-radius:8px; font-size:13px; box-shadow:var(--shadow); max-width:340px;}
  .toast.err{background:#7A2E24;}
  .toast.ok{background:var(--accent-deep);}

  .tabs{display:flex; gap:4px; border-bottom:1px solid var(--rule); margin-bottom:18px; flex-wrap:wrap;}
  .tab{padding:9px 14px; font-size:13px; cursor:pointer; color:var(--ink-soft); border-bottom:2px solid transparent; font-weight:500;}
  .tab.active{color:var(--accent-deep); border-color:var(--accent); font-weight:700;}

  .grade-table{width:100%; border-collapse:collapse; font-size:13px;}
  .grade-table th{font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; color:var(--ink-soft); padding:8px; border-bottom:1px solid var(--rule); text-align:left;}
  .grade-table td{padding:8px; border-bottom:1px solid var(--rule-soft); vertical-align:top;}
  .slot{display:flex; flex-direction:column; gap:6px; min-width:150px;}
  .slot button{align-self:flex-start;}
  .slot .slot-label{font-size:11.5px; color:var(--ink-soft);}
  .slot input[type=file]{font-size:11px;}
  .slot-locked{background:var(--accent-pale); border-radius:8px; padding:8px 10px; font-size:12px; color:var(--accent-deep);}
  .slot-locked .fname{font-weight:600; display:block; word-break:break-all;}
  .slot-reopen-note{background:#F5E7D0; color:var(--amber); border-radius:8px; padding:6px 9px; font-size:11.5px; margin-bottom:4px;}

  .doc-row{display:flex; gap:14px; align-items:stretch; margin-bottom:14px;}
  .doc-card{width:340px; flex-shrink:0; background:var(--surface); border:1px solid var(--rule); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 16px; cursor:pointer; display:flex; flex-direction:column; justify-content:center; transition:border-color .15s;}
  .doc-card:hover{border-color:var(--accent);}
  .doc-card h3{margin:0 0 3px; font-size:14.5px;}
  .doc-card .doc-card-sub{font-size:11.5px; color:var(--ink-soft);}
  .doc-card .doc-card-link{margin-top:8px; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.04em; text-transform:uppercase; color:var(--accent-deep);}
  .doc-inline{flex:1; min-width:0; background:var(--surface); border:1px solid var(--rule); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 16px; display:flex; gap:24px; align-items:flex-start; flex-wrap:wrap;}
  .doc-inline-periodo{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-soft); align-self:center; min-width:64px;}
  .doc-inline-empty{color:var(--ink-soft); font-size:12.5px; align-self:center;}

  .badge-count{display:inline-flex; align-items:center; justify-content:center; min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--debit); color:#fff; font-size:10.5px; font-weight:700;}

  .empty-state{text-align:center; padding:50px 20px; color:var(--ink-soft);}
  .empty-state .big{font-size:34px; margin-bottom:8px;}

  .checkbox-row{display:flex; align-items:center; gap:8px; font-size:13px; margin:4px 0;}
  .perm-grid{display:grid; grid-template-columns:1.4fr repeat(3,0.7fr); gap:6px; align-items:center; font-size:12.5px;}
  .perm-grid .hdr{font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; color:var(--ink-soft); text-align:center;}
  .perm-grid .modname{text-transform:capitalize;}
  .perm-grid input[type=checkbox]{display:block; margin:0 auto;}

  ::placeholder{color:#A7B0AB;}
  .hidden{display:none !important;}
</style>
</head>
<body>

<div id="loginScreen" class="login-screen hidden">
  <div class="login-box">
    <div class="eyebrow">Escritório contábil</div>
    <h1>Simples Contábeis</h1>
    <div class="field"><label>E-mail</label><input id="loginEmail" type="email" autocomplete="username"></div>
    <div class="field"><label>Senha</label><input id="loginPassword" type="password" autocomplete="current-password"></div>
    <button class="btn primary" style="width:100%; justify-content:center;" id="btnLogin">Entrar</button>
    <div id="loginError" class="login-error hidden"></div>
  </div>
</div>

<div id="shell" class="shell hidden">
  <div class="sidebar">
    <div class="sidebar-brand">
      <div class="eyebrow">Escritório contábil</div>
      <h2>Simples Contábeis</h2>
    </div>
    <div id="navList"></div>
    <div class="sidebar-foot">
      <div class="who">Conectado como<b id="whoName"></b><span id="whoProfile"></span></div>
      <div class="logout" id="btnLogout">Sair</div>
    </div>
  </div>
  <div class="main" id="main"></div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modalBody"></div></div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
"use strict";

// ===================== estado & helpers =====================
let STATE = { user:null, permissoes:{}, page:'dashboard' };

function toast(msg, kind){
  const el=document.createElement('div');
  el.className='toast'+(kind==='err'?' err':kind==='ok'?' ok':'');
  el.textContent=msg;
  document.getElementById('toastWrap').appendChild(el);
  setTimeout(()=>el.remove(),4200);
}

async function api(path, opts){
  opts = opts || {};
  const headers = opts.headers || {};
  let body = opts.body;
  if(body && !(body instanceof FormData)){ headers['Content-Type']='application/json'; body=JSON.stringify(body); }
  const r = await fetch('/api'+path, { method: opts.method||'GET', headers, body, credentials:'include' });
  let data=null;
  try{ data = await r.json(); }catch(e){}
  if(!r.ok){
    const msg = (data && data.error) || ('Erro '+r.status);
    if(r.status===401 && path!=='/auth/me'){ showLogin(); }
    throw new Error(msg);
  }
  return data;
}
function fmtMoney(v){ return (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(String(iso).replace(' ','T')+(String(iso).includes('Z')?'':'Z')); if(isNaN(d)) return iso; return d.toLocaleDateString('pt-BR'); }
function fmtDateHora(iso){ if(!iso) return '—'; const d=new Date(String(iso).replace(' ','T')+(String(iso).includes('Z')?'':'Z')); if(isNaN(d)) return iso; return d.toLocaleDateString('pt-BR')+' às '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
function fmtDateIso(iso){ if(!iso) return null; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function normalizaTxt(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }

// Combobox com busca: renderiza <div class="combo"><input class="combo-input"><input type="hidden">
// <div class="combo-list"></div></div> — usar em qualquer lugar que hoje seja um <select> grande
// (ex.: escolher um cliente numa lista longa) e o usuário precise digitar pra filtrar.
function comboSelectHtml(id, placeholder){
  return `<div class="combo" id="${id}">
    <input type="text" class="combo-input" placeholder="${esc(placeholder||'Digite para buscar…')}" autocomplete="off">
    <input type="hidden" class="combo-value">
    <div class="combo-list"></div>
  </div>`;
}
// items: [{id, label}]. onChange(id|null) roda toda vez que a seleção muda (inclusive ao limpar).
function setupComboSelect(id, items, onChange){
  const root = document.getElementById(id);
  const input = root.querySelector('.combo-input');
  const hidden = root.querySelector('.combo-value');
  const list = root.querySelector('.combo-list');
  function renderList(filtro){
    const termo = (filtro||'').trim().toLowerCase();
    const filtrados = termo? items.filter(it=>it.label.toLowerCase().includes(termo)) : items;
    list.innerHTML = filtrados.length
      ? filtrados.map(it=>`<div class="combo-item" data-id="${it.id}">${esc(it.label)}</div>`).join('')
      : `<div class="combo-empty">Nenhum resultado.</div>`;
    list.querySelectorAll('.combo-item').forEach(el=>el.addEventListener('mousedown', e=>{
      e.preventDefault();
      const item = items.find(it=>String(it.id)===el.dataset.id);
      hidden.value = item.id;
      input.value = item.label;
      list.classList.remove('open');
      onChange(item.id);
    }));
  }
  input.addEventListener('focus', ()=>{ renderList(input.value===selectedLabel()? '' : input.value); list.classList.add('open'); });
  input.addEventListener('input', ()=>{ renderList(input.value); list.classList.add('open'); });
  input.addEventListener('blur', ()=>{
    setTimeout(()=>{
      list.classList.remove('open');
      // se o texto não corresponde mais ao item selecionado, considera que o usuário limpou a escolha
      if(hidden.value && input.value !== selectedLabel()){ hidden.value=''; input.value=''; onChange(null); }
    }, 150);
  });
  function selectedLabel(){ const it = items.find(it=>String(it.id)===hidden.value); return it? it.label : ''; }
}

function openModal(html){ document.getElementById('modalBody').innerHTML=html; document.getElementById('modalBg').classList.add('open'); }
function closeModal(){ document.getElementById('modalBg').classList.remove('open'); document.getElementById('modalBody').innerHTML=''; }
document.getElementById('modalBg').addEventListener('click', e=>{ if(e.target.id==='modalBg') closeModal(); });

function confirmar(msg){ return window.confirm(msg); }

// ===================== login =====================
function showLogin(){
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('shell').classList.add('hidden');
}
document.getElementById('btnLogin').addEventListener('click', doLogin);
document.getElementById('loginPassword').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
async function doLogin(){
  const email=document.getElementById('loginEmail').value.trim();
  const password=document.getElementById('loginPassword').value;
  const errEl=document.getElementById('loginError');
  errEl.classList.add('hidden');
  try{
    await api('/auth/login', { method:'POST', body:{ email, password } });
    await boot();
  }catch(e){
    errEl.textContent = e.message;
    errEl.classList.remove('hidden');
  }
}
document.getElementById('btnLogout').addEventListener('click', async ()=>{
  await api('/auth/logout', { method:'POST' });
  STATE.user=null;
  showLogin();
});

// ===================== navegação =====================
const NAV = [
  { id:'dashboard', label:'Início', modulo:'dashboard', roles:['Administrador','Colaborador','Cliente'] },
  { id:'empresas', label:'Empresas', modulo:'empresas', roles:['Administrador','Colaborador'] },
  { id:'solicitacoes', label:'Solicitações de Documentos', modulo:'solicitacoes', roles:['Administrador','Colaborador'] },
  { id:'envio', label:'Envio de Documentos', modulo:'envio', roles:['Administrador','Colaborador'] },
  { id:'nfse', label:'NFS-e', modulo:'nfse', roles:['Administrador','Colaborador'] },
  { id:'meus-documentos', label:'Meus Documentos', modulo:null, roles:['Cliente'] },
  { id:'solicitar-documentos', label:'Solicitar Documentos', modulo:null, roles:['Cliente'] },
  { id:'documentos-recebidos', label:'Documentos Recebidos', modulo:null, roles:['Cliente'] },
  { id:'financeiro', label:'Financeiro', modulo:'financeiro', roles:['Administrador','Colaborador'] },
  { id:'relatorios', label:'Relatórios', modulo:'relatorios', roles:['Administrador','Colaborador'] },
  { id:'usuarios', label:'Usuários', modulo:'usuarios', roles:['Administrador'] },
  { id:'configuracoes', label:'Configurações', modulo:'configuracoes', roles:['Administrador'] },
];
function podeVerModulo(item){
  if(!item.roles.includes(STATE.user.perfil)) return false;
  if(!item.modulo) return true;
  if(STATE.user.perfil==='Administrador') return true;
  if(STATE.user.perfil==='Cliente') return false;
  return STATE.permissoes[item.modulo] && STATE.permissoes[item.modulo].visualizar;
}
function renderNav(){
  const wrap=document.getElementById('navList');
  wrap.innerHTML = NAV.filter(podeVerModulo).map(it=>
    `<div class="nav-item ${STATE.page===it.id?'active':''}" data-page="${it.id}">${esc(it.label)}</div>`
  ).join('');
  wrap.querySelectorAll('.nav-item').forEach(el=>el.addEventListener('click', ()=>goPage(el.dataset.page)));
}
function goPage(id){
  STATE.page=id;
  renderNav();
  render();
}

// ===================== boot =====================
async function boot(){
  try{
    const data = await api('/auth/me');
    STATE.user = data.user;
    STATE.permissoes = data.permissoes || {};
  }catch(e){
    showLogin();
    return;
  }
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('shell').classList.remove('hidden');
  document.getElementById('whoName').innerHTML = esc(STATE.user.nome);
  document.getElementById('whoProfile').textContent = STATE.user.perfil;
  STATE.page = STATE.user.perfil==='Cliente' ? 'meus-documentos' : 'dashboard';
  renderNav();
  render();
}

function main(){ return document.getElementById('main'); }
function can(modulo, acao){
  if(STATE.user.perfil==='Administrador') return true;
  if(STATE.user.perfil==='Cliente') return false;
  return !!(STATE.permissoes[modulo] && STATE.permissoes[modulo][acao]);
}

async function render(){
  const m = main();
  m.innerHTML = '<div class="empty-state">Carregando…</div>';
  try{
    if(STATE.page==='dashboard') await pageDashboard();
    else if(STATE.page==='empresas') await pageEmpresas();

  main().querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===EMP_TAB));

  const podePostar = can('empresas','postar');
  const podeEditar = can('empresas','editar');
  const podeExcluir = STATE.user.perfil==='Administrador'; // exclusão é sempre restrita a Administrador (apaga em cascata)
  const ativasTab = EMP_TAB==='ativas';
  const items = todas.filter(e=> ativasTab ? e.ativo : !e.ativo);
  const colspan = ativasTab? 5 : 4;

  const box = document.getElementById('empresasContent');
  box.innerHTML = `
    ${ativasTab? `<div class="row" style="margin-bottom:8px; align-items:center;">
      ${podePostar? `<button class="btn primary" id="btnNovaEmpresa">+ Nova empresa</button>`:''}

    </div>` : `<p class="subtitle" style="margin-top:-6px;">Empresas inativadas não aparecem em Relatórios nem podem receber novos anexos — mas nada foi apagado.</p>`}

      <table class="data-table">
        <thead><tr><th>Nome</th><th>CNPJ</th><th>Origem</th>${ativasTab?'<th>Nos relatórios</th>':''}<th></th></tr></thead>
        <tbody id="empresasBody"></tbody>
      </table>
    </div>
  `;
  const tbody = document.getElementById('empresasBody');
  function desenhaLinhas(filtro){
    const termo = normalizaTxt(filtro).trim();
    const visiveis = termo ? items.filter(e=> normalizaTxt(e.nome).includes(termo) || normalizaTxt(e.cnpj).includes(termo)) : items;
    tbody.innerHTML = visiveis.length ? visiveis.map(e=>`
      <tr data-id="${e.id}">
        <td><b>${esc(e.nome)}</b></td>
        <td>${esc(e.cnpj||'—')}</td>
        <td><span class="tag muted">${e.origem==='dominio'?'Domínio Web':'Manual'}</span></td>
        ${ativasTab? `<td><span class="tag ${e.visivelRelatorios?'ok':'muted'}">${e.visivelRelatorios?'Sim':'Não'}</span></td>`:''}
        <td style="text-align:right;">
          <div style="display:flex; gap:12px; justify-content:flex-end; align-items:center;">
            ${podeEditar?`<span class="link-discreto" data-act="toggle-ativo">${e.ativo?'Inativar':'Reativar'}</span>`:''}
            ${podeEditar?`<button class="btn small" data-act="edit">Editar</button>`:''}
            ${podeExcluir? (e.temAnexos
                ? `<span class="tag muted" title="Já tem documento anexado — inative em vez de excluir">Excluir</span>`
                : `<button class="btn small danger" data-act="excluir">Excluir</button>`)
              : ''}
          </div>
        </td>
      </tr>
    `).join('') : `<tr><td colspan="${colspan}"><div class="empty-state">${termo? 'Nenhuma empresa encontrada.' : (ativasTab?'Nenhuma empresa ativa.':'Nenhuma empresa inativada.')}</div></td></tr>`;

    if(podeEditar) tbody.querySelectorAll('[data-act="edit"]').forEach(b=>b.addEventListener('click', e=>{
      const id=Number(e.target.closest('tr').dataset.id);
      empresaModal(items.find(x=>x.id===id));
    }));
    if(podeEditar) tbody.querySelectorAll('[data-act="toggle-ativo"]').forEach(b=>b.addEventListener('click', async e=>{
      const id = Number(e.target.closest('tr').dataset.id);
      const emp = items.find(x=>x.id===id);
      const novoAtivo = !emp.ativo;
      if(!confirmar(`${novoAtivo?'Reativar':'Inativar'} "${emp.nome}"?`)) return;
      try{ await api('/empresas/'+id, { method:'PUT', body:{ ativo: novoAtivo } }); toast(novoAtivo?'Empresa reativada.':'Empresa inativada.','ok'); renderEmpresasTab(); }
      catch(err){ toast(err.message,'err'); }
    }));
    if(podeExcluir) tbody.querySelectorAll('[data-act="excluir"]').forEach(b=>b.addEventListener('click', async e=>{
      const id = Number(e.target.closest('tr').dataset.id);
      const emp = items.find(x=>x.id===id);
      if(!confirmar(`Excluir a empresa "${emp.nome}"? Isso apaga também usuários, solicitações e financeiro dessa empresa. Não dá pra desfazer.`)) return;
      try{ await api('/empresas/'+id, { method:'DELETE' }); toast('Empresa excluída.','ok'); renderEmpresasTab(); }
      catch(err){ toast(err.message,'err'); }
    }));
  }
  desenhaLinhas('');
  document.getElementById('empFiltro').addEventListener('input', e=>desenhaLinhas(e.target.value));

  if(podePostar && ativasTab){
    document.getElementById('btnNovaEmpresa').addEventListener('click', ()=>empresaModal());
    document.getElementById('btnImportarDominio').addEventListener('click', importarDominioModal);
    document.getElementById('btnAtualizarEmpresas').addEventListener('click', atualizarEmpresasDoDominio);
  }
}

// Botão "Atualizar Empresas": pede pro agente local sincronizar agora (não espera o ciclo automático).
async function atualizarEmpresasDoDominio(){
  const btn = document.getElementById('btnAtualizarEmpresas');
  const status = document.getElementById('atualizarEmpresasStatus');
  btn.disabled = true; btn.textContent = 'Atualizando…';
  status.textContent = 'Aguardando o agente responder (precisa estar rodando na sua máquina)…';
  try{
    const { id } = await api('/dominio/sincronizar-empresas', { method:'POST' });
    let tentativas = 0;
    const poll = async ()=>{
      tentativas++;
      const r = await api('/dominio/sincronizar-empresas/'+id);
      if(r.status==='pending'){
        if(tentativas>30){
          status.textContent = 'Sem resposta do agente — confira se ele está rodando (npm run dominio-agent:dev) e se a sessão do Onvio está válida (npm run onvio-login).';
          btn.disabled=false; btn.textContent='↻ Atualizar Empresas';
          return;
        }
        setTimeout(poll, 2000);
        return;
      }
      btn.disabled = false; btn.textContent = '↻ Atualizar Empresas';
      if(r.status==='ok'){
        status.textContent = `Atualizado: ${r.novas} nova(s), ${r.atualizadas} atualizada(s).`;
        toast('Empresas atualizadas.','ok');
        renderEmpresasTab();
      } else {
        status.textContent = 'Falhou: '+(r.erro||'erro desconhecido.');
        toast(r.erro || 'Falha ao atualizar empresas.','err');
      }
    };
    poll();
  }catch(e){
    btn.disabled = false; btn.textContent = '↻ Atualizar Empresas';
    status.textContent = '';
    toast(e.message,'err');
  }
}

function itemRowHtml(it, i){

function modeloModal(t){
  const itens = t? t.itens : [{ chave:'item1', label:'', accept:['qualquer'], obrigatorio:true }];
  openModal(`
    <h3>${t?'Editar':'Novo'} modelo de solicitação</h3>

      </select>
    </div>` : ''}
    <label class="checkbox-row"><input type="checkbox" id="mdNotificar" ${t&&t.notificar_email?'checked':''}> Notificar cliente por e-mail ao criar/reabrir</label>

// Grade compartilhada (admin abre de dentro de Solicitações; cliente abre de Meus Documentos)
const MESES=['','Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const UFS_BR=['AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR','PE','PI','RJ','RN','RS','RO','RR','SC','SP','SE','TO'];
function rotuloPeriodo(p){ return p.mes? `${MESES[p.mes]}/${p.ano}` : (p.rotulo || String(p.ano)); }

// Conteúdo de um slot (anexar/baixar/reabrir), sem wrapper — usado tanto na grade completa
// (dentro de um <td>) quanto no card compacto de "Meus Documentos" (dentro de uma div solta).
function slotInner(periodoId, s, opts){
  const { podePostar, podeVerDownload, podeEditar, mostrarLabel } = opts;
  const inputId = `f_${periodoId}_${s.chave}`;
  const accept = (s.accept||[]).includes('qualquer') ? '' : (s.accept||[]).map(a=>({ofx:'.ofx',pdf:'.pdf',zip:'.zip,.rar,.7z',xml:'.xml',imagem:'.png,.jpg,.jpeg'}[a]||'')).join(',');
  const label = mostrarLabel? `<div class="slot-label" style="font-weight:600; color:var(--ink);">${esc(s.label)}${s.obrigatorio?' *':''}</div>` : '';
  if(s.travado && s.upload){
    return `<div class="slot">
      ${label}
      <div class="slot-locked"><span class="fname">${esc(s.upload.fileName)}</span>Enviado em ${fmtDateHora(s.upload.uploadedAt)} · travado</div>
      ${(podeVerDownload || podeEditar)? `<div style="display:flex; gap:6px;">
        ${podeVerDownload? `<button class="btn small" data-act="download" data-upload="${s.upload.id}">Baixar</button>`:''}
        ${podeEditar? `<button class="btn small danger" data-act="reabrir" data-upload="${s.upload.id}">Reabrir</button>`:''}
      </div>`:''}
    </div>`;
  }
  return `<div class="slot">
    ${label}
    ${s.reaberto? `<div class="slot-reopen-note">Reaberto${s.motivoReabertura? ': '+esc(s.motivoReabertura):''} — pode reenviar</div>`:''}
    ${s.upload? `<div class="slot-label">Anterior: ${esc(s.upload.fileName)} (substituído)</div>`:''}
    ${podePostar? `
      <input type="file" id="${inputId}" ${accept?`accept="${accept}"`:''}>
      <button class="btn small primary" data-act="salvar" data-periodo="${periodoId}" data-item="${s.chave}" data-input="${inputId}">Salvar</button>
    ` : `<span class="slot-label">Pendente</span>`}
  </div>`;
}
// Liga os cliques de salvar/baixar/reabrir dentro de um container (a grade inteira, ou um card
// compacto) — onDepois roda depois de qualquer ação que mude o estado, pra recarregar a tela certa.
function wireSlotEvents(container, onDepois){
  container.querySelectorAll('[data-act="salvar"]').forEach(b=>b.addEventListener('click', async ()=>{
    const input = document.getElementById(b.dataset.input);
    const file = input.files[0];
    if(!file){ toast('Selecione um arquivo.','err'); return; }
    const fd = new FormData(); fd.append('arquivo', file); fd.append('itemChave', b.dataset.item);
    try{
      await api('/checklist/periodos/'+b.dataset.periodo+'/upload', { method:'POST', body:fd });
      toast('Arquivo salvo.','ok');
      onDepois();
    }catch(e){ toast(e.message,'err'); }
  }));
  container.querySelectorAll('[data-act="download"]').forEach(b=>b.addEventListener('click', ()=>{
    window.open('/api/checklist/uploads/'+b.dataset.upload+'/download', '_blank');
  }));
  container.querySelectorAll('[data-act="reabrir"]').forEach(b=>b.addEventListener('click', async ()=>{
    const motivo = prompt('Motivo da reabertura (aparece para o cliente):');
    if(motivo===null) return;
    await api('/checklist/uploads/'+b.dataset.upload+'/reabrir', { method:'POST', body:{ motivo } });
    onDepois();
  }));
}

  const html = `

      ${podePostar && atribuicao.periodicidade==='avulso' ? `<button class="btn" id="btnNovoAvulso">+ Nova solicitação avulsa</button>`:''}

  if(grade.length){

    tbody.innerHTML = grade.map(p=>
      `<tr data-periodo="${p.periodoId}"><td><b>${esc(rotuloPeriodo(p))}</b></td>${p.slots.map(s=>`<td>${slotInner(p.periodoId, s, opts)}</td>`).join('')}</tr>`
    ).join('');

    if(!rotulo) return;
    await api('/checklist/periodos/gerar', { method:'POST', body:{ atribuicaoId, ano:new Date().getFullYear(), rotulo } });
    abrirGrade(atribuicaoId, souCliente);
  });

// ===================== Meus Documentos (cliente) =====================
// Cada solicitação vira uma linha compacta: um card pequeno pra abrir o histórico completo, e ao
// lado o período "da vez" já pronto pra anexar — mensal mostra o mês anterior (o extrato que acabou
// de fechar), anual mostra o ano corrente, avulso mostra a pendência mais recente ainda aberta.
function periodoDaVez(atribuicao, grade){
  if(!grade.length) return null;
  if(atribuicao.periodicidade==='mensal'){
    const hoje = new Date();
    const anterior = new Date(hoje.getFullYear(), hoje.getMonth()-1, 1);
    const ano = anterior.getFullYear(), mes = anterior.getMonth()+1;
    return grade.find(p=>p.ano===ano && p.mes===mes) || null;
  }
  if(atribuicao.periodicidade==='anual'){
    const anoAtual = new Date().getFullYear();
    return grade.find(p=>p.ano===anoAtual) || grade.slice().sort((a,b)=>b.ano-a.ano)[0];
  }
  // avulso: a pendência aberta mais recente (algum slot ainda não travado)
  const abertos = grade.filter(p=>p.slots.some(s=>!s.travado));
  return abertos.length? abertos[abertos.length-1] : null;
}
async function pageMeusDocumentos(){
  const { items } = await api('/checklist/minhas-atribuicoes');
  main().innerHTML = `
    <h1>Meus Documentos</h1>
    <p class="subtitle">Envie aqui os arquivos solicitados pelo seu escritório de contabilidade</p>
    <div id="mdList"></div>
  `;
  const box = document.getElementById('mdList');
  if(!items.length){ box.innerHTML = '<div class="empty-state">Nenhuma solicitação criada para sua empresa ainda.</div>'; return; }

  box.innerHTML = items.map(a=>`
    <div class="doc-row" data-id="${a.id}">
      <div class="doc-card" data-id="${a.id}">
        <h3>${esc(a.templateNome)}</h3>
        <div class="doc-card-sub">${({mensal:'Mensal',anual:'Anual',avulso:'Avulso'})[a.periodicidade]||a.periodicidade}</div>
        <div class="doc-card-link">Ver histórico completo →</div>
      </div>
      <div class="doc-inline" id="docInline${a.id}"><div class="empty-state" style="padding:10px;">Carregando…</div></div>
    </div>
  `).join('');
  box.querySelectorAll('.doc-card').forEach(c=>c.addEventListener('click', ()=>abrirGrade(Number(c.dataset.id), true)));

  for(const a of items){
    const painel = document.getElementById('docInline'+a.id);
    try{
      const { grade } = await api('/checklist/grade/'+a.id);
      const p = periodoDaVez(a, grade);
      if(!p){
        painel.innerHTML = `<div class="doc-inline-empty">Nenhuma pendência no momento — clique no card para ver o histórico.</div>`;
        continue;
      }
      const opts = { podePostar:true, podeVerDownload:false, podeEditar:false, mostrarLabel:true };
      painel.innerHTML = `
        <div class="doc-inline-periodo">${esc(rotuloPeriodo(p))}</div>
        ${p.slots.map(s=>slotInner(p.periodoId, s, opts)).join('')}
      `;
      wireSlotEvents(painel, ()=>pageMeusDocumentos());
    }catch(e){
      painel.innerHTML = `<div class="doc-inline-empty">Não consegui carregar — abra o card.</div>`;
    }
  }
}

  openModal(`

    <div class="field"><label>O que você precisa?</label>

function envioDocBlocoHtml(d, podeEditar, podePostar, souCliente, mostrarVencimento){
  const vencHtml = !mostrarVencimento ? '' : d.vencimento
    ? `<div><span class="tag warn" style="font-weight:700;">Vencimento ${esc(fmtDateIso(d.vencimento))}</span>${d.vencimentoOrigem==='automatico'?' <span style="font-size:10.5px; color:var(--ink-soft);">(identificado automaticamente)</span>':''}</div>`
    : `<div><span class="tag muted">Vencimento não identificado</span></div>`;
  return `<div class="slot" style="padding-bottom:8px; margin-bottom:2px; border-bottom:1px dashed var(--rule);">
    <div class="slot-locked" style="background:var(--paper);"><span class="fname">${esc(d.fileName)}</span>Enviado em ${fmtDateHora(d.enviadoEm)}</div>
    ${d.observacao? `<div class="slot-reopen-note" style="background:var(--accent-pale); color:var(--accent-deep);">${esc(d.observacao)}</div>`:''}
    ${vencHtml}
    ${!souCliente ? `<div style="font-size:11px; color:var(--ink-soft);">${d.emailEnviado? '✓ Enviado por e-mail ao cliente' : (d.emailErro? '⚠ E-mail não enviado: '+esc(d.emailErro) : '')}</div>` : ''}
    <div style="display:flex; gap:6px; flex-wrap:wrap;">
      <button class="btn small" data-act="baixar-envio" data-doc="${d.id}">Baixar</button>
      ${podeEditar && mostrarVencimento? `<button class="btn small" data-act="editar-venc" data-doc="${d.id}" data-venc="${d.vencimento||''}">Vencimento</button>`:''}
      ${!souCliente && podePostar && !d.emailEnviado? `<button class="btn small" data-act="reenviar-email" data-doc="${d.id}">Reenviar e-mail</button>`:''}
      ${podeEditar? `<button class="btn small danger" data-act="excluir-doc" data-doc="${d.id}">Excluir</button>`:''}
    </div>
  </div>`;
}
function envioCelulaHtml(p, accept, podePostar, podeEditar, souCliente, mostrarVencimento){
  const inputId = `ef_${p.periodoId}`;
  const docs = p.documentos || [];
  const blocos = docs.map(d=>envioDocBlocoHtml(d, podeEditar, podePostar, souCliente, mostrarVencimento)).join('');
  const pedidoPendente = !souCliente && p.solicitadoEm && !docs.length
    ? `<div class="slot-reopen-note" style="background:var(--accent-pale); color:var(--accent-deep);">Solicitado pelo cliente em ${fmtDateHora(p.solicitadoEm)}</div>` : '';
  if(souCliente || !podePostar){
    return docs.length? `<div class="slot">${blocos}</div>` : `<span class="slot-label">Nada enviado ainda</span>`;
  }
  const obsId = docs.length? inputId+'_obs' : '';
  return `<div class="slot">
    ${pedidoPendente}
    ${blocos}
    <input type="file" id="${inputId}" ${accept?`accept="${accept}"`:''}>
    ${docs.length? `<input type="text" id="${obsId}" placeholder="Observação (ex.: guia recalculada — cliente não pagou no prazo)" style="font-size:12.5px; border:1px solid var(--rule); border-radius:8px; padding:7px 9px;">`:''}
    <button class="btn small primary" data-act="enviar-doc" data-periodo="${p.periodoId}" data-input="${inputId}" data-obs="${obsId}">${docs.length?'Incluir outro documento':'Enviar'}</button>
  </div>`;
}
function wireEnvioGradeEvents(container, atribuicaoId, souCliente){
  container.querySelectorAll('[data-act="enviar-doc"]').forEach(b=>b.addEventListener('click', async ()=>{
    const input = document.getElementById(b.dataset.input);
    const file = input.files[0];
    if(!file){ toast('Selecione um arquivo.','err'); return; }
    const fd = new FormData(); fd.append('arquivo', file);
    if(b.dataset.obs){
      const obsEl = document.getElementById(b.dataset.obs);
      if(obsEl && obsEl.value.trim()) fd.append('observacao', obsEl.value.trim());
    }
    try{
      const r = await api('/envio/periodos/'+b.dataset.periodo+'/enviar', { method:'POST', body:fd });
      if(r.emailEnviado) toast('Documento enviado e e-mail disparado ao cliente.','ok');
      else toast('Documento salvo, mas o e-mail não foi enviado'+(r.emailErro?': '+r.emailErro:'')+'.', 'err');
      abrirEnvioGrade(atribuicaoId, souCliente);
    }catch(e){ toast(e.message,'err'); }
  }));
  container.querySelectorAll('[data-act="baixar-envio"]').forEach(b=>b.addEventListener('click', ()=>{
    window.open('/api/envio/documentos/'+b.dataset.doc+'/download', '_blank');
  }));
  container.querySelectorAll('[data-act="editar-venc"]').forEach(b=>b.addEventListener('click', ()=>{
    vencimentoModal(b.dataset.doc, b.dataset.venc||'', ()=>abrirEnvioGrade(atribuicaoId, souCliente));
  }));
  container.querySelectorAll('[data-act="reenviar-email"]').forEach(b=>b.addEventListener('click', async ()=>{
    try{ await api('/envio/documentos/'+b.dataset.doc+'/reenviar-email', { method:'POST' }); toast('E-mail reenviado.','ok'); abrirEnvioGrade(atribuicaoId, souCliente); }
    catch(e){ toast(e.message,'err'); }
  }));
  container.querySelectorAll('[data-act="excluir-doc"]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirmar('Excluir este documento enviado? O cliente já pode ter recebido por e-mail — isso só remove daqui do site.')) return;
    try{ await api('/envio/documentos/'+b.dataset.doc, { method:'DELETE' }); toast('Excluído.','ok'); abrirEnvioGrade(atribuicaoId, souCliente); }
    catch(e){ toast(e.message,'err'); }
  }));
}
async function abrirEnvioGrade(atribuicaoId, souCliente){
  const { atribuicao, grade } = await api('/envio/grade/'+atribuicaoId);
  const podePostar = !souCliente && can('envio','postar');
  const podeEditar = !souCliente && can('envio','editar');
  const accept = (atribuicao.accept||[]).includes('qualquer') ? '' : (atribuicao.accept||[]).map(a=>({ofx:'.ofx',pdf:'.pdf',zip:'.zip,.rar,.7z',xml:'.xml',imagem:'.png,.jpg,.jpeg'}[a]||'')).join(',');

  main().innerHTML = `
    <h1>${esc(atribuicao.templateNome)}</h1>
    <p class="subtitle">${esc(atribuicao.empresaNome)} — ${({mensal:'Mensal',anual:'Anual',avulso:'Avulso'})[atribuicao.periodicidade]||atribuicao.periodicidade}</p>
    <div class="row" style="margin-bottom:14px;">
      <button class="btn" id="btnVoltarEnvioGrade">← Voltar</button>
      ${podePostar && atribuicao.periodicidade!=='avulso' ? `<button class="btn" id="btnGerarEnvioPeriodo">Gerar ano na grade</button>`:''}
      ${podePostar && atribuicao.periodicidade==='avulso' ? `<button class="btn" id="btnNovoEnvioAvulso">+ Novo envio avulso</button>`:''}
    </div>
    <div class="card" style="overflow-x:auto;">
      ${grade.length? `<table class="grade-table"><thead><tr><th>Período</th><th>Documento</th></tr></thead>
      <tbody id="envioGradeBody"></tbody></table>` : `<div class="empty-state">Nenhum período gerado ainda.</div>`}
    </div>
  `;
  document.getElementById('btnVoltarEnvioGrade').addEventListener('click', ()=> souCliente ? pageDocumentosRecebidos() : pageEnvio());

  if(grade.length){
    const tbody = document.getElementById('envioGradeBody');
    tbody.innerHTML = grade.map(p=>
      `<tr data-periodo="${p.periodoId}"><td><b>${esc(rotuloPeriodo(p))}</b></td><td>${envioCelulaHtml(p, accept, podePostar, podeEditar, souCliente, atribuicao.detectarVencimento)}</td></tr>`
    ).join('');
    wireEnvioGradeEvents(tbody, atribuicaoId, souCliente);
  }

  if(podePostar && atribuicao.periodicidade!=='avulso') document.getElementById('btnGerarEnvioPeriodo').addEventListener('click', async ()=>{
    const ano = prompt('Gerar grade de qual ano?', new Date().getFullYear());
    if(!ano) return;
    await api('/envio/periodos/gerar', { method:'POST', body:{ atribuicaoId, ano:Number(ano) } });
    abrirEnvioGrade(atribuicaoId, souCliente);
  });
  if(podePostar && atribuicao.periodicidade==='avulso') document.getElementById('btnNovoEnvioAvulso').addEventListener('click', async ()=>{
    const rotulo = prompt('Descreva este envio avulso (ex.: "IRPF 2026")');
    if(!rotulo) return;
    await api('/envio/periodos/gerar', { method:'POST', body:{ atribuicaoId, ano:new Date().getFullYear(), rotulo } });
    abrirEnvioGrade(atribuicaoId, souCliente);
  });
}

// ===================== Documentos Recebidos (cliente) =====================
// Acha o documento mais recente entre todos os períodos (pode ter mais de um documento por
// período — ex.: guia original + guia recalculada) e devolve o período junto com ele.
function documentoEnvioMaisRecente(grade){
  let melhor = null, melhorDoc = null;
  for(const p of grade){
    for(const d of (p.documentos||[])){
      if(!melhorDoc || d.enviadoEm > melhorDoc.enviadoEm){ melhor = p; melhorDoc = d; }
    }
  }
  return melhor? { periodo: melhor, documento: melhorDoc } : null;
}
async function pageDocumentosRecebidos(){
  const { items } = await api('/envio/minhas-atribuicoes');
  main().innerHTML = `
    <h1>Documentos Recebidos</h1>
    <p class="subtitle">Guias e documentos enviados pelo seu escritório de contabilidade</p>
    <div id="drList"></div>
  `;
  const box = document.getElementById('drList');
  if(!items.length){ box.innerHTML = '<div class="empty-state">Nenhum documento configurado para sua empresa ainda.</div>'; return; }
  box.innerHTML = items.map(a=>`
    <div class="doc-row" data-id="${a.id}">
      <div class="doc-card" data-id="${a.id}">
        <h3>${esc(a.templateNome)}</h3>
        <div class="doc-card-sub">${({mensal:'Mensal',anual:'Anual',avulso:'Avulso'})[a.periodicidade]||a.periodicidade}</div>
        <div class="doc-card-link">Ver histórico completo →</div>
      </div>
      <div class="doc-inline" id="drInline${a.id}"><div class="empty-state" style="padding:10px;">Carregando…</div></div>
    </div>
  `).join('');
  box.querySelectorAll('.doc-card').forEach(c=>c.addEventListener('click', ()=>abrirEnvioGrade(Number(c.dataset.id), true)));

  for(const a of items){
    const painel = document.getElementById('drInline'+a.id);
    try{
      const { grade } = await api('/envio/grade/'+a.id);
      const achado = documentoEnvioMaisRecente(grade);
      if(!achado){
        painel.innerHTML = `<div class="doc-inline-empty">Nenhum documento recebido ainda.</div>`;
        continue;
      }
      const { periodo: p, documento: d } = achado;
      const vencHtml = d.vencimento? `<span class="tag warn" style="font-weight:700;">Vencimento ${esc(fmtDateIso(d.vencimento))}</span>` : '';
      const outros = (p.documentos||[]).length - 1;
      painel.innerHTML = `
        <div class="doc-inline-periodo">${esc(rotuloPeriodo(p))}</div>
        <div class="slot">
          <div class="slot-label" style="font-weight:600; color:var(--ink);">${esc(d.fileName)}</div>
          ${d.observacao? `<div class="slot-reopen-note" style="background:var(--accent-pale); color:var(--accent-deep);">${esc(d.observacao)}</div>`:''}
          ${vencHtml}
          ${outros>0? `<div style="font-size:11px; color:var(--ink-soft);">+ ${outros} documento(s) anterior(es) nesse período</div>`:''}
          <button class="btn small" data-act="baixar-envio" data-doc="${d.id}">Baixar</button>
        </div>
      `;
      painel.querySelectorAll('[data-act="baixar-envio"]').forEach(b=>b.addEventListener('click', ()=>{
        window.open('/api/envio/documentos/'+b.dataset.doc+'/download', '_blank');
      }));
    }catch(e){
      painel.innerHTML = `<div class="doc-inline-empty">Não consegui carregar — abra o card.</div>`;
    }
  }
}

  const souAdmin = STATE.user.perfil==='Administrador';
  if(!souAdmin){
    box.innerHTML = `<div class="empty-state">Só o Administrador pode configurar o certificado digital do escritório.</div>`;
    return;
  }
  const { items } = await api('/nfse/certificados');
  const doEscritorio = items.find(c=>!c.empresaId);
  box.innerHTML = `
    <div class="card">
      <h3>Certificado digital do escritório</h3>
      <p style="font-size:12.5px; color:var(--ink-soft); margin-top:-6px;">
        Usado para assinar e emitir NFS-e em nome de empresas-clientes que outorgaram procuração eletrônica
        ao CNPJ do escritório (feito por elas no e-CAC/gov.br — fora deste site). Empresas com certificado
        próprio (aba Empresas) usam o certificado delas, não este.
      </p>
      ${doEscritorio? `
        <div class="slot-locked" style="background:var(--paper);">
          <span class="fname">${esc(doEscritorio.titular||'Certificado configurado')}</span>
          CNPJ do certificado: ${esc(doEscritorio.cnpjCertificado||'—')} · Válido até ${fmtValidade(doEscritorio.validadeAte)}
        </div>
        <button class="btn small danger" id="btnRemoverCertEscritorio" style="margin-top:8px;">Remover certificado</button>
      ` : `
        <div class="field"><label>Arquivo do certificado (.pfx)</label><input type="file" id="nfseCertArquivo" accept=".pfx,.p12"></div>
        <div class="field"><label>Senha do certificado</label><input type="password" id="nfseCertSenha"></div>
        <button class="btn primary" id="btnEnviarCertEscritorio">Enviar certificado</button>
      `}
    </div>
  `;
  if(doEscritorio){
    document.getElementById('btnRemoverCertEscritorio').addEventListener('click', async ()=>{
      if(!confirmar('Remover o certificado do escritório? Empresas configuradas com "procuração do escritório" ficam sem conseguir emitir até você enviar outro.')) return;
      try{ await api('/nfse/certificados/'+doEscritorio.id, { method:'DELETE' }); toast('Certificado removido.','ok'); renderNfseConfig(); }
      catch(e){ toast(e.message,'err'); }
    });
  } else {
    document.getElementById('btnEnviarCertEscritorio').addEventListener('click', async ()=>{
      const arquivo = document.getElementById('nfseCertArquivo').files[0];
      const senha = document.getElementById('nfseCertSenha').value;
      if(!arquivo){ toast('Selecione o arquivo .pfx.','err'); return; }
      if(!senha){ toast('Informe a senha do certificado.','err'); return; }
      const fd = new FormData(); fd.append('arquivo', arquivo); fd.append('senha', senha);
      try{ await api('/nfse/certificados', { method:'POST', body:fd }); toast('Certificado enviado.','ok'); renderNfseConfig(); }
      catch(e){ toast(e.message,'err'); }
    });
  }
}

async function renderNfseEmpresas(){
  const podeEditar = can('nfse','editar');
  const [{ items }] = await Promise.all([ api('/nfse/empresas') ]);
  const box = document.getElementById('nfseContent');
  box.innerHTML = `
    <div class="field" style="max-width:360px; margin-bottom:10px;"><input type="text" id="nfseEmpFiltro" placeholder="Buscar por empresa…" autocomplete="off"></div>
    <div class="card" style="padding:0; overflow-x:auto;">
      <table class="data-table">
        <thead><tr><th>Empresa</th><th>Habilitado</th><th>Método de assinatura</th><th>Município (IBGE)</th><th></th></tr></thead>
        <tbody id="nfseEmpBody"></tbody>
      </table>
    </div>
  `;
  const tbody = document.getElementById('nfseEmpBody');
  function desenha(filtro){
    const termo = normalizaTxt(filtro).trim();
    const visiveis = termo? items.filter(e=>normalizaTxt(e.nome).includes(termo)) : items;
    tbody.innerHTML = visiveis.length? visiveis.map(e=>`
      <tr data-id="${e.id}">
        <td><b>${esc(e.nome)}</b></td>
        <td><span class="tag ${e.habilitado?'ok':'muted'}">${e.habilitado?'Sim':'Não'}</span></td>
        <td>${e.metodoAssinatura==='certificado_proprio'? 'Certificado próprio'+(e.temCertificadoProprio?'':' ⚠ sem certificado enviado') : 'Procuração (escritório)'}</td>
        <td>${esc(e.codigoMunicipio||'—')}</td>
        <td style="text-align:right;">${podeEditar? `<button class="btn small" data-act="config">Configurar</button>`:''}</td>
      </tr>
    `).join('') : `<tr><td colspan="5"><div class="empty-state">${termo?'Nenhuma empresa encontrada.':'Nenhuma empresa cadastrada.'}</div></td></tr>`;
    tbody.querySelectorAll('[data-act="config"]').forEach(b=>b.addEventListener('click', e=>{
      const id = Number(e.target.closest('tr').dataset.id);
      nfseEmpresaConfigModal(items.find(x=>x.id===id));
    }));
  }
  desenha('');
  document.getElementById('nfseEmpFiltro').addEventListener('input', e=>desenha(e.target.value));
}
function nfseEmpresaConfigModal(e){
  openModal(`
    <h3>NFS-e — ${esc(e.nome)}</h3>
    <label class="checkbox-row"><input type="checkbox" id="nfseEmpHabilitado" ${e.habilitado?'checked':''}> Habilitar emissão de NFS-e para esta empresa</label>
    <div class="field" style="margin-top:10px;"><label>Método de assinatura</label>
      <select id="nfseEmpMetodo">
        <option value="procuracao_escritorio" ${e.metodoAssinatura!=='certificado_proprio'?'selected':''}>Procuração eletrônica (usa o certificado do escritório)</option>
        <option value="certificado_proprio" ${e.metodoAssinatura==='certificado_proprio'?'selected':''}>Certificado próprio desta empresa</option>
      </select>
    </div>
    <div id="nfseEmpCertWrap"></div>
    <div class="row">
      <div class="field" style="width:140px;"><label>Código do município</label><input id="nfseEmpMunicipio" value="${esc(e.codigoMunicipio||'')}" maxlength="7"></div>
      <div class="field grow"><label>Descrição</label><input id="nfseEmpMunicipioDesc" value="${esc(e.nomeMunicipio||'')}" readonly style="background:var(--paper);"></div>
    </div>
    <div class="card" style="margin:6px 0 14px; background:var(--paper);">
      <div style="font-size:12px; color:var(--ink-soft); margin-bottom:8px;">Buscar cidade manualmente — use se a empresa não tiver cidade/UF cadastrada, ou pra corrigir</div>
      <div class="row">
        <div class="field" style="width:90px;"><label>UF</label>
          <select id="nfseEmpUf"><option value="">—</option>${UFS_BR.map(u=>`<option value="${u}" ${e.uf===u?'selected':''}>${u}</option>`).join('')}</select>
        </div>
        <div class="field grow"><label>Cidade</label>${comboSelectHtml('nfseEmpCidadeCombo','Selecione a UF primeiro…')}</div>
      </div>
    </div>
    <div class="field"><label>Inscrição municipal</label><input id="nfseEmpIM" value="${esc(e.inscricaoMunicipal||e.inscricaoMunicipalCadastro||'')}"></div>
    <label class="checkbox-row"><input type="checkbox" id="nfseEmpSimples" ${e.opcaoSimplesNacional!==false?'checked':''}> Optante pelo Simples Nacional</label>
    <div class="modal-actions">
      <button class="btn" id="nfseEmpCancel">Cancelar</button>
      <button class="btn primary" id="nfseEmpSalvar">Salvar</button>
    </div>
  `);
  async function carregarCidadesDaUf(uf, tentaPreencherDe){
    const combo = document.getElementById('nfseEmpCidadeCombo');
    if(!uf){ setupComboSelect('nfseEmpCidadeCombo', [], ()=>{}); return; }
    combo.querySelector('.combo-input').placeholder = 'Carregando cidades…';
    try{
      const { items } = await api('/nfse/municipios-ibge?uf='+encodeURIComponent(uf));
      setupComboSelect('nfseEmpCidadeCombo', items, (id)=>{
        const item = items.find(it=>String(it.id)===String(id));
        document.getElementById('nfseEmpMunicipio').value = item? item.id : '';
        document.getElementById('nfseEmpMunicipioDesc').value = item? item.label : '';
      });
      combo.querySelector('.combo-input').placeholder = 'Digite para buscar a cidade…';
      if(tentaPreencherDe){
        const alvo = normalizaTxt(tentaPreencherDe);
        const achado = items.find(it=>normalizaTxt(it.label)===alvo);
        if(achado){
          combo.querySelector('.combo-input').value = achado.label;
          combo.querySelector('.combo-value').value = achado.id;
          document.getElementById('nfseEmpMunicipio').value = achado.id;
          document.getElementById('nfseEmpMunicipioDesc').value = achado.label;
        }
      }
    }catch(err){
      combo.querySelector('.combo-input').placeholder = 'Não consegui carregar as cidades.';
      toast(err.message,'err');
    }
  }
  document.getElementById('nfseEmpUf').addEventListener('change', ev=>carregarCidadesDaUf(ev.target.value, null));
  if(e.uf) carregarCidadesDaUf(e.uf, e.codigoMunicipio? null : e.cidade);
  else setupComboSelect('nfseEmpCidadeCombo', [], ()=>{});
  function desenhaCertWrap(){
    const metodo = document.getElementById('nfseEmpMetodo').value;
    const wrap = document.getElementById('nfseEmpCertWrap');
    if(metodo!=='certificado_proprio'){ wrap.innerHTML=''; return; }
    wrap.innerHTML = `
      <div class="card" style="margin:10px 0; background:var(--paper);">
        ${e.temCertificadoProprio? `<p style="font-size:12.5px; color:var(--ink-soft); margin:0;">Certificado próprio já enviado. Envie outro arquivo abaixo só se quiser substituir.</p>`:''}
        <div class="field" style="margin-top:6px;"><label>Arquivo do certificado (.pfx)</label><input type="file" id="nfseEmpCertArquivo" accept=".pfx,.p12"></div>
        <div class="field"><label>Senha do certificado</label><input type="password" id="nfseEmpCertSenha"></div>
      </div>
    `;
  }
  desenhaCertWrap();
  document.getElementById('nfseEmpMetodo').addEventListener('change', desenhaCertWrap);
  document.getElementById('nfseEmpCancel').addEventListener('click', closeModal);
  document.getElementById('nfseEmpSalvar').addEventListener('click', async ()=>{
    const metodo = document.getElementById('nfseEmpMetodo').value;
    const body = {
      habilitado: document.getElementById('nfseEmpHabilitado').checked,
      metodoAssinatura: metodo,
      codigoMunicipio: document.getElementById('nfseEmpMunicipio').value.trim(),
      nomeMunicipio: document.getElementById('nfseEmpMunicipioDesc').value.trim(),
      inscricaoMunicipal: document.getElementById('nfseEmpIM').value.trim(),
      opcaoSimplesNacional: document.getElementById('nfseEmpSimples').checked,
    };
    try{
      if(metodo==='certificado_proprio'){
        const arquivoEl = document.getElementById('nfseEmpCertArquivo');
        const arquivo = arquivoEl && arquivoEl.files[0];
        if(arquivo){
          const senha = document.getElementById('nfseEmpCertSenha').value;
          if(!senha){ toast('Informe a senha do certificado.','err'); return; }
          const fd = new FormData(); fd.append('arquivo', arquivo); fd.append('senha', senha); fd.append('empresaId', e.id);
          await api('/nfse/certificados', { method:'POST', body:fd });
        } else if(!e.temCertificadoProprio){
          toast('Envie o certificado desta empresa (.pfx) ou escolha "Procuração eletrônica".','err'); return;
        }
      }
      await api('/nfse/empresas/'+e.id, { method:'PUT', body });
      closeModal(); toast('Configuração salva.','ok'); renderNfseEmpresas();
    }catch(err){ toast(err.message,'err'); }
  });
}

async function renderNfseEmitir(){
  const [{ items }, { items: modelos }] = await Promise.all([ api('/nfse/empresas'), api('/nfse/modelos') ]);
  const habilitadas = items.filter(e=>e.habilitado);
  const modelosAtivos = modelos.filter(m=>m.ativo);
  const box = document.getElementById('nfseContent');
  if(!habilitadas.length){
    box.innerHTML = `<div class="empty-state">Nenhuma empresa habilitada para emitir NFS-e ainda — configure na aba Empresas.</div>`;
    return;
  }
  if(!modelosAtivos.length){
    box.innerHTML = `<div class="empty-state">Nenhum modelo de serviço cadastrado ainda — crie um na aba Modelos antes de emitir.</div>`;
    return;
  }
  const hoje = new Date();
  box.innerHTML = `
    <div class="card">
      <div class="row">
        <div class="field grow"><label>Empresa (prestador do serviço)</label>
          <select id="nfseEmiEmpresa">${habilitadas.map(e=>`<option value="${e.id}">${esc(e.nome)}</option>`).join('')}</select>
        </div>
        <div class="field grow"><label>Modelo de serviço</label>
          <select id="nfseEmiModelo">${modelosAtivos.map(m=>`<option value="${m.id}">${esc(m.nome)}</option>`).join('')}</select>
        </div>
      </div>
      <div style="margin:14px 0 8px; font-weight:600; font-size:13px; color:var(--ink-soft); border-top:1px solid var(--rule); padding-top:12px;">Tomador do serviço</div>
      <div class="row">
        <div class="field grow"><label>CPF ou CNPJ</label><input id="nfseEmiDocTomador" placeholder="Só números"></div>
        <div class="field grow"><label>Nome / Razão social</label><input id="nfseEmiNomeTomador"></div>
      </div>
      <div id="nfseEmiCnpjStatus" style="font-size:11.5px; color:var(--ink-soft); margin:-6px 0 8px;"></div>
      <div class="field"><label>E-mail (opcional)</label><input id="nfseEmiEmailTomador" type="email"></div>
      <div class="row">
        <div class="field grow"><label>Endereço</label><input id="nfseEmiEndereco"></div>
        <div class="field" style="width:100px;"><label>Número</label><input id="nfseEmiNumero"></div>
        <div class="field grow"><label>Complemento</label><input id="nfseEmiComplemento"></div>
        <div class="field" style="width:130px;"><label>CEP</label><input id="nfseEmiCep"></div>
      </div>
      <div class="row">
        <div class="field grow"><label>Bairro</label><input id="nfseEmiBairro"></div>
        <div class="field grow"><label>Cidade</label><input id="nfseEmiCidade"></div>
        <div class="field" style="width:70px;"><label>UF</label><input id="nfseEmiUf" maxlength="2"></div>
      </div>
      <input type="hidden" id="nfseEmiCodMun">
      <div style="margin:14px 0 8px; font-weight:600; font-size:13px; color:var(--ink-soft); border-top:1px solid var(--rule); padding-top:12px;">Serviço prestado</div>
      <div class="row">
        <div class="field" style="width:140px;"><label>Valor (R$)</label><input id="nfseEmiValor" type="number" step="0.01" min="0"></div>
        <div class="field" style="width:160px;"><label>Competência</label><input id="nfseEmiCompetencia" type="date" value="${hoje.toISOString().slice(0,10)}"></div>
      </div>
      <div class="field"><label>Descrição do serviço</label><textarea id="nfseEmiDescricao" rows="2" placeholder="Ex.: Fabricação de 01 toldo sombrite medidas 6x4"></textarea></div>
      <button class="btn primary" id="btnEmitirNfse">Emitir NFS-e (ambiente de testes)</button>
      <div id="nfseEmiResultado" style="margin-top:12px;"></div>
    </div>
  `;
  document.getElementById('nfseEmiDocTomador').addEventListener('input', async e=>{
    const doc = e.target.value.replace(/\D/g,'');
    e.target.value = doc;
    if(doc.length!==14) return; // busca automática só existe pra CNPJ — CPF não tem consulta pública
    const status = document.getElementById('nfseEmiCnpjStatus');
    status.textContent = 'Consultando CNPJ na Receita Federal…';
    try{
      const r = await api('/nfse/cnpj/'+doc);
      document.getElementById('nfseEmiNomeTomador').value = r.razaoSocial || '';
      document.getElementById('nfseEmiEmailTomador').value = r.email || '';
      document.getElementById('nfseEmiEndereco').value = r.logradouro || '';
      document.getElementById('nfseEmiNumero').value = r.numero || '';
      document.getElementById('nfseEmiComplemento').value = r.complemento || '';
      document.getElementById('nfseEmiCep').value = r.cep || '';
      document.getElementById('nfseEmiBairro').value = r.bairro || '';
      document.getElementById('nfseEmiCidade').value = r.municipio || '';
      document.getElementById('nfseEmiUf').value = r.uf || '';
      status.textContent = 'Dados preenchidos a partir do CNPJ.';
      if(r.municipio && r.uf){
        try{
          const m = await api('/nfse/municipio-ibge?cidade='+encodeURIComponent(r.municipio)+'&uf='+encodeURIComponent(r.uf));
          document.getElementById('nfseEmiCodMun').value = m.codigoMunicipio;
        }catch(errIbge){ /* segue sem o código IBGE do tomador — o servidor usa o do prestador como padrão */ }
      }
    }catch(err){
      status.textContent = err.message;
    }
  });
  document.getElementById('btnEmitirNfse').addEventListener('click', async ()=>{
    const resultado = document.getElementById('nfseEmiResultado');
    const body = {
      empresaId: Number(document.getElementById('nfseEmiEmpresa').value),
      modeloId: Number(document.getElementById('nfseEmiModelo').value),
      tomador: {
        documento: document.getElementById('nfseEmiDocTomador').value.replace(/\D/g,''),
        nome: document.getElementById('nfseEmiNomeTomador').value.trim(),
        email: document.getElementById('nfseEmiEmailTomador').value.trim() || null,
        logradouro: document.getElementById('nfseEmiEndereco').value.trim() || null,
        numero: document.getElementById('nfseEmiNumero').value.trim() || null,
        complemento: document.getElementById('nfseEmiComplemento').value.trim() || null,
        cep: document.getElementById('nfseEmiCep').value.trim() || null,
        bairro: document.getElementById('nfseEmiBairro').value.trim() || null,
        codigoMunicipio: document.getElementById('nfseEmiCodMun').value || null,
      },
      servico: {
        descricao: document.getElementById('nfseEmiDescricao').value.trim(),
        valor: Number(document.getElementById('nfseEmiValor').value),
        competencia: document.getElementById('nfseEmiCompetencia').value,
      },
    };
    if(!body.tomador.documento || !body.tomador.nome){ toast('Preencha o documento e o nome do tomador.','err'); return; }
    if(!body.servico.descricao || !body.servico.valor || !body.servico.competencia){ toast('Preencha a descrição, o valor e a competência.','err'); return; }
    resultado.innerHTML = `<div class="empty-state">Enviando ao Sistema Nacional NFS-e…</div>`;
    try{
      const r = await api('/nfse/emitir', { method:'POST', body });
      resultado.innerHTML = `<div class="slot-locked" style="background:var(--paper);"><span class="fname">Emitida com sucesso</span>Chave de acesso: ${esc(r.chaveAcesso||'—')}</div>`;
      toast('NFS-e emitida (ambiente de testes).','ok');
    }catch(e){
      resultado.innerHTML = `<div class="slot-locked" style="background:var(--paper); border-color:var(--debit);"><span class="fname">Rejeitada pelo Sistema Nacional NFS-e</span>${esc(e.message)}</div>`;
      toast(e.message,'err');
    }
  });
}

  const hoje = new Date();
  const compDefault = hoje.getFullYear()+'-'+String(hoje.getMonth()+1).padStart(2,'0');
  box.innerHTML = `

      <div class="field" style="margin-bottom:0;"><label>Competência</label><input type="month" id="finComp" value="${compDefault}"></div>

    document.getElementById('finResumo').innerHTML = `
      <div class="kpi"><div class="eyebrow">Pago</div><div class="val">${fmtMoney(resumo.pago.total)}</div><div class="sub">${resumo.pago.qtd} lançamento(s)</div></div>

      <div class="kpi"><div class="eyebrow">Atrasado</div><div class="val">${fmtMoney(resumo.atrasado.total)}</div><div class="sub">${resumo.atrasado.qtd} lançamento(s)</div></div>

      </tr>

    if(podeEditar) document.getElementById('lancBody').querySelectorAll('[data-act="pago"]').forEach(b=>b.addEventListener('click', async e=>{
      const id = Number(e.target.closest('tr').dataset.id);
      await api('/financeiro/lancamentos/'+id, { method:'PUT', body:{ status:'pago', dataPagamento: new Date().toISOString().slice(0,10) } });
      carregar();
    }));
  }
  document.getElementById('finComp').addEventListener('change', carregar);
  if(podePostar) document.getElementById('btnGerarLanc').addEventListener('click', async ()=>{
    const comp = document.getElementById('finComp').value;
    const r = await api('/financeiro/lancamentos/gerar', { method:'POST', body:{ competencia: comp } });
    toast(r.criados+' lançamento(s) gerado(s).','ok');
    carregar();
  });
  carregar();
}

const MODS = [['dashboard','Início'],['empresas','Empresas'],['solicitacoes','Solicitações de Documentos'],['envio','Envio de Documentos'],['nfse','NFS-e'],['financeiro','Financeiro'],['relatorios','Relatórios'],['usuarios','Usuários'],['configuracoes','Configurações']];
async function usuarioModal(u){
  const { items: empresas } = await api('/empresas');
  openModal(`
    <h3>${u?'Editar':'Novo'} usuário</h3>
    <div class="field"><label>Nome</label><input id="usNome" value="${u?esc(u.nome):''}"></div>
    <div class="field"><label>E-mail</label><input id="usEmail" type="email" value="${u?esc(u.email):''}"></div>
    <div class="field"><label>Senha ${u?'(deixe em branco para manter)':''}</label><input id="usSenha" type="password"></div>
    ${!u? `<div class="field"><label>Perfil</label><select id="usPerfil"><option value="Colaborador">Colaborador (escritório)</option><option value="Administrador">Administrador</option><option value="Cliente">Cliente</option></select></div>`
        : `<div class="field"><label>Perfil</label><input value="${esc(u.perfil)}" disabled></div>`}
    <div id="usEmpresaWrap" class="field hidden"><label>Empresa</label><select id="usEmpresa">${empresas.map(e=>`<option value="${e.id}" ${u&&u.empresaId===e.id?'selected':''}>${esc(e.nome)}</option>`).join('')}</select></div>
    ${u? `<label class="checkbox-row"><input type="checkbox" id="usAtivo" ${u.ativo?'checked':''}> Ativo</label>`:''}
    <div id="usColabWrap" class="hidden">
      <div style="margin:16px 0 8px; padding-top:12px; border-top:1px solid var(--rule); font-weight:600; font-size:13.5px;">Permissões e acessos</div>
      <label class="checkbox-row"><input type="checkbox" id="usAcessoTodas" checked> Acesso a todas as empresas</label>
      <div id="usEmpresasRestritasWrap" class="hidden" style="margin:6px 0 10px; max-height:140px; overflow-y:auto; border:1px solid var(--rule); border-radius:8px; padding:8px 10px;">
        ${empresas.map(e=>`<label class="checkbox-row"><input type="checkbox" class="usEmpresaRestrita" value="${e.id}"> ${esc(e.nome)}</label>`).join('') || '<span style="font-size:12px; color:var(--ink-soft);">Nenhuma empresa cadastrada.</span>'}
      </div>
      <div id="usPermWrap"></div>
    </div>
    <div class="modal-actions">
      <button class="btn" id="usCancel">Cancelar</button>
      <button class="btn primary" id="usSalvar">Salvar</button>
    </div>
  `);
  const perfilSel = document.getElementById('usPerfil');
  function syncPerfilUI(){
    const perfil = u? u.perfil : perfilSel.value;
    document.getElementById('usEmpresaWrap').classList.toggle('hidden', perfil!=='Cliente');
    document.getElementById('usColabWrap').classList.toggle('hidden', perfil!=='Colaborador');
  }
  if(perfilSel) perfilSel.addEventListener('change', syncPerfilUI);
  syncPerfilUI();

  function renderPermGrid(perms){
    perms = perms || [];
    const wrap = document.getElementById('usPermWrap');
    wrap.innerHTML = `<div style="font-size:12px; font-weight:600; margin-bottom:6px;">Permissões por módulo</div>
      <div class="perm-grid">
        <div></div><div class="hdr">Ver</div><div class="hdr">Postar</div><div class="hdr">Editar</div>
        ${MODS.map(([m,l])=>{
          const p = perms.find(x=>x.modulo===m) || {};
          return `<div class="modname">${l}</div>
            <div><input type="checkbox" class="pv" data-mod="${m}" ${p.pode_visualizar?'checked':''}></div>
            <div><input type="checkbox" class="pp" data-mod="${m}" ${p.pode_postar?'checked':''}></div>
            <div><input type="checkbox" class="pe" data-mod="${m}" ${p.pode_editar?'checked':''}></div>`;
        }).join('')}
      </div>`;
  }
  renderPermGrid([]);
  const acessoTodasEl = document.getElementById('usAcessoTodas');
  const empresasRestritasWrap = document.getElementById('usEmpresasRestritasWrap');
  acessoTodasEl.addEventListener('change', ()=> empresasRestritasWrap.classList.toggle('hidden', acessoTodasEl.checked));

  if(u && u.perfil==='Colaborador'){
    const [{ items: perms }, { empresaIds }] = await Promise.all([
      api('/users/'+u.id+'/permissoes'),
      api('/users/'+u.id+'/empresas'),
    ]);
    renderPermGrid(perms);
    acessoTodasEl.checked = !!u.acessoTodasEmpresas;
    empresasRestritasWrap.classList.toggle('hidden', acessoTodasEl.checked);
    empresasRestritasWrap.querySelectorAll('.usEmpresaRestrita').forEach(c=>{ c.checked = empresaIds.includes(Number(c.value)); });
  }

  document.getElementById('usCancel').addEventListener('click', closeModal);
  document.getElementById('usSalvar').addEventListener('click', async ()=>{
    const nome=document.getElementById('usNome').value.trim();
    const email=document.getElementById('usEmail').value.trim();
    const senha=document.getElementById('usSenha').value;
    if(!nome||!email){ toast('Preencha nome e e-mail.','err'); return; }
    const perfil = u? u.perfil : perfilSel.value;
    try{
      let userId;
      if(u){
        const body = { nome, email, ativo: document.getElementById('usAtivo').checked };
        if(senha) body.password = senha;
        if(perfil==='Cliente') body.empresaId = Number(document.getElementById('usEmpresa').value);
        if(perfil==='Colaborador') body.acessoTodasEmpresas = document.getElementById('usAcessoTodas').checked;
        await api('/users/'+u.id, { method:'PUT', body });
        userId = u.id;
      } else {
        if(!senha){ toast('Defina uma senha.','err'); return; }
        const body = { nome, email, perfil, password: senha };
        if(perfil==='Cliente') body.empresaId = Number(document.getElementById('usEmpresa').value);
        if(perfil==='Colaborador') body.acessoTodasEmpresas = document.getElementById('usAcessoTodas').checked;
        const r = await api('/users', { method:'POST', body });
        userId = r.id;
      }
      if(perfil==='Colaborador'){
        const permissoes = {};
        MODS.forEach(([m])=>{
          permissoes[m] = {
            visualizar: !!document.querySelector(`.pv[data-mod="${m}"]`)?.checked,
            postar: !!document.querySelector(`.pp[data-mod="${m}"]`)?.checked,
            editar: !!document.querySelector(`.pe[data-mod="${m}"]`)?.checked,
          };
        });
        await api('/users/'+userId+'/permissoes', { method:'PUT', body:{ permissoes } });
        const empresaIds = document.getElementById('usAcessoTodas').checked ? [] :
          [...document.querySelectorAll('.usEmpresaRestrita:checked')].map(c=>Number(c.value));
        await api('/users/'+userId+'/empresas', { method:'PUT', body:{ empresaIds } });
      }
      closeModal(); pageUsuarios();
    }catch(e){ toast(e.message,'err'); }
  });
}
