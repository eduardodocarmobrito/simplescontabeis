name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/simplescontabeis:latest
            ghcr.io/${{ github.repository_owner }}/simplescontabeis:${{ github.sha }}

      # Sem passo de SSH: o GitHub não alcança a porta 22 da VPS (i/o timeout desde 2026-10-22 ~17h).
      # A VPS puxa sozinha — timer systemd `simplescontabeis-deploy` roda `docker compose pull && up -d`
      # em /opt/simplescontabeis a cada 2 min e só recria o container quando a imagem :latest mudou.
      # Deploy leva até ~2 min depois do workflow terminar.
